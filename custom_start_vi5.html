ung Hiểm'],kingdoms:[{name:'Chú Đỉnh Thành',brief:'Thất Diệu sơn lộc thành trì tu tiên chuyên luyện khí, nay bịb ị quân phản loạn phàm nhân Tịnh Thế Quân chiếm đ óng, luyện khí đ úc giáp gây phản loạn.',tags:['Tịnh Thế Quânchi ếm cứ','luyện_khí']},{name:'Định Biên Thành',brief:'Trung Nguyên quân trấn biên ải phía tây, gần Thiên Môn Quan, có thể chi viện; chống lại Hi Hoàng Cổ Triều ở Tây Vực, phòng thủ Tịnh Thế Quân.',tags:['Biên Tắc Quân Trấn','Càn Nguyên hạ hạt']},{name:'Tịnh Thế Quân',brief:'bị Thiên Ma quân phản loạn phàm nhân bị thao túng, chiếm giữ Thất Diệu Chú Đỉnh Thành, nhận lệnh từ Tinh Thực Tông, coi mọi sinh linh là kẻ thù.',tags:['phản quân','Thiên Ma Chi Trảo']}],sects:[{name:'Tinh Thực Tông',brief:'Vốn là Tuyền Cơ Các của Đạo Minh, vì nghiên cứu tinh không mà bị thực thể từ phía bên kia các vì sao nhìn thấu, dẫn đ ến đ ọa lạc; nay trở thành móng vuốt của Thiên Ma, là kẻ đ ịch nguy hiểm nhất.',tags:['Thiên Ma Chi Trảo','Đọa Lạc']}]},{id:'eco-zy-wmgl',name:'Vạn Mộc Ngộ Đạo Cổ Lâm',description:'Rừng ôn đ ới cực đ ông. Vấn Đạo Sơn là ngọn núi thiêng nhô lên giữa biển rừng, do Vấn Đạo Tiên Tông tọa trấn; hạ lưu Thiên Giang chảy xuyên qua rừng, rìa phía đ ông là vực sâu khổng lồ thông tới Đông Thổ.',tags:['Cổ Lâm','Huyền Minhminh chủ','Thông Đông Thổ'],kingdoms:[],sects:[{name:'Vấn Đạo Tiên Tông',brief:'Huyền Minh minh chủ, bao dung mọi đ ạo, vạn pháp đ ều có thể tu luyện; tuân theo minh ư ớc cổ xưa, đ ời đ ời bảo vệ Càn Nguyên Thánh Triều; chủ trấn thiên ma.',tags:['Huyền Minhminh chủ','Chính Đạo','Vạn Pháp']}]}]},{id:'reg-dongtu',name:'Đông Thổ',description:'vùng biển tự do nằm trơ trọi trên đ ại dư ơng. biển nấm khổng lồ ở phía tây đ ã phong tỏa con đ ường trên bộ thông tới Trung Nguyên, chỉ còn đ ường biển; hàng vạn hòn đ ảo và rặng đ á ngầm rải rác khắp Đông Minh, Lâm Uyên Thành là cổng kết nối các vực. các tông môn trong vùng đ ều giữ thái đ ộ trung lập, ngư ời đ ời gọi là "vùng đ ất mặt trời mọc".',children:[{id:'eco-dt-jujun',name:'Cự Tầm Khuẩn Hải',description:'Bình phong sư ơng bào tử phía tây. Vực sâu ngút trời nối liền thành biển, bào tử nấm quanh năm tạo thành sư ơng mù, ban đ êm tỏa ra ánh sáng mờ ảo; phong tỏa con đ ường bộ nối liền Đông Thổ và Trung Nguyên, Lưu Ly Đan Tông lập doanh trại hái thuốc tại đ ây.',tags:['bào vụ bình chư ớng','Cự Tầm','Hiểm Địa'],kingdoms:[],sects:[]},{id:'eco-dt-linyuan',name:'Lâm Uyên thủy hư ơng',description:'Vùng sông nư ớc cửa biển miền trung. Huyền Hà và Thiên Giang giao nhau đ ổ ra biển tại đ ây, vùng đ ất ngập nư ớc quanh co ngàn dặm; Lâm Uyên Thành đ ược xây dựng trên mặt nư ớc, là cửa ngõ đ ể các vực vư ợt biển đ ổ bộ lên bờ, cũng là trung tâm tín ngư ỡng Thanh Long.',tags:['hà khẩuth ủy hư ơng','tự do cảng','cổng liên vực'],kingdoms:[{name:'Lâm Uyên Thành',brief:'thành phố tu tiên siêu lớn đ ược xây dựng trên mặt nư ớc·tự do cảng，cổng liên vực，trung tâm tín ngư ỡng Thanh Long。',tags:['tự do cảng','cổng liên vực']}],sects:[{name:'Thiên Diễn Lâu',brief:'trung lập · trung tâm tình báo, nổi danh nhờ trận pháp, phù lục và bốc toán, tổ chức "Thiên Diễn Đại Bỉ"; đ óng tại Lâm Uyên Thành.',tags:['trung lập','Thuật Tu','Tình Báo']},{name:'Hợp Hoan Tông',brief:'trung lập tông_môn, tin rằng âm dư ơng giao hợp, thất tình lục dục mới là căn bản đ ể thông đ ạt đ ại đ ạo; đ óng tại Lâm Uyên Thành (Túy Nguyệt Lâu).',tags:['trung lập','Song Tu']}]},{id:'eco-dt-liufang',name:'Lưu Phư ơng Đảo',description:'Tiên đ ảo linh dư ợc phía đ ông. Sư ơng mù linh khí lư ợn lờ, bốn mùa như xuân, kỳ hoa dị thảo và thực vật tiên giới mọc khắp nơi; do Lưu Ly Đan Tông tọa trấn, phàm nhân ca tụng là "Đảo Dư ợc Vư ơng".',tags:['Linh Dư ợc Tiên Đảo','đan đ ạo','trung lập'],kingdoms:[],sects:[{name:'Lưu Ly Đan Tông',brief:'trung lập luyện_đan đ ại tông，nhà cung cấp đan dư ợc lớn nhất Thần Lục；lấy thuốc cứu đ ời, lấy đan chứng đ ạo。',tags:['trung lập','đan đ ạo']}]},{id:'eco-dt-penglai',name:'Bồng Lai Tam Tiên Đảo',description:'Thánh đ ịa ở ẩn tại hòn đ ảo xa phía đ ông. Ba đ ảo Bồng Lai, Phư ơng Trư ợng, Doanh Châu nối với nhau bằng cầu vồng, thoắt ẩn thoắt hiện theo thủy triều linh khí, thuyền phàm khó lòng tiếp cận; là đ ỉnh cao tu chân của Đông Thổ.',tags:['Ẩn Thế Tiên Đảo','Kiếm Tu','Thư ợng Cổ Tiên Tông'],kingdoms:[],sects:[{name:'Bồng Lai Tiên Tông',brief:'Ẩn thế thư ợng cổ tiên tông, thanh tu hỏi đ ạo, ngự kiếm tìm hiểu huyền cơ; Đông Thổ tu chân chi đ ỉnh.',tags:['trung lập','Kiếm Tu','Ẩn Thế']}]},{id:'eco-dt-shuanghua',name:'Sư ơng Hoa Đảo',description:'Băng sư ơng nguyệt hoa phía đ ông. Mặt biển trải rộng lớp băng mỏng, bông tuyết kết lại thành cụm như ngọc, linh khí của ánh trăng là nồng đ ậm nhất; Toàn Nữ Tông Quảng Hàn Cung ẩn mình tại đ ây.',tags:['băng sư ơngnguyệt hoa','Toàn Nữ tông','trung lập'],kingdoms:[],sects:[{name:'Quảng Hàn Cung',brief:'Tông phái trung lập chỉ nhận nữ giới, chủ yếu tu luyện băng sư ơng, thái âm, nguyệt hoa, bồi dư ỡng sức mạnh Nguyên Âm; là tử đ ịch của Hợp Hoan Tông.',tags:['trung lập','Toàn Nữ','băng sư ơng']}]},{id:'eco-dt-biluo',name:'Bích Lạc San Hô Hải',description:'Biển san hô xanh thẳm phía đ ông nam. Rặng san hô rải rác, hàng trăm hòn đ ảo, dư ới nư ớc có các khu đ ịnh cư của ngư nhân san hô; Châu Nhai Thành nhờ giao thư ơng với ngư nhân mà trở nên giàu có.',tags:['San Hô Hải','Ngư Nhân Thông Thư ơng','Hải Trân'],kingdoms:[{name:'Châu Nhai Thành',brief:'Bích lạc san hô hải thành phố cảng ven biển chuyên buôn bán trân bảo đ ại dư ơng, nhờ giao thư ơng với ngư nhân mà trở nên giàu có.',tags:['Hải Trân Cảng Thành']}],sects:[]},{id:'eco-dt-liexing',name:'Liệt Tinh Hải',description:'Vùng biển của Tán tu ở trung tâm Đông Minh. Hàng ngàn hòn đ ảo và vạn rặng đ á ngầm rải rác, thư ơng nhân trên biển và hải tặc qua lại tấp nập; Phư ờng thị tán tu Tụ Tiên Thành và hải bang Đông Doanh Phù Tang Thành cùng tồn tại.',tags:['Tản Tuhải cư ơng','Vạn Đảo Thiên Tiêu','pháp ngoạiph ường thị'],kingdoms:[{name:'Tụ Tiên Thành',brief:'Liệt Tinh Hải trung Tản Tu phư ờng thị đ ại thành, vàng thau lẫn lộn, tự do ngoài vòng pháp luật, là sào huyệt của chợ đen và tình báo.',tags:['Tản Tuphư ờng thị','pháp ngoại']},{name:'Phù Tang Thành',brief:'thành bang trên đ ảo mang phong cách Đông Doanh, tín ngư ỡng "chư thiên bách thần", đ ền thờ và cổng Torii ở khắp nơi, dân phong chuộng kiếm sĩ.',tags:['Đông Doanh hải bang','Thần Đạo']}],sects:[]}]},{id:'reg-beijing',name:'Bắc Cảnh',description:'thảo nguyên, đ ài nguyên, vịnh hẹp sông băng và sa mạc cực bắc cùng tồn tại; càng về bắc càng lạnh, phàm quốc và phàm tu mỗi bên chiếm giữ một góc.',children:[{id:'eco-bj-xuesong',name:'Tuyết Tùng Hạp Loan',description:'Vịnh hẹp sông băng ven biển phía đ ông bắc. Gia tộc Công Tôn mang huyết mạch Ngư ời Giao Tiếp Với Cá Voi đ ời đ ời lập quốc, tôn sùng Huyền Vũ phư ơng Bắc; thuyền lầu đ ầu rồng dạo chơi trong vịnh hẹp.',tags:['băng xuyên hẻm loan','Hải Tộc','Huyền Vũ tín ngư ỡng'],kingdoms:[{name:'Thư ơng Lan vư ơng triều',brief:'vư ơng triều thế tập trên biển, Công Tôn thị lấy huyết mạch của Ngư ời Giao Tiếp Với Cá Voi đ ể lập quốc; đ óng đ ô tại Kình Tủy Thành.',tags:['vư ơng triều','Giao Nhân Huyết Mạch']}],sects:[]},{id:'eco-bj-yongshuang',name:'Vĩnh Sư ơng Tùng Đào',description:'Rừng thông đen lá kim sâu trong nội đ ịa phía bắc. Thợ săn kết thành Hùng Bi Hội Minh đ ể tự trị, Ngai vàng thông đen và sào huyệt ẩn trong sư ơng mù giấu sâu giữa rừng.',tags:['Châm Diệp Lâm','Tát Mãn','Liệp Hộ'],kingdoms:[{name:'Hùng Bi Hội Minh',brief:'Tùng lâm hành liệp nhân chi tùng tán liên minh, không có vư ơng triều thống nhất, các Trư ởng lão áo trắng cùng bàn bạc chính sự.',tags:['Trư ởng Lão hội minh']}],sects:[{name:'Đống Cốt Quan',brief:'Vĩnh Sư ơng Tùng Đào thâm xứ tiểu tông môn quỷ tu dựa vào thi khí của Cô Phần Lĩnh mà thành lập.',tags:['trung lập','Quỷ Tu']}]},{id:'eco-bj-yinsha',name:'Ngân Sa Lạc Tinh Mạc',description:'Sa mạc phía tây. Biển cát trắng bạc đan xen với những tảng thiên thạch khổng lồ; năm thành bang ốc đ ảo cùng kết thành liên minh thư ơng mại, nắm giữ thư ơng đ ạo phía tây Bắc Cảnh.',tags:['sa mạc','thư ơng đ ạo','lục châu'],kingdoms:[{name:'Sa Duệ Thư ơng Bang',brief:'năm đ ại lục châu thành bang liên minh，tinh nghị hội cộng trị，nghị hội trú tinh vẫn bảo。',tags:['thành bang liên minh']}],sects:[]},{id:'eco-bj-buzhou',name:'Bất Chu Tàn Tích',description:'Dãy núi chạy dọc từ nam chí bắc ở trung tâm. Sư ờn núi bằng huyền thiết đ âm thủng tầng mây; sư ờn đ ông là Thiên Cơ Môn, sư ờn tây là Huyết Liên Mật Giáo, trên đ ỉnh chính là Tuyết Tông Cao Địa Bộ.',tags:['Sơn Mạch','Huyền Thiết','Ma Đạo'],kingdoms:[{name:'Tuyết Tông Cao Địa Bộ',brief:'Vư ơng quốc thần quyền trên núi cao, là thế lực phụ thuộc của Huyết Liên Mật Giáo; đ óng đ ô tại Thiên Thế Bảo, vư ơng miện tuyết đ ược thế tập.',tags:['Thần Quyền Phụ Thuộc Quốc']}],sects:[{name:'Thiên Cơ Môn',brief:'Chính Đạo cơ quan luyện_khí tông_môn，cư đ ông lộc thiên cơ phong，thần lục tối đa pháp bảo chế tạo thư ơng。',tags:['Chính Đạo','luyện_khí']},{name:'Huyết Liên Mật Giáo',brief:'Đại tông môn Ma Đạo lấy việc hiến tế ngư ời sống và cung phụng máu làm căn bản tu luyện, đ óng tại Thiên Cốt Hình sư ờn tây.',tags:['Ma Đạo']}]},{id:'eco-bj-heiyao',name:'Hắc Diệu Hỏa Uyên',description:'Thung lũng đ ứt gãy đ ịa nhiệt ở đo ạn giữa tàn tích. Sông nham thạch uốn lư ợn dư ới đ áy cốc, là vực sâu ấm áp duy nhất giữa lục đ ịa lạnh giá; Tẫn Dư ơng Thành đ ược xây treo leo trên vách đ á phía đ ông.',tags:['thung lũng đ ứt gãy đ ịa nhiệt','luyện_khí','Ôn Tuyền'],kingdoms:[],sects:[{name:'Tẫn Dư ơng Thành',brief:'trung lậptu tiên thành，Bắc Cảnhluy ện_khítrung Tâm；thiên Lô cùng mở"Lô Hỏa Tế"nổi danh。',tags:['trung lậptu tiên thành']}]},{id:'eco-bj-canglang',name:'Thư ơng Lang Thảo Hải',description:'Thảo nguyên ôn đ ới phía đ ông nam. Mục dân mư ời hai bộ lạc cùng tôn thờ Đại Khả Hãn; Thư ơng Lang Sơn đ ược lập làm núi thiêng.',tags:['thảo nguyên','Du Mục','Kỵ Binh'],kingdoms:[{name:'Thư ơng Lang Hãn Quốc',brief:'Liên minh mư ời hai bộ lạc thảo nguyên theo chế đ ộ Khả Hãn, vư ơng đ ình chóp vàng di chuyển theo Đại Khả Hãn.',tags:['Bộ Lạc Liên Minh']}],sects:[]},{id:'eco-bj-qianjing',name:'Thiên Kính Diêm Trạch',description:'Cánh đ ồng muối trên nền đ áy biển cổ ở vùng trũng phía đ ông nam. Nư ớc cạn phủ trên mặt đ ất như gư ơng, ban đ êm trên ruộng muối nổi lên lân hỏa màu xanh u ám; do bảy gia tộc làm muối cùng cai trị.',tags:['Diêm Nguyên','Môn Phiệt','chiêm bốc'],kingdoms:[{name:'Thất Tính Diêm Gia',brief:'Chung · Kính · Đư ờng · Tiêu · Lư · Dư ơng · Tạ Liên minh nghị sự của bảy hào tộc buôn muối lớn, nghị đ ường đ ặt tại Đạc Chung Thành.',tags:['Môn Phiệt Liên Minh']}],sects:[{name:'Diêm Kính Xã',brief:'Bí xã ảo thuật phản chiếu Kính Hàn Khâu, trực thuộc gia tộc họ Kính trong bảy họ.',tags:['trung lập','chiêm bốc']}]},{id:'eco-bj-nanfeng',name:'Nam Phong Cẩm Tú',description:'Vùng đ ất màu mỡ biên giới phía nam, là nơi đ áng sống nhất Bắc Cảnh. Phiên quốc của Càn Nguyên Thánh Triều là Nam Phong Quốc đ óng đ ô tại Cẩm Tú Thành, văn phong cực kỳ hưng thịnh.',tags:['ốc thổ','Văn Tu','Viên Lâm'],kingdoms:[{name:'Nam Phong Quốc',brief:'Vư ơng quốc phàm nhân ở biên giới phía nam Bắc Cảnh, là chư hầu của Càn Nguyên Thánh Triều; gia tộc họ Tiêu thế tập, văn phong cực kỳ hưng thịnh.',tags:['phiên quốc']}],sects:[{name:'Linh Phong Trai',brief:'Tông môn Chính Đạo lấy âm nhạc nhập đ ạo, đ óng tại Cẩm Tú Thành; là thánh đ ịa của các tu sĩ phong nhã trong thiên hạ.',tags:['Chính Đạo','âm luật']}]}]},{id:'reg-nanjiang',name:'Nam Cư ơng',description:'Rừng mưa ẩm nhiệt, Sở đ ịa đ ại trạch, Thập Vạn Đại Sơn dữ cận hải hồng thụ lâm tịnh tồn, nam lâm ba tầng vô tận hải; Đạo Minh tứ tông (Tư ơng Linh Các · U Minh Phủ · Ngũ Độc Giáo · Thiên Hình Tông) thống ngự chư quốc, dữ Tây Vực Tiên Minh đ ịch đ ối.',children:[{id:'eco-nj-yuzhang',name:'Vũ Chư ớng Lâm',description:'Rừng mưa nhiệt đ ới đ ầy chư ớng khí đ ộc ở phía nam. Thần Mộc Điện của Ngũ Độc Giáo luyện cổ ngự đ ộc; Bốn bộ tộc phía nam của Bách Việt đ ời đ ời chịu sự bóc lột.',tags:['rừng mưa nhiệt đ ới','cổ đ ộc','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang nam cảnh, Xà Phư ơng · Quỷ Phư ơng · Mẫu Phư ơng tam bộ, bị Ngũ Độc Giáo thật tế khống chế, sung tác phàm nhân lai nguyên.',tags:['bộ lạc liên bang','nam cảnh']}],sects:[{name:'Ngũ Độc Giáo',brief:'Đạo Minh thành viên, thối đ ộc luyện cổ, ngự thế gian vạn đ ộc chi đ ại tông, cư Thần Mộc Điện.',tags:['Đạo Minh','cổ đ ộc']}]},{id:'eco-nj-cuiyu',name:'Thúy Ngọc Khâu',description:'Vùng đ ồi núi á nhiệt đ ới dày đ ặc suối linh khí ở phía bắc. Địa mạch dị biến tạo thành Vạn Linh Tức Quật và Hóa Thú Uyên; Tạo Vật Điện của Thiên Hình Tông chiếm giữ nơi này đ ể nhân giống kỳ thú, Bốn bộ tộc phía bắc của Bách Việt đ ời đ ời hái thuốc, ngự thú đ ể mưu sinh.',tags:['đ ồi á nhiệt đ ới','Hoạt Thể Cải Tạo','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang Bắc Cảnh, Phư ợng Linh · Tư ớc Vũ · Thú Minh · Thúy Linh tứ bộ, thế đ ại thải dư ợc ngự thú, thụ Thiên Hình Tông bàn bác.',tags:['bộ lạc liên bang','Bắc Cảnh']}],sects:[{name:'Thiên Hình Tông',brief:'Đạo Minh thành viên, phồn dục kỳ biến ma thú, hoạt thể cải tạo chi đ ại tông, cư Tạo Vật Điện; cận bách niên cư ờng thế quật khởi.',tags:['Đạo Minh','Cải Tạo','Kỳ Thú']}]},{id:'eco-nj-shiwan',name:'Thập Vạn Đại Sơn',description:'Dãy núi nguyên thủy phía tây nam, cấm đ ịa của Yêu tộc. Bảy tộc của Vạn Yêu Minh chiếm giữ, quốc gia phàm nhân không đ ược bư ớc vào; ngang hàng với Đạo Minh, hai bên không xâm phạm lẫn nhau.',tags:['nguyên thủy Sơn Mạch','yêu tộc cấm đ ịa','Vạn Yêu Minh'],kingdoms:[],sects:[{name:'Vạn Yêu Minh',brief:'Yêu tộc đ ộc lập liên minh, vô minh chủ, thất tộc cộng trị; dữ Đạo Minh đ ồng cấp, hỗ bất xâm phạm.',tags:['Yêu Tộc','Liên Minh','Cấm Địa']}]},{id:'eco-nj-yongheng',name:'Vĩnh Hằng Cốc',description:'Thung lũng tử khí ở trung nam. Thông U Các của U Minh Phủ lập tại Cửu U Tuyền giữa thung lũng; Đại Tự Thành của Đại Tự Vư ơng Triều xây ở cửa thung lũng, là thủ đ ô của quốc gia phụ thuộc Đạo Minh.',tags:['tử khí cốc đ ịa','vong linh','Đạo Minh','thần quyền nô lệ'],kingdoms:[{name:'Đại Tự Vư ơng Triều',brief:'Tàn khốc thần quyền nô lệ vư ơng triều, U Minh Phủ công khai phụ thuộc; đ ô kì Đại Tự Thành kiến vu Vĩnh Hằng Cốc biên duyên.',tags:['thần quyền nô lệ','U Minh Phủ phụ thuộc']}],sects:[{name:'U Minh Phủ',brief:'Đạo Minh thành viên, nhiếp tử khí, luyện thi lỗi chi đ ại tông, cư Thông U Các; Đại Tự Vư ơng Triều tông chủ.',tags:['Đạo Minh','vong linh']}]},{id:'eco-nj-yunmeng',name:'Vân Mộng Trạch',description:'Đầm lầy khổng lồ của đ ất Sở ở phía đ ông, trung tâm vư ơng triều. Dĩnh Đô của Sở Thiên Vư ơng Triều xây dựng cung đi ện trên mặt nư ớc giữa đ ầm lầy; Cửu Ca Điện của Tư ơng Linh Các chính là trung tâm nghị sự của Đạo Minh.',tags:['thấp đ ịa đ ại trạch','Sở vu','Đạo Minh trung khu'],kingdoms:[{name:'Sở Thiên Vư ơng Triều',brief:'Sở đ ịa vu chúc vư ơng triều, Tư ơng Linh Các phụ dung; quân vư ơng trị chính, đ ại chúc ti thần, đ ô Dĩnh Thành kiến vu Vân Mộng Trạch phúc tâm.',tags:['vư ơng triều','Sở vu','Đạo Minhphụ dung']}],sects:[{name:'Tư ơng Linh Các',brief:'Đạo Minh minh chủ, thư ợng cổ Vu tộc thất lạc huyết duệ chi đ ại tông, cư Cửu Ca Điện; Sở Thiên Vư ơng Triều tông chủ, Đại Chúc Do Các trung chỉ phái.',tags:['Đạo Minh','minh chủ','Vu Tộc']}]},{id:'eco-nj-jinxiu',name:'Cẩm Tú Đạo Hư ơng',description:'Kho lư ơng thực của Sở Thiên ở vùng trung bắc. Hàng ngàn dặm ruộng bậc thang và đ ồng bằng, lúa linh khí mọc ba vụ; Đạo Quan Phủ của Sở Thiên nắm giữ chính sách lư ơng thực, phàm tu rất hiếm.',tags:['lư ơng thư ơng','Đạo Điền','Sở Thiên'],kingdoms:[{name:'Sở Thiên Vư ơng Triều',brief:'Vư ơng triều tây cảnh lư ơng thư ơng, Đạo Quan Phủ chủ lý lư ơng chính; Đại Chúc Hành Cung tọa trấn đ ạo tế.',tags:['vư ơng triều','lư ơng thư ơng']}],sects:[]},{id:'eco-nj-shenmu',name:'Thần Mộc Mãng Nguyên',description:'Rừng thần mộc Thư ợng cổ ở vùng tây trung, cấm đ ịa của mộc linh. Thần mộc khổng lồ đ ã khai mở một nửa linh trí cắm rễ giữa tâm rừng; phàm tu không đ ược vào, quốc gia phàm nhân không dám bén mảng.',tags:['Thư ợng Cổ Thần Mộc','thụ linh cấ ỷ dị tự dưng in sâu vào thức hải sau khi tỉnh dậy, phẩm giai vư ợt xa phạm trù mà tu sĩ Luyện Khí kỳ có thể khống chế, lai lịch bí ẩn.',glyph:'Cổ',tags:['Ngũ Độc tổ truyền','lai lịch bất minh'],data:{đang_sử_dụng:!1,phẩm_chất:'Thiên',cảnh_giới:'Luyện Khí kỳ',ngũ_hành:'Âm',thể_loại:'Thần thức',tiêu_hao:'linh_khí:5',nhãn:['công_kích:5','Ngũ Độc tổ truyền','lai lịch bất minh'],hiệu_quả:{'Vô Tư ớng Chủng Cổ':'Ngưng tụ thần_thức thành kim vô hình, vô đi ều kiện cấy một con cổ trùng vào cơ thể mục tiêu từ Hóa Thần kỳ trở xuống, bỏ qua mọi sự kháng cự.','Tuần Cổ Cổ Cảm':'Bất kỳ ai bị cấy cổ trùng của kinh này vào cơ thể, bất luận xa gần, đ ều có thể dựa vào cổ trùng đ ể cảm nhận phư ơng hư ớng và sống chết của kẻ đ ó.'},mô_tả:'Sau khi nuốt quả lạ ngũ sắc và tỉnh lại từ cơn hôn mê, một môn thần_thức công_pháp bỗng dưng khắc sâu vào tận cùng thức hải. Hoàn toàn không liên quan đ ến những gì ghi trong 《Bách Độc Kinh》, tựa như xuất phát từ tiếng thì thầm gọi đ ến "Vạn Độc Tổ Quật" kia.'}},{id:'plot-luowu-duangu',storyId:'story-luowu-mirror',name:'Đoạn Cốt Thổ Nạp Quyết',category:'công_pháp',thể_loại:'Tâm pháp',phẩm_chất:'Hoàng',cảnh_giới:'Luyện Khí kỳ',ngũ_hành:'Thổ',desc:'Tâm pháp nhập môn của La Võ Môn đ ược mẫu thân phong ấn vào Tố Quang Giám, và đ ã đ ược đi ều chỉnh dựa theo kinh mạch của ngư ơi.',glyph:'Cốt',tags:['La Vũ Môn','mẫu thân di lưu','đo ạn thể'],data:{đang_sử_dụng:!1,phẩm_chất:'Hoàng',cảnh_giới:'Luyện Khí kỳ',ngũ_hành:'Thổ',thể_loại:'Tâm pháp',tiêu_hao:'Vô',nhãn:['tu hành tốc đ ộ:1','La Vũ Môn Truyền Thừa','mẫu thân di lưu'],hiệu_quả:{'Đoạn Cốt Thổ Nạp':'Trong chiến đ ấu, mỗi hiệp tự đ ộng loại bỏ một trạng thái tiêu cực từ nguồn không cao hơn cảnh giới của bản thân.'},mô_tả:'Tâm pháp nhập môn La Võ Môn mẫu thân lưu lại trong Tố Quang Giám. Truyền thừa trong gư ơng đ ã đ ược đi ều chỉnh lại dựa theo kinh mạch của ngư ơi, giúp thân nam nhi cũng có thể an toàn vận công.'}},{id:'plot-luowu-suguang',storyId:'story-luowu-mirror',name:'Tố Quang Giám',category:'vật_p ất tuyệt đ ỉnh còn đ ược các Trư ởng Lão thu làm đ ệ tử thân truyền, đ ích thân chỉ dạy.',cost:0,glyph:'Thí',recommend:'Tầm Thư ờng Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'tông_môn',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7203,Nguyệt:1,Nhật:5,thời_thần:'thìn'},tông_môn:'nhập tông thụ thí · đ ãi phân phái môn đ ệ',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ngày đ ại lễ nhập tông, trên quảng trư ờng Trắc Linh đ ông nghìn nghịt ngư ời.\n Ngư ơi theo một đ ám thiếu niên nam nữ mang trong mình mơ ư ớc lần lư ợt tiến vào. Chính giữa quảng trư ờng đ ặt một tòa ngọc bàn thanh sắc cổ kính, mặt bàn tỏa ra ngũ sắc quang mang lưu chuyển bất đ ịnh.\n Chấp sự hành lễ đ ứng bên cạnh, tiếng xư ớng tên liên tiếp vang lên: \"Linh Căn tạp nham, phân vào Ngoại môn, làm tạp dịch——\" \"Chân Linh nhập phẩm, Ngoại môn thân truyền——\" \"Thư ợng phẩm Linh Căn, Nội môn đ ích truyền, đ ược Trư ởng Lão chọn làm đ ồ đ ệ——\"\n Mỗi một tiếng xư ớng lên đ ều kéo theo nhịp thở của mọi ngư ời dư ới đ ài: kẻ đ ược gọi vào Nội môn thì vui sư ớng ra mặt, ngư ời vào Ngoại môn cũng thở phào nhẹ nhõm như đ ược đ ại xá, chỉ có những kẻ không đo ra đ ược Linh Căn là ảm đ ạm rút lui.\n Cuối cùng cũng đ ến lư ợt ngư ơi. Chấp sự ngư ớc mắt liếc ngư ơi một cái, nhạt giọng nói: \"Tiến lên, đ ặt tay vào giữa ngọc bàn, ngưng thần, không đ ược phân tâm.\"\n Ngư ơi hít sâu một hơi, chậm rãi bư ớc tới, đem lòng bàn tay nhẹ nhàng đ ặt lên ngọc bàn ôn nhuận mang theo chút hơi lạnh kia——'},{id:'story-yinyu',name:'Ẩn Ngọc Sơ Thức',subtitle:'kết giao cao nhân chốn phàm trần',desc:'Vốn đ ịnh chỉ sống qua ngày chốn phàm trần, lại tình cờ gặp đ ược du phư ơng tiên sư nơi quán trà, đ ược tặng cho một cuộn tàn thư.',cost:0,glyph:'Cơ',recommend:'Tầm Thư ờng Tu Hành',thể_loại:'Tản Tu',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7156,Nguyệt:11,Nhật:12,thời_thần:'dậu'},tông_môn:'Tản Tu',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'ngư ơi đang ngồi ở góc quán trà，nhìn những hạt tuyết đ ập vào song cửa ngẩn ngư ời。\nlão giả áo xám bàn bên chợt cư ời với ngư ơi：\n"Tiểu hữu có duyên với kiếm."\nlão tiện tay đ ẩy qua mặt bàn một cuộn giấy dầu Hoàngtàn khuyết，lạit ự rót tự uống cạn ly rư ợu，chớp mắt đ ã tan biến vào bão tuyết——'},{id:'story-fuchou',name:'Huyết Môn Di Cô',subtitle:'Phụ Cừu Tiền Hành',desc:'Môn phái bị ma tu tàn sát cạn kiệt trong đ êm, chỉ mình ngư ơi mang theo tín vật sư môn trốn thoát.',cost:0,glyph:'Cừu',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'Tản Tu',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7188,Nguyệt:7,Nhật:22,thời_thần:'dần'},tông_môn:'Tản Tu (tiền · Vụ Ẩn Sơn Môn)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'hậu kỳ'}},body:'Sơn môn bị hủy diệt chỉ trong một đ êm.\n Ngư ơi nằm rạp trong vũng bùn máu giả chết, lắng nghe tiếng gầm thét phẫn nộ cuối cùng của sư tỷ, nghe tiếng quải trư ợng nặng nề lư ớt qua bên cạnh.\nCho đ ến khi mọi thứ chìm vào tĩnh lặng.\n Ngư ơi nắm chặt lấy miếng ngọc bài đ ã bị máu tư ơi nhuộm đ ẫm, trư ớc lúc bình minh bò ra khỏi đ ống đ ổ nát hoang tàn——',tags:['Cừu Oán']},{id:'story-dadao',name:'Dĩ Ngộ Đại Đạo',subtitle:'Tiền Thế Kim Sinh',desc:'Ngư ơi dư ờng như nhớ lại mọi chuyện kiếp trư ớc. Mọi thứ chưa kịp bắt đ ầu, lại phảng phất như đ ã đ ến hồi kết.',cost:0,glyph:'Đạo',recommend:'Tiểu Đạo Du Du',thể_loại:'đ ặc biệt',settings:{thời_gian:{Niên:7301,Nguyệt:3,Nhật:3,thời_thần:'mão'},tông_môn:'Tản Tu',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ngư ơi mở bừng mắt giữa ánh bình minh.\n Ngoài cửa sổ là dòng linh khê quen thuộc không thể quen thuộc hơn, phía xa tiếng chuông sớm vang vọng——\n Tất cả những thứ này, ngư ơi dư ờng như đ ã thấy qua ngàn vạn lần trong một giấc mộng nào đ ó.\n Ngư ơi đ ưa tay khẽ chạm vào ngọc bài trư ớc ngực, nơi đ ó phảng phất vẫn còn lưu lại hơi ấm sau ngọn lửa thiêu đ ốt của kiếp trư ớc——',tags:['Truyền thuyết']},{id:'story-tianxuan-zayou',name:'Vạn Kiếm Bình · kiếm sư tặng thạch',subtitle:'Duyên bèo nư ớc gặp nhau trong bão tuyết',desc:'Thiên Huyền Kiếm Tông tạp dịch Đệ Tử, vu Vạn Kiếm Bình tảo tuyết thời ngẫu ngộ kiếm mạch truyền nhân Mặc Thi Hành phụng mệnh hạ sơn lịch luyện; lâm hành tiền nàng lưu hạ một viên Hạ Phẩm Linh Thạch.',cost:0,glyph:'Kiếm',recommend:'Lệ Tâm Vấn Đạo',thể_loại:'tông_môn',constraints:{locationIds:['eco-xy-wuyan'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7204,Nguyệt:12,Nhật:18,thời_thần:'thìn'},tông_môn:'Thiên Huyền Kiếm Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Thiên Huyền Kiếm Tôngt ông_mônqu ảng trư ờng，vạn Kiếm trên bình đ ài đ ọng một lớp sư ơng mới，vài tênt ạp dịch Đệ Tử đang cúi đ ầu quét tư ớc，ngư ơi cũng ở trong đ ó。\ntông chủ Mạc Quyết Vân đứng phía trư ớc đ ại đi ện Thạchtr ên thềm，chắp tay sau lưng đ ứng，trư ờng sam xám trắng tung bay trong gió；Kiếmm ạch truyền nhân Mặc Thi Hànhm ột thân Huyềnthanh Kiếm Bào，đ ứng lẻ loi giữa vạn Kiếmbìnhtrung ư ơng，trư ờng Kiếmnghi êng đ ón tàn tuyết，đ ứng yên Bất Động，dư ờng như đ ã đ ứng trong bão tuyết này suốt cả đ êm。\n"Một đ êm chưa thu kiếm, nhát kiếm đ ó, đ ã có \'thể\' chưa?"Mạc Quyết Vân đ ích thanh âm bất đ ại, khư ớc thanh tích truyền biến chỉnh cá Vạn Kiếm Bình, ẩn ẩn áp quá hô khiếu đ ích phong thanh.\n Mặc Thi Hành chậm rãi thu kiếm vào vỏ, mặc mâu thanh lãnh, vọng trư ớc mạn thiên phong tuyết, thanh âm hẩn đ ạm.\n"Hồi sư tôn, còn kém một phân. Một tiễn này Đệ Tử luyện ba năm, chiêu đ ã tới cực, trong kiếm lại luôn thiếu một hơi—— không phải không đ ủ sắc, là không có thi."\n Mạc Quyết Vân mi đ ầu vi bất khả sát đ ịa nhất đ ộng, tụ bào khinh phất, tư ơng nàng thân bàng tam xích tích tuyết đ ãng khai, nàng khư ớc liên nhãn dã vị trát.\n"Bế tử quan trên núi, kiếm ý ngư ợc lại bị mài cùn. Từ hôm nay trở đi, ngư ơi xuống núi lịch luyện đi—— đi nhân gian tìm một ngụm「thi」đ ó của ngư ơi, tìm không thấy, thì không cần về tông."\n Mặc Thi Hành chinh liễu nhất thuấn, tùy tức đoan chính hành liễu nhất lễ, thanh âm y cựu thanh lãnh, khư ớc bỉ phư ơng tài đa liễu nhất phân trịnh trọng,"Đệ Tử……lĩnh mệnh。"\n Nàng chuyển thân hư ớng sơn môn tẩu khứ, trư ờng phát thúc đ ắc cực cao, bối thư ợng trư ờng kiếm ánh trư ớc tuyết quang, huyền thanh kiếm bào lư ợc quá nhất đ ịa tố bạch. Hành chí ngư ơi thân biên, cư ớc bộ vô đoan đ ốn liễu nhất đ ốn.\n Nàng thuỵ mâu khán liễu khán ngư ơi đ ống đ ắc phát hồng đ ích thủ, hựu khán liễu khán ngư ơi cư ớc hạ na nhất tiểu phiến bị tảo đ ắc can can tịnh tịnh đ ích tuyết đ ịa, mặc mâu lý lư ợc quá nhất ti cực đ ạm đ ích đ ồ vật.\n"Nhất xứ nhất xứ, tảo đ ắc bất yếm, giá dã thị kiếm ý."Mặc Thi Hành thuyết trư ớc, tòng tụ trung thủ xuất một viên Hạ Phẩm Linh Thạch, khinh khinh các tiến ngư ơi chư ởng tâm,"Tâm trầm đ ắc hạ xuống, chổi cũng có thể thông đ ạo. Đồng này, coi như cảm tạ ngư ơi cho ta xem một mảnh tuyết đ ịa sạch sẽ này."\nlời cạn，nàng không nói thêm gì，mũi chân nhẹ nhàng Điểm，niệm quyết Ngự Kiếmm à bay lên，một Đạothanh quang ẩn vào tuyết rơi，chớp mắt biến mất。'},{id:'story-lingfeng-yueye',name:'Hồi Âm Cốc · nguyệt hạ hợp tấu',subtitle:'Nhã hội khi mới nhập Linh Phong Trai',desc:'Vừa gia nhập Linh Phong Trai không lâu, đ êm trăng một mình gảy đ àn tại Hồi Âm Cốc, tình cờ gặp Hạ Vị Ương tay cầm ngọc đ ịch, hai ngư ời hợp tấu một khúc.',cost:0,glyph:'Cầm',recommend:'Tiểu Đạo Du Du / Tầm Thư ờng Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-bj-nanfeng'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7212,Nguyệt:8,Nhật:16,thời_thần:'hợi'},tông_môn:'Linh Phong Trai',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'dạ sắc hơi trầm xuống，một vầng trăng non treo trên đ êm Hồi Âm Cốc Không；Thủyh ơi sư ơng mờ mịt，làm ư ớt rêu xanh ven bờ。\nngư ơi ngồi ven sông Thạch trên，trên gối đ ặt ngang cổ Cầm，ngón tay khảy，tịnh Vôđịnh phổ，chỉ nư ơng theo cơn gió phập phồng。Linh linh Thất Huyền，thỉnh thoảng kinh đ ộng đ ến loài nghỉ trong bụi lautrongvài con Thủychim，Thủychim vỗ cánh sư ợt qua Thủym ặt，lay đ ộng ánh trăng ĐiểmĐiểm。\nchợt có tiếng sáo Tựtừ ngọn cây rơi xuống，tiếng sáo thanh việt ấy，không tranh không đo ạt，chỉ khẽ lấp vào Cầmâm thanh sắp dứt Khôngkhe，giữ lại cái sắp tán đi kia Dưv ận。\nngư ơi giữ chặt Cầmdây，ngư ớc mắt nhìn về phía xa，ngã rẽ lối mòn trong rừng，một bộ sa y màu ngó sen nhạt nhè nhẹ lay theo gió。ngư ời đ ến tay cầm một chi ngọc đ ịch，sáo Thântoàn thân trắng ngần，duy chỉ có phần đu ôi Trụyminh Hoàngtua cờ。\n"Quấy rầy nhã hứng của đ ạo hữu, vừa rồi nghe tiếng đ àn này, dư ờng như có ý giang lưu uyển chuyển nhiễu phư ơng đi ện, nhưng lại nhiều thêm vài phần tùy tính. Đạo hữu là ngư ời mới nhập trai?"\n nễ khởi thân, hư ớng nữ tử củng thủ nhất lễ,"tại hạ ngư ơi, sơ nhập Linh Phong Trai, kiến thử đ ịa nguyệt sắc chánh hảo, tình nan tự cấm, bất tư ởng kinh đ ộng liễu sư tỷ."\n Nữ tử kia bư ớc đ ến bên bờ nư ớc, không đ ứng trên cao nhận lễ, mà ngồi xuống phiến đ á xanh bên cạnh, đ ặt ngang ngọc đ ịch lên gối.\n"Vạn vật có tiếng, sóng nư ớc vỗ bờ này là tiếng, trùng kêu chim hót là tiếng, tiếng đ àn của đ ạo hữu tự nhiên cũng là tiếng, đ ã đ ều ở trong thiên đ ịa này, vậy thì không tính là quấy rầy."\n"Ta vừa rồi ở trong rừng, nghe trong tiếng đ àn của đ ạo hữu dư ờng như có ý chưa dứt, trùng hợp ta có một khúc nhạc cũng thiếu đi chút ý cảnh, không biết đ ạo hữu có nguyện hợp tấu một khúc?"\n Ngư ơi ngồi xuống lại, hai tay đ ặt lên dây đ àn, không cần dùng lời nói đ ể xác nhận đi ệu thức, ngón tay vừa hạ xuống, chính là lời đ áp lại.\n Tiếng đ àn nổi lên như suối chảy khe núi, trong trẻo trong ngần; tiếng sáo theo đ ó mà hòa vào, miên man xa xăm, tựa gió thoảng qua rừng thông.\n Khúc nhạc kết thúc, dư âm tan vào trong gió, mặt nư ớc trở lại vẻ bình lặng.\n"Gió đ êm nay, xem ra lại dịu dàng hơn ngày thư ờng đ ôi chút." Hạ Vị Ương khẽ vuốt thân sáo, đ ứng dậy, chỉnh lại lọn tóc bị gió thổi rối.\n"Nếu như đ ạo hữu thích nơi này, về sau cũng có thể thư ờng đ ến. Linh Phong Trai Hạ Vị Ương, ghi nhớ tiếng đ àn đ êm nay của đ ạo hữu."'},{id:'story-liuli-baicao',name:'Bách Thảo Phong · Dư ợc Viên tân lân',subtitle:'Cùng Triệu Phư ơng Huỳnh cuốc đ ất trồng dư ợc',desc:'Tạp dịch đ ệ tử của Lưu Ly Đan Tông, đang cuốc đ ất tại góc dư ợc viên Bách Thảo Phong; ngay sát vách có một tiểu sư muội rụt rè tên Triệu Phư ơng Huỳnh vừa mới chuyển đ ến.',cost:0,glyph:'Đan',recommend:'Tầm Thư ờng Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-dt-liufang'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7197,Nguyệt:4,Nhật:9,thời_thần:'thìn'},tông_môn:'Lưu Ly Đan Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Lưu Phư ơng Sơn Mạchk éo dài mấy trăm dặm，thần huy xé mây，Kimánh sáng chiếu xuống Bách Thảo Phong，đ ỉnh núi mây mù bồng bềnh，loáng thoáng thấy bóng dáng Nội Môn Đệ Tửng ự_vậtt ại Thiên，có kẻ ngồi trên hồ lô、có ngư ời đ ứng trênphi kiếm，nhưng những thứ đ ó đ ều vớit ạp dịch Vô Duyênphong cảnh。\n Lưu Ly Đan Tông，Bách Thảo Phong，khu vực tập trung gieo trồng linh thảo linh dư ợc cấp thấp，trong số đ ó có một tiểu dư ợc viên。\nngư ơi nhấc cuốc lên nghỉ một lát，thẳng lưng lên，luyện khí kỳs ơ kỳc ủalinh_khílu ân chuyển trong kinh mạch đ ược một vòng nhỏ Thiên，xóa đi ít nhiều mệt nhọc。dư ợc đi ền này chính là nơi hắn Lưu Ly Đan Tôngm ột mẫu ba phân Địa，thứ đ ược trồng đ ều làluy ện khí kỳk ỳđan dư ợccủa Cơ Sởph ụ Tài。\ntiểu dư ợc viên bỏ hoang gần nửa tháng ở nhà kế bên，hôm nay rục rịch。\nphía bên bờ rào trúc，một thiếu nữ tuổi đ ộ thanh xuân Niênhoa Nữ，Thântr êncủatạp dịchv ải Bàoc ó chút rộng rãi，tay áo xắn vài vòng Đạo，đ ể lộ cổ tay gầy。cô gái nửa ngồi ở ThổĐịa trên，huơ tay múa chân trư ớc cỏ thuốc ủ rũ vừa đ ược cắm xuống。\n"Lục cao cao, đ ất ở đ ây rất mềm mại, ngư ơi phải tranh khí, cắm rễ sâu một chút."\nThanh âm thuận trư ớc thần phong phiêu quá trúc ly, lạc nhập ngư ơi nhĩ trung. Na thiếu nữ tịnh vị sát giác bàng nhân mục quang, chỉ thị tòng câu cừ yểu khởi thiểu hứa tuyền thủy, lâm cấp thảo dư ợc.\n"Uống nư ớc rồi thì không đ ược phép héo nữa, đ ợi ngư ơi mọc ra lá mới, ta sẽ gọi ngư ơi là lục tráng tráng."\n Ngư ơi thủ trung sừ đ ầu khinh đ ốn, bính thư ợng nhất khối ngạnh thổ, phát xuất liễu hư ởng thanh, thiếu nữ chuyển đ ầu, mâu tử lý ánh xuất ngư ơi đ ề trư ớc sừ đ ầu đ ích thân ảnh.\n Nàng liên mang trạm khởi thân lai, song thủ tại thân tiền giao đi ệp, triều trư ớc ngư ơi thâm thâm hành liễu nhất lễ, vì đ ộng tác thái cấp, đ ầu đ ính na đi ều dụng lai thúc phát đ ích thô bố đi ều oai liễu một số, kỷ lũ toái phát tán tại ngạch tiền.\n"Tiền, tiền bối hảo." Nàng cúi đ ầu rất thấp, đ ể lộ gáy trắng ngần thon thả, giọng nói có chút rụt rè, "Ta là Triệu Phư ơng Huỳnh mới đ ến khối dư ợc đi ền này, nếu làm ồn đ ến tiền bối tu hành, mong tiền bối thứ tội."'},{id:'story-nanjiang-fox',name:'Thập Vạn Đại Sơn · giải cấu hồ yêu',subtitle:'Trên đ ường hái thuốc tình cờ lạc vào u cốc tiên chi',desc:'vì tìm"Linh Sơn Tiên Chi"tại Thập Vạn Đại Sơnb ên Duyên ẩn nấp quanh quẩn vài ngày，lỡ lạc vào u cốc，bắt gặp đang đ ối diện Mộccột đ ơn Tự Thanh Khâu luyện lời nói Hồtộc Nữ Tô Ngưng Hư ơng。',cost:0,glyph:'Hồ',recommend:'Tầm Thư ờng Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'Tản Tu',constraints:{regionIds:['reg-nanjiang'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7220,Nguyệt:6,Nhật:1,thời_thần:'thìn'},tông_môn:'Tản Tu',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'Tia nắng ban mai mờ tỏ, hơi nư ớc oi bức ẩm ư ớt đ ặc trưng của Nam Cư ơng vẫn chưa tiêu tán hết, trong rừng ngưng đ ọng lại lớp sư ơng mù tựa màn lụa mỏng.\n Ngư ơi lưng cõng gùi tre, chân xỏ giày da, bư ớc vào lối nhỏ thâm u. Nơi này vắng bóng ngư ời, thợ hái thuốc tầm thư ờng không dám bén mảng, nhưng vì truy tìm "Linh Sơn Tiên Chi" trong truyền thuyết, ngư ơi đ ã quanh quẩn ở rìa Thập Vạn Đại Sơn nhiều ngày.\n Ngư ơi vạch đ ám lá rộng che khuất tầm nhìn trư ớc mắt, tầm nhìn chợt mở rộng. Phía trư ớc là một u cốc tĩnh mịch, trong cốc suối chảy róc rách, hai bên bờ nở đ ầy dã hoa không tên, đung đ ưa theo gió, cánh hoa rơi rụng lả tả. Giữa khóm hoa, một thiếu nữ mặc nhu quần màu phấn nhạt đang ngồi, nàng quay lưng về phía ngư ơi, đ ối diện với một cọc gỗ lẩm bẩm đi ều gì đ ó.\n"Công tử đ ại ân, tiểu nữ tử không biết lấy gì đ ền đ áp, chỉ có..." Giọng thiếu nữ hơi khựng lại, nghiêng đ ầu, tựa như đang nhớ lại đi ều gì, sau đ ó đ ổi sang một ngữ đi ệu khác, mang theo chút e lệ, "Chỉ có lấy thân báo đ áp, nguyện theo chàng đi khắp chân trời góc bể."\n Ngư ơi vô tình giẫm gãy một cành cây khô, tiếng "rắc" khẽ vang lên, trong u cốc tĩnh mịch này lại lộ ra vẻ vô cùng đ ột ngột.\n Thân hình thiếu nữ khẽ run, đ ột ngột quay đ ầu lại, khuôn mặt kiều diễm, hai má ửng hồng, trong đ ôi mắt trong vắt như nư ớc suối mang theo chút hoảng hốt.\n"Ngư ơi là ai? Ngư ơi là... tới đ ây ngắm cảnh sao?"\n Ngư ơi chắp tay hành lễ, "Tại hạ là ngư ời hái thuốc trong núi, đi nhầm vào nơi thanh tu của cô nư ơng... nhiều đi ều đ ắc tội, xin hãy lư ợng thứ."\n Thiếu nữ nghe vậy, sự cảnh giác trong mắt hơi lui đi, thay vào đ ó là sự tò mò, tựa như đang xác nhận thiện ý của đ ối phư ơng.\n"Ngư ời hái thuốc..." Nàng lặp lại với giọng trầm thấp, lập tức đ ứng dậy, vụng về đ áp lễ, "Tiểu nữ tử Tô Ngưng Hư ơng, xin ra mắt."'},{id:'story-wudu-init',name:'rời khỏi chư ớng lâm · Vạn Độc Tổ Quật',subtitle:'Một ván cư ợc lớn trong sát hạch nhập môn',desc:'tại Vũ Chư ớng Lâmtham gia Ngũ Độc Giáonh ập môns át hạch，đ ói rét đan xen、bốn bề đ ềuĐộc；bế tắc Vôđường nuốt xuốngm ột viên《Bách Độc Kinh》chưa ghi ngũ sắc quái quả，tỉnh dậy thức hải bỗng Không nhiều thêm một mônth ần_thức Cổ pháp，cùng một tiếng gọi ngư ơi đi"Vạn Độc Tổ Quật"lời thì thầm。',cost:0,glyph:'Cổ',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đ ặc biệt','kịch bản':!0,constraints:{locationIds:['eco-nj-yuzhang'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Ngũ Độc Giáo']},settings:{thời_gian:{Niên:7231,Nguyệt:4,Nhật:9,thời_thần:'tỵ'},tông_môn:'Ngũ Độc Giáo (nhập môn thí luyện)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Vũ Chư ớng Lâms âu thẳm，chư ớng khí ẩm thấp dính vào da，mãi không tan。\nđ ây là Ngũ Độc Giáonh ập môns át hạchc ửa ải cuối cùng——đ ộc Tựb ước ra khỏi khu rừng ăn thịt ngư ời này。đ ã sang ngày thứ ba，ngư ơiluyện khí kỳs ơ kỳ đóĐiểmít ỏilinh_khí đã sớm bị chư ớng khí Độcbào mòn chỉ còn lại Vôvài，đ ói Hỏac ùng hàn ý đ ồng thanh gặm nhấm ngũ tạng lục phủ。\nlại khổ thay khu rừng này"thực phẩm"Tịnh bất toán thiểu: tử hồng đ ích tư ơng quả, phì hậu đ ích khuẩn tán, ba mãn đ ằng mạn đ ích đi ềm ngẫu……ngư ơi phiên khai tùy thân na quyển 《Bách Độc Kinh》 nhất nhất bỉ đ ối, phiên đ áo tối hậu, chỉ tiêm phát lư ơng——vô nhất lệ ngoại, toàn thị kịch đ ộc. Nguyên lai giá nhất quan khảo đ ích tòng bất thị"Có thể tìm đ ược đ ồ ăn không"，mà là"Minh tri hữu đ ộc, nhĩ cảm bất cảm bính".\n Tựu tại ngư ơi cơ hồ yếu đ ảo hạ khứ đ ích lúc, nhất tùng hủ diệp gian lộ xuất một viên quyền đ ầu đ ại đ ích quả tử, ngũ thải ban lan, lưu chuyển trư ớc cận hồ yêu dị đ ích quang trạch. Ngư ơi phiên biến 《Bách Độc Kinh》, tòng đ ầu đ áo vĩ——cánh không có bán cá tự đ ề đ áo tha.\n Vị tái vu kinh, tiện thị vị tri; vị tri, tiện thị bất tri tử hoạt. Khả ngư ơi dã xác thật, tái không có biệt đ ích lộ liễu.\n Ngư ơi đinh trư ớc na mai quái quả khán liễu hẩn cửu, chung vu bế thư ợng nhãn, nhất khẩu giảo liễu hạ khứ——đ ổ giá nhất bả.\nÝ thức trụy nhập vô biên đ ích hắc.\n……\n Tái tranh nhãn thời, thiên quang dĩ lư ợng. Cơ hàn tận thoái, na đi ểm bị ma tận đ ích linh_khí cánh dã tiễu nhiên phục nguyên, tứ chi bách hài thuyết bất xuất đ ích thông thái, phảng phất cái gì đ ồ vật tại thể nội bị triệt đ ể tẩy quá nhất biến.\n Chỉ thị——ngư ơi đ ích thức hải lý, bằng không đa liễu nhất môn công_pháp. Tha đ ích tên bản thân phù thư ợng tâm đ ầu: 《Phệ Tâm Cổ Kinh》. thần_thức vi châm, chủng cổ phệ tâm, quỷ dị đ ắc dữ 《Bách Độc Kinh》 lý nhậm hà nhất hiệt đ ô bất tư ơng can.\nNhi tại thức hải thâm xứ, nhất đo ạn sa á nhi diêu viễn đ ích đ ê ngữ, chính thiếp trư ớc thần hồn phản phục hồi hư ởng, huy chi bất khứ——\n"Lai……Vạn Độc Tổ Quật……trảo ngã……"\n Ngư ơi mạc liễu mạc hoài lý na khối nhập môn thời tông_môn phát hạ đ ích ti nam chi thạch——tha nhất như vãng thư ờng, chỉ nhận đ ắc nam bắc, khư ớc bán đi ểm chỉ bất xuất na"Vạn Độc Tổ Quật"ở nơi nao。',tags:['Ngũ Độc Giáo','kỳ ngộ']},{id:'story-luowu-mirror',name:'Di kính quy tông · tố quang tầm thân',subtitle:'Truyền thừa La Võ Môn ngủ say trong di vật của mẫu thân',desc:'Bạch Nhụy Huyền trong lúc vân du tình cờ phát hiện, trong cơ thể ngư ơi thế mà lại đang vận chuyển tâm pháp của La Võ Môn; Tố Quang Giám do mẫu thân đ ể lại có lưu giữ công pháp, kỹ nghệ và bốn đo ạn ký ức, chỉ khi đ ột phá đ ại cảnh giới mới có thể lần lư ợt giải tỏa. Để truy tìm nguyên nhân cái chết của mẫu thân ngư ơi, nàng quyết đ ịnh đ ưa ngư ơi quay lại La Võ Môn.',cost:0,glyph:'Kính',recommend:'Tầm Thư ờng Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đ ặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tínhc ấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','La Vũ Môn']},settings:{thời_gian:{Niên:7232,Nguyệt:8,Nhật:17,thời_thần:'thân'},tông_môn:'La Vũ Môn (quy tông đ ồ trung)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Bạch Nhụy Huyền ly khai La Vũ Môn hậu, nhất lộ tầm phỏng các đ ịa Thể Tu thiết tha luận kỹ. Đồ kinh ngư ơi cư trú đ ích thành trấn thời, nàng nguyên bản chỉ đ ả toán đ ình lưu nhất dạ, khư ớc tại nhân quần trung sát giác đ áo nhất lũ cực thục tất đ ích thổ nạp tiết luật——na cỗ khí tức chính tòng ngư ơi đ ích kinh mạch gian tuần hoàn, phân minh thị La Vũ Môn Đoán Cốt nhất mạch đ ích nội công lộ số.\n Nàng đ ương tức lan hạ ngư ơi, tế vấn giá môn tâm pháp tòng hà nhi lai, hựu phản phục truy vấn ngư ơi đ ích mẫu thân tính thậm danh thùy, thị phủ tằng vi La Vũ Môn Đệ Tử. Ngư ơi khư ớc đ áp bất thư ợng lai: mẫu thân khứ thế thời, ngư ơi thư ợng bất biết nàng đ ích quá vãng, chỉ ký đ ắc nàng lâm chung tiền tư ơng nhất diện cựu kính giao cấp ngư ơi; phụ thân dã chỉ khẳng thuyết, nàng thị bị cừu nhân sở sát.\n Ngư ơi thủ xuất mẫu thân lưu lại kính tử. Kính diện bất ánh tầm thư ờng nhân ảnh, linh lực xúc cập thời phản nhi phù xuất nhất tằng tằng Lưu đ ích kinh mạch đ ồ dữ kỹ_nghệ thủ trát. Bạch Nhụy Huyền kiểm tra hứa cửu, Xác nhận kỳ trung tàng trư ớc hoàn chỉnh đ ích La Vũ Môn Truyền Thừa, khư ớc bị tứ trọng cấm chế phân cách; chỉ hữu ngư ơi thân tự đ ột phá một cái đ ại_cảnh_giới, kính trung phong ấn tài hội giải khai nhất tằng, hiển lộ nhất đo ạn mẫu thân lưu lại ký ức tuyến sách. Vị đ áo đ ột phá chi thời, túng sử nàng cư ờng hành quán chú linh lực dã chỉ hội chiếu kiến nhất phiến vụ quang.\n Cánh lệnh nàng ý ngoại đ ích thị, giá phần Truyền Thừa tảo dĩ y chiếu ngư ơi đ ích kinh mạch trùng tân đi ều chỉnh. Tức sử ngư ơi tịnh phi nữ tính, dã năng an toàn tu hành bổn ưng chỉ truyền môn trung nữ Đệ Tử đ ích công_pháp, tuyệt phi ngẫu nhiên đ ắc lai đ ích sao bản sở năng tố đ áo.\n Bạch Nhụy Huyền trầm mặc phiến khắc, tư ơng kính tử trịnh trọng giao hoàn ngư ơi, tùy tức dĩ La Vũ Môn chiến kỹ mạch mạch chủ chi danh lập thệ: vô luận ngư ơi đ ích mẫu thân thị thùy, hựu tử vu hà nhân chi thủ, nàng đ ô hội bồi ngư ơi tra minh chân tư ớng, vi cố nhân thảo hồi công đ ạo.\n Thành môn ngoại, nàng dĩ bị hảo hồi phản La Vũ Môn đ ích hành trang. Ngư ơi đ ái trư ớc 《Đoạn Cốt Thổ Nạp Quyết》 dữ Tố Quang Giám tùy nàng thư ợng lộ; hạ nhất đo ạn kính trung ký ức, yếu đ ẳng ngư ơi thân thủ khóa quá đ ệ một cái đ ại_cảnh_giới hậu tài hội tỉnh lai.',tags:['La Vũ Môn','kỳ ngộ','Thân Thế']},{id:'story-luowu-nuwa',name:'vẫn tinh hoán tâm · Nữ Oa di thạch',subtitle:'Kẻ vốn dĩ đ ã chết, trong ngực lại vang lên nhịp đ ập của trái tim đ á',desc:'Trung Nguyên bỗng nhiên có thiên thạch rơi xuống, ngư ơi bị đ ập trúng chính diện nhưng lại không chết; tu sĩ La Võ Môn chạy đ ến kiểm tra thì phát hiện, trái tim nguyên bản của ngư ơi đ ã bị thiên thạch thay thế, bên trong hòn đ á vẫn còn lưu lại sức mạnh nghi là nguồn gốc từ Cửu Thiên Huyền Nữ.',cost:0,glyph:'Vẫn',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đ ặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tính:'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','La Vũ Môn']},settings:{thời_gian:{Niên:7233,Nguyệt:3,Nhật:21,thời_thần:'tuất'},tông_môn:'La Vũ Môn (vẫn tinh cứu trị)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Na nhất dạ, Trung Nguyên thiên mạc hốt nhiên liệt khai nhất đ ạo xí bạch trư ờng ngân. Vẫn tinh tha trư ớc diễm vĩ việt quá quần sơn, tối chung trực trụy ngư ơi sở tại chi đ ịa; ngư ơi thậm chí lai bất cập đ óa thiểm, thiên đ ịa tiện tại chấn hư ởng dữ cư ờng quang trung nhất đ ồng trầm một.\n Phụ cận đ ích La Vũ Môn tu sĩ tuần trư ớc cự hư ởng cản lai, chỉ kiến đ ịa diện hãm thành nhưng mạo trư ớc nhiệt khí đ ích thâm khan. Chiếu lý thuyết, khan tâm bất cai lưu hạ nhậm hà hoạt vật, ngư ơi khư ớc hoàn chỉnh đ ịa tràng tại toái thạch giữa, hung khẩu không có trí mệnh sang thư ơng, tứ chi dã nhưng hữu ôn đ ộ.\n Nàng môn tư ơng ngư ơi đ ái ly khan đ ể, kiểm tra thư ơng thế thời tài phát hiện cánh gia bất khả tư nghị chi sự: ngư ơi đ ích hung khoang lý dĩ thính bất kiến huyết nhục tâm tạng đ ích khiêu đ ộng, thủ nhi đ ại chi đ ích thị một viên dữ vẫn tinh đ ồng chất đ ích ngũ sắc kỳ thạch. mỗi lần thạch tâm chấn đ ộng, đ ô hữu ôn nhuận nhi cổ lão đ ích lực lư ợng duyên huyết mạch lưu biến toàn thân, duy trì trư ớc bổn ưng đo ạn tuyệt đ ích sinh cơ.\n Môn trung tu sĩ thư ờng thí dĩ linh lực thám tra, ngũ sắc huy quang khư ớc tự hành phính hợp thư ơng xứ, bài khai ngoại lực, ẩn ư ớc hiển xuất bổ thiên tạo hóa đ ích đ ạo uẩn. Nàng môn vô pháp đo ạn đ ịnh thạch đ ầu chân chính đ ích lai lịch, chỉ năng Xác nhận kỳ trung tự hồ tàn lưu trư ớc dữ Cửu Thiên Huyền Nữ hữu quan đ ích lực lư ợng.\n Ngư ơi tòng hôn mê trung tỉnh lai thời, đ ệ nhất thanh thính kiến đ ích tịnh phi tầm thư ờng tâm khiêu, mà là hung khoang thâm xứ trầm ổn đ ích thạch minh. La Vũ Môn tu sĩ thủ tại nhất bàng, cáo tố ngư ơi vẫn thạch đ ã dữ ngư ơi đ ích tính mệnh dung vi nhất thể, tịnh chuẩn bị đ ái ngư ơi Quay lại tông_môn tư ờng tra giá khỏa “Nữ Oa Thạch” cứu cánh vi hà lựa chọn liễu ngư ơi.',tags:['La Vũ Môn','kỳ ngộ','Nữ Oa Thạch']},{id:'story-guanghan-twin-fish',name:'Song ngư bội dẫn · nguyệt hạ trùng phùng',subtitle:'Nàng cuối cùng cũng đ ợi đ ược chuyển thế của cố nhân',desc:'Đêm trăng tròn, ngọc bội bạn sinh bỗng nhiên phát nhiệt, dẫn dắt Cung chủ Quảng Hàn Cung Mộ Toàn Cơ tìm đ ến. Nàng nhận ra ngư ơi chính là chuyển thế của cố nhân năm xưa, và quyết đ ịnh không bỏ lỡ lần nữa, phá lệ đ ưa ngư ơi đ ến Quảng Hàn Cung.',cost:0,glyph:'Bội',recommend:'Tiểu Đạo Du Du / Tầm Thư ờng Tu Hành',thể_loại:'đ ặc biệt','kịch bản':!0,flags:['Mộ Toàn Cơ · cựu duyên chuyển thế'],constraints:{locationIds:['eco-dt-shuanghua'],giới_tínhc ấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Quảng Hàn Cung']},settings:{thời_gian:{Niên:7234,Nguyệt:8,Nhật:15,thời_thần:'tý'},tông_môn:'Quảng Hàn Cung (phá lệ nhập cung)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'đ êm trăng tròn, ngư ơi tòng thụy mộng trung tỉnh lai, phi y đ áo ốc ngoại tiểu giải. Hồi ốc thời nhu yếu xuyên quá gia hư ơng đ ích Hoa Hải, vạn khoảnh hoa chi chính phục tại dạ phong lý, thanh lư ợng nguyệt quang nhất lộ phô đ áo ngư ơi đ ích cư ớc biên.\n Tẩu đ áo Hoa Hải thâm xứ, ngư ơi hốt nhiên sát giác hung tiền nhất trận ôn nhiệt. Na mai ngọc bội bổn cai tại thụy tiền trích hạ, kim dạ khư ớc hãn kiến đ ịa bị ngư ơi vong tại thân thư ợng. Phụ mẫu tằng cáo tố ngư ơi, ngư ơi xuất sinh thời khẩu trung tiện hàm trư ớc tha; trừ thử chi ngoại, vô nhân thuyết đ ắc thanh tha tòng hà nhi lai.\n Ngọc bội việt lai việt đ ãng, khư ớc bất chư ớc thư ơng cơ phu. Lư ỡng vĩ tư ơng hàm đ ích ngư văn phù khởi nhu hòa nguyệt huy, tư ợng tại hồi ứng một cái khóa việt mạn trư ờng tuế nguyệt đ ích hô hoán. Ngư ơi mạch nhiên hồi thủ, chỉ kiến Hoa Hải ngoại lập trư ớc nhất đ ạo tuyệt mỹ đ ích tiên tử thân ảnh, nguyệt bạch cung trang duệ quá hoa tiêu, thanh lãnh mi nhãn gian khư ớc hữu cơ hồ áp bất trụ đ ích kinh hỉ dữ hoàng nhiên.\nLai nhân chính thị Quảng Hàn Cung chủ Mộ Toàn Cơ. Nàng cảm ứng đ áo lánh một viên song ngư bội tô tỉnh hậu lập tức tuần tích nhi lai, chỉ nhất nhãn tiện nhận xuất ngư ơi thần hồn trung na đ ạo lệnh nàng đ ẳng đ ãi chí kim đ ích khí tức. Tiền thế, ngư ơi dữ nàng tư ơng thức tư ơng tri, khư ớc tại nàng lai đ ắc cập biểu lộ chân tình trư ớc đ ó vẫn lạc; nàng chỉ năng bả na mai thủy chung vị năng tống xuất đ ích đ ồng tâm bội dữ ngư ơi nhất đ ồng mai táng.\n Như kim, na mai bổn ưng trư ờng miên mộ trong ngọc bội tùy ngư ơi chuyển thế nhi sinh. Mộ Toàn Cơ thủ xuất bản thân trân tàng đa niên đ ích lánh nhất bán, lư ỡng mai ngọc bội cách trư ớc nguyệt sắc đ ồng thời khinh minh, tái không có bỉ giá cánh xác thiết đ ích chứng minh.\n Nàng hư ớng lai khắc chế đ ích thần tình chung vu thất thủ, việt quá hoa tùng khẩn khẩn bão trụ ngư ơi, tư ợng thị sảo nhất tùng thủ tiện hội tái mất đi nhất thứ. Đãi tối sơ đ ích kích đ ộng bình phục, nàng tài cáo tố ngư ơi tiền thế chi sự, dã thản ngôn giá nhất thế tuyệt bất hội tái bả tâm ý lưu đ áo lai bất cập thuyết xuất khẩu đ ích lúc.\n Quảng Hàn Cung tòng vị thu quá phi nữ tính Đệ Tử, đ ãn Mộ Toàn Cơ quyết đ ịnh thân tự thừa đ ảm thứ phá lệ. Thiên lư ợng trư ớc đ ó, nàng hội cấp ngư ơi thời_gian cáo biệt gia hư ơng; đ ãi nguyệt luân tây trầm, ngư ơi tư ơng đ ái trư ớc Song Ngư Đồng Tâm Bội tùy nàng khải trình, tiền vãng Sư ơng Hoa Đảo thư ợng đ ích Quảng Hàn Cung.',tags:['Quảng Hàn Cung','Chuyển Thế','Mộ Toàn Cơ','Song Ngư Đồng Tâm Bội']},{id:'story-guanghan-frozen-qilin',name:'Hồ tâm băng quan · kiếp tiền di dân',subtitle:'Cùng Kỳ Lân ấu tể thức tỉnh',desc:'Mặt hồ Nguyệt Hoa nứt toác, một khối băng tinh cổ xưa nổi lên mặt nư ớc; ngư ơi và Kỳ Lân ấu tể trong ngực bị phong ấn bên trong, y phục và giọng đi ệu đ ều giống hệt cổ tu sĩ trư ớc thời đ ại kiếp, nhưng lại chỉ nhớ đ ược mỗi sứ mệnh bảo vệ ấu tể.',cost:0,glyph:'Lân',recommend:'Tầm Thư ờng Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đ ặc biệt','kịch bản':!0,constraints:{locationIds:['eco-dt-shuanghua'],giới_tính:'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Quảng Hàn Cung']},settings:{thời_gian:{Niên:7235,Nguyệt:11,Nhật:6,thời_thần:'mão'},tông_môn:'Quảng Hàn Cung (hồ đ ể hoạch cứu)',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Sư ơng Hoa Đảo đ ịa mạch hốt nhiên chấn đ ộng, nguyệt hoa hồ tùy chi phát sinh đ ịa long phiên thân. Hồ ngạn băng tằng thốn thốn khai liệt, hồ đ ể truyền lai trầm muộn oanh hư ởng, tư ợng hữu nhất tọa bị tuế nguyệt yểm mai đ ích cựu đi ện chính tại thủy hạ băng tháp.\n Quảng Hàn Cung tu sĩ cản đ áo hồ biên phong tỏa liệt khích thời, nhất khối trư ợng hứa cao đ ích trừng triệt băng tinh tòng hồ đ ể chậm rãi nổi lên mặt nư ớc. Băng trung tịnh phi khoáng thạch hoặc cổ khí, mà là nhất danh song tí khẩn bão ấu thú đ ích nữ tử——chính thị trầm thụy kỳ trong ngư ơi.\n Chúng nhân tư ơng băng tinh khiên dẫn thư ợng ngạn, dĩ nguyệt hoa chi lực trục tằng hóa khai phong ấn. Ngư ơi hoài trung na chích bất minh ấu thú thủy chung bị hộ tại hung tiền, đ ầu sinh nhu nhuyễn lân giác, tế tiểu lân phiến gian lưu chuyển trư ớc ngũ sắc hỗn đ ộn quang; tức sử băng phong giải trừ, ngư ơi đ ích thủ tí nhưng bổn năng đ ịa bất khẳng tùng khai.\n Tô tỉnh hậu đ ích ngư ơi không có minh hiển thư ơng thế, y bào tài chế, phát sức hình chế nãi chí thuyết thoại khẩu âm khư ớc đ ô dữ đ ương thế bất đ ồng, cánh tiếp cận đi ển tịch trung ký tái đ ích đ ại kiếp tiền cổ tu sĩ. tông_môn cao tằng tiếp liên tuần vấn ngư ơi đ ích tên, sư thừa dữ bị phong nhập hồ đ ể đ ích duyên do, ngư ơi khư ớc chỉ tòng phá toái ký ức lý lao xuất linh tinh họa diện, vô pháp cấp xuất hoàn chỉnh đ áp án.\n Nàng môn nhân thử thôi trắc, ngư ơi hoặc hứa thị đ ại kiếp trư ớc đ ó bị Lưu chí kim đ ích hạnh tồn giả; nguyệt hoa hồ đ ể đ ích đ ịa đ ộng chỉ thị ngẫu nhiên đ ả khai liễu na tọa trầm thụy đa niên đ ích băng quan. Chân tư ớng thư ợng vô đ ịnh luận, cung trung dã bất hội tại ngư ơi thần trí vị phục thời cư ờng bách bức vấn.\n Ngư ơi duy nhất ký đ ắc thanh sở đ ích thị bản thân sứ mệnh: bảo hộ hoài trong Kỳ Lân ấu sồ, như ợng giá đi ểm tòng cựu thời đ ại bảo tồn hạ xuống đ ích hy vọng hoạt đ áo vị lai. ấu sồ thể nội phong trư ớc tứ đ ạo trầm thụy đ ích tứ tư ợng ấn ký, Thanh Long, Bạch Hổ, Chu Tư ớc, Huyền Vũ chi lực giai vị thủ đ ắc, tứ hạng thiên phú nhưng toàn bộ khóa.\n Tại trảo hồi ký ức dữ tra thanh băng phong lai lịch trư ớc đ ó, Quảng Hàn Cung tạm thời tiếp nạp ngư ơi dữ Kỳ Lân ấu sồ lưu tại Sư ơng Hoa Đảo. Ngư ơi tỉnh lai đ ích giá nhất nhật, dã trở thành giá đo ạn khóa việt đ ại kiếp đ ích thủ hộ sứ mệnh trùng tân khai thủy đ ích đ ệ nhất thiên.',tags:['Quảng Hàn Cung','Đại Kiếp Tiền','Kỳ Lân ấu sồ','Thất Ức']},{id:'story-hehuan-yuanyang',name:'Uyên Ương Trì · Hợp Hoan Tông nhập môn',subtitle:'Hoan Mị Điện hậu sơ kiến song tu trư ờng',desc:'bị lừa vào Hợp Hoan Tông，yêu bài còn chưa ấm，liền bị dẫn đ ến bên hồ Uyên Ương——Ôn Tuyềnb ốc khói mờ ảo，hư ơng quỳnh tứ dật，sơ ngộ"Hợp Hoan Song Tu"chi danh。',cost:0,glyph:'Hợp',recommend:'Tiểu Đạo Du Du / Tầm Thư ờng Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-dt-linyuan'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7245,Nguyệt:3,Nhật:28,thời_thần:'tuất'},tông_môn:'Hợp Hoan Tông',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'Trời đ ã chập tối, lồng đ èn hoa vừa đ ược treo lên. Hàng trăm chiếc lồng đ èn cung đ ình màu đ ỏ rực tỏa sáng, nhuộm luồng khí nóng bốc lên thành một sắc hồng ái muội. Trong không khí thoang thoảng dị hư ơng ngòn ngọt, tựa hoa lan lại tựa hư ơng xạ, chỉ vừa hít một chút vào phổi đ ã thấy ruột gan nóng hầm hập.\nTay ngư ơi vò xát miếng yêu bài vừa nhận, vẫn chưa hoàn toàn tỉnh táo sau khi bị kẻ khác dụ dỗ vào nơi này. Đằng sau là hành lang dẫn tới Hoan Mị Điện, trư ớc mắt lại là một bức xuân cung sống đ ộng.\n Nơi đ ây là đ ại mộc dục của Hợp Hoan Tông, gọi là Uyên Ương Trì —— cái tên thật đ úng với thực tế. Đưa mắt nhìn quanh, đ ây nào phải là chốn đ ất lành tu tiên gì, rõ ràng là một chốn vui chơi giấu giếm. Trong làn nư ớc suối ấm áp, vô số thân xác trắng ngần đang quấn quýt lấy nhau —— nơi này không chỉ là chốn tắm rửa, mà chính là trư ờng tu luyện của đ ệ tử Hợp Hoan Tông.\n Tầm mắt hơi dời đi, lại thấy một bệ ngọc giữa hồ, vài tên nữ tu đang ngồi quây lại thành vòng tròn, nằm ở giữa là một thiếu niên tuấn tú mặt đang đ ỏ bừng.\n\"Đây chính là tiểu sư đ ệ mới nhập môn sao? Nguyên Dư ơng ngư ợc lại mư ời phần dồi dào... đ ể các sư tỷ nếm thử chút nào.\"\n\"Đây chính là... tu tiên sao?\" Ngư ơi lầm bầm tự ngữ, âm thanh nhanh chóng bị dìm nghỉm bởi những tiếng rên rỉ nối tiếp nhau.\n Suối nư ớc nóng màu trắng đ ục, sư ơng mờ mang theo hơi ẩm ư ớt át. Cách đ ó không xa trên chiếc giư ờng nư ớc, vô số nam nữ thiếu niên cởi trần đang nô đ ùa mây mưa.',tags:['Hợp Hoan']},{id:'story-fan-zhigen',name:'Hạng vĩ đ ăng hỏa · hậu thiên thực căn',subtitle:'Thân phàm phu tình cờ gặp đ ược tiên duyên',desc:'Mang thân phàm nhân, tình cờ gặp đ ược một lão giả lưu lạc nơi đ ầu đ ường xó chợ. Nhờ có duyên với nhau, lão giả dùng một môn bí pháp gần như thất truyền đ ể cấy ghép Linh Căn cho ngư ơi, từ đ ó bư ớc chân lên con đ ường tu chân.',cost:0,glyph:'Tục',recommend:'Tầm Thư ờng Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'đ ặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{thời_gian:{Niên:7268,Nguyệt:10,Nhật:7,thời_thần:'hợi'},tông_môn:'Tản Tu',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Mưa đ êm gõ nhịp vào hiên nhà, ngọn đ èn trong ngôi nhà cũ ở ngõ sau mờ nhạt.\n Ngư ơi vừa sắc xong thuốc cho nư ơng, toan dập đ èn thì ngoài cửa chợt truyền đ ến tiếng ho nhỏ khản đ ặc —— một ông lão y phục rách nát đang bám lấy khung cửa, tựa hồ thân thể không thể đ ứng vững đ ược nữa.\n\"Tiểu hữu... một bát nư ớc trong... một chỗ tránh gió, có đ ược không?\"\n Ngư ơi như ờng lối cho ông lão bư ớc vào nhà, ngồi xuống mép giư ờng, mư ợn ánh đ èn dầu lờ mờ, ông lão ngư ớc đ ôi mắt vẩn đ ục lên cẩn thận đ ánh giá ngư ơi một hồi lâu.\n\"Mệnh ngư ơi không có căn cốt, vốn không thể tu tiên. Nhưng —— lão hủ mang trên mình một môn bí pháp cấy ghép Linh Căn, e rằng đ ã không còn ngày tháng đ ể thi triển nữa. Đêm nay ngư ơi dẫn ta vào nhà, chính là nhân duyên.\"\n Lão lấy từ trong ngực ra một ngón tay khô gầy như củi, đ ầu ngón tay ngưng kết một luồng Linh Khí xám xịt, chỉ thẳng vào mi tâm của ngư ơi.\n\"Cắn răng chịu đ ựng ý hỏa thiêu, mở ra khí hải bảy tấc, từ nay phàm trần không còn là nơi đ ể ngư ơi quay về.\"\n Một đ ạo noãn lưu từ mi tâm chạy thẳng xuống Đan Điền. Tiếng mưa bên song cửa dần xa, ngọn nến trong phòng bỗng chốc bùng cháy rực rỡ ——\n Thân phàm phu, từ nay dứt trần tục, kết duyên tiên đ ạo.',tags:['đ ặc biệt']},{id:'story-fan-renjian',name:'Túc mễ nhân gian · thuần phàm chi lộ',subtitle:'Không bư ớc chân vào con đ ường tu chân',desc:'Không gia nhập hàng ngũ tu chân, an phận giữ bổn phận phàm nhân; sống qua ngày chốn phàm trần, hoặc trải qua kiếp nạn trên sa trư ờng. Thân phàm phu cũng có thể kiến thức đ ược thế đ ạo tu chân.',cost:0,glyph:'Tục',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đ ặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{thời_gian:{Niên:7222,Nguyệt:5,Nhật:18,thời_thần:'tỵ'},tông_môn:'Tản Tu',cảnh_giới_ban_đ ầu:{đ ại_cảnh_giới:'phàm nhân',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ánh sáng mờ ảo xuyên qua lớp giấy dán cửa sổ rọi xuống bàn của ngư ơi, chiếu sáng một bản khế ư ớc chưa chép xong.\n Quán cháo sát vách đ ã bày ra nồi cháo nóng hổi đ ầu tiên, hơi nư ớc lẫn với mùi củi lửa từ từ bốc lên.\n Ngư ơi là phàm phu, không thông hiểu tu chân, chẳng biết linh_khí; tu sĩ thế gian ngự kiếm xuyên mây, đ ối với ngư ơi mà nói chẳng qua chỉ là truyền thuyết trên trời.\n Nhưng khói lửa chốn phàm trần, tự có nơi dành cho ngư ơi —— sổ sách ph
