hương bang, chưởng Bắc Cảnh tây bộ thương đạo.',tags:['sa mạc','thương đạo','lục châu'],kingdoms:[{name:'Sa Duệ Thương Bang',brief:'năm đại lục châu thành bang liên minh，tinh nghị hội cộng trị，nghị hội trú tinh vẫn bảo。',tags:['thành bang liên minh']}],sects:[]},{id:'eco-bj-buzhou',name:'Bất Chu Tàn Tích',description:'trung ương·nam bắc túng quán Sơn Mạch. Huyền thiết sơn cốt đâm thủng tầng mây; đông lộc thiên cơ môn, tây lộc huyết liên mật giáo, chủ tích thượng vi tuyết tông cao địa bộ.',tags:['Sơn Mạch','Huyền Thiết','Ma Đạo'],kingdoms:[{name:'Tuyết Tông Cao Địa Bộ',brief:'Vương quốc thần quyền trên núi cao, huyết liên mật giáo phụ thuộc; đô thiên thế bảo, tuyết quan thế tập.',tags:['Thần Quyền Phụ Thuộc Quốc']}],sects:[{name:'Thiên Cơ Môn',brief:'Chính Đạo cơ quan luyện_khí tông_môn，cư đông lộc thiên cơ phong，thần lục tối đa pháp bảo chế tạo thương。',tags:['Chính Đạo','luyện_khí']},{name:'Huyết Liên Mật Giáo',brief:'Dĩ nhân tế huyết cung vi tu pháp căn bản chi Ma Đạo đại tông, cư tây lộc Thiên Cốt Hình.',tags:['Ma Đạo']}]},{id:'eco-bj-heiyao',name:'Hắc Diệu Hỏa Uyên',description:'Tàn tích trung đoạn·địa nhiệt liệt cốc. Nham tương hà uốn lượn dưới đáy cốc, hàn lục trung duy nhất noãn uyên; Tẫn Dương Thành treo leo xây trên vách đá phía đông.',tags:['địa nhiệt liệt cốc','luyện_khí','Ôn Tuyền'],kingdoms:[],sects:[{name:'Tẫn Dương Thành',brief:'trung lậptu tiên thành，Bắc Cảnhluyện_khítrungTâm；thiênLôcùng mở"Lô Hỏa Tế"nổi danh。',tags:['trung lậptu tiên thành']}]},{id:'eco-bj-canglang',name:'Thương Lang Thảo Hải',description:'Đông nam · ôn đới thảo nguyên. Thập nhị bộ mục dân cộng phụng Đại Khả Hãn; Thương Lang Sơn lập vi thánh sơn.',tags:['thảo nguyên','Du Mục','Kỵ Binh'],kingdoms:[{name:'Thương Lang Hãn Quốc',brief:'Thảo nguyên thập nhị bộ liên minh khả hãn chế, kim đính vương đình tùy đại khả hãn di động.',tags:['Bộ Lạc Liên Minh']}],sects:[]},{id:'eco-bj-qianjing',name:'Thiên Kính Diêm Trạch',description:'Đông nam đê địa · cổ hải sàng diêm nguyên. Thiển thủy phúc diện như kính, lân hỏa diêm trường dạ khởi u lam; thất tính diêm gia cọng trị.',tags:['Diêm Nguyên','Môn Phiệt','chiêm bốc'],kingdoms:[{name:'Thất Tính Diêm Gia',brief:'Chung · Kính · Đường · Tiêu · Lư · Dương · Tạ thất đại diêm thương hào tộc nghị minh, nghị đường Đạc Chung Thành.',tags:['Môn Phiệt Liên Minh']}],sects:[{name:'Diêm Kính Xã',brief:'Kính Hàn Khâu đảo ảnh ảo_thuật bí xã, tòng thuộc thất tính Kính thị.',tags:['trung lập','chiêm bốc']}]},{id:'eco-bj-nanfeng',name:'Nam Phong Cẩm Tú',description:'Nam thùy · ốc thổ, Bắc Cảnh tối nghi cư chi địa. Càn Nguyên Thánh Triều phiên quốc Nam Phong Quốc đô vu Cẩm Tú Thành, văn phong đỉnh thịnh.',tags:['ốc thổ','Văn Tu','Viên Lâm'],kingdoms:[{name:'Nam Phong Quốc',brief:'Bắc Cảnh nam thùy phàm nhân vương quốc, Càn Nguyên Thánh Triều phiên thuộc; Tiêu thị thế tập, văn phong đỉnh thịnh.',tags:['phiên quốc']}],sects:[{name:'Linh Phong Trai',brief:'Dĩ âm nhập đạo chi Chính Đạo tông_môn, cư Cẩm Tú Thành; thiên hạ phong nhã tu sĩ chi thánh địa.',tags:['Chính Đạo','âm luật']}]}]},{id:'reg-nanjiang',name:'Nam Cương',description:'Rừng mưa ẩm nhiệt, Sở địa đại trạch, Thập Vạn Đại Sơn dữ cận hải hồng thụ lâm tịnh tồn, nam lâm ba tầng vô tận hải; Đạo Minh tứ tông (Tương Linh Các · U Minh Phủ · Ngũ Độc Giáo · Thiên Hình Tông) thống ngự chư quốc, dữ Tây Vực Tiên Minh địch đối.',children:[{id:'eco-nj-yuzhang',name:'Vũ Chướng Lâm',description:'Nam bộ · rừng mưa nhiệt đới · chướng cổ. Ngũ Độc Giáo Thần Mộc Điện luyện cổ ngự độc; Bách Việt Nam Tứ Bộ thế đại chịu bàn bác.',tags:['rừng mưa nhiệt đới','cổ độc','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang nam cảnh, Xà Phương · Quỷ Phương · Mẫu Phương tam bộ, bị Ngũ Độc Giáo thật tế khống chế, sung tác phàm nhân lai nguyên.',tags:['bộ lạc liên bang','nam cảnh']}],sects:[{name:'Ngũ Độc Giáo',brief:'Đạo Minh thành viên, thối độc luyện cổ, ngự thế gian vạn độc chi đại tông, cư Thần Mộc Điện.',tags:['Đạo Minh','cổ độc']}]},{id:'eco-nj-cuiyu',name:'Thúy Ngọc Khâu',description:'Bắc bộ · đồi á nhiệt đới · linh tuyền mật bố. Địa mạch dị biến thiên thành Vạn Linh Tức Quật dữ Hóa Thú Uyên; Thiên Hình Tông tạo vật điện cứ thử phồn dục kỳ thú, Bách Việt Bắc Tứ Bộ thế đại thải dược, ngự linh_thú vi sinh.',tags:['đồi á nhiệt đới','Hoạt Thể Cải Tạo','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang Bắc Cảnh, Phượng Linh · Tước Vũ · Thú Minh · Thúy Linh tứ bộ, thế đại thải dược ngự thú, thụ Thiên Hình Tông bàn bác.',tags:['bộ lạc liên bang','Bắc Cảnh']}],sects:[{name:'Thiên Hình Tông',brief:'Đạo Minh thành viên, phồn dục kỳ biến ma thú, hoạt thể cải tạo chi đại tông, cư Tạo Vật Điện; cận bách niên cường thế quật khởi.',tags:['Đạo Minh','Cải Tạo','Kỳ Thú']}]},{id:'eco-nj-shiwan',name:'Thập Vạn Đại Sơn',description:'Tây nam · nguyên thủy Sơn Mạch · yêu tộc cấm địa. Vạn Yêu Minh thất tộc bàn cứ, phàm quốc bất nhập; dữ Đạo Minh đồng cấp, hỗ bất xâm phạm.',tags:['nguyên thủySơn Mạch','yêu tộc cấm địa','Vạn Yêu Minh'],kingdoms:[],sects:[{name:'Vạn Yêu Minh',brief:'Yêu tộc độc lập liên minh, vô minh chủ, thất tộc cộng trị; dữ Đạo Minh đồng cấp, hỗ bất xâm phạm.',tags:['Yêu Tộc','Liên Minh','Cấm Địa']}]},{id:'eco-nj-yongheng',name:'Vĩnh Hằng Cốc',description:'Trung nam · tử khí cốc địa. U Minh Phủ Thông U Các lập vu cốc tâm Cửu U Tuyền; Đại Tự Vương Triều Đại Tự Thành kiến vu cốc khẩu, vi Đạo Minh phụ thuộc quốc chi đô kì.',tags:['tử khí cốc địa','vong linh','Đạo Minh','thần quyền nô lệ'],kingdoms:[{name:'Đại Tự Vương Triều',brief:'Tàn khốc thần quyền nô lệ vương triều, U Minh Phủ công khai phụ thuộc; đô kì Đại Tự Thành kiến vu Vĩnh Hằng Cốc biên duyên.',tags:['thần quyền nô lệ','U Minh Phủ phụ thuộc']}],sects:[{name:'U Minh Phủ',brief:'Đạo Minh thành viên, nhiếp tử khí, luyện thi lỗi chi đại tông, cư Thông U Các; Đại Tự Vương Triều tông chủ.',tags:['Đạo Minh','vong linh']}]},{id:'eco-nj-yunmeng',name:'Vân Mộng Trạch',description:'Đông bộ · Sở địa đại trạch · vương triều phúc tâm. Sở Thiên Vương Triều Dĩnh Đô kiến vu trạch trung thủy  tư chất tuyệt đỉnh còn được các Trưởng Lão thu làm đệ tử thân truyền, đích thân chỉ dạy.',cost:0,glyph:'Thí',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'tông_môn',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7203,Nguyệt:1,Nhật:5,thời_thần:'thìn'},tông_môn:'nhập tông thụ thí · đãi phân phái môn đệ',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ngày đại lễ nhập tông, trên quảng trường Trắc Linh đông nghìn nghịt người.\nNgươi theo một đám thiếu niên nam nữ mang trong mình mơ ước lần lượt tiến vào. Chính giữa quảng trường đặt một tòa ngọc bàn thanh sắc cổ kính, mặt bàn tỏa ra ngũ sắc quang mang lưu chuyển bất định.\nChấp sự hành lễ đứng bên cạnh, tiếng xướng tên liên tiếp vang lên: \"Linh Căn tạp nham, phân vào Ngoại môn, làm tạp dịch——\" \"Chân Linh nhập phẩm, Ngoại môn thân truyền——\" \"Thượng phẩm Linh Căn, Nội môn đích truyền, được Trưởng Lão chọn làm đồ đệ——\"\nMỗi một tiếng xướng lên đều kéo theo nhịp thở của mọi người dưới đài: kẻ được gọi vào Nội môn thì vui sướng ra mặt, người vào Ngoại môn cũng thở phào nhẹ nhõm như được đại xá, chỉ có những kẻ không đo ra được Linh Căn là ảm đạm rút lui.\nCuối cùng cũng đến lượt ngươi. Chấp sự ngước mắt liếc ngươi một cái, nhạt giọng nói: \"Tiến lên, đặt tay vào giữa ngọc bàn, ngưng thần, không được phân tâm.\"\nNgươi hít sâu một hơi, chậm rãi bước tới, đem lòng bàn tay nhẹ nhàng đặt lên ngọc bàn ôn nhuận mang theo chút hơi lạnh kia——'},{id:'story-yinyu',name:'Ẩn Ngọc Sơ Thức',subtitle:'ư thị tỉnh gian kết thức cao nhân',desc:'bản dục chỉ tại thị tỉnh độ nhật, khước ư trà tứ ngẫu ngộ du phương tiên sư, tặng nễ nhất quyển tàn hiệt.',cost:0,glyph:'Cơ',recommend:'Tầm Thường Tu Hành',thể_loại:'Tản Tu',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7156,Nguyệt:11,Nhật:12,thời_thần:'dậu'},tông_môn:'Tản Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'ngươi đang ngồi ở góc quán trà，nhìn những hạt tuyết đập vào song cửa ngẩn người。\nlão giả áo xám bàn bên chợt cười với ngươi：\n"Tiểu hữu có duyên với kiếm."\nlão tiện tay đẩy qua mặt bàn một cuộn giấy dầuHoàngtàn khuyết，lạiTựcốTựuống cạn rượu trong ly，chớp mắt đã tan biến vào bão tuyết——'},{id:'story-fuchou',name:'Huyết Môn Di Cô',subtitle:'Phụ Cừu Tiền Hành',desc:'Môn phái tại ma tu dạ tập trung bị đồ tận, chỉ ngươi nhất nhân đái trước sư môn tín vật đào xuất sinh thiên.',cost:0,glyph:'Cừu',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'Tản Tu',constraints:{linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7188,Nguyệt:7,Nhật:22,thời_thần:'dần'},tông_môn:'Tản Tu (tiền · Vụ Ẩn Sơn Môn)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'hậu kỳ'}},body:'Sơn môn hủy vu nhất dạ giữa.\nNgươi phục tại huyết nê lý trang tử, thính trước sư tỷ đích tối hậu nhất thanh nộ hống, thính trước na đạo trầm trọng đích quải trượng tòng thân biên kinh quá.\nTrực đáo nhất thiết quy vu tử tịch.\nNgươi khẩn khẩn toản trước na mai bị huyết tẩm thấu đích ngọc bài, tại lê minh tiền tòng đoạn bích tàn viên trung ba xuất hiện——',tags:['Cừu Oán']},{id:'story-dadao',name:'Dĩ Ngộ Đại Đạo',subtitle:'Tiền Thế Kim Sinh',desc:'nễ tự hồ ký đắc tiền thế chủng chủng. nhất thiết thượng vị khai thủy, tiện phảng phất dĩ thị kết cục.',cost:0,glyph:'Đạo',recommend:'Tiểu Đạo Du Du',thể_loại:'đặc biệt',settings:{thời_gian:{Niên:7301,Nguyệt:3,Nhật:3,thời_thần:'mão'},tông_môn:'Tản Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ngươi tại triêu hà trung tranh khai nhãn.\nSong ngoại thị tái thục tất bất quá đích linh khê, viễn xứ thần chung khâu hưởng——\nGiá nhất thiết, ngươi tự hồ tại mỗ cá mộng lý kiến quá thiên bách thứ.\nNgươi đài thủ khinh phủ hung khẩu đích ngọc bài, na lý phảng phất hoàn tàn lưu trước thượng nhất thế hỏa phần sau đó đích dư ôn——',tags:['Truyền thuyết']},{id:'story-tianxuan-zayou',name:'Vạn Kiếm Bình · kiếm sư tặng thạch',subtitle:'phong tuyết trong bình thủy chi duyên',desc:'Thiên Huyền Kiếm Tông tạp dịch Đệ Tử, vu Vạn Kiếm Bình tảo tuyết thời ngẫu ngộ kiếm mạch truyền nhân Mặc Thi Hành phụng mệnh hạ sơn lịch luyện; lâm hành tiền nàng lưu hạ một viên Hạ Phẩm Linh Thạch.',cost:0,glyph:'Kiếm',recommend:'Lệ Tâm Vấn Đạo',thể_loại:'tông_môn',constraints:{locationIds:['eco-xy-wuyan'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7204,Nguyệt:12,Nhật:18,thời_thần:'thìn'},tông_môn:'Thiên Huyền Kiếm Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Thiên Huyền Kiếm Tôngtông_mônquảng trường，vạnKiếmtrên bình đài đọng một lớp sương mới，vài têntạp dịchĐệ Tửđang cúi đầu quét tước，ngươi cũng ở trong đó。\ntông chủMạc Quyết Vânđứng phía trước đại điệnThạchtrên thềm，chắp tay sau lưng đứng，trường sam xám trắng tung bay trong gió；Kiếmmạch truyền nhânMặc Thi Hànhmột thânHuyềnthanhKiếmBào，đứng lẻ loi giữa vạnKiếmbìnhtrung ương，trườngKiếmnghiêng đón tàn tuyết，đứng yênBất Động，dường như đã đứng trong bão tuyết này suốt cả đêm。\n"Nhất dạ vị thu thế, na nhất tiễn, khả hữu 「 thi 」 liễu?"Mạc Quyết Vân đích thanh âm bất đại, khước thanh tích truyền biến chỉnh cá Vạn Kiếm Bình, ẩn ẩn áp quá hô khiếu đích phong thanh.\nMặc Thi Hành chậm rãi thu kiếm vào vỏ, mặc mâu thanh lãnh, vọng trước mạn thiên phong tuyết, thanh âm hẩn đạm.\n"Hồi sư tôn, còn kém một phân. Một tiễn này Đệ Tử luyện ba năm, chiêu đã tới cực, trong kiếm lại luôn thiếu một hơi—— không phải không đủ sắc, là không có thi."\nMạc Quyết Vân mi đầu vi bất khả sát địa nhất động, tụ bào khinh phất, tương nàng thân bàng tam xích tích tuyết đãng khai, nàng khước liên nhãn dã vị trát.\n"Bế tử quan trên núi, kiếm ý ngược lại bị mài cùn. Từ hôm nay trở đi, ngươi xuống núi lịch luyện đi—— đi nhân gian tìm một ngụm「thi」đó của ngươi, tìm không thấy, thì không cần về tông."\nMặc Thi Hành chinh liễu nhất thuấn, tùy tức đoan chính hành liễu nhất lễ, thanh âm y cựu thanh lãnh, khước bỉ phương tài đa liễu nhất phân trịnh trọng,"Đệ Tử……lĩnh mệnh。"\nNàng chuyển thân hướng sơn môn tẩu khứ, trường phát thúc đắc cực cao, bối thượng trường kiếm ánh trước tuyết quang, huyền thanh kiếm bào lược quá nhất địa tố bạch. Hành chí ngươi thân biên, cước bộ vô đoan đốn liễu nhất đốn.\nNàng thuỵ mâu khán liễu khán ngươi đống đắc phát hồng đích thủ, hựu khán liễu khán ngươi cước hạ na nhất tiểu phiến bị tảo đắc can can tịnh tịnh đích tuyết địa, mặc mâu lý lược quá nhất ti cực đạm đích đồ vật.\n"Nhất xứ nhất xứ, tảo đắc bất yếm, giá dã thị kiếm ý."Mặc Thi Hành thuyết trước, tòng tụ trung thủ xuất một viên Hạ Phẩm Linh Thạch, khinh khinh các tiến ngươi chưởng tâm,"Tâm trầm đắc hạ xuống, chổi cũng có thể thông đạo. Đồng này, coi như cảm tạ ngươi cho ta xem một mảnh tuyết địa sạch sẽ này."\nlời cạn，nàng không nói thêm gì，mũi chân nhẹ nhàngĐiểm，niệm quyếtNgự Kiếmmà bay lên，mộtĐạothanh quang ẩn vào tuyết rơi，chớp mắt biến mất。'},{id:'story-lingfeng-yueye',name:'Hồi Âm Cốc · nguyệt hạ hợp tấu',subtitle:'sơ nhập Linh Phong Trai đích nhã hội',desc:'Nhập Linh Phong Trai bất cửu, nguyệt dạ độc phủ cầm vu Hồi Âm Cốc, kháp ngộ thủ trì ngọc địch đích Hạ Vị Ương, nhị nhân hợp tấu nhất khúc.',cost:0,glyph:'Cầm',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-bj-nanfeng'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7212,Nguyệt:8,Nhật:16,thời_thần:'hợi'},tông_môn:'Linh Phong Trai',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'dạ sắc hơi trầm xuống，một vầng trăng non treo trên đêm Hồi Âm CốcKhông；Thủyhơi sương mờ mịt，làm ướt rêu xanh ven bờ。\nngươi ngồi ven sôngThạchtrên，trên gối đặt ngang cổCầm，ngón tay khảy，tịnhVôđịnh phổ，chỉ nương theo cơn gió phập phồng。Linh linh Thất Huyền，thỉnh thoảng kinh động đến loài nghỉ trong bụi lautrongvài conThủychim，Thủychim vỗ cánh sượt quaThủymặt，lay động ánh trăngĐiểmĐiểm。\nchợt có tiếng sáoTựtừ ngọn cây rơi xuống，tiếng sáo thanh việt ấy，không tranh không đoạt，chỉ khẽ lấp vàoCầmâm thanh sắp dứtKhôngkhe，giữ lại cái sắp tán đi kiaDưvận。\nngươi giữ chặtCầmdây，ngước mắt nhìn về phía xa，ngã rẽ lối mòn trong rừng，một bộ sa y màu ngó sen nhạt nhè nhẹ lay theo gió。người đến tay cầm một chi ngọc địch，sáoThântoàn thân trắng ngần，duy chỉ có phần đuôiTrụyminhHoàngtua cờ。\n"Quấy rầy nhã hứng của đạo hữu, vừa rồi nghe tiếng đàn này, dường như có ý giang lưu uyển chuyển nhiễu phương điện, nhưng lại nhiều thêm vài phần tùy tính. Đạo hữu là người mới nhập trai?"\n nễ khởi thân, hướng nữ tử củng thủ nhất lễ,"tại hạ ngươi, sơ nhập Linh Phong Trai, kiến thử địa nguyệt sắc chánh hảo, tình nan tự cấm, bất tưởng kinh động liễu sư tỷ."\nNa nữ tử hành chí thủy biên, tịnh vị trạm tại cao xứ thụ lễ, mà là tại nhất bàng đích thanh thạch thượng tọa hạ, tương ngọc địch hoành tại tất đầu.\n"Vạn vật có tiếng, sóng nước vỗ bờ này là tiếng, trùng kêu chim hót là tiếng, tiếng đàn của đạo hữu tự nhiên cũng là tiếng, đã đều ở trong thiên địa này, vậy thì không tính là quấy rầy."\n"Ta vừa rồi ở trong rừng, nghe trong tiếng đàn của đạo hữu dường như có ý chưa dứt, trùng hợp ta có một khúc nhạc cũng thiếu đi chút ý cảnh, không biết đạo hữu có nguyện hợp tấu một khúc?"\nNgươi trùng tân lạc tọa, song thủ phủ thượng cầm huyền, vô nhu ngôn ngữ Xác nhận điệu thức, chỉ tiêm lạc hạ, tiện thị hồi ứng.\nCầm âm khởi thời như sơn giản đích tuyền, thanh liệt thấu lượng; địch thanh tùy chi nhi nhập, miên trường du viễn, tự phong quá tùng lâm.\nKhúc chung, dư âm tán nhập phong trung, thủy diện phục quy bình tĩnh.\n"Kim dạ đích phong, đảo thị tỷ vãng nhật nhu hòa liễu ta."Hạ Vị Ương khinh phủ địch thân, trạm khởi thân lai, lý liễu lý bị phong xuy loạn đích mấn phát.\n"Nếu như đạo hữu thích nơi này, về sau cũng có thể thường đến. Linh Phong Trai Hạ Vị Ương, ghi nhớ tiếng đàn đêm nay của đạo hữu."'},{id:'story-liuli-baicao',name:'Bách Thảo Phong · Dược Viên tân lân',subtitle:'dữ Triệu Phương Huỳnh đồng khoảnh sừ dược',desc:'Lưu Ly Đan Tông Ngoại Môn Đệ Tử, vu Bách Thảo Phong thiên giác dược viên sừ dược; cách bích tân ban lai nhất vị khiếp sinh sinh đích tiểu sư muội Triệu Phương Huỳnh.',cost:0,glyph:'Đan',recommend:'Tầm Thường Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-dt-liufang'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7197,Nguyệt:4,Nhật:9,thời_thần:'thìn'},tông_môn:'Lưu Ly Đan Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Lưu PhươngSơn Mạchkéo dài mấy trăm dặm，thần huy xé mây，Kimánh sáng chiếu xuốngBách Thảo Phong，đỉnh núi mây mù bồng bềnh，loáng thoáng thấy bóng dángNội Môn Đệ Tửngự_vậttạiThiên，có kẻ ngồi trên hồ lô、có người đứng trênphi kiếm，nhưng những thứ đó đều vớitạp dịchVôDuyênphong cảnh。\nLưu Ly Đan Tông，Bách Thảo Phong，khu vực tập trung gieo trồng linh thảo linh dược cấp thấp，trong số đó có một tiểu dược viên。\nngươi nhấc cuốc lên nghỉ một lát，thẳng lưng lên，luyện khí kỳsơ kỳcủalinh_khíluân chuyển trong kinh mạch được một vòng nhỏThiên，xóa đi ít nhiều mệt nhọc。dược điền này chính là nơi hắnLưu Ly Đan Tôngmột mẫu ba phânĐịa，thứ được trồng đều làluyện khí kỳkỳđan dượccủaCơ SởphụTài。\ntiểu dược viên bỏ hoang gần nửa tháng ở nhà kế bên，hôm nay rục rịch。\nphía bên bờ rào trúc，một thiếu nữ tuổi độ thanh xuânNiênhoaNữ，Thântrêncủatạp dịchvảiBàocó chút rộng rãi，tay áo xắn vài vòngĐạo，để lộ cổ tay gầy。cô gái nửa ngồi ởThổĐịatrên，huơ tay múa chân trước cỏ thuốc ủ rũ vừa được cắm xuống。\n"Lục cao cao, đất ở đây rất mềm mại, ngươi phải tranh khí, cắm rễ sâu một chút."\nThanh âm thuận trước thần phong phiêu quá trúc ly, lạc nhập ngươi nhĩ trung. Na thiếu nữ tịnh vị sát giác bàng nhân mục quang, chỉ thị tòng câu cừ yểu khởi thiểu hứa tuyền thủy, lâm cấp thảo dược.\n"Uống nước rồi thì không được phép héo nữa, đợi ngươi mọc ra lá mới, ta sẽ gọi ngươi là lục tráng tráng."\nNgươi thủ trung sừ đầu khinh đốn, bính thượng nhất khối ngạnh thổ, phát xuất liễu hưởng thanh, thiếu nữ chuyển đầu, mâu tử lý ánh xuất ngươi đề trước sừ đầu đích thân ảnh.\nNàng liên mang trạm khởi thân lai, song thủ tại thân tiền giao điệp, triều trước ngươi thâm thâm hành liễu nhất lễ, vì động tác thái cấp, đầu đính na điều dụng lai thúc phát đích thô bố điều oai liễu một số, kỷ lũ toái phát tán tại ngạch tiền.\n"Tiền、tiền bối hảo。"tha đầu thùy đắc ngận đê, lộ xuất bạch tịnh tiêm tế đích hậu cảnh, thanh âm hữu ta phát khiếp,"Ta là Triệu Phương Huỳnh mới đến khối dược điền này, nếu là ồn ào đến tiền bối tu hành, còn mong tiền bối thứ tội."'},{id:'story-nanjiang-fox',name:'Thập Vạn Đại Sơn · giải cấu hồ yêu',subtitle:'thái dược đồ trung ngẫu nhập tiên chi u cốc',desc:'vì tìm"Linh Sơn Tiên Chi"tạiThập Vạn Đại SơnbênDuyênẩn nấp quanh quẩn vài ngày，lỡ lạc vào u cốc，bắt gặp đang đối diệnMộccột đơnTựThanh Khâu luyện lời nóiHồtộcNữTô Ngưng Hương。',cost:0,glyph:'Hồ',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'Tản Tu',constraints:{regionIds:['reg-nanjiang'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7220,Nguyệt:6,Nhật:1,thời_thần:'thìn'},tông_môn:'Tản Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'tia nắng ban mai mờ tỏ，Nam Cươngsự oi bức ẩm ướt đặc hữuThủyhơi nước vẫn chưa tiêu tán hết，trong rừng ngưng đọng lại sương mù tựa màn lụa mỏng。\nngươiThâncõng gùi tre，chân xỏ giày da，bước vào lối nhỏ thâm u，nơi này vắng bóng người，tầmThườngngười hái thuốc không dám bén mảng，nhưng vì truy tìm truyền thuyếttrong"Linh Sơn Tiên Chi", Dĩ tại Thập Vạn Đại Sơn biên duyên bàn hoàn liễu sổ nhật.\nNgươi bát khai nhãn tiền già tế thị tuyến đích khoát diệp, thị dã khoát nhiên khai lãng, tiền phương thị nhất xứ tĩnh mật đích u cốc, cốc trung khê thủy sàn sàn, lưỡng ngạn khai mãn liễu bất tri danh đích dã hoa, tùy phong diêu duệ, lạc anh tân phân. Hoa tùng trung ương, tọa trước nhất vị thân trước thiển phấn nhu quần đích thiếu nữ, nàng bối đối trước ngươi, chính đối trước nhất căn mộc thung niệm niệm hữu từ.\n"Công tử đại ân, tiểu nữ tử vô dĩ vi báo, duy hữu……"Thiếu nữ thanh âm sảo đốn, oai liễu oai đầu, tự tại hồi ức cái gì, tùy hậu hoán liễu nhất chủng ngữ điệu, lược đái kiều tu,"Duy hữu dĩ thân tương hứa, nguyện tùy quân tẩu biến thiên nhai hải giác."\nNgươi bất thận thải đoạn liễu nhất tiệt khô chi, ca sát khinh hưởng, tại giá tĩnh mật u cốc trung hiển đắc vưu vi đột ngột.\nThiếu nữ thân hình vi trạm, mạch nhiên hồi thủ, diện dung kiều hàm, song giáp vựng hồng, khê thủy bàn thanh triệt đích nhãn mâu trung đái trước ta hứa kinh hoảng.\n"Ngươi là thùy? Ngươi thị...... lai giá lý thưởng phong cảnh đích ma?"\n nễ củng thủ nhất lễ,"tại hạ ngươi, là người hái thuốc trong núi, đi nhầm vào cô nương…… nơi thanh tu, nhiều có đắc tội, xin hãy lượng thứ."\nThiếu nữ văn ngôn, nhãn trung cảnh dịch sảo thoái, thủ nhi đại chi đích thị hảo kỳ, tự tại xác nhận thiện ý của đối phương.\n"Thái dược nhân……"tha đê thanh trọng phức, tùy tức khởi thân, bôn chuyết địa hồi liễu nhất lễ,"Tiểu nữ tử Tô Ngưng Hương, giá sương hữu lễ liễu."'},{id:'story-wudu-init',name:'rời khỏi chướng lâm · Vạn Độc Tổ Quật',subtitle:'nhập môn sát hạch trong nhất trường hào đổ',desc:'tạiVũ Chướng Lâmtham giaNgũ Độc Giáonhập mônsát hạch，đói rét đan xen、bốn bề đềuĐộc；bế tắcVôđường nuốt xuốngmột viên《Bách Độc Kinh》chưa ghi ngũ sắc quái quả，tỉnh dậy thức hải bỗngKhôngnhiều thêm một mônthần_thứcCổpháp，cùng một tiếng gọi ngươi đi"Vạn Độc Tổ Quật"lời thì thầm。',cost:0,glyph:'Cổ',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-nj-yuzhang'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Ngũ Độc Giáo']},settings:{thời_gian:{Niên:7231,Nguyệt:4,Nhật:9,thời_thần:'tỵ'},tông_môn:'Ngũ Độc Giáo (nhập môn thí luyện)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Vũ Chướng Lâmsâu thẳm，chướng khí ẩm thấp dính vào da，mãi không tan。\nđây làNgũ Độc Giáonhập mônsát hạchcửa ải cuối cùng——độcTựbước ra khỏi khu rừng ăn thịt người này。đã sang ngày thứ ba，ngươiluyện khí kỳsơ kỳđóĐiểmít ỏilinh_khíđã sớm bị chướng khíĐộcbào mòn chỉ còn lạiVôvài，đóiHỏacùng hàn ý đồng thanh gặm nhấm ngũ tạng lục phủ。\nlại khổ thay khu rừng này"thực phẩm"Tịnh bất toán thiểu: tử hồng đích tương quả, phì hậu đích khuẩn tán, ba mãn đằng mạn đích điềm ngẫu……ngươi phiên khai tùy thân na quyển 《Bách Độc Kinh》 nhất nhất bỉ đối, phiên đáo tối hậu, chỉ tiêm phát lương——vô nhất lệ ngoại, toàn thị kịch độc. Nguyên lai giá nhất quan khảo đích tòng bất thị"Có thể tìm được đồ ăn không"，mà là"Minh tri hữu độc, nhĩ cảm bất cảm bính".\nTựu tại ngươi cơ hồ yếu đảo hạ khứ đích lúc, nhất tùng hủ diệp gian lộ xuất một viên quyền đầu đại đích quả tử, ngũ thải ban lan, lưu chuyển trước cận hồ yêu dị đích quang trạch. Ngươi phiên biến 《Bách Độc Kinh》, tòng đầu đáo vĩ——cánh không có bán cá tự đề đáo tha.\nVị tái vu kinh, tiện thị vị tri; vị tri, tiện thị bất tri tử hoạt. Khả ngươi dã xác thật, tái không có biệt đích lộ liễu.\nNgươi đinh trước na mai quái quả khán liễu hẩn cửu, chung vu bế thượng nhãn, nhất khẩu giảo liễu hạ khứ——đổ giá nhất bả.\nÝ thức trụy nhập vô biên đích hắc.\n……\nTái tranh nhãn thời, thiên quang dĩ lượng. Cơ hàn tận thoái, na điểm bị ma tận đích linh_khí cánh dã tiễu nhiên phục nguyên, tứ chi bách hài thuyết bất xuất đích thông thái, phảng phất cái gì đồ vật tại thể nội bị triệt để tẩy quá nhất biến.\nChỉ thị——ngươi đích thức hải lý, bằng không đa liễu nhất môn công_pháp. Tha đích tên bản thân phù thượng tâm đầu: 《Phệ Tâm Cổ Kinh》. thần_thức vi châm, chủng cổ phệ tâm, quỷ dị đắc dữ 《Bách Độc Kinh》 lý nhậm hà nhất hiệt đô bất tương can.\nNhi tại thức hải thâm xứ, nhất đoạn sa á nhi diêu viễn đích đê ngữ, chính thiếp trước thần hồn phản phục hồi hưởng, huy chi bất khứ——\n"Lai……Vạn Độc Tổ Quật……trảo ngã……"\nNgươi mạc liễu mạc hoài lý na khối nhập môn thời tông_môn phát hạ đích ti nam chi thạch——tha nhất như vãng thường, chỉ nhận đắc nam bắc, khước bán điểm chỉ bất xuất na"Vạn Độc Tổ Quật"ở nơi nao。',tags:['Ngũ Độc Giáo','kỳ ngộ']},{id:'story-luowu-mirror',name:'Di kính quy tông · tố quang tầm thân',subtitle:'Di vật mẫu thân trung trầm thụy đích la võ Truyền Thừa',desc:'Vân du thiết tha đích Bạch Nhụy Huyền ngẫu nhiên phát hiện, ngươi thể nội cánh vận chuyển trước La Vũ Môn tâm pháp; mẫu thân lưu lại Tố Quang Giám Lưu trước công_pháp, kỹ_nghệ dữ tứ đoạn ký ức, duy hữu đột phá đại_cảnh_giới tài năng trục thứ giải tỏa. Vi truy tra mẫu thân chi tử, nàng quyết định đái ngươi Quay lại La Vũ Môn.',cost:0,glyph:'Kính',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tínhcấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','La Vũ Môn']},settings:{thời_gian:{Niên:7232,Nguyệt:8,Nhật:17,thời_thần:'thân'},tông_môn:'La Vũ Môn (quy tông đồ trung)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Bạch Nhụy Huyền ly khai La Vũ Môn hậu, nhất lộ tầm phỏng các địa Thể Tu thiết tha luận kỹ. Đồ kinh ngươi cư trú đích thành trấn thời, nàng nguyên bản chỉ đả toán đình lưu nhất dạ, khước tại nhân quần trung sát giác đáo nhất lũ cực thục tất đích thổ nạp tiết luật——na cỗ khí tức chính tòng ngươi đích kinh mạch gian tuần hoàn, phân minh thị La Vũ Môn Đoán Cốt nhất mạch đích nội công lộ số.\nNàng đương tức lan hạ ngươi, tế vấn giá môn tâm pháp tòng hà nhi lai, hựu phản phục truy vấn ngươi đích mẫu thân tính thậm danh thùy, thị phủ tằng vi La Vũ Môn Đệ Tử. Ngươi khước đáp bất thượng lai: mẫu thân khứ thế thời, ngươi thượng bất biết nàng đích quá vãng, chỉ ký đắc nàng lâm chung tiền tương nhất diện cựu kính giao cấp ngươi; phụ thân dã chỉ khẳng thuyết, nàng thị bị cừu nhân sở sát.\nNgươi thủ xuất mẫu thân lưu lại kính tử. Kính diện bất ánh tầm thường nhân ảnh, linh lực xúc cập thời phản nhi phù xuất nhất tằng tằng Lưu đích kinh mạch đồ dữ kỹ_nghệ thủ trát. Bạch Nhụy Huyền kiểm tra hứa cửu, Xác nhận kỳ trung tàng trước hoàn chỉnh đích La Vũ Môn Truyền Thừa, khước bị tứ trọng cấm chế phân cách; chỉ hữu ngươi thân tự đột phá một cái đại_cảnh_giới, kính trung phong ấn tài hội giải khai nhất tằng, hiển lộ nhất đoạn mẫu thân lưu lại ký ức tuyến sách. Vị đáo đột phá chi thời, túng sử nàng cường hành quán chú linh lực dã chỉ hội chiếu kiến nhất phiến vụ quang.\nCánh lệnh nàng ý ngoại đích thị, giá phần Truyền Thừa tảo dĩ y chiếu ngươi đích kinh mạch trùng tân điều chỉnh. Tức sử ngươi tịnh phi nữ tính, dã năng an toàn tu hành bổn ưng chỉ truyền môn trung nữ Đệ Tử đích công_pháp, tuyệt phi ngẫu nhiên đắc lai đích sao bản sở năng tố đáo.\nBạch Nhụy Huyền trầm mặc phiến khắc, tương kính tử trịnh trọng giao hoàn ngươi, tùy tức dĩ La Vũ Môn chiến kỹ mạch mạch chủ chi danh lập thệ: vô luận ngươi đích mẫu thân thị thùy, hựu tử vu hà nhân chi thủ, nàng đô hội bồi ngươi tra minh chân tướng, vi cố nhân thảo hồi công đạo.\nThành môn ngoại, nàng dĩ bị hảo hồi phản La Vũ Môn đích hành trang. Ngươi đái trước 《Đoạn Cốt Thổ Nạp Quyết》 dữ Tố Quang Giám tùy nàng thượng lộ; hạ nhất đoạn kính trung ký ức, yếu đẳng ngươi thân thủ khóa quá đệ một cái đại_cảnh_giới hậu tài hội tỉnh lai.',tags:['La Vũ Môn','kỳ ngộ','Thân Thế']},{id:'story-luowu-nuwa',name:'vẫn tinh hoán tâm · Nữ Oa di thạch',subtitle:'bản ưng tử khứ đích nhân, hung trung hưởng khởi thạch tâm',desc:'Trung Nguyên hốt giáng vẫn tinh, ngươi bị chính diện tráp trung khước không có tử khứ; cản lai tra khán đích La Vũ Môn tu sĩ phát hiện, ngươi nguyên bản đích tâm tạng dĩ bị vẫn thạch thế đại, thạch trung hoàn tàn lưu trước nghi tự nguyên tự Cửu Thiên Huyền Nữ đích lực lượng.',cost:0,glyph:'Vẫn',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tính:'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','La Vũ Môn']},settings:{thời_gian:{Niên:7233,Nguyệt:3,Nhật:21,thời_thần:'tuất'},tông_môn:'La Vũ Môn (vẫn tinh cứu trị)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Na nhất dạ, Trung Nguyên thiên mạc hốt nhiên liệt khai nhất đạo xí bạch trường ngân. Vẫn tinh tha trước diễm vĩ việt quá quần sơn, tối chung trực trụy ngươi sở tại chi địa; ngươi thậm chí lai bất cập đóa thiểm, thiên địa tiện tại chấn hưởng dữ cường quang trung nhất đồng trầm một.\nPhụ cận đích La Vũ Môn tu sĩ tuần trước cự hưởng cản lai, chỉ kiến địa diện hãm thành nhưng mạo trước nhiệt khí đích thâm khan. Chiếu lý thuyết, khan tâm bất cai lưu hạ nhậm hà hoạt vật, ngươi khước hoàn chỉnh địa tràng tại toái thạch giữa, hung khẩu không có trí mệnh sang thương, tứ chi dã nhưng hữu ôn độ.\nNàng môn tương ngươi đái ly khan để, kiểm tra thương thế thời tài phát hiện cánh gia bất khả tư nghị chi sự: ngươi đích hung khoang lý dĩ thính bất kiến huyết nhục tâm tạng đích khiêu động, thủ nhi đại chi đích thị một viên dữ vẫn tinh đồng chất đích ngũ sắc kỳ thạch. mỗi lần thạch tâm chấn động, đô hữu ôn nhuận nhi cổ lão đích lực lượng duyên huyết mạch lưu biến toàn thân, duy trì trước bổn ưng đoạn tuyệt đích sinh cơ.\nMôn trung tu sĩ thường thí dĩ linh lực thám tra, ngũ sắc huy quang khước tự hành phính hợp thương xứ, bài khai ngoại lực, ẩn ước hiển xuất bổ thiên tạo hóa đích đạo uẩn. Nàng môn vô pháp đoạn định thạch đầu chân chính đích lai lịch, chỉ năng Xác nhận kỳ trung tự hồ tàn lưu trước dữ Cửu Thiên Huyền Nữ hữu quan đích lực lượng.\nNgươi tòng hôn mê trung tỉnh lai thời, đệ nhất thanh thính kiến đích tịnh phi tầm thường tâm khiêu, mà là hung khoang thâm xứ trầm ổn đích thạch minh. La Vũ Môn tu sĩ thủ tại nhất bàng, cáo tố ngươi vẫn thạch đã dữ ngươi đích tính mệnh dung vi nhất thể, tịnh chuẩn bị đái ngươi Quay lại tông_môn tường tra giá khỏa “Nữ Oa Thạch” cứu cánh vi hà lựa chọn liễu ngươi.',tags:['La Vũ Môn','kỳ ngộ','Nữ Oa Thạch']},{id:'story-guanghan-twin-fish',name:'Song ngư bội dẫn · nguyệt hạ trùng phùng',subtitle:'tha chung vu đẳng đáo cố nhân đích chuyển thế',desc:'đêm trăng tròn, bạn sinh ngọc bội hốt nhiên phát nhiệt, dẫn lai Quảng Hàn Cung chủ Mộ Toàn Cơ. Nàng nhận xuất ngươi thị tích nhật cố nhân đích chuyển thế, tịnh quyết định bất tái thác quá, phá lệ đái ngươi tiền vãng Quảng Hàn Cung.',cost:0,glyph:'Bội',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'đặc biệt','kịch bản':!0,flags:['Mộ Toàn Cơ · cựu duyên chuyển thế'],constraints:{locationIds:['eco-dt-shuanghua'],giới_tínhcấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Quảng Hàn Cung']},settings:{thời_gian:{Niên:7234,Nguyệt:8,Nhật:15,thời_thần:'tý'},tông_môn:'Quảng Hàn Cung (phá lệ nhập cung)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'đêm trăng tròn, ngươi tòng thụy mộng trung tỉnh lai, phi y đáo ốc ngoại tiểu giải. Hồi ốc thời nhu yếu xuyên quá gia hương đích Hoa Hải, vạn khoảnh hoa chi chính phục tại dạ phong lý, thanh lượng nguyệt quang nhất lộ phô đáo ngươi đích cước biên.\nTẩu đáo Hoa Hải thâm xứ, ngươi hốt nhiên sát giác hung tiền nhất trận ôn nhiệt. Na mai ngọc bội bổn cai tại thụy tiền trích hạ, kim dạ khước hãn kiến địa bị ngươi vong tại thân thượng. Phụ mẫu tằng cáo tố ngươi, ngươi xuất sinh thời khẩu trung tiện hàm trước tha; trừ thử chi ngoại, vô nhân thuyết đắc thanh tha tòng hà nhi lai.\nNgọc bội việt lai việt đãng, khước bất chước thương cơ phu. Lưỡng vĩ tương hàm đích ngư văn phù khởi nhu hòa nguyệt huy, tượng tại hồi ứng một cái khóa việt mạn trường tuế nguyệt đích hô hoán. Ngươi mạch nhiên hồi thủ, chỉ kiến Hoa Hải ngoại lập trước nhất đạo tuyệt mỹ đích tiên tử thân ảnh, nguyệt bạch cung trang duệ quá hoa tiêu, thanh lãnh mi nhãn gian khước hữu cơ hồ áp bất trụ đích kinh hỉ dữ hoàng nhiên.\nLai nhân chính thị Quảng Hàn Cung chủ Mộ Toàn Cơ. Nàng cảm ứng đáo lánh một viên song ngư bội tô tỉnh hậu lập tức tuần tích nhi lai, chỉ nhất nhãn tiện nhận xuất ngươi thần hồn trung na đạo lệnh nàng đẳng đãi chí kim đích khí tức. Tiền thế, ngươi dữ nàng tương thức tương tri, khước tại nàng lai đắc cập biểu lộ chân tình trước đó vẫn lạc; nàng chỉ năng bả na mai thủy chung vị năng tống xuất đích đồng tâm bội dữ ngươi nhất đồng mai táng.\nNhư kim, na mai bổn ưng trường miên mộ trong ngọc bội tùy ngươi chuyển thế nhi sinh. Mộ Toàn Cơ thủ xuất bản thân trân tàng đa niên đích lánh nhất bán, lưỡng mai ngọc bội cách trước nguyệt sắc đồng thời khinh minh, tái không có bỉ giá cánh xác thiết đích chứng minh.\nNàng hướng lai khắc chế đích thần tình chung vu thất thủ, việt quá hoa tùng khẩn khẩn bão trụ ngươi, tượng thị sảo nhất tùng thủ tiện hội tái mất đi nhất thứ. Đãi tối sơ đích kích động bình phục, nàng tài cáo tố ngươi tiền thế chi sự, dã thản ngôn giá nhất thế tuyệt bất hội tái bả tâm ý lưu đáo lai bất cập thuyết xuất khẩu đích lúc.\nQuảng Hàn Cung tòng vị thu quá phi nữ tính Đệ Tử, đãn Mộ Toàn Cơ quyết định thân tự thừa đảm thứ phá lệ. Thiên lượng trước đó, nàng hội cấp ngươi thời_gian cáo biệt gia hương; đãi nguyệt luân tây trầm, ngươi tương đái trước Song Ngư Đồng Tâm Bội tùy nàng khải trình, tiền vãng Sương Hoa Đảo thượng đích Quảng Hàn Cung.',tags:['Quảng Hàn Cung','Chuyển Thế','Mộ Toàn Cơ','Song Ngư Đồng Tâm Bội']},{id:'story-guanghan-frozen-qilin',name:'Hồ tâm băng quan · kiếp tiền di dân',subtitle:'dữ Kỳ Lân ấu sồ nhất đồng tô tỉnh',desc:'nguyệt hoa hồ địa động khai liệt, nhất khối cổ lão băng tinh phù xuất hồ diện; ngươi dữ hoài trong Kỳ Lân ấu sồ bị Lưu kỳ trung, y sức dữ khẩu âm giai tự đại kiếp tiền đích cổ tu sĩ, khước chỉ ký đắc thủ hộ ấu sồ sứ mệnh.',cost:0,glyph:'Lân',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-dt-shuanghua'],giới_tính:'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tản Tu','Quảng Hàn Cung']},settings:{thời_gian:{Niên:7235,Nguyệt:11,Nhật:6,thời_thần:'mão'},tông_môn:'Quảng Hàn Cung (hồ để hoạch cứu)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Sương Hoa Đảo địa mạch hốt nhiên chấn động, nguyệt hoa hồ tùy chi phát sinh địa long phiên thân. Hồ ngạn băng tằng thốn thốn khai liệt, hồ để truyền lai trầm muộn oanh hưởng, tượng hữu nhất tọa bị tuế nguyệt yểm mai đích cựu điện chính tại thủy hạ băng tháp.\nQuảng Hàn Cung tu sĩ cản đáo hồ biên phong tỏa liệt khích thời, nhất khối trượng hứa cao đích trừng triệt băng tinh tòng hồ để chậm rãi nổi lên mặt nước. Băng trung tịnh phi khoáng thạch hoặc cổ khí, mà là nhất danh song tí khẩn bão ấu thú đích nữ tử——chính thị trầm thụy kỳ trong ngươi.\nChúng nhân tương băng tinh khiên dẫn thượng ngạn, dĩ nguyệt hoa chi lực trục tằng hóa khai phong ấn. Ngươi hoài trung na chích bất minh ấu thú thủy chung bị hộ tại hung tiền, đầu sinh nhu nhuyễn lân giác, tế tiểu lân phiến gian lưu chuyển trước ngũ sắc hỗn độn quang; tức sử băng phong giải trừ, ngươi đích thủ tí nhưng bổn năng địa bất khẳng tùng khai.\nTô tỉnh hậu đích ngươi không có minh hiển thương thế, y bào tài chế, phát sức hình chế nãi chí thuyết thoại khẩu âm khước đô dữ đương thế bất đồng, cánh tiếp cận điển tịch trung ký tái đích đại kiếp tiền cổ tu sĩ. tông_môn cao tằng tiếp liên tuần vấn ngươi đích tên, sư thừa dữ bị phong nhập hồ để đích duyên do, ngươi khước chỉ tòng phá toái ký ức lý lao xuất linh tinh họa diện, vô pháp cấp xuất hoàn chỉnh đáp án.\nNàng môn nhân thử thôi trắc, ngươi hoặc hứa thị đại kiếp trước đó bị Lưu chí kim đích hạnh tồn giả; nguyệt hoa hồ để đích địa động chỉ thị ngẫu nhiên đả khai liễu na tọa trầm thụy đa niên đích băng quan. Chân tướng thượng vô định luận, cung trung dã bất hội tại ngươi thần trí vị phục thời cường bách bức vấn.\nNgươi duy nhất ký đắc thanh sở đích thị bản thân sứ mệnh: bảo hộ hoài trong Kỳ Lân ấu sồ, nhượng giá điểm tòng cựu thời đại bảo tồn hạ xuống đích hy vọng hoạt đáo vị lai. ấu sồ thể nội phong trước tứ đạo trầm thụy đích tứ tượng ấn ký, Thanh Long, Bạch Hổ, Chu Tước, Huyền Vũ chi lực giai vị thủ đắc, tứ hạng thiên phú nhưng toàn bộ khóa.\nTại trảo hồi ký ức dữ tra thanh băng phong lai lịch trước đó, Quảng Hàn Cung tạm thời tiếp nạp ngươi dữ Kỳ Lân ấu sồ lưu tại Sương Hoa Đảo. Ngươi tỉnh lai đích giá nhất nhật, dã trở thành giá đoạn khóa việt đại kiếp đích thủ hộ sứ mệnh trùng tân khai thủy đích đệ nhất thiên.',tags:['Quảng Hàn Cung','Đại Kiếp Tiền','Kỳ Lânấu sồ','Thất Ức']},{id:'story-hehuan-yuanyang',name:'Uyên Ương Trì · Hợp Hoan Tông nhập môn',subtitle:'Hoan Mị Điện hậu sơ kiến song tu trường',desc:'bị lừa vàoHợp Hoan Tông，yêu bài còn chưa ấm，liền bị dẫn đến bên hồ Uyên Ương——Ôn Tuyềnbốc khói mờ ảo，hương quỳnh tứ dật，sơ ngộ"Hợp Hoan Song Tu"chi danh。',cost:0,glyph:'Hợp',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'tông_môn',constraints:{locationIds:['eco-dt-linyuan'],linh_căn_cấm:['Vô']},settings:{thời_gian:{Niên:7245,Nguyệt:3,Nhật:28,thời_thần:'tuất'},tông_môn:'Hợp Hoan Tông',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'Trời đã chập tối, lồng đèn hoa vừa được treo lên. Hàng trăm chiếc lồng đèn cung đình màu đỏ rực tỏa sáng, nhuộm luồng khí nóng bốc lên thành một sắc hồng ái muội. Trong không khí thoang thoảng dị hương ngòn ngọt, tựa hoa lan lại tựa hương xạ, chỉ vừa hít một chút vào phổi đã thấy ruột gan nóng hầm hập.\nTay ngươi vò xát miếng yêu bài vừa nhận, vẫn chưa hoàn toàn tỉnh táo sau khi bị kẻ khác dụ dỗ vào nơi này. Đằng sau là hành lang dẫn tới Hoan Mị Điện, trước mắt lại là một bức xuân cung sống động.\nNơi đây là đại mộc dục của Hợp Hoan Tông, gọi là Uyên Ương Trì —— cái tên thật đúng với thực tế. Đưa mắt nhìn quanh, đây nào phải là chốn đất lành tu tiên gì, rõ ràng là một chốn vui chơi giấu giếm. Trong làn nước suối ấm áp, vô số thân xác trắng ngần đang quấn quýt lấy nhau —— nơi này không chỉ là chốn tắm rửa, mà chính là trường tu luyện của đệ tử Hợp Hoan Tông.\nTầm mắt hơi dời đi, lại thấy một bệ ngọc giữa hồ, vài tên nữ tu đang ngồi quây lại thành vòng tròn, nằm ở giữa là một thiếu niên tuấn tú mặt đang đỏ bừng.\n\"Đây chính là tiểu sư đệ mới nhập môn sao? Nguyên Dương ngược lại mười phần dồi dào... để các sư tỷ nếm thử chút nào.\"\n\"Đây chính là... tu tiên sao?\" Ngươi lầm bầm tự ngữ, âm thanh nhanh chóng bị dìm nghỉm bởi những tiếng rên rỉ nối tiếp nhau.\nSuối nước nóng màu trắng đục, sương mờ mang theo hơi ẩm ướt át. Cách đó không xa trên chiếc giường nước, vô số nam nữ thiếu niên cởi trần đang nô đùa mây mưa.',tags:['Hợp Hoan']},{id:'story-fan-zhigen',name:'Hạng vĩ đăng hỏa · hậu thiên thực căn',subtitle:'phàm phu chi thân ngẫu ngộ tiên duyên',desc:'Mang thân phàm nhân, tình cờ gặp được một lão giả lưu lạc nơi đầu đường xó chợ. Nhờ có duyên với nhau, lão giả dùng một môn bí pháp gần như thất truyền để cấy ghép Linh Căn cho ngươi, từ đó bước chân lên con đường tu chân.',cost:0,glyph:'Tục',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'đặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{thời_gian:{Niên:7268,Nguyệt:10,Nhật:7,thời_thần:'hợi'},tông_môn:'Tản Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'luyện khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Mưa đêm gõ nhịp vào hiên nhà, ngọn đèn trong ngôi nhà cũ ở ngõ sau mờ nhạt.\nNgươi vừa sắc xong thuốc cho nương, toan dập đèn thì ngoài cửa chợt truyền đến tiếng ho nhỏ khản đặc —— một ông lão y phục rách nát đang bám lấy khung cửa, tựa hồ thân thể không thể đứng vững được nữa.\n\"Tiểu hữu... một bát nước trong... một chỗ tránh gió, có được không?\"\nNgươi nhường lối cho ông lão bước vào nhà, ngồi xuống mép giường, mượn ánh đèn dầu lờ mờ, ông lão ngước đôi mắt vẩn đục lên cẩn thận đánh giá ngươi một hồi lâu.\n\"Mệnh ngươi không có căn cốt, vốn không thể tu tiên. Nhưng —— lão hủ mang trên mình một môn bí pháp cấy ghép Linh Căn, e rằng đã không còn ngày tháng để thi triển nữa. Đêm nay ngươi dẫn ta vào nhà, chính là nhân duyên.\"\nLão lấy từ trong ngực ra một ngón tay khô gầy như củi, đầu ngón tay ngưng kết một luồng Linh Khí xám xịt, chỉ thẳng vào mi tâm của ngươi.\n\"Cắn răng chịu đựng ý hỏa thiêu, mở ra khí hải bảy tấc, từ nay phàm trần không còn là nơi để ngươi quay về.\"\nMột đạo noãn lưu từ mi tâm chạy thẳng xuống Đan Điền. Tiếng mưa bên song cửa dần xa, ngọn nến trong phòng bỗng chốc bùng cháy rực rỡ ——\nThân phàm phu, từ nay dứt trần tục, kết duyên tiên đạo.',tags:['đặc biệt']},{id:'story-fan-renjian',name:'Túc mễ nhân gian · thuần phàm chi lộ',subtitle:'bất nhập tu chân lộ',desc:'Bất nhập tu chân chi liệt, an thủ phàm nhân bổn phân; vu thị tỉnh gian độ nhật, vu sa trường thượng lịch
