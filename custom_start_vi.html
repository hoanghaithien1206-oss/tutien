少年男女鱼贯而入，广场中央立着一座古朴的青玉测灵盘，盘面五色微光流转不定。\n司礼执事立于盘侧，唱名声此起彼伏：「Linh Căn驳杂，分入外门，充作杂役——」「真灵入品，外门亲传——」「Thượng Phẩm Linh Căn，内门嫡传，长老择徒而授——」\n每一声唱报都牵动着阶下众人的呼吸：被点入内门者喜形于色，落入外门者亦如蒙大赦，唯有测不出Linh Căn者，黯然退场。\n终于轮到你。执事抬眼扫了你一眼，淡淡道："Tiến lên, đặt tay lên giữa bàn cờ, ngưng thần, chớ có phân tâm."\n你深吸一口气，缓步上前，将掌心轻轻覆上那温润微凉的玉盘——'},{id:'story-yinyu',name:'Ẩn Ngọc Sơ Thức',subtitle:'Tại thị tỉnh gian kết thức cao nhân',desc:'本欲只在市井度Ngày，却于茶肆偶遇游方仙师，赠你一卷残页。',cost:0,glyph:'机',recommend:'Tầm Thường Tu Hành',thể_loại:'tản tu',constraints:{Linh Căn禁止:['không']},settings:{thời_gian:{năm:7156,tháng:11,ngày:12,thời_thần:'dậu'},thân_phận:'tản tu',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'你正坐在茶肆角落，看着雪粒打在窗棂上发呆。\n邻桌一位灰衣老者忽然冲你笑了笑：\n"Tiểu hữu có duyên với kiếm."\n他随手在桌上推过一卷油黄的残页，又自顾自饮尽杯中酒，转眼便消失在风雪中——'},{id:'story-fuchou',name:'Huyết Môn Di Cô',subtitle:'Phụ Cừu Tiền Hành',desc:'Môn phái在Ma Tu夜袭中被屠尽，只你一人带着师门信物逃出生Thiên。',cost:0,glyph:'仇',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'tản tu',constraints:{Linh Căn禁止:['không']},settings:{thời_gian:{năm:7188,tháng:7,ngày:22,thời_thần:'dần'},thân_phận:'Tán Tu (Trước · Vụ Ẩn Sơn Môn)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'hậu kỳ'}},body:'Sơn môn bị hủy hoại chỉ trong một đêm.\nNgươi nằm bò trong vũng bùn máu giả chết, nghe tiếng rống giận cuối cùng của sư tỷ, nghe tiếng chống gậy nặng nề lướt qua bên cạnh.\nCho đến khi tất cả chìm vào tĩnh mịch.\nNgươi nắm chặt khối ngọc bài bị máu nhuộm thẫm kia, trước khi bình minh ló rạng bò ra từ trong những bức tường đổ nát ——',tags:['Cừu Oán']},{id:'story-dadao',name:'Đã Ngộ Đại Đạo',subtitle:'Tiền Thế Kim Sinh',desc:'Ngươi dường như nhớ lại đủ loại chuyện kiếp trước. Mọi thứ còn chưa bắt đầu, mà phảng phất như đã là kết cục.',cost:0,glyph:'道',recommend:'Tiểu Đạo Du Du',thể_loại:'đặc biệt',settings:{thời_gian:{năm:7301,tháng:3,ngày:3,thời_thần:'mão'},thân_phận:'tản tu',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'你在朝霞中睁开眼。\n窗外是再熟悉不过的灵溪，远处晨钟敲响——\n这一切，你似乎在某个梦里见过千百次。\n你抬手轻抚胸口的玉牌，那里仿佛还残留着上一世Hỏa焚之后的余温——',tags:['Truyền Thuyết']},{id:'story-tianxuan-zayou',name:'Vạn Kiếm Bình · Kiếm Sư Tặng Thạch',subtitle:'Trong phong tuyết bèo nước gặp nhau',desc:'ThiênHuyền剑宗杂役Đệ tử，于万剑坪扫雪时偶遇剑脉传人墨诗行奉命下山历练；临行前她留下一枚下品Linh thạch。',cost:0,glyph:'剑',recommend:'Lệ Tâm Vấn Đạo',thể_loại:'tông môn',constraints:{locationIds:['eco-xy-wuyan'],Linh Căn Cấm Chỉ:['không']},settings:{thời_gian:{năm:7204,tháng:12,ngày:18,thời_thần:'thìn'},thân_phận:'Thiên Huyền Kiếm Tông（外门杂役）',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'Thiên Huyền Kiếm TôngTông Môn广场，万剑坪上积了一层新霜，几名杂役Đệ Tử正低头清扫，你就在其中。\n宗主莫决云立在大殿前的石阶上，负手而立，灰白长衫随风飘荡；剑脉传人墨诗行一袭玄青剑袍，独立于万剑坪中央，长剑斜引残雪，凝立Bất Động，仿佛已在这风雪里站了整整一夜。\n"Một đêm không thu thế, nhát kéo đó, liệu có ra「Thơ」rồi chăng?"莫决云的声音不大，却清晰传遍整个万剑坪，隐隐压过呼啸的风声。\n墨诗行缓缓收剑入鞘，墨眸清冷，望着漫天风雪，声音很淡。\n"回师尊，还差一分。这一剪Đệ tử练了三Năm，招已至极，剑里却始终少一口气——不是不够利，是没有诗。"\n莫决云眉头微不可察地一动，袖袍轻拂，将她身旁三尺积雪荡开，她却连眼也未眨。\n"闭死在山上，剑意反被磨钝了。今Ngày起，你下山历练去——去人间寻你那一口「诗」，寻不到，便不必回宗。"\n墨诗行怔了一瞬，随即端正行了一礼，声音依旧清冷，却比方才多了一分郑重，"Đệ tử…… Lĩnh mệnh."\n她转身向山门走去，长发束得极高，背上长剑映着雪光，玄青剑袍掠过一地素白。行至你身边，脚步无端顿了一顿。\n她垂眸看了看你冻得发红的手，又看了看你脚下那一小片被扫得干干净净的雪地，墨眸里掠过一丝极淡的东西。\n"Một chỗ lại một chỗ, quét mãi không chán, đây cũng là kiếm ý."墨诗行说着，从袖中取出一枚下品Linh Thạch，轻轻搁进你掌心，"心沉得下来，扫帚也能通道。这枚，权当谢你让我看了这一片干净的雪Địa。"\n语尽，她不再多言，足尖轻点，掐诀御剑而起，一道青光没入风雪，转瞬不见。'},{id:'story-lingfeng-yueye',name:'Hồi Âm Cốc · Nguyệt Hạ Hợp Tấu',subtitle:'Sơ nhập Linh Phong Trai nhã hội',desc:'入Linh Phong Trai不久，Tháng夜独抚琴于回音谷，恰遇手持玉笛的夏未央，二人合奏一曲。',cost:0,glyph:'琴',recommend:'Tiểu đạo du du / Tu hành tầm thường',thể_loại:'tông môn',constraints:{locationIds:['eco-bj-nanfeng'],Linh Căn Cấm Chỉ:['không']},settings:{thời_gian:{năm:7212,tháng:8,ngày:16,thời_thần:'hợi'},thân_phận:'Linh Phong Trai',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'夜色稍沉，一弯新月挂在回音谷的夜空；水汽氤氲，濡湿了岸边的青苔。\n你坐于河边石上，膝上横着古琴，指尖勾挑，并无定谱，只随风势起落。泠泠七弦，偶尔惊起栖息在芦苇荡中的几只水鸟，水鸟振翅掠过水面，摇散月光点点。\n忽有笛声自林梢落下，那笛音清越，不争不抢，只轻轻填补琴音将歇的空隙，留住了那将要散去的余韵。\n你按住琴弦，抬眼望去，林间小径转角处，一袭淡藕色纱裙随风微动。来人手持一支玉笛，笛身通体洁白，惟有末端坠着明黄流苏。\n"Quấy rầy nhã hứng của đạo hữu rồi, vừa rồi nghe tiếng đàn này, tựa hồ có ý cảnh sông dài uốn lượn quanh bãi cỏ thơm, lại nhiều thêm mấy phần tùy tính. Đạo hữu là người mới gia nhập Tế?"\n你起身，向女子拱手一礼，"在下你，初入Linh Phong Trai，见此ĐịaTháng色正好，情难自禁，不想惊动了师姐。"\n那女子行至水边，并未站在高处受礼，而是在一旁的青石上坐下，将玉笛横在膝头。\n"万物有声，这Thủy浪拍岸是声，虫鸣鸟叫是声，道友的琴音自然也是声，既然都在这ThiênĐịa间，那便算不得惊扰。"\n"Ta vừa rồi ở trong rừng, nghe thấy tiếng đàn của đạo hữu dường như còn chưa hết ý, vừa vặn ta có một khúc nhạc cũng thiếu hụt chút ý cảnh, không biết đạo hữu có nguyện ý hợp tấu một khúc?"\n你重新落座，双手抚上琴弦，无需言语Xác Nhận调式，指尖落下，便是回应。\n琴音起时如山涧滴泉，清冽透亮；笛声随之而入，绵长悠远，似风过松林。\n曲终，余音散入风中，水面复归平静。\n"Gió đêm nay, ngược lại ôn hòa hơn thường ngày một chút."夏未央轻抚笛身，站起身来，理了理被风吹乱的鬓发。\n"若是道友喜欢此Địa，往后也可常来。Linh Phong Trai夏未央，记下了道友今夜的琴。"'},{id:'story-liuli-baicao',name:'Bách Thảo Phong · Dược Viên Tân Lân',subtitle:'Cùng Triệu Phương Huỳnh đồng khoảnh sừ dược',desc:'Lưu Ly Đan Tông外门Đệ tử，于百草峰偏角药园锄药；隔壁新搬来一位怯生生的小师妹赵芳萤。',cost:0,glyph:'丹',recommend:'Tầm Thường Tu Hành',thể_loại:'tông môn',constraints:{locationIds:['eco-dt-liufang'],Linh Căn Cấm Chỉ:['không']},settings:{thời_gian:{năm:7197,tháng:4,ngày:9,thời_thần:'thìn'},thân_phận:'Lưu Ly Đan Tông（外门杂役）',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'流芳Sơn Mạch绵延几百里，晨辉破云，金光洒落百草峰，峰顶云蒸霞蔚，隐约可见有内门Đệ Tử御物在天，或坐于葫芦、或立于Phi Kiếm，但那都是与杂役无缘的风景。\nLưu Ly Đan Tông，百草峰，集中种植低阶灵草灵药的区域，其中一片小药园。\n你提起锄头歇息片刻，直起腰，Luyện KhíSơ Kỳ的Linh Khí在经脉里转了小半周天，消解了些许疲乏。这块药田便是其在Lưu Ly Đan Tông的一亩三分地，种的皆是Luyện Khí期Đan Dược的Cơ Sở辅材。\n隔壁那荒废了大半个月的小药园，今日有了动静。\n竹篱那边，一名看上去豆蔻年华的少女，身上的杂役布袍宽大了些许，袖口挽了几道，露出细瘦的手腕。她半蹲在土地上，对着刚栽下去有些蔫头耷脑的草药比划。\n"Lục Cao Cao, đất ở đây rất mềm mại, ngươi phải tranh khí, cắm rễ cho sâu vào."\n声音顺着晨风飘过竹篱，落入你耳中。那少女并未察觉旁人目光，只是从沟渠舀起少许泉水，淋给草药。\n"Uống nước rồi thì không được khô héo, đợi ngươi mọc ra lá non, ta sẽ gọi ngươi là Lục Tráng Tráng."\n你手中锄头轻顿，碰上一块硬土，发出了响声，少女转头，眸子里映出你提着锄头的身影。\n她连忙站起身来，双手在身前交叠，朝着你深深行了一礼，因为动作太急，头顶那条用来束发的粗布条歪了一些，几缕碎发散在额前。\n"Tiền, Tiền Bối hảo."她头垂得很低，露出白净纤细的后颈，声音有些发怯，"Ta là Triệu Phương Huỳnh mới đến dược điền này, nếu như có quấy rầy tiền bối tu hành, xin tiền bối thứ tội."'},{id:'story-nanjiang-fox',name:'Thập Vạn Đại Sơn · Giải cấu Hồ Yêu',subtitle:'Trên đường hái thuốc ngẫu nhiên nhập Tiên Chi U Cốc',desc:'为寻"Linh Sơn Tiên Chi"在Thập Vạn Đại Sơn边缘盘桓数日，误入幽谷，遇见正对木桩独自练习答词的青丘狐族少女苏凝香。',cost:0,glyph:'狐',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'tản tu',constraints:{regionIds:['reg-nanjiang'],Linh Căn Cấm Chỉ:['không']},settings:{thời_gian:{năm:7220,tháng:6,ngày:1,thời_thần:'thìn'},thân_phận:'tản tu',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'trung kỳ'}},body:'晨曦微露，Nam Cương特有的湿热水汽尚未完全散去，在林间凝成轻纱般的薄雾。\n你身负竹篓，脚穿皮靴，踏入幽深的小径，这里人迹罕至，寻常采药人不敢涉足，但你为了寻找那传闻中的"Linh Sơn Tiên Chi"，已在Thập Vạn Đại Sơn边缘盘桓了数日。\n你拨开眼前遮蔽视线的阔叶，视野豁然开朗，前方是一处静谧的幽谷，谷中溪水潺潺，两岸开满了不知名的野花，随风摇曳，落英缤纷。花丛中央，坐着一位身着浅粉襦裙的少女，她背对着你，正对着一根木桩念念有词。\n"Đại ân của công tử, tiểu nữ tử không biết lấy gì báo đáp, chỉ có……"少女声音稍顿，歪了歪头，似在回忆什么，随后换了一种语调，略带娇羞，"Chỉ mong được lấy thân tương hứa, nguyện theo chàng góc bể chân trời."\n你不慎踩断了一截枯枝，咔嚓轻响，在这静谧幽谷中显得尤为突兀。\n少女身形微颤，蓦然回首，面容娇憨，双颊晕红，溪水般清澈的眼眸中带着些许惊慌。\n"Ngươi là ai? Ngươi là...... đến đây ngắm phong cảnh sao?"\n你拱手一礼，"在下你，乃山中采药之人，误闯姑娘……清修之Địa，多有得罪，还望见谅。"\n少女闻言，眼中警惕稍退，取而代之的是好奇，似在Xác Nhận对方的善意。\n"Thái Dược Nhân……"她低声重复，随即起身，笨拙地回了一礼，"Tiểu nữ tử Tô Ngưng Hương, xin được hữu lễ."'},{id:'story-wudu-init',name:'Đi ra Chướng Lâm · Vạn Độc Tổ Quật',subtitle:'Một canh bạc lớn trong trắc nghiệm nhập môn',desc:'于Vũ Chướng Lâm中参加Ngũ Độc GiáoNhập Môn Trắc Nghiệm，饥寒交迫、四下皆毒；走投无路吞下一枚《 Bách Độc Kinh 》未载的五彩怪果，醒来识海凭空多了一门Thần Thức蛊法，与一句唤你前往"Vạn Độc Tổ Quật"的低语。',cost:0,glyph:'蛊',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',Kịch Tình:!0,constraints:{locationIds:['eco-nj-yuzhang'],Linh Căn Cấm Chỉ:['không'],Môn Phái Quy Thuộc:['','tản tu','Ngũ Độc Giáo']},settings:{thời_gian:{năm:7231,tháng:4,ngày:9,thời_thần:'tỵ'},thân_phận:'Ngũ Độc Giáo (Nhập Môn Thí Luyện)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'Vũ Chướng Lâm深处，湿热的瘴气黏在皮肤上，久久不散。\n这是Ngũ Độc GiáoNhập Môn Trắc Nghiệm的最后一关——独自走出这片吃人的林子。已是第三日，你Luyện KhíSơ Kỳ那点微薄的Linh Khí早被瘴毒磨得所剩无几，饥火与寒意一齐啃着五脏六腑。\n偏偏这林中"Thực Vật"并不算少：紫红的浆果、肥厚的菌伞、爬满藤蔓的甜藕……你翻开随身那卷《 Bách Độc Kinh 》一一比对，翻到最后，指尖发凉——无一例外，全是剧毒。原来这一关考的从不是"Có thể tìm được thức ăn không"，而是"Biết rõ có độc, ngươi có dám chạm không"。\n就在你几乎要倒下去的时候，一丛腐叶间露出一枚拳头大的果子，五彩斑斓、流转着近乎妖异的光泽。你翻遍《 Bách Độc Kinh 》，从头到尾——竟没有半个字提到它。\n未载于经，便是未知；未知，便是不知死活。可你也确实，再没有别的路了。\n你盯着那枚怪果看了很久，终于闭上眼，一口咬了下去——赌这一把。\n意识坠入无边的黑。\n……\n再睁眼时，天光已亮。饥寒尽退，那点被磨尽的Linh Khí竟也悄然复原，四肢百骸说不出的通泰，仿佛什么东西在体内被彻底洗过一遍。\n只是——你的识海里，凭空多了一门Công Pháp。它的名字自己浮上心头：《Phệ Tâm Cổ Kinh》。Thần Thức为针，种蛊噬心，诡异得与《 Bách Độc Kinh 》里任何一页都不相干。\n而在识海深处，一段沙哑而遥远的低语，正贴着神魂反复回响，挥之不去——\n"Tới…… Vạn Độc Tổ Quật…… tìm ta……"\n你摸了摸怀里那块Nhập Môn时Tông Môn发下的Tư Nam Chi Thạch——它一如往常，只认得南北，却半点指不出那"Vạn Độc Tổ Quật"在何方。',tags:['Ngũ Độc Giáo','Kỳ Ngộ']},{id:'story-luowu-mirror',name:'Di Kính Quy Tông · Tố Quang Tầm Thân',subtitle:'Truyền thừa La Võ ngủ say trong di vật của mẫu thân',desc:'云游切磋的白蕊弦偶然发现，你体内竟运转着La Vũ MônTâm Pháp；母亲留下的Tố Quang GiámPhong Tồn着Công pháp、技艺与四段记忆，唯有Đột PháĐại cảnh giới才能逐次解锁。为追查母亲之死，她决定带你Phản HồiLa Vũ Môn。',cost:0,glyph:'镜',recommend:'Tu hành tầm thường / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',Kịch Tình:!0,constraints:{locationIds:['eco-zy-zhuohua'],Giới Tính Cấm Chỉ:['nữ'],Linh Căn Cấm Chỉ:['không'],Môn Phái Quy Thuộc:['','tản tu','La Vũ Môn']},settings:{thời_gian:{năm:7232,tháng:8,ngày:17,thời_thần:'thân'},thân_phận:'La Vũ Môn (Quy Tông Đồ Trung)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'白蕊弦离开La Vũ Môn后，一路寻访各ĐịaThể Tu切磋论技。途经你居住的城镇时，她Nguyên Bản只打算停留一夜，却在人群中察觉到一缕极熟悉的吐纳节律——那股气息正从你的经脉间循环，分明是La Vũ Môn锻骨一脉的内功路数。\n她当即拦下你，细问这门Tâm Pháp从何而来，又反复追问你的母亲姓甚名谁、是否曾为La Vũ MônĐệ tử。你却答不上来：母亲去世时，你尚不知道她的过往，只记得她临终前将一面旧镜交给你；父亲也只肯说，她是被仇人所杀。\n你取出母亲留下的镜子。镜面不映寻常人影，灵力触及时反而浮出一层层Phong Tồn的经脉图与技艺手札。白蕊弦检查许久，Xác Nhận其中藏着完整的La Võ Môn Truyền Thừa，却被四重禁制分隔；只有你亲自Đột Phá一个Đại cảnh giới，镜中封印才会解开一层，显露一段母亲留下的记忆线索。未到Đột Phá之时，纵使她强行灌注灵力也只会照见一片雾光。\n更令她意外的是，这份Truyền Thừa早已依照你的经脉重新调整。即使你并非女性，也能安全修行本应只传门中女Đệ tử的Công pháp，绝非偶然得来的Sao Bản所能做到。\n白蕊弦沉默片刻，将镜子郑重交还你，随即以La Vũ Môn战技脉脉主之名立誓：无论你的母亲是谁，又死于何人之手，她都会陪你查明真相，为故人讨回公道。\n城门外，她已备好回返La Vũ Môn的行装。你带着《Đoán Cốt Thổ Nạp Quyết》与Tố Quang Giám随她上路；下一段镜中记忆，要等你亲手跨过第一个Đại cảnh giới后才会醒来。',tags:['La Vũ Môn','Kỳ Ngộ','Thân Thế']},{id:'story-luowu-nuwa',name:'Vẫn Tinh Hoán Tâm · Nữ Oa Di Thạch',subtitle:'Người vốn dĩ nên chết đi, trong ngực vang lên thạch tâm',desc:'Trung Nguyên忽降陨星，你被正面砸中却没有死去；赶来查看的La Vũ Môn修士发现，你Nguyên Bản的心脏已被陨石替代，石中还残留着疑似源自九ThiênHuyền女的力量。',cost:0,glyph:'陨',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',Kịch Tình:!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tính:'nữ',Linh Căn Cấm Chỉ:['không'],Môn Phái Quy Thuộc:['','tản tu','La Vũ Môn']},settings:{thời_gian:{năm:7233,tháng:3,ngày:21,thời_thần:'tuất'},thân_phận:'La Vũ Môn (Vẫn Tinh Cứu Trị)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'那一夜，Trung NguyênThiên幕忽然裂开一道炽白长痕。陨星拖着焰尾越过群山，最终直坠你所在之Địa；你甚至来不及躲闪，ThiênĐịa便在震响与强光中一同沉没。\n附近的La Vũ Môn修士循着巨响赶来，只见Địa面陷成仍冒着热气的深坑。照理说，坑心不该留下任何活物，你却完整Địa躺在碎石之间，胸口没有致命创伤，四肢也仍有温度。\n她们将你带离坑底，检查伤势时才发现更加不可思议之事：你的胸腔里已听不见血肉心脏的跳动，取而代之的是一枚与陨星同质的五色奇石。每一次Thạch Tâm震动，都有温润而古老的力量沿血脉流遍全身，维持着本应断绝的生机。\n门中修士尝试以灵力探查，五色辉光却自行拼合伤处、排开外力，隐约显出补ThiênTạo Hóa的道韵。她们无法断定石头真正的来历，只能Xác Nhận其中似乎残留着与九ThiênHuyền女有关的力量。\n你从昏迷中醒来时，第一声听见的并非寻常心跳，而是胸腔深处沉稳的石鸣。La Vũ Môn修士守在一旁，告诉你陨石已经与你的性命融为一体，并准备带你Phản HồiTông môn详查这颗“Nữ Oa Thạch”究竟为何Lựa Chọn了你。',tags:['La Vũ Môn','Kỳ Ngộ','Nữ Oa Thạch']},{id:'story-guanghan-twin-fish',name:'Song Ngư Bội Dẫn · Nguyệt Hạ Trùng Phùng',subtitle:'Nàng cuối cùng đợi được cố nhân chuyển thế',desc:'Tháng圆之夜，Bạn Sinh Ngọc Bội忽然发热，引来Quảng Hàn Cung主Mộ Toàn Cơ。她认出你是昔Ngày故人的Chuyển Thế，并决定不再错过，破例带你前往Quảng Hàn Cung。',cost:0,glyph:'佩',recommend:'Tiểu đạo du du / Tu hành tầm thường',thể_loại:'đặc biệt',Kịch Tình:!0,flags:['Mộ Toàn Cơ · Cựu duyên chuyển thế'],constraints:{locationIds:['eco-dt-shuanghua'],Giới Tính Cấm Chỉ:['nữ'],Linh Căn Cấm Chỉ:['không'],Môn Phái Quy Thuộc:['','tản tu','Quảng Hàn Cung']},settings:{thời_gian:{năm:7234,tháng:8,ngày:15,thời_thần:'tý'},thân_phận:'Quảng Hàn Cung (Phá Lệ Nhập Cung)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'Tháng圆之夜，你从睡梦中醒来，披衣到屋外小解。回屋时需要穿过家乡的Hoa Hải，万顷花枝正伏在夜风里，清亮Tháng光一路铺到你的脚边。\n走到Hoa Hải深处，你忽然察觉胸前一阵温热。那枚玉佩本该在睡前摘下，今夜却罕见Địa被你忘在身上。父母曾告诉你，你出生时口中便含着它；除此之外，无人说得清它从何而来。\n玉佩越来越烫，却不灼伤肌肤。两尾相衔的鱼纹浮起柔和Tháng辉，像在回应一个跨越漫长岁Tháng的呼唤。你蓦然回首，只见Hoa Hải外立着一道绝美的仙子身影，Tháng白宫装曳过花梢，清冷眉眼间却有几乎压不住的惊喜与惶然。\n来人正是Quảng Hàn Cung主Mộ Toàn Cơ。她感应到另一枚双鱼佩苏醒后立即循迹而来，只一眼便认出你神魂中那道令她等待至今的气息。前世，你与她相识相知，却在她来得及表露真情之前陨落；她只能把那枚始终未能送出的同心佩与你一同埋葬。\n如今，那枚本应长眠墓中的玉佩随你Chuyển Thế而生。Mộ Toàn Cơ取出自己珍藏多Năm的另一半，两枚玉佩隔着Tháng色同时轻鸣，再没有比这更确切的证明。\n她向来克制的神情终于失守，越过花丛紧紧抱住你，像是稍一松手便会再失去一次。待最初的激动平复，她才告诉你前世之事，也坦言这一世绝不会再把心意留到来不及说出口的时候。\nQuảng Hàn Cung从未收过非女性Đệ tử，但Mộ Toàn Cơ决定亲自承担这次破例。Thiên亮之前，她会给你Thời gian告别家乡；待Tháng轮西沉，你将带着Song Ngư Đồng Tâm Bội随她启程，前往Sương Hoa Đảo上的Quảng Hàn Cung。',tags:['Quảng Hàn Cung','Chuyển Thế','Mộ Toàn Cơ','Song Ngư Đồng Tâm Bội']},{id:'story-guanghan-frozen-qilin',name:'Hồ tâm băng quan · Kiếp tiền di dân',subtitle:'Cùng Kỳ Lân ấu tể đồng thời tô tỉnh',desc:'Tháng华湖Địa动开裂，一块古老冰晶浮出湖面；你与怀中的Kỳ Lân Ấu Tể被Phong Tồn其中，衣饰与口音皆似Đại Kiếp Tiền的古修士，却只记得守护幼崽的使命。',cost:0,glyph:'麟',recommend:'Tu hành tầm thường / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',Kịch Tình:!0,constraints:{locationIds:['eco-dt-shuanghua'],giới_tính:'nữ',Linh Căn Cấm Chỉ:['không'],Môn Phái Quy Thuộc:['','tản tu','Quảng Hàn Cung']},settings:{thời_gian:{năm:7235,tháng:11,ngày:6,thời_thần:'mão'},thân_phận:'Quảng Hàn Cung (Hồ Để Hoạch Cứu)',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'Sương Hoa ĐảoĐịa脉忽然震动，Tháng华湖随之发生Địa龙翻身。湖岸冰层寸寸开裂，湖底传来沉闷轰响，像有一座被岁Tháng掩埋的旧殿正在Thủy下崩塌。\nQuảng Hàn Cung修士赶到湖边封锁裂隙时，一块丈许高的澄澈冰晶从湖底缓缓浮上Thủy面。冰中并非矿石或古器，而是一名双臂紧抱Ấu Thú的女子——正是沉睡其中的你。\n众人将冰晶牵引上岸，以Tháng华之力逐层化开封印。你怀中那只不明Ấu Thú始终被护在胸前，头生柔软麟角，细小鳞片间流转着五色Hỗn Độn光；即使冰封解除，你的手臂仍本能Địa不肯松开。\n苏醒后的你没有明显伤势，衣袍裁制、发饰形制乃至说话口音却都与当世不同，更接近典籍中记载的Đại Kiếp Tiền古修士。Tông môn高层接连询问你的姓名、师承与被封入湖底的缘由，你却只从破碎记忆里捞出零星画面，无法给出完整答案。\n她们因此推测，你或许是大劫之前被Phong Tồn至今的幸存者；Tháng华湖底的Địa动只是偶然打开了那座沉睡多Năm的冰棺。真相尚无定论，宫中也不会在你神智未复时强迫逼问。\n你唯一记得清楚的是自己的使命：保护怀中的Kỳ Lân Ấu Tể，让这点从旧时代保存下来的希望活到未来。幼崽体内封着四道沉睡的四象印记，青龙、白虎、朱雀、Huyền武之力皆未取得，四项Thiên赋仍Toàn Bộ锁定。\n在找回记忆与查清冰封来历之前，Quảng Hàn Cung暂时接纳你与Kỳ Lân Ấu Tể留在Sương Hoa Đảo。你醒来的这一Ngày，也成为这段跨越大劫的守护使命Bắt Đầu Lại的第一Thiên。',tags:['Quảng Hàn Cung','Đại Kiếp Tiền','Kỳ Lân Ấu Tể','Thất Ức']},{id:'story-hehuan-yuanyang',name:'Uyên Ương Trì · Hợp Hoan Tông Nhập Môn',subtitle:'Hoan Mị Điện sau sơ kiến Song Tu Tràng',desc:'被人劝入Hợp Hoan Tông，腰牌未热，便被引至鸳鸯池畔——Ôn Tuyền氤氲，琼浆四溢，初识"Hợp Hoan Song Tu"之名。',cost:0,glyph:'合',recommend:'Tiểu đạo du du / Tu hành tầm thường',thể_loại:'tông môn',constraints:{locationIds:['eco-dt-linyuan'],Linh Căn Cấm Chỉ:['không']},settings:{thời_gian:{năm:7245,tháng:3,ngày:28,thời_thần:'tuất'},thân_phận:'Hợp Hoan Tông',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'trung kỳ'}},body:'天色已暗，华灯初上。数百盏绯色宫灯高悬，将腾起的袅袅热气染成暧昧的粉红。空气中弥漫着甜腻异香，如兰似麝，只稍稍吸入肺腑，便觉腹热气躁。\n你手里捏着刚领到的腰牌，还未从被人劝进此地的经历中回过神来。身后是通往欢媚殿的回廊，眼前是一幅活色生香的画卷。\n此处，Hợp Hoan Tông大浴场，唤作鸳鸯池——起名倒是直白，放眼望去，哪里是什么修仙福地，分明是毫无遮掩的欢场。温热泉水中，无数晶莹剔透的肉体各自纠缠——这里不仅是沐浴之地，更是Hợp Hoan TôngĐệ Tử的Tu Luyện场。\n你视线稍偏，便又见池水中的某处玉台，数名女修围坐一圈，中间躺着一位面色潮红的俊秀青年。\n"Đây là tiểu sư đệ mới gia nhập? Nguyên dương có vẻ dồi dào chật chội... Để các sư tỷ thưởng thức tử tế nào."\n"Đây chính là…… Tu Tiên?"你喃喃自语，声音很快就被周遭此起彼伏的浪叫声淹没。\n乳白色的Ôn Tuyền，泛着暖意的迷蒙水雾，不远处的水床上，许多不着寸缕的少男少女正在嬉戏。',tags:['Hợp Hoan']},{id:'story-fan-zhigen',name:'Hạng vĩ đăng hỏa · Hậu thiên thực căn',subtitle:'Phàm phu chi thân ngẫu ngộ Tiên Duyên',desc:'Phàm nhân之身，偶遇一位流落街巷的老叟。彼此有缘之下，老叟以一门近乎失传的秘法为你接续Linh Căn，自此踏上修真路。',cost:0,glyph:'续',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'đặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{thời_gian:{năm:7268,tháng:10,ngày:7,thời_thần:'hợi'},thân_phận:'tản tu',初始cảnh_giới:{大cảnh_giới:'luyện khí kỳ',小cảnh_giới:'sơ kỳ'}},body:'夜雨敲檐，巷尾的旧屋灯火微弱。\n你替母亲煎完了药，正欲熄灯，门口忽地传来轻而沙哑的咳声——一名衣衫褴褛的老叟扶着门框，似乎已撑不住身子。\n"Tiểu hữu…… một bát nước trong…… một chỗ tránh gió, có được chăng?"\n你让出门来，老叟入屋，跌坐在炕沿，借着灯光，他抬起一双竟未浑浊的眸子，仔细打量了你半晌。\n"你Mệnh Trung无根，本不可修。然——老朽身怀一门接续Linh Căn的秘法，已无来Ngày施展。今夜你引我入屋，便是因缘。"\n他从怀中摸出一截枯瘦如柴的指头，指尖结着一缕灰白的Linh Khí，伸至你眉心。\n"Nhịn xuống cảm giác nóng rực, thất thốn Khí Hải như mở ra, từ đây phàm trần không còn là nơi ngươi thuộc về."\n一道温热自眉心直贯丹田。窗外的雨声渐远，屋内的烛火忽然明亮起来——\n凡夫之躯，自此续上仙缘。',tags:['đặc biệt']},{id:'story-fan-renjian',name:'Túc Mễ Nhân Gian · Thuần Phàm Chi Lộ',subtitle:'Bất Nhập Tu Chân Lộ',desc:'不入修真之列，安守Phàm nhân本分；于市井间度Ngày，于沙场上历劫。Phàm躯亦能见识修真世道。',cost:0,glyph:'俗',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{thời_gian:{năm:7222,tháng:5,ngày:18,thời_thần:'tỵ'},thân_phận:'tản tu',初始cảnh_giới:{大cảnh_giới:'phàm nhân',小cảnh_giới:'sơ kỳ'}},body:'熹微之光透过窗纸落在你的桌案上，照亮一份未抄完的契书。\n隔壁的粥摊已摆出了第一锅热粥，蒸气混着柴香缓缓浮起。\n你是Phàm夫，不通修真，不识Linh khí；这世间的修士御剑入云，于你而言不过是Thiên上传闻。\n但市井烟Hỏa，自有你的去处——账册要算，柴米要买，旁边卖花的少女今晨还托你带一壶酒。\n你整了整布袍，揣好沉甸甸的几枚铜钱，跨过门槛，迎着晨光踏入这熙攘的街市。\nPhàm nhân有Phàm nhân的活法。修真Thế giới的风浪与你似远还近，但只要心里有秤，Phàm途亦能不亏己心。',tags:['đặc biệt','Thuần Phàm']}];function s(e,t){const n=e.constraints;if(!n)return!0;if(n.locationIds?.length&&(!t.locationId||!n.locationIds.includes(t.locationId)))return!1;if(n.regionIds?.length){if(!t.locationId)return!1;const e=(0,a.Wb)(t.locationId);if(!e.region||!n.regionIds.includes(e.region.id))return!1}if(n.Tính Biệt&&t.Tính Biệt!==n.Tính Biệt)return!1;if(n.Tính Biệt禁止?.includes(t.Tính Biệt))return!1;if(n.Nguyên DươngNguyên Âm必须&&!t.Nguyên DươngNguyên Âm)return!1;if(n.Linh CănNgũ Hành任意?.length&&!t.root.elements.some(e=>n.Linh CănNgũ Hành任意.includes(e)))return!1;if(n.Linh Căn禁止?.length&&t.root.elements.some(e=>n.Linh Căn禁止.includes(e)))return!1;if(n.Linh CănPhẩm Giai?.length){const e=(0,o.fn)(t.root);if(!n.Linh CănPhẩm Giai.some(t=>e.includes(t)))return!1}return!(n.physiqueTier?.length&&!n.physiqueTier.includes(t.physique.tier))&&!(n.Môn Phái Quy Thuộc
