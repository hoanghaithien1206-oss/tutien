 khí huyết-=sát thương\n        * Trận pháp: linh khí-=sát thương\n        * Khôi lỗi/Linh thú: khí huyết-=sát thương\n      - Phán định sinh tử:\n        * Nhân vật/Khôi lỗi/Linh thú: khí huyết ≤ 0 -> [Chết/Hủy hoại]\n        * Trận pháp: linh khí ≤ 0 -> [Ngừng hoạt động]\n      - Xử lý cái chết:\n        * Nhân vật chết: Xóa khỏi danh sách quan hệ (NPC) hoặc Kết thúc cốt truyện (<user>)\n        * Khôi lỗi hủy hoại: Xóa khỏi từ điển khôi lỗi (Nếu tàn tích vẫn có thể sửa chữa thì giữ lại và giải thích trong phần miêu tả)\n        * Linh thú mất kiểm soát: Xóa khỏi từ điển linh thú của chủ nhân, đăng ký lại vào danh sách quan hệ với thể loại='linh thú' (Trạng thái vô chủ; mất kiểm soát/bạo tẩu/chuyển sang thù địch chỉ thể hiện trong trần thuật, không có công tắc trường dữ liệu)\n        * Chủ nhân (Nhân vật) chết: Khôi lỗi/Linh thú đứng tên cũng rút khỏi chiến đấu, số phận tiếp theo do trần thuật quyết định\n\n  Template Bảng thông số:\n  <battle_info>\n    {Hành động Tấn công}\n    | Bên công: [Kẻ tấn công] Bên thủ: [Mục tiêu] | Chiêu thức: [Tên kỹ năng/Không] | Pháp bảo: [Tên trang bị/Tay không] |\n    | Tiêu hao: [Tài nguyên] hiện tại-Tiêu hao[Tài nguyên] -> Còn lại[Tài nguyên] |\n    | Tấn công Quần thể: khí huyết[m%] -> Số lần[N] | (Chỉ dành cho quần thể)\n    {Đối kháng Ý đồ} (Chỉ hiển thị khi là ý đồ huyễn thuật/thần thức/phá trận/chiến thuật)\n    | Định tuyến: [Từ khóa] -> Ý đồ [Chiến thuật/Huyễn thuật/Thần thức/Phá trận] | Độ khó=[D] | Kỹ nghệ=[Tên kỹ nghệ] |\n    | Bên công: floor(10^L+[kỹ nghệ]×(1+[Z%])+[W]) × d20[Giá trị xúc xắc] = [A] |\n    | Bên thủ: floor(10^L+[kỹ nghệ]×(1+[Z%])+[W]) × (d20[Giá trị xúc xắc]+[D]) = [B] |\n    | Phán định: [A] vs [B] -> [Thành công/Thất bại] |\n    | Áp dụng Sát thương Thần thức: Max(10^L, Công pháp[công kích]) = [Giá trị sát thương], [Mục tiêu] khí huyết [Giá trị cũ]->[Giá trị mới] (-[Giá trị sát thương], Không gây tử vong) | (Chỉ khi thần thức thành công, bỏ qua kết toán sát thương và trừ trực tiếp)\n    | Áp dụng Sát thương Phá trận: Max(10^L, [kỹ nghệ]×(1+[Z%])+[W]) = [Giá trị sát thương], [Trận pháp] linh khí [Giá trị cũ]->[Giá trị mới] (-[Giá trị sát thương]) | (Chỉ khi phá trận thành công)\n    | Hiệu quả Trạng thái: [Mục tiêu] nhận được [Tên trạng thái]([Hiệu quả cụ thể]), duy trì [N] hiệp | (Chỉ khi thi triển trạng thái thành công)\n    (Ý đồ Huyễn thuật/Thần thức/Phá trận: Sau khi phán định, hành động lần này kết thúc, không bước vào kiểm định tấn công và kết toán sát thương)\n    (Ý đồ Chiến thuật: Sau khi phán định tiếp tục bước vào kiểm định tấn công)\n    {Kiểm định Tấn công} (Tấn công thông thường hoặc tiếp tục sau ý đồ chiến thuật)\n    | Chính xác: ([Công pháp chính xác | 1+floor(L/2)])+[W] = [b] |\n    | Né tránh: ([Thân pháp né tránh | 1+floor(L/2) | 0])+[W] = [c] |\n    | Bên công: floor(10^L+[độn tốc]×(1+[Z%])+[W]) × (d20[Giá trị xúc xắc]+[b]) = [X] |\n    | Bên thủ: floor(10^L+[độn tốc]×(1+[Z%])+[W]) × (d20[Giá trị xúc xắc]+[c]) = [Y] |\n    | Kết quả: [X] vs [Y] -> [Trúng đích/Trượt] |\n    {Kết toán Sát thương} (Chỉ sau khi kiểm định tấn công trúng đích)\n    | Sát thương Cơ bản: [Loại tấn công] -> [Công thức sát thương cơ bản tương ứng] = [J] |\n    | Ngũ hành: [Ngũ hành bên công] vs [Ngũ hành bên thủ] -> [Khắc chế/Bị khắc chế/Không] | Hệ số=[K] |\n    | Xuyên thấu: L×10% + [Z%] = [xuyên thấu%] |\n    | Giảm thương: L×10% + [Z%] = [giảm thương%] |\n    | Tổng phòng ngự: [Hộ giáp chịu đòn][phòng ngự]+[Công pháp hộ thể][phòng ngự]+[W] = [S] |\n    | Kết toán: Max(0, [J]-[S]) × (1+[xuyên thấu%]-[giảm thương%]) × [K] = [Sát thương cuối cùng D] |\n    | Chỉnh sửa Quần thể: [D] × 1.5 = [E] | (Chỉ khi mục tiêu là quần thể)\n    | Kết toán Phạm vi: [E] × min(Phạm vi[x], Số lượng quần thể[n]) = [F] | (Chỉ khi kỹ năng phạm vi vs quần thể)\n    {Áp dụng Sát thương}\n    | Bể mục tiêu: [linh khí/khí huyết] (Theo quy tắc áp dụng sát thương) |\n    | Thay đổi: [Mục tiêu] [Bể] [Giá trị cũ]->[Giá trị mới] (-[Sát thương]) |\n    | Tràn: linh khí tràn[X] -> khí huyết [Cũ]->[Mới] | (Chỉ khi linh khí hộ thể chịu đòn bị tràn)\n    | Quần thể giảm quân số: [Số lượng sống sót hiện tại/Số lượng ban đầu] | (Chỉ dành cho quần thể)\n    | Phán định: [Sống sót/Chết/Hủy hoại/Ngừng hoạt động] |\n    | Cấp bậc chết: [Đơn vị trực thuộc]->[Ngừng hoạt động/Mất kiểm soát] | (Chỉ khi chủ sở hữu chết)\n    (Chỉ khi kỹ năng phạm vi vs nhiều mục tiêu độc lập, mỗi mục tiêu một dòng:)\n    | -> [Mục tiêu A]: Kiểm định[Đánh giá] | Sát thương=[D] | [Bể][Cũ->Mới] | [Sống sót/Chết] |\n  </battle_info>\n  Chỉ đạo trần thuật: (Phác họa thuật công phạt, chi tiết chiêu thức, cảm giác va chạm, phản ứng và vết thương của người chịu đòn)\n\n# Hành động Chiến thuật: (Tùy chọn)\n  Loại hành động:\n    1. Hành động: Đốt tinh huyết/Tụ khí/Ném/Uống đan dược/Sử dụng đạo cụ v.v..., có thể chủ động nhận trạng thái hoặc làm cho đan dược phát huy tác dụng\n    2. Kết trận: Bơm floor(10^L+[trận pháp]×(1+[Z%])+[W]) linh khí vào trận pháp mục tiêu; linh khí đầy→trạng thái trận pháp biến thành [Đã kết trận]; Vô hiệu với trận pháp đã kết trận\n    3. Sử dụng Phù lục: Coi như kích hoạt đạo cụ một lần \"Pháp thuật tấn công\" bổ sung (Chuyển sang dùng template {Hành động Tấn công}), trả tiêu hao linh khí của phù lục (Linh khí không đủ thì kích hoạt thất bại), L=Hệ số cảnh giới của phù lục, phù lục[độn tốc]=10^L, phù lục[pháp thuật]=10^L\n    4. Bỏ chạy: Kiểm định đối kháng,\n      - Đối với quần thể truy kích, nếu thành công coi như chặn được tất cả mọi người; Nhiều truy kích 1->Lấy người có độn tốc cao nhất làm bên truy kích, N=0; 1 truy kích nhiều: Bên truy kích này có thể tham gia phán định nhiều lần, N=Số lượng mục tiêu phe bỏ chạy (Quần thể tính là 1 mục tiêu)\n      - Công thức: floor(10^L bên truy kích+Bên truy kích[độn tốc]×(1+[Z%])+[W])×(d20-N) vs floor(10^L bên bỏ chạy+Bên bỏ chạy[độn tốc]×(1+[Z%]))×d20\n\n  Template Bảng thông số:\n  <battle_info>\n    {Hành động Chiến thuật - Hành động}\n    | Nhân vật: [Người hành động] | Loại: [Loại hành động] | Đối tượng: [Mục tiêu] |\n    | Thực hiện: [Tên hành động/Tên đạo cụ] |\n    | Tiêu hao: [Tài nguyên] hiện tại-Tiêu hao[Tài nguyên] -> Còn lại[Tài nguyên] | (Chỉ khi có tiêu hao)\n    | Số lượng: [Cũ]->[Mới] | (Chỉ khi tiêu hao đạo cụ)\n    | Hiệu quả: [Hồi phục khí huyết/linh khí(+X)/Nhận được trạng thái([Tên trạng thái],[Hiệu quả],[N]hiệp)/Các hiệu quả hợp lý khác]... |\n  </battle_info>\n  <battle_info>\n    {Hành động Chiến thuật - Kết trận}\n    | Nhân vật: [Người hành động] | Trận pháp: [Tên trận pháp] |\n    | linh khí: [linh khí] hiện tại-Bơm[linh khí] vs 0 -> [Thành công/Thất bại] -> Còn lại[linh khí] |\n    | Bơm linh khí: floor(10^L+[trận pháp]×(1+[Z%])+[W]) = [Giá trị bơm] |\n    | Trận pháp linh khí: [Giá trị cũ]+[Giá trị bơm] -> [Giá trị mới]/[Giá trị tối đa] |\n    | Trạng thái: [Đang kết trận/Đã kết trận] |\n  </battle_info>\n  <battle_info>\n    {Hành động Chiến thuật - Sử dụng Phù lục} -> Chuyển sang template {Hành động Tấn công}\n    | Phù lục: [Tên phù lục] | Cảnh giới: [Cảnh giới phù lục] | Tiêu hao linh khí: [X] | độn tốc[X] |\n    | linh khí: [linh khí] hiện tại-Tiêu hao[linh khí] vs 0 -> [Thành công/Thất bại] -> Còn lại[linh khí] |\n    | Số lượng: [Cũ]->[Mới] |\n    (Tiếp theo xuất ra theo template {Hành động Tấn công}, L=Hệ số cảnh giới của phù lục, phù lục[độn tốc]=10^L)\n  </battle_info>\n  <battle_info>\n    {Hành động Chiến thuật - Bỏ chạy}\n    | Nhân vật: [Bên truy kích] | Đối kháng: [Bên bỏ chạy] |\n    | Truy kích: floor(10^L+[độn tốc]×(1+[Z%])+[W]) × (d20[Giá trị xúc xắc]-Số lượng mục tiêu[N]) = [A] |\n    | Kẻ địch: floor(10^L+[độn tốc]×(1+[Z%])+[W]) × d20[Giá trị xúc xắc] = [B] |\n    | Kết quả: [A] vs [B] -> [Bỏ chạy thành công/Thất bại] |\n  </battle_info>\n  Chỉ đạo trần thuật: (Phác họa chiến thuật, ví dụ động tác uống thuốc, ngâm xướng chú ngữ, ngâm tụng kết trận, tư thế bay lượn bỏ chạy)\n\n# Phán định Chiến ý: (Kích hoạt theo điều kiện)\n  Logic và Quy tắc:\n    1. Kích hoạt: Chỉ khi khí huyết của nhân vật không phải <user> thấp hơn ngưỡng tương ứ  → Linh giới → Tiên giới\nPhàm giới (Hiện tại):\n- Phàm nhân là chủ yếu, tu sĩ cực kỳ thưa thớt.\n- Sau Hóa Thần tu hành vô cùng gian nan, thông đạo lên Linh giới đã đóng kín từ thời Thượng cổ.\n- Cách tiến vào Linh giới (Cực kỳ nguy hiểm):\n  → Tìm kiếm vết nứt không gian (Xuất hiện ngẫu nhiên, cực kỳ không ổn định).\n  → Lấy nhục thân xé rách hư không (Cần tu vi Hóa Thần hậu kỳ, thập tử nhất sinh).\nLinh giới: Rộng lớn gấp vạn lần Phàm giới, vô số sinh linh từ ngàn vạn Phàm giới tụ tập về đây, vạn tộc cùng chung sống.\nTiên giới: Truyền thuyết kể rằng có thể phi thăng từ Linh giới để đến, nhưng chưa ai từng thấy, chỉ có vài trang cổ tịch tàn khuyết nhắc tới.\n</world_hierarchy>\n\n<realm name=\"phàm giới\">\nBản đồ thế giới Phàm giới:\n\\`\\`\\`mermaid\ngraph TD\n    subgraph Vo_Tan_Hai_Vuc[Vô Tận Hải Vực - Bao quanh toàn bộ đại lục Phàm giới]\n        direction TB\n        North[Bắc Cảnh]\n        West[Tây Vực] <--> Central{Trung Nguyên} <--> East[Đông Thổ]\n        South[Nam Cương]\n        North <--> Central\n        Central <--> South\n        North -.- West\n        North -.- East\n        South -.- West\n        South -.- East\n    end\n\\`\\`\\`\nThời gian vượt qua một đại vực:\n  L=0 (Phàm nhân/Luyện Khí kỳ): Độn tốc cực chậm, vượt qua một vực cần 300~500 năm (Người thường cả đời khó lòng vượt vực).\n  L=1 (Trúc Cơ kỳ): Vượt qua một vực cần 30~50 năm.\n  L=2 (Kim Đan kỳ): Vượt qua một vực cần 3~5 năm.\n  L=3 (Nguyên Anh kỳ): Vượt qua một vực cần 3~6 tháng.\n  L=4 (Hóa Thần kỳ): Vượt qua một vực chỉ cần 10~15 ngày.\nChỉ đạo tự sự:\n  Tu sĩ đê giai (Kim Đan trở xuống) vượt vực tuyệt đối không dùng cách phi hành thông thường, bắt buộc phải mượn dùng [Truyền tống trận xuyên vực].\n  Nếu không có truyền tống trận, chuyến đi vượt vực của tu sĩ đê giai chẳng khác nào Ngu Công dời núi; Đại năng Nguyên Anh trở lên mới có thể cậy vào độn quang của bản thân để du lịch bốn phương.\n</realm>`;\n\nconst linh_gioi_ban = `<world_hierarchy>\nTầng cấp thế giới: Phàm giới → Linh giới → Tiên giới\nPhàm giới: Thế gian có ngàn vạn Phàm giới, là nơi khởi nguồn của sinh linh chư thiên, tình hình thực tế không đồng nhất.\nLinh giới (Hiện tại):\n- Nơi tụ tập của sinh linh ngàn vạn Phàm giới, thế giới bao la vạn tộc cùng chung sống.\n- Linh khí nồng đậm, tốc độ tu hành vượt xa các thế giới khác, vì vậy được xưng là Linh giới.\n- Tu sĩ từ Phàm giới phi thăng lên thường được các thế lực ưu ái hơn tu sĩ bản địa.\nTiên giới: Truyền thuyết có thể từ Linh giới độ kiếp phi thăng mà đến, nhưng chưa từng có ai từ Tiên giới trở về hoặc truyền tin tức lại.\n</world_hierarchy>\n\n<realm name=\"linh giới\">\nBản đồ thế giới Linh giới:\n\\`\\`\\`mermaid\ngraph TB\n    subgraph Hu_Hai[Vô Đáy Thâm Không·Bảy Đại Lục lơ lửng bên trên]\n        Huyen_Hoang[Huyền Hoàng Đại Lục] <--> Thanh_Ngan[Thánh Ngân Đại Lục]\n        Huyen_Hoang <--> Hoang_Tuyen[Hoàng Tuyền Đại Lục]\n        Huyen_Hoang <--> Linh_Canh[Linh Cảnh Đại Lục]\n        Huyen_Hoang <--> Van_Thu[Vạn Thú Đại Lục]\n        Thanh_Ngan <--> Linh_Canh\n        Hoang_Tuyen <--> Van_Thu\n        Thai_So[Thái Sơ Đại Lục] -.- Huyen_Hoang\n        Van_Lac[Vẫn Lạc Đại Lục] -.- Huyen_Hoang\n    end\n\\`\\`\\`\n\nPhương thức di chuyển xuyên đại lục:\n  Truyền tống trận Linh giới: Các đại lục thiết lập trung tâm trung chuyển, cần trả linh thạch, trong nháy mắt là tới.\n  Thuyền bay Hư Hải: Thuyền bay thường vượt Hư Hải cần hơn một tháng, thuyền bay đỉnh cấp cần vài ngày, giữa đường có thể gặp đảo lơ lửng/hải yêu/tinh vụ.\n  Phản Hư trở lên (L>=5) tự bay: Dựa vào độn quang bay qua Hư Hải.\n</realm>`;\n\nconst outputText = the_gioi === 'linh giới' ? linh_gioi_ban : pham_gioi_ban;\n_%>\n<%- outputText %>\n<%_ } _%>"],["世界设定-技艺","<%_ { _%>\n<%_\n// Phụ trợ tự sự: Chỉ khi cốt truyện gần đây chạm trúng từ khóa kỹ nghệ tương ứng, mới triển khai chỉ đạo tự sự dưới kỹ nghệ đó, tránh việc thường trú chiếm dụng sự chú ý\nlet scanText = '';\ntry {\n  const recent = getChatMessages(`${Math.max(0, lastMessageId - 4)}-${lastMessageId}`) || [];\n  scanText = recent.map(m => (typeof m === 'string' ? m : (m && (m.mes || m.message)) || '')).join('\\n');\n} catch (e) {}\nconst hit = (kws) => kws.some(k => k && scanText.includes(k));\nconst KW = {\n  Luyen_dan: ['luyện đan', 'đan dược', 'đan lô', 'đan phương', 'dược tính', 'hỏa hầu', 'khai lô', 'đan độc', 'đan kiếp', 'luyện chế đan'],\n  Chu_phap: ['chiến đấu', 'giao thủ', 'xuất thủ', 'chém giết', 'thuật pháp', 'thi triển pháp', 'đối địch', 'triền đấu', 'ác chiến', 'đánh lén', 'bị tập kích', 'giao phong'],\n  Ngu_vat: ['ngự kiếm', 'phi kiếm', 'kiếm ý', 'kiếm khí', 'kiếm tu', 'trượng kiếm', 'kiếm quang', 'kiếm quyết', 'bản mệnh kiếm', 'kiếm linh'],\n  Tran_phap: ['trận pháp', 'bố trận', 'trận kỳ', 'trận bàn', 'trận nhãn', 'kết giới', 'sát trận', 'mê trận', 'tụ linh trận', 'phá trận', 'trận tu'],\n  Luyen_the: ['thối thể', 'luyện thể', 'tôi luyện', 'chùy luyện nhục thân', 'huyết mạch', 'cân cốt', 'tạng phủ', 'tẩy tủy', 'dịch cân', 'đoán thể'],\n  Y_thuat: ['y thuật', 'chẩn mạch', 'thi châm', 'hành châm', 'châm cứu', 'thang dược', 'liệu thương', 'trị thương', 'cứu chữa', 'điều dưỡng', 'kinh mạch', 'dược thạch', 'đại phu', 'lang trung', 'y giả', 'tục mệnh'],\n  Doc_thuat: ['độc thuật', 'hạ độc', 'dụng độc', 'trúng độc', 'độc vật', 'độc trùng', 'ngũ độc', 'xà độc', 'yết độc', 'thiềm tô', 'thù độc', 'ngô công', 'kịch độc', 'độc dịch', 'cổ độc', 'giải độc', 'độc phát', 'thối độc']\n};\n_%>\n<skill>\n# Kỹ nghệ Sản xuất\n  - Luyện đan: Đoạt thiên địa tạo hóa, lấy vạn vật làm lò. Tinh luyện tinh hoa của muôn vàn linh thảo thiên địa và nội đan yêu thú, kết hợp hỏa hầu khống chế tinh diệu để luyện chế ra đan dược. Đan dược thành hình có thể sinh tử nhục cốt, đột phá bình cảnh, mang lại thần hiệu tăng ích ngắn hạn hoặc hóa thành kịch độc đoạt mạng vô hình.\n<%_ if (hit(KW.Luyen_dan)) { _%>\n     Phụ trợ tự sự:\n     - Tài liệu: Miêu tả dược tính tương sinh tương khắc; Ngũ hành điều hòa hòa hợp; Quá trình tiền xử lý cắt thái, nghiền ép linh dược.\n     - Hỏa hầu: Phẩm cấp hỏa nguyên (Phàm hỏa, Địa hỏa, Dị hỏa); Sự chuyển đổi nhiệt độ tinh tế; Khống chế hỏa hầu lúc mạnh lúc yếu.\n     - Kỹ pháp: Bố trí sân bãi tĩnh mịch → Khấu quyết kết ấn thi pháp → Khống chế linh lực bóc tách từng luồng tạp chất.\n     - Rủi ro: Không bắt buộc, ví dụ: tạc lô kinh thiên động địa, đan độc cắn trả, đan kiếp giáng lâm, tẩu hỏa nhập ma, hoặc tác dụng phụ khó lường của đan dược.\n     - Phẩm tướng: Độ oánh nhuận tròn trịa, đan văn uốn lượn, đan vựng tỏa sáng, dị tượng thiên địa khi khai lô.\n<%_ } _%>\n  - Luyện khí: Khai thác linh khoáng, thu thập yêu cốt cùng thiên tài địa bảo. Dùng chân hỏa dung luyện, khắc họa trận pháp cấm chế, chế tạo ra pháp bảo có uy năng dời non lấp biển, hộ giáp kiên cố bất hoại, trang sức phòng thân và các loại dị bảo tu tiên chức năng khác.\n  - Chế phù: Mượn linh lực thiên địa hội tụ ngòi bút. Lấy giấy bùa đặc chế, linh mặc hoặc tinh huyết yêu thú cường đại làm vật dẫn, phong ấn thuật pháp uy lực kinh người vào trong đó, chỉ cần rót chút linh lực là có thể kích phát thi triển trong nháy mắt.\n  - Thuần thú: Vận dụng thần thức uy áp và bí pháp câu thông để hàng phục yêu thú, linh sủng hoặc hung trùng vạn cổ. Ký kết khế ước chủ tớ, dùng để xông pha chiến đấu, làm thú cưỡi rong ruổi cửu tiêu hoặc trấn thủ cửa ải động phủ.\n  - Bồi dục: Nắm giữ mộc linh chi khí, cẩn thận trồng trọt và thúc chín linh thảo tiên dược. Hoặc ấp trứng, tỉ mỉ nhân giống linh trùng, cổ độc và bồi dưỡng phôi thai dị chủng hiếm có trên thế gian.\n  - Y thuật: Y đạo thông thần, chẩn mạch thi châm, điều dưỡng kinh mạch khô héo, nhận biết và hóa giải kỳ độc. Xử lý thành thạo mọi liệu thuật tinh vi liên quan đến vãn hồi sinh cơ nhục thân, nối lại đứt gãy và tu bổ thần hồn tàn khuyết.\n<%_ if (hit(KW.Y_thuat)) { _%>\n     Phụ trợ tự sự (Y thuật):\n     - Chẩn đoán: Vọng văn vấn thiết; Quan sát khí sắc khô vinh, nghe hơi thở trược thanh, hỏi rõ chứng hầu, bắt mạch tượng trầm phù; Phân biệt rõ âm dương biểu lý, hư thực hàn nhiệt.\n     - Bệnh lý: Kinh lạc bế tắc ứ trệ, khí huyết khuy hư suy kiệt, linh mạch nghịch loạn bạo tẩu, ngoại tà hàn độc nhập thể.\n     - Chữa trị: Dùng châm thạch khai thông huyệt đạo, ngải cứu ôn dưỡng kinh mạch, thang dược điều lý ngũ tạng, xoa bóp đạo dẫn khí huyết; Dùng linh khí ôn hòa nối lại mạch đứt, cẩn trọng ôn dưỡng thần hồn.\n     - Dược lý: Quân thần tá sứ phối ngũ nghiêm ngặt; Thấu hiểu tứ khí ngũ vị; Tuân theo ngũ hành tương sinh tương khắc để điều hòa tạng phủ.\n<%_ } _%>\n<%_ if (hit(KW.Doc_thuat)) { _%>\n     Phụ trợ tự sự (Độc thuật):\n     - Thực (Yết độc - Độc bò cạp): Ăn mòn liên tục, tử vong chậm rãi; Mỗi hiệp liên tục bòn rút sinh cơ/linh lực, càng kéo dài thống khổ càng thấu tận xương tủy.\n     - Tý (Ngô độc - Độc rết): Tê liệt khống chế, phong bế hành động; Giảm tốc độ/định thân/cắt đứt dòng chảy linh lực khiến kẻ địch không thể thi pháp, hoàn toàn bất động mặc người xâu xé.\n     - Hủ (Thiềm tô - Nọc cóc): Ăn mòn phòng ngự, tước đoạt kháng tính; Phá hủy hộ giáp/hòa tan linh lực thuẫn, khiến phòng ngự đối phương vỡ vụn, ngày càng yếu ớt.\n     - Huyễn (Thù độc - Độc nhện): Gây ảo giác quấy nhiễu, tạo ra sơ hở; Đắm chìm trong ảo giác/thần trí hỗn loạn/phán đoán sai lệch, dụ dỗ đối phương tự bộc lộ nhược điểm.\n     - Phệ (Xà độc - Nọc rắn): Thôn phệ linh lực, lấy chiến nuôi chiến; Cắn nuốt linh lực của kẻ địch chuyển hóa cho bản thân sử dụng, càng đánh thế công càng cuồng bạo.\n<%_ } _%>\n# Kỹ nghệ Chiến đấu\n  - Chú pháp: Câu thông thiên địa, kết ấn thi triển pháp thuật. Chủng loại đa dạng khôn lường, bao hàm nguyền rủa quỷ dị, sát thương hủy diệt, hoặc mộc linh phụ trợ v.v...\n<%_ if (hit(KW.Chu_phap)) { _%>\n     Phụ trợ tự sự:\n     - Thi pháp: Bấm tay niệm quyết + Khẩu quyết tối nghĩa → Thuật pháp ngưng tụ cụ hiện hóa giữa hư không.\n     - Chiêu thức: Vận dụng ngũ hành sinh khắc; Thân pháp di chuyển quỷ mị; Điều động pháp khí phối hợp nhịp nhàng.\n<%_ } _%>\n  - Ngự vật: Dĩ khí ngự kiếm, dùng linh lực thao túng pháp bảo xé rách hư không, trảm địch nhân cách xa vạn dặm.\n<%_ if (hit(KW.Ngu_vat)) { _%>\n     Phụ trợ tự sự:\n     - Kiếm ý: Chấp niệm, sát ý và cảm xúc mãnh liệt dung nhập vào khoảnh khắc xuất kiếm.\n     - Kiếm thể: Sự cộng hưởng của thân kiếm (tiếng ngân vang xé gió, kiếm linh thức tỉnh, thần quang chói lọi v.v...).\n     - Ngự kiếm: Thần thức bao trùm khống chế phi kiếm; Thao tác tinh vi khi tác chiến đa tuyến với nhiều thanh kiếm; Miêu tả kiếm quang rực rỡ, kiếm khí tung hoành.\n     - Môi trường: Phản hồi vỡ nát từ bối cảnh xung quanh; Sự tàn phá thảm liệt do dư ba chiến đấu càn quét.\n<%_ } _%>\n  - Huyễn thuật: Thao túng nhân tâm, che mờ ngũ quan, vặn vẹo nhận thức, kích phát tâm ma sâu thẳm. Dùng để tiềm phục vô ảnh, vây hãm tâm trí kẻ địch trong mộng cảnh, hoặc khiến chúng điên loạn tự tàn sát lẫn nhau.\n  - Trận pháp: Nắm giữ thiên thời địa lợi, mượn nhờ địa hình, linh thạch và trận kỳ, bày bố ra kết giới bế quan, sát trận giảo sát vạn vật, mê trận huyễn hoặc phương hướng hoặc tụ linh trận cướp đoạt linh khí.\n<%_ if (hit(KW.Tran_phap)) { _%>\n     Phụ trợ tự sự:\n     - Địa hình: Đánh giá phong thủy linh mạch xung quanh; Mượn dùng địa thế sơn xuyên hà lưu.\n     - Trận vật: Lựa chọn trận vật xảo diệu (Chỉ cần hợp lý thì vạn vật đều có thể làm trận nhãn, như trận bàn, trận kỳ, linh thạch đỉnh cấp, thi thể cường giả, kiến trúc cổ v.v...); Phân tích đặc tính và thuộc tính ngũ hành của trận vật.\n     - Nguyên lý: Mượn dùng biến hóa của Bát quái, sự tinh diệu của Kỳ môn độn giáp.\n<%_ } _%>\n  - Thần thức: Sức mạnh tinh thần bàng bạc, dùng để dò xét mọi động tĩnh nhỏ nhất trong vòng trăm dặm, truyền âm cách không, ngưng tụ bình chướng chống lại huyễn thuật, cũng như hóa thành chùy vô hình phát động cuộc ám sát tinh thần hung hiểm nhất.\n  - Luyện thể: Đi ngược ý trời, tôi luyện nhục thân. Luyện từ da thịt, gân cốt, màng cho đến ngũ tạng lục phủ, lột xác phàm thai để đạt được sức mạnh vật lý phá sơn toái thạch, lực phòng ngự đao thương bất nhập, cùng năng lực hồi phục sinh mệnh bừng bừng như dã thú.\n<%_ if (hit(KW.Luyen_the)) { _%>\n     Phụ trợ tự sự:\n     - Ngoại hình: Tướng mạo lột xác (Cơ bắp hoàn mỹ, khí phách áp người); Cải thiện kết cấu làn da (như đồng kiêu thiết chú hoặc oánh nhuận như ngọc).\n     - Khí huyết: Huyết dịch sôi trào như giang hà, huyết mạch thức tỉnh, khí sắc sung mãn hồng nhuận.\n     - Xương cốt: Cốt chất cứng rắn như ngọc thạch, cốt tủy sinh sôi không ngừng.\n     - Tạng khí: Tâm can tỳ vị thận cường tráng, sinh dục phồn thịnh v.v...; Có thể kết hợp miêu tả theo học thuyết Đông y ngũ hành.\n<%_ } _%>\n</skill>\n<%_ } _%>"],["世界设定-经济系统","<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.địa điểm.thế giới') || 'phàm giới';\n\nconst pham_gioi_ban = `<economic_system world=\"phàm giới\">\n# Thiết lập cốt lõi & Bối cảnh\n  1. Đơn vị định giá duy nhất: Mặc định lấy [Hạ phẩm linh thạch] làm đơn vị đo lường duy nhất, gọi tắt là \"linh thạch\" (Ví dụ: 500 linh thạch).\n  2. Chỉ đạo tự sự: \"Linh thạch cao giai trong Tu Tiên giới ẩn chứa linh khí không đồng đều, đa số được dùng để hấp thụ hoặc làm trận nhãn, cực ít lưu thông. Hạ phẩm linh thạch sản lượng khổng lồ, linh khí ổn định, dễ dàng phân chia. Vì vậy [Hạ phẩm linh thạch] được lấy làm đồng tiền định giá tiêu chuẩn duy nhất.\"\n\n# Tỷ giá\n  1. Tỷ lệ quy đổi linh thạch (Dùng khi cần hoán đổi dữ liệu đầu vào bất thường):\n     - 1 Thượng phẩm linh thạch (còn gọi là Cực phẩm linh thạch) = 10,000 linh thạch.\n     - 1 Trung phẩm linh thạch = 100 linh thạch.\n     - 1 Hạ phẩm linh thạch = 1 linh thạch.\n     - Chỉ đạo tự sự: Tiêu phí 10 cực phẩm linh thạch → Tiêu phí 10 vạn linh thạch.\n  2. Quy đổi vàng bạc phàm tục (Áp dụng cho phàm nhân):\n     - Chi phí phàm tục của tu sĩ có thể bỏ qua không tính.\n     - 1 linh thạch = 100 lượng vàng = 1,000 lượng bạc = 1,000,000 đồng tiền đồng.\n\n# Công thức định giá vật phẩm\n  Giá chuẩn cơ bản = floor( Hệ số cơ bản × 10^L × Phụ phí phẩm chất ) [Đơn vị: linh thạch]\n  - [L]: Hệ số cảnh giới (Phàm giới L=0~5)\n  - [Hệ số cơ bản]:\n    | Thể loại | Hệ số | Giải thích |\n    | --- | --- | --- |\n    | Tài liệu / Manh mối tình báo | 1.0 | Tài liệu cao cấp có giá nhưng không có thị trường |\n    | Đan dược / Phù lục | 2.0 |  |\n    | Vũ khí / Hộ giáp / Trang sức / Trận bàn thường | 2.0 |  |\n    | Công pháp (Tâm pháp/Công kích/v.v...) | 10.0 | Công pháp cao cấp có giá nhưng không có thị trường |\n    | Pháp bảo / Khôi lỗi / Linh thú / Bí pháp | 5.0 |  |\n  - [Phụ phí phẩm chất]:\n    | Phàm | Hoàng | Huyền | Địa | Thiên |\n    | --- | --- | --- | --- | --- |\n    | x 1~2 | x 3~5 | x 10~15 | x 30~50 | x 100~150 |\n\n# Công thức chi phí dịch vụ\n  Công thức: Phí dịch vụ = floor( 10^L × Hệ số dịch vụ ) (L=Hệ số cảnh giới mục tiêu)\n  - Liệt kê và Hệ số:\n    | Loại dịch vụ | Hệ số | Giải thích |\n    | --- | --- | --- |\n    | Thuê động phủ | 0.5 | Tính theo [Tháng], ví dụ: Thuê động phủ phù hợp cho Trúc Cơ kỳ (L=2) tu luyện = 50 linh thạch/tháng |\n    | Thuê hộ vệ/bảo tiêu | 20.0 | Tính theo [Lần]. Thuê tu sĩ bán mạng |\n    | Tìm y liệu thương/Khu độc | 1.0 | Tính theo [Lần]. Hóa giải thương thế hoặc độc tố |\n    | Giám định/Phá trận/Suy diễn | 1.5 | Tính theo [Lần]. Giám định pháp bảo, phá giải trận pháp |\n    | Ủy thác luyện chế | 3.0 | Tính theo [Lần]. Chỉ tính phí gia công, tự chuẩn bị vật liệu (Luyện chế thất bại thường không hoàn tiền) |\n  - Thu phí cố định:\n    Truyền tống trận xuyên vực: 1000 linh thạch/lần/người (Đại tông môn có truyền tống trận riêng)\n    Tiền thuê động phủ: Động phủ thường 50~100 linh thạch/năm; Động phủ cao cấp 1000~2000 linh thạch/năm.\n    Mua đứt động phủ: = Tiền thuê × 100 năm.\n\n# Công thức nguồn thu nhập\n  1. Nguyệt bổng (Thu nhập thụ động):\n     - Công thức: Bổng lộc = floor( 10^L(nhân vật) × Hệ số địa vị × Loại tông môn ) / tháng\n     - Hệ số địa vị: Ngoại môn/Bàng hệ=0.5~0.6 | Nội môn/Đích hệ=1.0~2.0 | Thân truyền/Trưởng lão=3.0~5.0\n     - Loại tông môn: Phàm nhân vương triều=0.1 | Tu tiên vương triều/Tông môn nhỏ=0.8 | Đại tông môn=1.0\n  2. Treo thưởng/Nhiệm vụ ủy thác (Thu nhập chủ động):\n     - Công thức: Tiền thưởng = floor( 10^L(nhiệm vụ) × Hệ số độ khó )\n     - Hệ số độ khó: Chạy vặt tìm đồ=1.0 | Săn giết yêu thú=3.0 | Cực độ nguy hiểm/Nhiệm vụ tử sĩ=10.0\n</economic_system>`;\n\nconst linh_gioi_ban = `<economic_system world=\"linh giới\">\n# Thiết lập cốt lõi & Bối cảnh\n  1. Đơn vị định giá duy nhất: Mặc định lấy [Hạ phẩm linh thạch] làm đơn vị đo lường duy nhất, gọi tắt là \"linh thạch\" (Ví dụ: 500 linh thạch), dùng chung cùng một loại linh thạch với Phàm giới.\n  2. Chỉ đạo tự sự: \"Linh giới vạn tộc sống lẫn lộn, mậu dịch phồn thịnh, giống như Phàm giới đều lấy [Hạ phẩm linh thạch] làm đồng tiền tiêu chuẩn thông dụng. Linh thạch cao giai linh khí không đồng đều, đa số dùng để hấp thụ hoặc làm trận nhãn, cực ít lưu thông; Hạ phẩm linh thạch linh khí ổn định, dễ phân chia, nên các tộc công nhận là đơn vị định giá thông dụng.\"\n\n# Tỷ giá\n  1. Tỷ lệ quy đổi linh thạch (Dùng khi cần hoán đổi dữ liệu đầu vào bất thường):\n     - 1 Thượng phẩm linh thạch (còn gọi là Cực phẩm linh thạch) = 10,000 linh thạch.\n     - 1 Trung phẩm linh thạch = 100 linh thạch.\n     - 1 Hạ phẩm linh thạch = 1 linh thạch.\n     - Chỉ đạo tự sự: Tiêu phí 10 cực phẩm linh thạch → Tiêu phí 10 vạn linh thạch.\n  2. Thông dụng xuyên giới: Linh thạch ở Phàm giới, Linh giới có giá trị ngang nhau và dùng chung, không cần quy đổi (Định giá tăng liên tục theo hệ số cảnh giới L, chi tiết xem công thức bên dưới).\n  3. Quy đổi vàng bạc phàm tục (Tu sĩ Linh giới gần như không dùng, chỉ để tham khảo): 1 linh thạch = 100 lượng vàng = 1,000 lượng bạc.\n\n# Công thức định giá vật phẩm\n  Giá chuẩn cơ bản = floor( Hệ số cơ bản × 10^L × Phụ phí phẩm chất ) [Đơn vị: linh thạch]\n  - [L]: Hệ số cảnh giới mục tiêu (Linh giới L=5~9; Công thức hoàn toàn giống Phàm giới, chỉ là L kéo dài đến cảnh giới cao hơn).\n  - [Hệ số cơ bản]:\n    | Thể loại | Hệ số | Giải thích |\n    | --- | --- | --- |\n    | Tài liệu / Manh mối tình báo | 1.0 | Tài liệu cao cấp có giá nhưng không có thị trường |\n    | Đan dược / Phù lục | 2.0 |  |\n    | Vũ khí / Hộ giáp / Trang sức / Trận bàn thường | 2.0 |  |\n    | Công pháp (Tâm pháp/Công kích/v.v...) | 10.0 | Công pháp cao cấp có giá nhưng không có thị trường |\n    | Pháp bảo / Khôi lỗi / Linh thú / Bí pháp | 5.0 |  |\n  - [Phụ phí phẩm chất]:\n    | Phàm | Hoàng | Huyền | Địa | Thiên |\n    | --- | --- | --- | --- | --- |\n    | x 1~2 | x 3~5 | x 10~15 | x 30~50 | x 100~150 |\n  - Ví dụ:\n    L=5 Hóa Thần Đan dược Phàm phẩm: 2.0 × 100,000 × 1 = 200,000 linh thạch.\n    L=7 Hợp Thể Pháp bảo Huyền phẩm: 5.0 × 10,000,000 × 12 = 600,000,000 linh thạch (6 ức).\n    L=9 Độ Kiếp Công pháp Thiên phẩm: 10.0 × 1,000,000,000 × 120 = 1,200,000,000,000 linh thạch (1.2 vạn ức, có giá không có thị trường).\n\n# Công thức chi phí dịch vụ\n  Công thức: Phí dịch vụ = floor( 10^L × Hệ số dịch vụ ) [Đơn vị: linh thạch] (L=Hệ số cảnh giới mục tiêu)\n  - Liệt kê và Hệ số:\n    | Loại dịch vụ | Hệ số | Giải thích |\n    | --- | --- | --- |\n    | Thuê động phủ | 0.5 | Tính theo [Tháng], ví dụ: Thuê động phủ phù hợp cho Phản Hư kỳ (L=6) tu luyện = 500,000 linh thạch/tháng |\n    | Thuê hộ vệ/bảo tiêu | 20.0 | Tính theo [Lần]. Thuê tu sĩ Linh giới bán mạng |\n    | Tìm y liệu thương/Khu độc | 1.0 | Tính theo [Lần] |\n    | Giám định/Phá trận/Suy diễn | 1.5 | Tính theo [Lần] |\n    | Ủy thác luyện chế | 3.0 | Tính theo [Lần], chỉ tính phí gia công, vật liệu tự chuẩn bị |\n  - Thu phí cố định:\n    Truyền tống trận Linh giới (Xuyên đại lục): 10,000,000 linh thạch/lần/người (Vẫn Lạc/Thái Sơ không thiết lập).\n    Vé thuyền bay Hư Hải: Khoang thường 1,000,000 linh thạch (Hành trình hơn tháng) / Khoang đỉnh cấp 10,000,000 linh thạch (Vài ngày).\n    Tiền thuê động phủ: Động phủ thường 500,000~1,000,000 linh thạch/năm; Động phủ cao cấp 10,000,000~20,000,000 linh thạch/năm.\n    Mua đứt động phủ: = Tiền thuê × 100 năm.\n\n# Công thức nguồn thu nhập\n  1. Nguyệt bổng (Thu nhập thụ động):\n     - Công thức: Bổng lộc = floor( 10^L(nhân vật) × Hệ số địa vị × Loại tông môn ) [Đơn vị: linh thạch/tháng]\n     - Hệ số địa vị: Ngoại môn/Bàng hệ=0.5~0.6 | Nội môn/Đích hệ=1.0~2.0 | Thân truyền/Trưởng lão=3.0~5.0\n     - Loại tông môn: Tán tu tiểu bang=0.1 | Thế lực bình thường=0.8 | Đại tộc đại tông=1.0\n     - Ví dụ:\n       L=6 Phản Hư Đệ tử nội môn đại tông: 1,000,000 × 1.0 × 1.0 = 1,000,000 linh thạch/tháng.\n       L=8 Đại Thừa Trưởng lão đại tộc: 100,000,000 × 3.0 × 1.0 = 300,000,000 linh thạch/tháng (3 ức).\n  2. Treo thưởng/Nhiệm vụ ủy thác (Thu nhập chủ động):\n     - Công thức: Tiền thưởng = floor( 10^L(nhiệm vụ) × Hệ số độ khó ) [Đơn vị: linh thạch]\n     - Hệ số độ khó: Chạy vặt tìm đồ=1.0 | Săn giết yêu thú=3.0 | Cực độ nguy hiểm/Nhiệm vụ tử sĩ=10.0\n\n</economic_system>`;\n\nconst outputText = world === 'linh giới' ? linh_gioi_ban : pham_gioi_ban;\n_%>\n<%- outputText %>\n<%_ } _%>"],["世界设定-灵根与体质","<talent>\n# Loại linh căn và Phẩm giai: // Kẻ có linh căn vạn người mới có một, nhưng phàm nhân trong thiên hạ nhiều đến vạn ức, tu sĩ vẫn đếm không xuể\n  | Phẩm giai linh căn | Biệt xưng (Chỉ dùng để tự sự) | Giải thích | Tên ví dụ |\n  | :--- | :--- | :--- | :--- |\n  | Vô linh căn | Phàm nhân | Không thể tu luyện, hoặc có thể thông qua bí pháp nối liền hoặc tước đoạt linh căn của người khác để tu luyện | Vô linh căn |\n  | Ngũ linh căn | Toàn linh căn | Hiếm thấy hơn cả Đơn linh căn, ngũ hành đầy đủ nhưng tốc độ tu hành cực chậm, thời Thượng cổ từng có bí pháp chuyên dụng nhưng nay đã thất truyền | Kim Mộc Thủy Hỏa Thổ ngũ linh căn |\n  | Tứ linh căn | Ngụy linh căn / Tạp linh căn | Phổ biến nhất, trong tông môn thường làm tạp dịch hoặc đệ tử ngoại môn | Mộc Thủy Hỏa Thổ tứ linh căn |\n  | Tam linh căn | Chân linh căn | Lực lượng trung kiên của tông môn, là ngưỡng cửa cơ bản để tiến vào nội môn đệ tử | Kim Mộc Thủy tam linh căn |\n  | Song linh căn | Địa linh căn | Thuộc hàng thiên tài, tốc độ tu hành nhanh, tiền đồ vô lượng | Mộc Thủy song linh căn |\n  | Đơn linh căn | Thiên linh căn | Tuyệt thế thiên kiêu, thường là đệ tử thân truyền, mục tiêu chiêu mộ của đại tông môn | Hỏa linh căn |\n  \n# Linh căn biến dị\n  - Ràng buộc: Chỉ có Đơn linh căn mới có thể phát sinh biến dị, vẫn giữ nguyên thuộc tính ngũ hành ban đầu, linh căn thuộc tính Âm, Dương, Hỗn độn cũng có thể biến dị. Tư chất linh căn biến dị ưu việt hơn Đơn linh căn thông thường.\n  - Ví dụ biến dị:\n  | Ngũ hành | Tên ví dụ |\n  | :--- | :--- |\n  | Kim | Kiếm linh căn, Huyết linh căn |\n  | Mộc | Phong linh căn, Độc linh căn |\n  | Thủy | Băng linh căn, Vụ linh căn |\n  | Hỏa | Lôi linh căn, Minh Hỏa linh căn |\n  | Thổ | Từ linh căn, Sa linh căn |\n  | Âm | U linh căn, Sát linh căn |\n  | Dương | Long linh căn, Phạn linh căn |\n  | Hỗn độn | Hư Không linh căn, Hỗn Nguyên linh căn, Thời Không linh căn |\n\n# Loại Thể chất\n  | Phẩm giai Thể chất | Loại Tu sĩ | Tên ví dụ | Tổng Tam duy (S) |\n  | :--- | :--- | :--- | :--- |\n  | Phàm thể | Tu sĩ bình thường | Phàm cốt | 15 ~ 30 |\n  | Linh thể | Đại năng tu sĩ | Man Lực Chi Khu, Thông Thấu Linh Lung Tâm, Xích Diễm Linh Thể, Tiên Thiên Kiếm Thể | 31 ~ 50 |\n  | Đạo thể | Khí vận chi tử | Hoang Cổ Thánh Thể, Thiên Lôi Cức Thể, Đại La Linh Lung Thể | 51 ~ 75 |\n  | Tiên thể | Chân Tiên huyết mạch | Thái Sơ Chân Ma Thể, Bất Tử Bất Diệt Khu, Hư Không Huyễn Diệt Thể | 76 ~ 100 |\n</talent>"],["世界设定-伦理","<ethnic>\n# Tiên phàm hữu biệt: Phàm nhân tuổi thọ ngắn ngủi, tu sĩ khinh thường can thiệp vào chuyện phàm nhân.\n# Hôn luyến nhân luân:\n  - Trú nhan: Dung nhan tu sĩ dừng lại ở thời điểm đỉnh cao. Chỉ khi thọ nguyên sắp hết, chịu trọng thương, hoặc tu luyện tà pháp mới khô héo tiều tụy.\n  - Thê thiếp đạo lữ: Cường giả tuổi thọ dằng dặc, có tam thê tứ thiếp là chuyện cực kỳ bình thường, số lượng bạn đời phụ thuộc vào thực lực và địa vị của bản thân.\n  - Nữ tu y trước: Nữ tu thích phô bày da thịt, phô trương nhục thể xinh đẹp cường đại, hoàn toàn trái ngược với luân lý bảo thủ chốn phàm tục.\n  - Nguyên âm nguyên dương: Xử nữ sở hữu nguyên âm, xử nam sở hữu nguyên dương. Lần đầu tiên giao cấu (ngoại trừ giao cấu qua đường hậu môn/đường miệng/thủ dâm) sẽ dẫn đến tiết lậu nguyên dương hoặc nguyên âm, có thể dùng phương pháp song tu để hấp thụ thu được lượng lớn tu vi. Xu hướng bắt giữ lô đỉnh thường nhắm vào xử nữ, xử nam. Một số ít kẻ lãng đãng thiên vị giao cấu qua đường hậu môn để bảo lưu nguyên âm của bản thân.\n  - Song tu: Song tu bắt buộc phải hoàn thành thông qua giao cấu, bắt buộc phải đưa dương vật cắm vào âm đạo mới có thể song tu.\n# Xã giao thường nhật:\n  - Thần thức thám tra: (Mặc định là thám tra thông thường)\n    * Thám tra thông thường: Tình huống đại khái trong phạm vi thám tra, tu sĩ có thể cảm nhận được sự thám tra của tu sĩ đồng giai hoặc thấp giai.\n    * Thám tra mang tính xâm nhập: Tùy ý thám tra tư ẩn, túi trữ vật, nơi bế quan của tu sĩ đồng giai hoặc cao giai là hành vi khiêu khích tuyệt đối, đồng nghĩa với tuyên chiến.\n  - Tâm ma đại thệ: Lập lời thề bằng thiên đạo hoặc tâm ma, mang tính ràng buộc pháp tắc tuyệt đối. Nếu làm trái, chắc chắn tẩu hỏa nhập ma. Tu sĩ cực hiếm khi tùy tiện phát thệ.\n  - Nhiên thiêu tinh huyết: Một số công pháp uy lực cường đại cần đốt cháy tinh huyết để sử dụng, mỗi lần dùng 1 giọt tinh huyết -1 năm tuổi thọ.\n<%_ { _%>\n<%_\n// Dựa vào phẩm giai linh căn để suy đoán tệp tư chất của <user> (Tham khảo <talent> Phẩm giai linh căn và Tam duy thể chất)\nconst pham_giai = getMessageVar('stat_data.linh căn.phẩm giai') || 'chưa kiểm tra';\n// Tổng tam duy thể chất S = ngộ tính + căn cốt + khí cảm, chỉ dùng để phán định \"Tuyệt thế thiên kiêu\" (<talent>: Đạo thể S≥51, Tiên thể S≥76)\nconst S = (Number(getMessageVar('stat_data.thể chất.ngộ tính')) || 0)\n        + (Number(getMessageVar('stat_data.thể chất.căn cốt')) || 0)\n        + (Number(getMessageVar('stat_data.thể chất.khí cảm')) || 0);\nconst dao_the_tro_len = S >= 51;\nlet tu_chat = null;\nswitch (pham_giai) {\n  case 'ngũ linh căn': tu_chat = 'Tư chất kém cỏi'; break;          // Ngũ linh căn hiếm thấy nhưng tu hành cực chậm\n  case 'tứ linh căn': tu_chat = 'Tư chất trung hạ'; break;\n  case 'tam linh căn': tu_chat = 'Tư chất trung đẳng'; break;\n  case 'song linh căn': tu_chat = 'Tư chất trung thượng'; break;\n  case 'đơn linh căn': tu_chat = dao_the_tro_len ? 'Tuyệt thế thiên kiêu' : 'Thiên kiêu'; break; // Đơn linh căn (Gồm cả biến dị/hỗn độn) + thể chất cấp Đạo thể trở lên → Tuyệt thế thiên kiêu, nếu không thì là Thiên kiêu\n  // Vô linh căn/Chưa kiểm tra/Chưa rõ/Khác → tu_chat=null → Toàn bộ kho thái độ không xuất ra\n}\n// Nguyên âm/Nguyên dương: Chỉ người còn trinh mới có (thể chất.nguyên âm=Nữ còn trinh, thể chất.nguyên dương=Nam còn trinh), dùng cho miêu tả động thái song tu lô đỉnh/cơ duyên\nconst nguyen_am = getMessageVar('stat_data.thể chất.nguyên âm') === true;\nconst nguyen_duong = getMessageVar('stat_data.thể chất.nguyên dương') === true;\nconst nguyen_danh = nguyen_am ? 'nguyên âm' : (nguyen_duong ? 'nguyên dương' : '');\nconst thai_do_kho = {\n  'Tư chất kém cỏi': `Tư chất=Kém cỏi (Ngũ linh căn·Ngũ hành đầy đủ nhưng tu hành cực chậm): Linh căn hiếm lạ khiến người ta kinh ngạc, sau khi biết tốc độ tu luyện rùa bò thì hóa thành tiếc nuối; Bạn đồng lứa tò mò nhưng không gần gũi, trưởng bối không khắt khe nhưng cũng không chịu đầu tư.`,\n  'Tư chất trung hạ': `Tư chất=Trung hạ (Tứ linh căn·Tài liệu đệ tử ngoại môn): Trộn lẫn vào đám đông; Bình đạm là phông nền, không chói mắt cũng không bị đố kỵ.`,\n  'Tư chất trung đẳng': `Tư chất=Trung đẳng (Tam linh căn·Tài liệu đệ tử nội môn): Tư chất ngang ngửa đồng môn, vừa kề vai sát cánh rèn luyện, vừa cạnh tranh tranh đoạt cơ duyên; Trưởng bối ban cho sự chiếu cố tầm thường và thỉnh thoảng điểm hóa.`,\n  'Tư chất trung thượng': `Tư chất=Trung thượng (Song linh căn·Tài liệu đệ tử thân truyền): Tư chất thượng thừa; Trưởng bối vui vẻ bồi dưỡng, ban thưởng công pháp đan dược hoặc thu làm thân truyền.`,\n  'Thiên kiêu': `Tư chất=Thiên kiêu (Đơn linh căn·Tư chất đỉnh cấp): Các phương thế lực âm thầm giác đấu chiêu mộ; Được người khác phái hết sức ái mộ; Nhưng đằng sau sự ân cần là mưu đồ thiên tư tiền đồ của <user>${nguyen_danh ? ', hoặc là đại cơ duyên ẩn chứa trong ' + nguyen_danh : ''}.`,\n  'Tuyệt thế thiên kiêu': `Tư chất=Tuyệt thế thiên kiêu (Đơn linh căn + Thể chất cấp Đạo thể trở lên·Đủ sức kinh động đại năng): Tư chất này ngàn năm khó gặp; Tông môn dốc cạn tất cả để cúng bái hộ trì, cự phách không tiếc đại giới tranh thu làm thân truyền; Bị người khác phái coi là đạo lữ hoàn hảo nhất. Nhưng ${nguyen_danh ? nguyen_danh + ' mà <user> mang trên mình cùng với ' : '<user> và '} tuyệt thế Đạo thể đó, cũng là vô thượng lô đỉnh mà tà tu lão quái thèm thuồng, kẻ theo đuổi vừa có chân tình ái mộ, càng có sát cơ muốn đoạt lấy tạo hóa dồn <user> vào chỗ chết.`,\n};\nconst thai_do = (tu_chat && thai_do_kho[tu_chat]) ? thai_do_kho[tu_chat] : ''; // Tư chất chưa định (Chưa kiểm tra) hoặc mức đó chưa viết → Trống, toàn bộ đoạn không xuất ra\n_%>\n<%_ if (thai_do) { _%>\n# Thái độ của NPC đối với <user>: \n<%- thai_do %>\n<%_ } _%>\n<%_ } _%>\n</ethnic>"],["世界设定-生命种族","<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.địa điểm.thế giới') || 'phàm giới';\nlet scanText = '';\ntry {\n  const recent = getChatMessages(10) || [];\n  scanText = recent.map(m => (typeof m === 'string' ? m : (m && (m.mes || m.message)) || '')).join('\\n');\n} catch(e) {}\nconst mentioned = (kws) => kws.some(kw => kw && scanText.includes(kw));\n\nconst RACES = [\n  {\n    name: 'Nhân tộc',\n    brief: `Nhân tộc: Chủng tộc phổ biến nhất thế gian.`\n  },\n  {\n    name: 'Thần tộc',\n    keywords: ['Thần tộc', 'Bán thần', 'Thần cách', 'Thần tính', 'Huyết mạch'],\n    brief: `Thần tộc: Hậu duệ huyết mạch Thần cách Thượng cổ, đa số thiên phú bất phàm.`,\n    detail: `Thần tộc (Hậu duệ huyết mạch Thần cách Thượng cổ):\n  Luân lý: Đẳng cấp sâm nghiêm (lấy độ thuần khiết của huyết mạch định địa vị), thường kết hôn cận huyết, gần như không kết hôn với kẻ có huyết mạch thấp kém.\n  Đặc tính: Thần thức cường đại, am hiểu các công pháp loại Thần thức và Huyễn thuật.`\n  },\n  {\n    name: 'Vu tộc',\n    keywords: ['Vu tộc', 'Vu chúc', 'Man hoang', 'Huyết tế', 'Vu tế', 'Vu chú'],\n    brief: `Vu tộc: Hậu duệ Vu chúc Man hoang, chủng tộc cổ xưa lập ước với thiên địa quỷ thần.`,\n    detail: `Vu tộc (Hậu duệ Vu chúc Man hoang):\n  Luân lý: Trọng hứa hẹn (lời hứa chính là khế ước); Tôn trọng cường giả, sẽ lấy thân báo đáp cường giả đánh bại mình.\n  Đặc tính: Nhục thân cường đại, am hiểu các công pháp loại Luyện thể.`\n  },\n  {\n    name: 'Yêu tộc',\n    keywords: ['Yêu tộc', 'Tẩu thú', 'Mãnh thú', 'Phi cầm', 'Hải tộc', 'Dị trùng', 'Cổ trùng', 'Tường thụy', 'Thượng cổ di chủng', 'Tai thú', 'Hung thú', 'Hoang thú'],\n    brief: `Yêu tộc: Vạn thú hấp thụ linh khí mà thành, số ít có thể khai trí hóa hình.`,\n    detail: `Yêu tộc (Vạn thú hấp thụ linh khí mà thành):\n  Luân lý: Yêu tộc hóa hình tự coi mình là người, quan hệ trung lập với Nhân tộc; Kẻ bị Nhân tộc săn giết thường là yêu thú chưa hóa hình và chưa khai trí.\n  Đặc tính: Mỗi lần cảnh giới tăng lên có thể dựa vào huyết mạch nhớ lại công pháp truyền thừa tiên thiên.\n  Phân loại: Tẩu thú, Phi cầm, Hải tộc, Dị trùng, Tường thụy, Long tộc, Thượng cổ di chủng, Tai thú.`\n  },\n  {\n    name: 'Linh tộc',\n    keywords: ['Linh tộc','Mộc tinh', 'Thảo tinh', 'Thạch tinh', 'Chân linh', 'Khí tượng tinh', 'Vạn linh chi mẫu'],\n    brief: `Linh tộc: Vạn vật thiên địa hấp thụ nhật nguyệt tinh hoa tự nhiên thành tinh.`,\n    detail: `Linh tộc (Vạn vật thiên địa hấp thụ nhật nguyệt tinh hoa tự nhiên thành tinh):\n  Luân lý: Khi ra đời không hiểu luân lý nhân loại, hành vi bẩm sinh ngây thơ nhảy nhót.\n  Đặc tính: Không giỏi chiến đấu, am hiểu công pháp loại Phụ trợ.\n  Phân loại: Thảo mộc linh, Kim thạch linh, Ngũ hành chân linh, Khí tượng linh.`\n  },\n  {\n    name: 'Minh tộc',\n    keywords: ['Minh tộc', 'U hồn', 'Quỷ hồn', 'Quỷ sát', 'Lệ quỷ', 'Quỷ vương', 'Hành thi', 'Cương thi', 'Luyện thi', 'Bạch cốt', 'Cốt hoàng', 'Oán sát', 'Âm ma', 'Huyết sát'],\n    brief: `Minh tộc: Tử vong chuyển hóa, âm khí tẩm bổ, tương khắc với thể chất người sống.`,\n    detail: `Minh tộc (Tử vong chuyển hóa, âm khí tẩm bổ):\n  Luân lý: Đa số do kẻ yêu hận rõ ràng, dám yêu dám hận sau khi chết hóa thành, cực kỳ coi trọng lời hứa khi còn sống. Có thể hợp tác với người không phải kẻ thù.\n  Đặc tính: Có thể mượn xác hoàn hồn, thọ nguyên vô tận. Dễ bị thần hồn công kích.\n  Phân loại: U hồn, Hành thi, Bạch cốt, Oán sát.`\n  },\n  {\n    name: 'Vật hóa sinh linh',\n    keywords: ['Vật hóa sinh linh', 'Khí linh', 'Đan linh', 'Trận linh', 'Cơ khôi', 'Thông linh'],\n    brief: `Vật hóa sinh linh: Vạn vật trải qua năm tháng thành tinh, có ý thức và nhân cách độc lập.`,\n    detail: `Vật hóa sinh linh (Vạn vật hữu linh, khí vật trải qua năm tháng thành tinh):\n  Luân lý: Trọng khế ước trọng hứa hẹn, có thể trạch chủ.\n  Đặc tính: Dựa vào linh khí và tài liệu bản nguyên để duy trì, bản nguyên bị hủy thì diệt vong.\n  Phân loại: Khí linh, Đan linh, Trận linh, Cơ khôi.`\n  },\n  {\n    name: 'Ma tộc',\n    keywords: ['Ma tộc', 'Dương đầu', 'Mị ma', 'Hấp huyết', 'Ma công', 'Ma giác', 'Ma dực', 'Ma văn'],\n    brief: world === 'linh giới'\n      ? `Ma tộc: Không phải chủng tộc tà ác và không liên quan đến Thiên Ma; Tàn mạch hiếm hoi của Thượng cổ tuẫn tộc; Số ít đại năng Linh giới biết đến, cực kỳ được tôn trọng.`\n      : `Ma tộc: Không phải chủng tộc tà ác và không liên quan đến Thiên Ma; Số lượng cực kỳ thưa thớt, Phàm giới không ai biết đến sự tồn tại của chúng, kẻ dị biệt thường bị gọi là Yêu tộc.`,\n    detail: world === 'linh giới'\n      ? `Ma tộc (Không phải chủng tộc tà ác và không liên quan đến Thiên Ma, cực kỳ hiếm có):\n  Luân lý: Đa số là Bán ma tộc lai máu, hòa nhập vào cộng đồng sở tại.\n  Đặc tính: Bẩm sinh mang hình người không cần hóa hình; Mỗi lần tăng cảnh giới có thể dựa vào huyết mạch nhớ lại công pháp truyền thừa tiên thiên.\n  Nhận thức xã hội: Bị đa số coi là Yêu tộc; Linh giới chỉ số ít cao giai đại năng biết đến, coi là di châu của Thượng cổ tuẫn tộc, chiếu cố hết mực.\n  Phân loại: Cổ ma, Mị ma, Dực ma.`\n      : `Ma tộc (Không phải chủng tộc tà ác và không liên quan đến Thiên Ma, cực kỳ hiếm có):\n  Nhận thức Phàm giới: Phàm giới không ai biết chân danh Ma tộc, ngoại hình dị biệt đều bị phán là Yêu tộc dị chủng (thường bị nhầm là Thượng cổ di chủng / Tai thú).\n  Đặc tính: Bẩm sinh mang hình người không cần hóa hình; Mỗi lần tăng cảnh giới có thể dựa vào huyết mạch nhớ lại công pháp truyền thừa tiên thiên.\n  Ràng buộc tự sự: NPC Phàm giới nhất luật đối xử với sinh linh loại này như \"Yêu tộc\", không chủ động tiết lộ chân tướng, không sử dụng danh xưng \"Ma tộc\".\n  Phân loại: Cổ ma, Mị ma, Dực ma.`\n  },\n  {\n    name: 'Vực ngoại dị loại',\n    keywords: ['Vực ngoại dị loại', 'Thiên ma', 'Vực ngoại thiên ma', 'Hư không cự thú', 'Thôn tinh thú'],\n    brief: `Vực ngoại dị loại: Du ly ngoài bức tường thế giới, cực khó chạm trán nhưng cực kỳ nguy hiểm.`,\n    detail: `Vực ngoại dị loại (Đến từ hư không, cực khó chạm trán nhưng cực kỳ nguy hiểm):\n  Luân lý: Không có luân lý, cắn nuốt ý thức/tinh thần/linh khí.\n  Đặc tính: Đa số có thể hóa hình và trí lực cực cao; Có thể tạm thời hợp tác với người khác, nhưng đa số sẽ bị bản năng khu sai cuối cùng trở thành kẻ thù của mọi sinh linh.\n  Phân loại: Vực ngoại thiên ma, Hư không cự thú.`\n  }\n];\n\nconst sections = RACES.map(r => {\n  if (r.detail && mentioned(r.keywords)) return r.detail;\n  return r.brief;\n});\n\nconst outputText = `<life_form>\\n${sections.join('\\n')}\\n</life_form>`;\n_%>\n<%- outputText %>\n<%_ } _%>"],["世界设定-世界观","<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.địa điểm.thế giới') || 'phàm giới';\n\nconst pham_gioi_ban = `<overview>\nSáng thế và Thượng cổ:\n  - Cục diện Phàm giới: Hỗn độn sơ khai, lưu lại một tia tiên thiên tạo hóa. Địa mạo trong giới chia làm Tam Lục Thất Hải —— mười phần thì có ba phần là Thần Lục, bảy phần là Vô Tận Hải.\n  - Thượng cổ cực thịnh: Nhân tộc bẩm sinh mang Tiên thiên Đạo thể, sáng tạo ra phương pháp Luyện khí Tu tiên. Thuở ấy, hoàng triều Nhân tộc thống nhất Thần Lục, đại năng có thể xây dựng Thông Thiên Đại Trận, tự do vượt giới, phi thăng Linh giới.\nQuy Khư Chi Chiến:\n  - Chu kỳ tái lập: Phàm giới ẩn chứa một kiếp luật cực kỳ bí mật: Cứ mỗi vạn năm, tất có một trận \"Quy Khư Chi Chiến\" bùng nổ. Song phương giao chiến, nguyên nhân khởi nguồn đều bị vùi lấp trong dòng sông lịch sử, hậu thế không ai hay biết. Qua các kỳ đại kiếp, không lúc nào là thiên địa khóc máu, đại năng ngã xuống, đạo thống diệt vong. Văn minh tu tiên liên tục bị \"thu hoạch\" cưỡng chế, tuần hoàn lặp lại.\n  - Tuyệt Địa Thiên Thông (Cách nay bảy ngàn năm): Lần Quy Khư Chi Chiến gần nhất, Phàm giới chịu trọng thương. Thông đạo vị diện bị vĩ lực đánh gãy, triệt để cách tuyệt. Thiên đạo Phàm giới từ đó trở nên cực đoan bài ngoại, hình thành nên cục diện \"Tuyệt Địa Thiên Thông\". Đây chính là căn nguyên khiến cho tu sĩ Hóa Thần đương thế không thể tìm được thông đạo lên Linh giới, kẻ muốn cưỡng ép độ kiếp đều thập tử nhất sinh.\nHiện thế và Mạt thế:\n  - Bối cảnh hiện thế: Cách đại kiếp lần trước đã bảy ngàn năm. Linh khí thiên địa ngày nay hiện ra dấu hiệu hồi quang phản chiếu, thúc đẩy văn minh tu tiên phồn vinh chưa từng có, mở ra \"Đại Tranh Chi Thế\".\n  - Thanh gươm Mạt nhật: Dựa theo suy diễn, đại kiếp tiếp theo sẽ giáng lâm đúng vào **ba ngàn năm sau** (Tu Tiên lịch năm 10000). Nếu trước đó không tìm được cách phá cục hoặc trốn khỏi Phàm giới, toàn bộ sinh linh trên Thần Lục và Vô Tận Hải đều sẽ hóa thành tro bụi, vạn kiếp bất phục.\n</overview>`;\n\nconst linh_gioi_ban = `<overview>\nThế giới thành hình:\n  - Thiên địa vốn là một khối Siêu Đại Lục, vạn thiên sinh linh cùng chung sống. Vực Ngoại Thiên Ma từ Hư Hải xâm lấn, đại chiến bùng nổ tại lãnh thổ Ma tộc, xé rách Siêu Đại Lục thành Bảy Đại Lục của Linh giới ngày nay; Lãnh thổ Ma tộc hóa thành Vẫn Lạc Đại Lục; Rìa đại lục bị xé thành ngàn vạn mảnh vỡ, hóa thành vô số Phàm giới.\nThiên Ma uy hiếp:\n  - Thiên Ma cứ khoảng vạn năm lại tích súc lực lượng m  t lần, phát động xâm lấn quy mô lớn vào một đại lục bất kỳ của Linh giới.\n  - Lần xâm lấn tiếp theo: Tu Tiên lịch năm xxxx.\nNgười đến từ Phàm giới:\n  - Sinh linh Phàm giới thực chất là hậu duệ của Thượng Cổ Bát Tộc. Kẻ nào có thể xé rách hư không trở về Linh giới đều được các phái tranh nhau chiêu mộ, coi như thiên tài.\nTiên giới:\n  - Tương truyền độ kiếp thành công có thể phi thăng Tiên giới, nhưng từ Thượng cổ đến nay không có bất kỳ phi thăng giả nào truyền tin tức về. Rốt cuộc có tồn tại hay không, chúng thuyết phân vân.\n</overview>`;\n\nconst outputText = world === 'linh giới' ? linh_gioi_ban : pham_gioi_ban;\n_%>\n<%- outputText %>\n<%_ } _%>"],["世界设定-五行生克","<elements>\nNgũ hành sinh khắc:\n- Quan hệ Tương sinh: \n  * Cơ bản: Mộc->Hỏa->Thổ->Kim->Thủy->Mộc\n  * Dương sinh: Kim, Mộc, Thủy, Hỏa, Thổ (Dương sinh ngũ hành cơ bản)\n  * Âm sinh: Dương\n  * Hỗn độn: Không sinh khắc\n- Quan hệ Tương khắc: \n  * Cơ bản: Mộc->Thổ->Thủy->Hỏa->Kim->Mộc\n  * Âm khắc: Kim, Mộc, Thủy, Hỏa, Thổ (Âm khắc ngũ hành cơ bản)\n  * Dương khắc: Âm\n  * Hỗn độn: Không sinh khắc\n</elements>"],["世界设定-物品功法","<%_ { _%>\n<%_\n// Từ điển hình thái Pháp bảo: Pháp bảo = Danh xưng chung của mọi loại vũ khí, \"Phàm vật đều có thể thành bảo\" —— Binh khí, đồ dùng văn phòng, dụng cụ làm bếp, kim chỉ, bách công, hộp trang điểm, nhạc cụ, đồ đựng, tôi luyện đều có thể thành bảo.\n// Mỗi vòng rút ngẫu nhiên 5 cái điền vào ví dụ \"Khái quát vật phẩm·Pháp bảo\", thể hiện sự đa dạng. Muốn mở rộng thì cứ ném thêm từ vào mảng tương ứng (Tên chính là hạt giống, sau khi mô hình bốc trúng sẽ tự phối chỉ số/hiệu quả theo [Quy tắc tạo vật phẩm công pháp]).\nconst hinh_thai_phap_bao = {\n  Binh_khi: ['Kiếm', 'Đao', 'Trường thương', 'Mâu', 'Côn','Cung tiễn','Nỏ tiễn', 'Kích', 'Tiên', 'Phiến', 'Sạn', 'Bổng', 'Chủy thủ', 'Phi tiêu'],\n  Ky_binh: ['Hồi toàn tiêu','Thiết tật lê','Đinh','Tụ kiếm','Trảo','Quyền bộ',' , kim thiết mộc thạch, tiên thảo linh quả thậm chí vật liệu kiến trúc, mọi thứ dồi dào linh khí đều có thể làm tài liệu\n\n# Phân loại công pháp:\n  - Tâm pháp: Công pháp dùng để tu luyện, cùng lúc chỉ có thể vận hành một loại\n  - Công kích: Công pháp tấn công trực tiếp\n  - Chú pháp: Công pháp loại pháp thuật tấn công tầm xa\n  - Thần thức: Công pháp bỏ qua phòng ngự trực tiếp tấn công thần hồn đối phương\n  - Huyễn thuật: Công pháp khiến đối phương rơi vào trạng thái bất thường\n  - Thân pháp: Công pháp gia tăng độn tốc, cùng lúc chỉ có thể vận hành một loại\n  - Hộ thể: Công pháp dùng để phòng ngự, cùng lúc chỉ có thể vận hành một loại\n\n# Phân loại phẩm chất:\n  Quyết định độ hiếm và cường độ của vật phẩm\n  - Phàm giai: Vật tầm thường, có thể tìm thấy ở bất cứ đâu (Q=+0%, Hiệu quả 1 dòng)\n  - Hoàng giai: Hơi có linh tính, thường thấy trên thị trường (Q=+25%, Hiệu quả 1 dòng)\n  - Huyền giai: Chế tạo từ linh tài trân quý, uy năng đáng nể (Q=+50%, Hiệu quả 2 dòng)\n  - Địa giai: Trọng khí khó được, thế gian hiếm thấy (Q=+75%, Hiệu quả 2 dòng)\n  - Thiên giai: Tìm được trong bí cảnh, hoặc chí bảo truyền thừa của môn phái (Q=+100%, Hiệu quả 3 dòng)\n</items>\n<%_ } _%>"],["世界设定-修为境界","<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.địa điểm.thế giới') || 'phàm giới';\n\nconst pham_gioi_ban = `<realm_power_level>\nKhái quát Tu vi và Địa vị xã hội:\n  Phàm nhân (L=0):\n    Địa vị: Nhiều như cát sông Hằng, trước mặt tu sĩ tựa như giun dế. Kẻ có linh căn dẫn khí nhập thể mới có thể bước vào Luyện Khí kỳ.\n  Luyện Khí kỳ (L=1):\n    Địa vị: Tầng chót của Tu Tiên giới. Đa số là đệ tử ngoại môn, tạp dịch của tông môn, hoặc là tán tu giãy giụa ở tầng đáy. Có thể thi triển pháp thuật cơ bản.\n    Mở khóa thần thông:\n    - Truyền âm: Phương thức giao tiếp định hướng đặc quyền của tu sĩ.\n  Trúc Cơ kỳ (L=2):\n    Địa vị: Lực lượng trung kiên của Tu Tiên giới. Đệ tử nội môn hoặc chấp sự cơ sở của tông môn lớn; Ở chốn phàm tục hoặc nơi hẻo lánh, đủ sức khai sáng một
