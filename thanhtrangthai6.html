  const rules = [["非战斗判定规则","<rule name=\"Quy tắc Phán định Phi chiến đấu\">\n# Khai báo tham số:\n  L = Hệ số Cảnh giới hiện tại của nhân vật | L thử thách = Hệ số Cảnh giới ước tính tương ứng với đối tượng/môi trường phán định\n  [Z%] = Khớp với max(Tăng ích % liên quan) - max(Giảm ích % liên quan) của thuộc tính/kỹ nghệ kiểm định hiện tại\n  [W] = Khớp với max(Giá trị tăng liên quan) - max(Giá trị giảm liên quan) của thuộc tính/kỹ nghệ kiểm định hiện tại\n\n# Điều kiện kích hoạt cốt lõi:\n  Kích hoạt: Khi <user> ở trạng thái phi chiến đấu, cố gắng vượt qua những trở ngại khách quan mang tính không chắc chắn hoặc có rủi ro (Ví dụ: Phá giải cơ quan, chịu đựng giá rét tột độ, nhìn thấu ảo ảnh, giao thiệp bằng uy áp v.v...).\n  Bỏ qua: Khi L nhân vật ≥ L thử thách + 2 thì tự động thành công, không xuất ra bảng thông số tính toán.\n\n# Giai đoạn 1: Liệt kê các tình huống phi chiến đấu trong giới tu tiên và Ánh xạ tham số\n  Dựa theo logic hành vi, chia phán định thành năm loại lớn, và neo định các tham số kiểm định của chúng:\n  | Loại Kiểm định | Liệt kê Tình huống Điển hình | Ba chiều Cốt lõi | Kỹ nghệ Liên quan (Nếu không có thì là 0) |\n  | --- | --- | --- | --- |\n  | Thần niệm cảm tri | Nhìn thấu ẩn nấp/dịch dung, tìm kiếm linh mạch, phát hiện mai phục, chống lại chấn nhiếp tinh thần | khí cảm | thần thức / huyễn thuật |\n  | Thể phách cường áp | Chống lại chướng độc/môi trường khắc nghiệt, khuân vác vật nặng, giãy giụa khỏi trói buộc, sinh tồn trong tuyệt cảnh | căn cốt | luyện thể |\n  | Cơ xảo giải đố | Giám định pháp bảo/đan dược, phá giải trận pháp phi chiến đấu, theo dấu vết | ngộ tính | trận pháp / kỹ nghệ sản xuất tương ứng |\n  | Uy áp giao thiệp | Dùng cảnh giới gây áp lực, mặc cả mặc cả, tra khảo tình báo, mê hoặc tâm trí | khí cảm | huyễn thuật / thần thức |\n  | Thuần hóa thu phục | Thuần phục làm chiến lực phe mình | khí cảm | thuần thú |\n\n# Giai đoạn 2: Ước tính Độ khó và Công thức hóa\n  1. Thiết lập Hệ số Độ khó (C_diff):\n     Đơn giản=0.5 | Bình thường=1.0 | Khó khăn=1.5 | Cực khó=2.0\n  2. Công thức Năng hiệu Nhân vật (A):\n     A = floor( (10^L nhân vật + Ba chiều cốt lõi×5 + Kỹ nghệ liên quan) × (1+[Z%]) ) + [W] + d20\n  3. Công thức Độ khó Mục tiêu (D):\n     - Phán định Tĩnh (Cơ quan/Cạm bẫy/Môi trường/Trở ngại vô thức — Đối tượng khách quan không có ba chiều):\n       D_static = floor(10^L thử thách × C_diff) + 10(Cố định)\n     - Đối kháng Động (Đối thủ có ý thức sở hữu ba chiều — Tu sĩ/Yêu thú/Linh thức):\n       D_dynamic = floor( (10^L thử thách + Ba chiều cốt lõi của địch×5 + Kỹ nghệ liên quan của địch) × (1+[Z%]) ) + d20\n  4. Ngưỡng Chênh lệch (Δ) và Phân tầng Kết quả:\n     Δ = A - D\n     - Δ ≥ 10^L thử thách × 0.5 : 【Đại thành công】\n     - Δ ≥ 0 : 【Thành công】\n     - Δ < 0 : 【Thất bại】\n     - Δ ≤ -(10^L thử thách × 0.5) : 【Đại thất bại】\n\n# Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận điều kiện kích hoạt: Trạng thái phi chiến đấu và tồn tại trở ngại không chắc chắn}\n    - ${Kiểm tra điều kiện bỏ qua: Nếu L nhân vật ≥ L thử thách+2, tự động thành công, không xuất ra bảng thông số}\n    - ${Xác nhận loại kiểm định và ba chiều cốt lõi/kỹ nghệ liên quan tương ứng với hành vi lần này}\n    - ${Trích xuất giá trị ba chiều và giá trị kỹ nghệ tương ứng từ <status_current_variables>}\n    - ${Xác nhận căn cứ ước tính của L thử thách (Môi trường/Mục tiêu/Cấp độ cơ quan) và lý do chọn hệ số độ khó C}\n    - ${Phán đoán D đi theo hướng tĩnh (Cơ quan/Cạm bẫy/Môi trường) hay động (Đối thủ có ý thức)}\n  -->\n  <action_info>\n    {Phán định Phi chiến đấu - [Loại Kiểm định]}\n    | Mục tiêu:[Tóm tắt hành vi, ví dụ: Thần thức nhìn thấu ảo ảnh vách đá] | Ước tính Môi trường: L=[L thử thách] | Cấp độ Độ khó: [Đơn giản/Bình thường/Khó khăn/Cực khó] (C=[Hệ số]) |\n    | Ánh xạ Tham số: Ba chiều=[Tên ba chiều cốt lõi(ngộ tính/căn cốt/khí cảm)]([Giá trị]) | Kỹ nghệ=[Tên kỹ nghệ liên quan]([Giá trị]) |\n    | Tăng giảm Trạng thái: Tăng ích[Z%]=[X%]  const result = [];\n  for (const t of tickets) {\n    if (result.length >= n) break;\n    if (!seen.has(t.name)) {\n      seen.add(t.name);\n      result.push(t);\n    }\n  }\n  return result;\n};\n\nconst _pickedNameStrategies = _weightedPickN(_nameStrategies, 2);\nconst _renderStrategy = s => {\n  const list = s.pool ? _pickN(s.pool, 4) : s.examples;\n  return `      • 【${s.name}】${s.desc}(Ví dụ:${list.join(\"、\")})`;\n};\n\nconst nameStrategies = `Chiến lược đặt tên (Chỉ tham khảo, cấm rập khuôn cứng nhắc):\n${_pickedNameStrategies.map(_renderStrategy).join(\"\\n\")}\n      • Cấm đặt họ tên liên quan trực tiếp đến nghề nghiệp`;\n_%>\n<rule name=\"Quy tắc Sinh thành Nhân vật\">\n# Quy trình sinh thành nhân vật ngoài <user>\nLogic quy trình:\n  1. Kích hoạt: Trong tường thuật chính văn (Cấm sinh thành ở đầu chính văn);\n     - (A) Nhân vật NPC: Bất kỳ nhân vật chính nào ngoài <user> **lần đầu tiên** xuất hiện (Bao gồm cả hóa hình)\n     - (B) Linh thú/Khôi lỗi vô chủ: Yêu thú hoang dã/Khôi lỗi bị bỏ rơi xuất hiện/bị phát hiện\n\n# === (A) Sinh thành Nhân vật NPC ===\n# Bước 1: Suy nghĩ và tính toán tiền đề\n<!--\n/* Số chữ suy nghĩ: 400~700 token */\n  Step1_Định vị cơ bản:\n    - <%= nameStrategies %>\n    - Định vị cảnh giới: Dựa vào bối cảnh hiện tại, cường độ thế lực, tính hợp lý của cốt truyện để xác định đại cảnh giới và tiểu cảnh giới\n    - Dựa vào <talent> để xác định linh căn và thể chất; Dựa vào xếp loại thể chất quyết định 【Tổng ba chiều (S)】-> Phân bổ ba chiều (Bắt buộc liệt kê kết quả phân bổ)\n    - Quyết định màu lông: Lông cơ thể, màu mắt, dựa trên ngũ hành. Ví dụ màu sắc: <%= visualColorRef %>\n    - Phân tích trang phục: [Đầu][Áo ngực][Quần lót][Tất][Áo trên][Quần/váy dưới][Khoác ngoài][Chân][Trang sức]<%= clothingContent %>\n  Step2_Tính toán tài nguyên (Bắt buộc liệt kê công thức đầy đủ):\n    - Khí huyết giới hạn = floor( 10^L × (1 + căn cốt×0.1) )\n    - Linh khí giới hạn = floor( 10^L × (1 + khí cảm×0.1) )\n    - Độn tốc = floor( 10^L × (1 + căn cốt×0.02) )\n    - Giá trị hiện tại ban đầu = Giới hạn tương ứng (Lúc xuất hiện mặc định đầy trạng thái)\n    - Thiên kiếp:\n      | Thân phận | Thiên kiếp cơ bản |\n      | --- | --- |\n      | Chính phái | 0 |\n      | Tán tu | floor(10^(L-1) × 0.5) |\n      | Tà tu | floor(10^L × 0.5) |\n      | Tội nghiệp cực đoan | floor(10^L × 1~3) |\n    - Đan độc:\n      | Thân phận | Đan độc cơ bản |\n      | --- | --- |\n      | Thiên kiêu | 0 |\n      | Tán tu | floor(10^(L-1) × 0.5~1) |\n      | Đan tu/Tư chất kém | floor(10^L × 1~3) |\n  Step3_Giá trị kỹ nghệ ban đầu (Bắt buộc liệt kê công thức):\n    - Chỉ gán giá trị ban đầu cho các kỹ nghệ liên quan chặt chẽ đến thân phận/nghề nghiệp của nhân vật, còn lại mặc định 0\n    - Công thức tiêu chuẩn: floor( 10^L × Hệ số nghề nghiệp )\n        Nghề nghiệp chuyên môn cốt lõi: 0.3~0.5\n        Kiêm tu: 0.1~0.2\n        Nắm vững cơ bản: 0.05\n    - Ví dụ: Luyện đan sư Trúc Cơ kỳ (L=2) cốt lõi Luyện đan = floor(100×0.4) = 40\n  Step4_Trang bị đạo cụ mang theo (Bắt buộc liệt kê công thức):\n    - Phân tích tầng lớp thân phận nhân vật, và công pháp, trang bị, khôi lỗi/linh thú, vật phẩm tiêu hao sinh ra bao nhiêu món, bắt buộc liệt kê số lượng\n    | Tầng lớp thân phận | Số lượng công pháp | Số lượng trang bị | Số lượng khôi lỗi/linh thú | Số lượng vật phẩm tiêu hao | Khoảng phẩm chất |\n    | :--- | :--- | :--- | :--- | :--- | :--- |\n    | Tán tu | 2~3 | 1~2 | 0~1 | 0~1 | Phàm~Hoàng |\n    | Tu sĩ tinh anh | 4~6 | 4~6 | 0~2 | 1~2 | Hoàng~Huyền |\n    | Trưởng lão/Thánh tử | 4~6 | 6~8 | 0~2 | 1~2 | Huyền~Địa |\n    | Chưởng môn/Nguyên lão | 4~6 | 6~8 | 0~3 | 1~3 | Địa~Thiên |\n    - Linh thạch: floor( 10^(L+1) × rand(0.5~2.0))\n    - Thứ tự ưu tiên sinh thành công pháp: Tâm pháp > Công kích > Hộ thể > Thân pháp > Khác, tuân thủ <rule ref=\"Quy tắc Sinh thành Vật phẩm Công pháp\"/>\n-->\n\n# Bước 2: Template Bảng thông số\n  Quy tắc template: Nếu nội dung trống thì không sinh ra, có thể bỏ qua tên key; Cấm dịch sang tiếng Anh; Chỉ ký hiệu | ở đầu dòng mới được viết chuỗi nhiều dòng; Mảng bắt buộc sử dụng định dạng trong dòng (ví dụ [a, b] nghiêm cấm sử dụng - ngắt dòng); Định dạng YAML chú ý lùi lề; Trong ngoặc đơn là hướng dẫn điền, cấm xuất ra dấu ngoặc đơn và nội dung bên trong; Tuân thủ quy phạm số chữ;\n  Vị trí chèn: Tại vị trí xuất hiện của nhân vật này trong <gametxt>, cấm chèn bên ngoài <gametxt>, mỗi nhân vật sinh ra một bảng thông số độc lập\n  <char_info>\n  thể loại: nhân vật\n  tên:\n  chủng tộc:\n  thân phận: [] (Điền mảng trong dòng)\n  tính cách: |\n    (40~80 token, không liên quan đến thân phận/cảnh giới, sinh thành tự do)\n  ngoại mạo: |\n    (80~150 token, miêu tả khách quan trạng thái khỏa thân của nhân vật, bao gồm đôi mắt, màu tóc, tứ chi vóc dáng, nữ giới không có sẹo và miêu tả cơ quan sinh dục nữ (ví dụ: <%= physiologicalDescription %>), cấm so sánh ẩn dụ, không đánh giá)\n  trang phục: |\n    (60~120 token, miêu tả khách quan phối đồ trang phục, phức tạp hóa phong phú hóa, cấm so sánh ẩn dụ, không đánh giá)\n  bối cảnh: |\n    (80~150 token, xuất thân, làm thế nào bước lên con đường tu hành, trải nghiệm tu chân)\n  thọ nguyên:\n    tuổi: number\n    tuổi thọ: number\n    tuổi bề ngoài: number\n  linh căn:\n    tên: \n    ngũ hành: [] (Điền mảng trong dòng, ví dụ [thủy, hỏa])\n    phẩm giai: \n  thể chất:\n    tên:\n    hiệu quả:\n    ngộ tính: number\n    căn cốt: number\n    khí cảm: number\n    nguyên âm: (Gộp vào thể chất; điền true hoặc false, giữ lại nguyên âm hoặc nguyên dương làm tên key tùy theo giới tính nhân vật; không có đặc điểm giới tính này thì bỏ qua, mvu xử lý sẽ bù null)\n  tiến độ tu luyện:\n    cảnh giới: (Đại cảnh giới cộng tiểu cảnh giới, ví dụ: Trúc Cơ trung kỳ)\n    tiến độ hiện tại: number (Mặc định 0)\n    giới hạn tiến độ: number (= 10^L × 100)\n    thiên kiếp: number (Mặc định 0, người có tội nghiệp tùy tình hình)\n    đan độc: number (Mặc định 0, người uống thuốc lâu dài/đan tu tùy tình hình)\n  kỹ nghệ:\n    loại sản xuất:\n      luyện đan: number\n      luyện khí: number\n      chế phù: number\n      thuần thú: number\n      linh thực: number\n      y thuật: number\n    loại chiến đấu:\n      ngự vật: number\n      pháp thuật: number\n      huyễn thuật: number\n      trận pháp: number\n      thần thức: number\n      luyện thể: number\n  tài nguyên:\n    khí huyết:\n      hiện tại: number\n      tối đa: number\n    linh khí:\n      hiện tại: number\n      tối đa: number\n    độn tốc: number\n  công pháp:\n    (Điền tên công pháp):\n      đang sử dụng: true\n      phẩm chất:\n      cảnh giới:\n      ngũ hành:\n      thể loại: (tâm pháp|công kích|huyễn thuật|thần thức|pháp thuật|thân pháp|hộ thể|trận pháp)\n      tiêu hao:\n      nhãn: []\n      hiệu quả:\n        (Điền tên hiệu quả): (Điền mô tả hiệu quả, một dòng)\n      mô tả:\n  vật phẩm:\n    (Điền tên vật phẩm):\n      phẩm chất:\n      cảnh giới:\n      thể loại: (bí tịch|công thức|phù lục|đan dược|tài liệu|công cụ)\n      ngũ hành:\n      nhãn: []\n      số lượng: number\n      hiệu quả:\n        (Điền tên hiệu quả): (Điền mô tả hiệu quả, một dòng)\n      mô tả:\n  trang bị:\n    (Điền tên trang bị):\n      phẩm chất:\n      cảnh giới:\n      thể loại: (pháp bảo|hộ giáp|trang sức)\n      ngũ hành:\n      tiêu hao: (Bỏ qua key này nếu không có tiêu hao)\n      nhãn: [] (Pháp bảo→[công kích:N]; Hộ giáp→[phòng ngự:N]; Trang sức tùy nhu cầu)\n      hiệu quả:\n        (Điền tên hiệu quả): (Điền mô tả hiệu quả, một dòng)\n      mô tả:\n      vị trí: (tay|áo trên|quần dưới|đầu|chân|áo ngực|quần lót|tất|khoác ngoài|eo|dây chuyền|nhẫn|túi trữ vật)\n  khôi lỗi:\n    (Điền tên khôi lỗi):\n      phẩm chất:\n      cảnh giới:\n      ngũ hành:\n      nhãn: []\n      mô tả:\n      tài nguyên:\n        khí huyết:\n          hiện tại: number (= tối đa)\n          tối đa: number (= floor(10^L × (0.5~1) × (1+Q)))\n        linh khí:\n          hiện tại: number\n          tối đa: number (= floor(10^L × 0.5 × (1+Q)))\n        độn tốc: number (= floor(10^L × (0.5~2) × (1+Q)))\n      phòng ngự: number (= floor(10^L × (0~0.2) × (1+Q)))\n      kỹ năng:\n        (Điền tên kỹ năng):\n          công kích: number (= floor(10^L × (0~0.3) × (1+Q)))\n          tiêu hao: (linh khí:N|khí huyết:N|không)\n          hiệu quả:\n            (Điền tên hiệu quả): (Điền mô tả hiệu quả, một dòng)\n  linh thú:\n    (Điền tên linh thú):\n      phẩm chất:\n      cảnh giới:\n      ngũ hành:\n      nhãn: []\n      mô tả:\n      tài nguyên:\n        khí huyết:\n          hiện tại: number (= tối đa)\n          tối đa: number (= floor(10^L × (5~15) × (1+Q)))\n        linh khí:\n          hiện tại: number\n          tối đa: number\n        độn tốc: number\n      phòng ngự: number\n      kỹ năng:\n        (Điền tên kỹ năng):\n          công kích: number\n          tiêu hao:\n          hiệu quả:\n            (Điền tên hiệu quả): (Điền mô tả hiệu quả, một dòng)\n  linh thạch: number\n  </char_info>\n\n# === (B) Sinh thành Linh thú/Khôi lỗi vô chủ ===\n# Bước 1: Suy nghĩ và tính toán tiền đề\n<!--\n/* Số chữ suy nghĩ: 150~250 token */\n  Step1_Cảnh giới và Phẩm chất:\n    - Định vị cảnh giới: Dựa vào bối cảnh hiện tại quyết định cảnh giới L, phẩm chất Q\n  Step2_Tính toán chỉ số (Bắt buộc liệt kê công thức, tham khảo *RULE_Bảng hệ số sinh thành vật phẩm):\n    - Khí huyết giới hạn = floor(10^L × hp_coef × (1+Q))\n    - Linh khí giới hạn = floor(10^L × 0.5 × (1+Q))\n    - Độn tốc = floor(10^L × dun_coef × (1+Q))\n    - Phòng ngự = floor(10^L × def_coef × (1+Q))\n    - Kỹ năng công kích = floor(10^L × atk_coef × (1+Q))\n    - Số lượng kỹ năng: Phàm/Hoàng=1, Huyền/Địa=2, Thiên=3\n  Step3_Hảo cảm độ:\n    - Hảo cảm: Mặc định 0\n-->\n# Bước 2: Template Bảng thông số\n  <item_info>\n    {Tên thực thể}\n    | thể loại: [khôi lỗi|linh thú] |\n    | phẩm chất: [phàm|hoàng|huyền|địa|thiên] |\n    | cảnh giới: [Cảnh giới, ví dụ: luyện khí sơ kỳ] |\n    | ngũ hành: [kim|mộc|thủy|hỏa|thổ|âm|dương|hỗn độn] |\n    | nhãn: [hoang dã|vô chủ][Các nhãn miêu tả khác...] |\n    | mô tả: [Đặc trưng tóm tắt, 30~80 chữ] |\n    {Tài nguyên}\n    | khí huyết: Hiện tại[X] / Tối đa[Y] |\n    | linh khí: Hiện tại[X] / Tối đa[Y] |\n    | độn tốc: [X] |\n    {Phòng ngự}\n    | phòng ngự: [X] |\n    {Kỹ năng} (Số lượng: Phàm/Hoàng=1, Huyền/Địa=2, Thiên=3)\n    | [Tên kỹ năng 1] | công kích: [X] | tiêu hao: [linh khí:N|khí huyết:N|không] | hiệu quả: [Tên hiệu quả: Hiệu quả]... |\n    | [Tên kỹ năng 2] | ... | (Số lượng quyết định bởi phẩm chất)\n  </item_info>\n\n</rule>\n<%_ } _%>"],["领悟规则","<rule name=\"Quy tắc Lĩnh ngộ\">\n# Khai báo tham số:\n  L=Hệ số Cảnh giới Q=Hệ số Phẩm chất R=Hệ số Linh căn\n  Vu = Giá trị cơ bản của nhân vật = 10^L (của nhân vật)\n  Vt = Giá trị cơ bản của mục tiêu = 10^L (của mục tiêu)\n  [Z%] = Tăng/giảm ích % liên quan (Thuộc tính kiểm định: ngộ tính)\n  [W] = Giá trị tăng/giảm liên quan (Thuộc tính kiểm định: ngộ tính)\n\n# Điều kiện kích hoạt cốt lõi: \n  Kích hoạt: 1. <user> thực hiện rõ ràng các hành vi như nghiên cứu bí tịch, tham ngộ trận đồ, quan sát bia đá v.v...\n\n# Giai đoạn 1: Khớp nối, Ngũ hành và Giới hạn tiến độ\n  Logic và Quy tắc:\n    1. Tổng tiến độ mục tiêu (Y):\n      - Bí tịch/Thư quyển thực thể: Y = max(1, ceil(L / 2)) \n      - Loại phi bí tịch (Bia đá/Hình ảnh/Bích họa/Truyền công v.v...): Y = 1\n    2. Khóa giới hạn tiến độ (Max_X):\n      - Công thức: Max_X = max(0, Y - max(0, ceil(L mục tiêu - L nhân vật)))\n      - Giải thích: Khi nghiên cứu nội dung có cảnh giới cao hơn bản thân, giới hạn có thể đọc sẽ giảm xuống  \n    3. Bù trừ tương thích Ngũ hành (E_mod):\n      - Phán đoán thuộc tính ngũ hành của mục tiêu (Nếu không có thuộc tính rõ ràng hoặc tàn khuyết, mặc định phán đoán là hỗn độn)\n      - Nếu nhân vật có linh căn cùng ngũ hành với mục tiêu -> Tương thích khớp, E_mod = 0.8\n      - Nếu nhân vật không có linh căn ngũ hành tương ứng (hoặc mục tiêu là hỗn độn mà nhân vật không có linh căn hỗn độn) -> Tương thích bài xích, E_mod = 1.2\n    4. Bù trừ độ hoàn chỉnh: \n      [bản gốc] Hệ số nhân độ khó = 1.0; [bản sao] Hệ số nhân độ khó = 1.2; [tàn khuyết] Hệ số nhân độ khó = 1.5  \n\n# Giai đoạn 2: Kiểm định Tham ngộ\n  Logic và Quy tắc:\n    1. Tiêu hao: Chỉ tiêu hao thời gian (Mặc định 2~4 canh giờ)\n    2. Năng hiệu lĩnh ngộ (P): \n      Công thức: P = floor( (Vu + [ngộ tính]×10 + [kỹ nghệ] liên quan) × (1+[Z%]) ) + [W]\n    3. Độ khó tham ngộ (D):\n      Công thức: D = floor( Vt × (1+[Hệ số Q]) × Bù trừ độ hoàn chỉnh × E_mod ) + d20\n    4. Kết toán chênh lệch (Δ): Δ = P - D\n\n# Giai đoạn 3: Phán định Kết quả và Cơ chế liên đới\n  Dựa vào tỷ lệ giữa chênh lệch Δ và D, quyết định kết quả tham ngộ lần này:\n    - Tham ngộ thành công (Δ ≥ 0): Tiến độ +1  \n      * Phần thưởng giai đoạn: Nếu X sau khi cập nhật < Y, nhận được chút cảm ngộ, [kỹ nghệ] tương ứng tăng Max(1, floor((Vt)×0.02)) điểm, tối đa không được vượt quá [Max_S] = 10^(L nhân vật + 1)\n      * Tự động nối tiếp: Nếu X sau khi cập nhật < Max_X, nối tiếp vòng tham ngộ tiếp theo, xuất ra kiểm định vòng tiếp theo, cho đến khi X đạt Max_X hoặc phán định thất bại thì dừng lại  \n    - Tối nghĩa khó hiểu (Δ < 0 và Δ > -D × 0.5): Tiến độ +0 Dừng nghiên cứu  \n    - Tẩu hỏa nhập ma (Δ ≤ -D × 0.5 hoặc cưỡng ép vượt 2 bậc): Tiến độ +0 Dừng nghiên cứu\n      * Kết toán trừng phạt: Trừ khí huyết floor(Vt × 0.2), và nhận trạng thái tiêu cực [Tâm thần bị thương (ngộ tính -5, duy trì đến khi được chữa trị, có thể cộng dồn)]  \n\n# Giai đoạn 4: Phân phát Phần thưởng Đại thành\n  Khi tiến độ X = Y, vật phẩm này đã được lĩnh ngộ triệt để, không thể nhận thêm tiến độ, và dựa vào loại để phát phần thưởng cuối cùng:\n    1. Quy tắc giới hạn cảnh giới (Quan trọng):\n       Tất cả [công pháp], [công thức], [bí pháp] sinh ra từ lĩnh ngộ, cảnh giới cuối cùng (L) bắt buộc không được vượt quá 【L cảnh giới hiện tại của nhân vật】  \n    2. Công pháp và Kỹ nghệ: \n       - Nhân vật học được công pháp, định dạng tuân theo <rule ref=\"Quy tắc Sinh thành Vật phẩm Công pháp\"/>\n       - Kỹ nghệ tương ứng tăng Max(1, floor((Vt/Vu) × 10)) điểm, tối đa không được vượt quá [Max_S] = 10^(L nhân vật + 1)\n    3. Loại kỹ nghệ sản xuất (Đan phương/Khí phổ/Trận đồ):\n       - Nhận được [công thức]\n    4. Loại ẩn bí tạo hóa (Cổ quyển/Bia đá/Tin đồn):\n       - Tiết lộ tình báo: Nhận được [điểm yếu] của yêu thú cấp cao, [tọa độ không gian] của bí cảnh ẩn, [tín vật trận nhãn] của động phủ đại năng v.v...  \n\n# Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận loại mục tiêu (Bí tịch thực thể/Phi bí tịch), trích xuất L và Q của mục tiêu, xác nhận loại độ hoàn chỉnh}\n    - ${Tính toán nguồn gốc chênh lệch giữa L mục tiêu và L hiện tại của nhân vật cần thiết cho Max_X}\n    - ${Xác nhận ngũ hành linh căn của nhân vật và ngũ hành mục tiêu, quyết định giá trị E_mod (0.8/1.2)}\n    - ${Xác nhận giá trị ngộ tính và giá trị kỹ nghệ liên quan mà P phụ thuộc lấy từ <status_current_variables>}\n    - ${Nếu sau khi thành công lần này X=Y, xác nhận loại phần thưởng đại thành, loại công pháp phải xác nhận cảnh giới sinh ra không vượt quá L hiện tại của nhân vật}\n  -->\n  <action_info>\n    {Phân tích Tham ngộ}\n    | Mục tiêu:[Tên bí tịch/truyền thừa] | Cảnh giới: L=[L mục tiêu], Q=[Hệ số Q] | Độ hoàn chỉnh:[bản gốc/bản sao/tàn khuyết/không] |\n    | Tương thích Ngũ hành: [ngũ hành] mục tiêu vs Linh căn nhân vật [có/không] -> E_mod =[0.8/1.2] |\n    | Tham số Tiến độ: Tổng mục tiêu cần Y=[Y] | Khóa giới hạn vượt bậc Max_X=[Giá trị] |\n    | Tiến độ hiện tại: [X cũ] / [Y] |\n    {Đối kháng Chỉ số}\n    | Ngộ tính/Kỹ nghệ nhân vật: P = floor(([Vu] +[ngộ tính]×10 + [kỹ nghệ]) × (1+[Z%])) +[W] = [Tổng giá trị P] |\n    | Độ khó Tham ngộ: D = floor(Vt[X] × (1+Q) × Bù trừ[X] × E_mod[X]) + d20[Giá trị xúc xắc] = [Tổng giá trị D] |\n    | Chênh lệch: P[Tổng giá trị P] - D[Tổng giá trị D] = Δ[Giá trị] |\n    {Kết toán và Phản hồi}\n    | Kết quả Phán định:[Tham ngộ thành công / Tối nghĩa khó hiểu / Tẩu hỏa nhập ma] |\n    | Thay đổi Trừng phạt: [Không / khí huyết -[X], Nhận trạng thái Tâm thần bị thương (ngộ tính -5, có thể cộng dồn)] |\n    | Cập nhật Tiến độ: [tiến độ đọc: X mới/Y] |\n    (Nếu X mới < Y và thành công:)\n    | Thu hoạch Giai đoạn: Tăng cơ bản Max(1, floor([Vt]×0.02))=[Giá trị cơ bản] | Tăng thực tế min([Giá trị cơ bản], Max(0, [Max_S]-[Giá trị cũ]))=[Giá trị tăng] | [kỹ nghệ]: [Giá trị cũ]+[Giá trị tăng]=[Giá trị mới]/[Max_S] |\n    (Nếu X mới < Max_X và thành công:)\n    | Hệ thống Liên đới: [Tiến độ chưa đạt giới hạn, tự động kích hoạt vòng tham ngộ tiếp theo...] | (Sau đó đính kèm trực tiếp bảng thông số vòng mới)\n    (Nếu X mới = Max_X và Max_X < Y:)\n    | Bình cảnh Cảnh giới:[Nội dung quá thâm sâu, bị giới hạn bởi cảnh giới hiện tại (chênh lệch L), tiến độ tạm thời bị khóa] |\n    (Dưới đây chỉ xuất ra khi X mới = Y)\n    {Phần thưởng Lĩnh ngộ Đại thành}\n    | Loại Phần thưởng:[Học được công pháp / Mở khóa công thức / Tiết lộ tình báo] |\n    | Giảm bậc Cảnh giới (Bị giới hạn bởi L nhân vật): L mục tiêu=[X] -> L sinh ra cuối cùng=[X] |\n    | Nhận được Cụ thể:[Nội dung phần thưởng chi tiết] |\n    | Tinh tiến Cuối cùng: Tăng cơ bản Max(1, floor([Vt]/[Vu]×10))=[Giá trị cơ bản] | Tăng thực tế min([Giá trị cơ bản], Max(0, [Max_S]-[Giá trị cũ]))=[Giá trị tăng] | [kỹ nghệ]: [Giá trị cũ]+[Giá trị tăng]=[Giá trị mới]/[Max_S] |\n  </action_info>\n</rule>"],["生产制作规则","<rule name=\"Quy tắc Sản xuất Chế tác\">\n# Khai báo tham số:\n  L=Hệ số Cảnh giới Q=Hệ số Phẩm chất R=Hệ số Linh căn\n\n# Mệnh lệnh Cốt lõi: Chỉ kích hoạt khi <user> tuyên bố rõ ràng thực hiện các hành vi sản xuất như luyện đan, luyện khí, chế phù, khắc lục trận bàn, chế tạo khôi lỗi v.v...\n\n# Khai báo Khái niệm Cốt lõi:\n  [Vt] = Giá trị cơ bản của sản phẩm mục tiêu = 10^L nguyên liệu chính\n  [Vu] = Giá trị cơ bản của nhân vật = 10^L nhân vật\n  [B] = Hệ số nhân sản xuất hàng loạt (Số lượng phần nguyên liệu đưa vào một lần, mặc định là 1)\n\n# Giai đoạn 1: Phân tích Sản xuất và Tính toán Cộng hưởng Nguyên liệu\n  Logic và Quy tắc:\n    1. Giới hạn Kỹ nghệ và Dụng cụ:\n      - Luyện đan: Cần [Đan lô]; có thể được cộng thêm bởi [Ngọn lửa]\n      - Luyện khí/Chế tạo khôi lỗi: Cần [Khí đỉnh/Đài rèn/Dao khắc]; có thể được cộng thêm bởi [Ngọn lửa]\n      - Chế phù: Cần [Phù bút]; cấm dùng [Ngọn lửa]\n      - Trận pháp: Cần [Trận bàn/Dao khắc]; cấm dùng [Ngọn lửa]\n    2. Neo định Nguyên liệu chính và Khoảng Phẩm chất:\n      - Tính toán theo cấu hình một phần nguyên liệu, nếu không xác định rõ, lấy nguyên liệu có [L] cao nhất trong số các vật đưa vào làm nguyên liệu chính (Nếu L bằng nhau thì lấy Q cao nhất)\n      - L cảnh giới mục tiêu = L nguyên liệu chính\n      - Khóa khoảng phẩm chất: Giới hạn dưới (Min_Q) = Phẩm chất kém nhất trong tất cả nguyên liệu; Giới hạn trên (Max_Q) = Phẩm chất tốt nhất trong tất cả nguyên liệu\n    3. Ngũ hành Sinh khắc và Linh khí Nguyên liệu (Cộng thêm tích cực cho một phần P_mat_single):\n      - Công thức linh khí cơ bản: 10^[L nguyên liệu] × (1 + [Hệ số Q])\n      - Hệ số sinh khắc (E) giữa nguyên liệu phụ và nguyên liệu chính: Phụ sinh Chính(1.5) | Chính sinh Phụ(1.2) | Không sinh khắc(1.0) | Chính khắc Phụ(0.5) | Phụ khắc Chính(0.5)\n      - Giới hạn Quân Thần Tá Sứ: Trong các nguyên liệu phụ, chỉ lấy 3 mục có giá trị sau khi tính toán cao nhất để tính vào ảnh hưởng tích cực, từ mục thứ 4 trở đi do dư thừa linh khí nên P=0\n    4. Tích lũy Bài xích Tạp chất (Độ khó tiêu cực cho một phần D_mat_single):\n      - Bất kể là nguyên liệu chính hay nguyên liệu phụ, mỗi một món nguyên liệu đưa vào đều sẽ làm tăng độ khó tinh luyện và áp chế\n      - Độ khó tạp chất của một nguyên liệu đơn lẻ = 10^[L nguyên liệu đó] × 0.5\n\n# Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận dụng cụ cần thiết có tồn tại trong <status_current_variables> hay không, nếu thiếu thì không thể kích hoạt}\n    - ${Trích xuất từ <status_current_variables> các giá trị kỹ nghệ liên quan của người luyện chế, nguồn gốc các giá trị cộng thêm của dụng cụ/ngọn lửa/công pháp/trận pháp}\n    - ${Xác nhận số lượng hàng loạt B và danh sách nguyên liệu, dựa theo quy tắc khóa nguyên liệu chính (L cao nhất/Q cao nhất) và khoảng phẩm chất [Min_Q, Max_Q]}\n    - ${Xem lại giới hạn Quân Thần Tá Sứ của <Giao thức Sản xuất Chế tác>, xác nhận trong các nguyên liệu phụ cái nào được tính vào ảnh hưởng tích cực, cái nào bị cắt đứt thành 0}\n    - ${Xác nhận có sở hữu công thức hay không, quyết định xem hình phạt không có công thức có được tính vào D hay không}\n    - ${Xác nhận có phải là lần luyện chế đầu tiên hay không, quyết định xem sự tinh tiến kỹ nghệ có được kích hoạt hay không}\n  -->\n  <action_info>\n    {Phân tích Sản xuất}\n    | Kỹ nghệ: [luyện đan/luyện khí/chế phù/trận pháp] | Dụng cụ: [Giá trị cộng thêm] | Trang bị: [Giá trị cộng thêm] | Ngọn lửa: [Giá trị cộng thêm] |\n    | Hàng loạt(B): [Số lượng] phần nguyên liệu cùng luyện | Tìm kiếm cực trị: Cộng thêm Trận pháp=[Giá trị cao nhất] | Cộng thêm Công pháp=[Giá trị cao nhất] |\n    | Định tính Nguyên liệu (Một phần): Nguyên liệu chính=[Tên nguyên liệu (L=[X], Q=[Phẩm chất], ngũ hành=[Ngũ hành nguyên liệu])] |\n    | Khoảng Phẩm chất: Giới hạn dưới=[Min_Q] | Giới hạn trên=[Max_Q] |\n    | Xác định Thành phẩm: L cảnh giới mục tiêu=[L nguyên liệu chính] | Giá trị cơ bản Vt=[10^L nguyên liệu chính] |\n    {Năng hiệu và Tạp chất của một phần Nguyên liệu}\n    | Năng hiệu Nguyên liệu chính: 10^[L] × (1+[Hệ số Q]) = [P_main] |\n    | Sắp xếp Nguyên liệu phụ: [Giá trị P của nguyên liệu phụ cao thứ 1], [Giá trị P cao thứ 2], [Giá trị P cao thứ 3] (Phần còn lại cắt đứt thành 0) |\n    | Cộng thêm Hợp lệ Một phần (P_mat): P_main + 3 mục đầu của nguyên liệu phụ = [Giá trị] |\n    | Tích lũy Tạp chất Một phần (D_mat): Tổng số nguyên liệu đưa vào[N] -> Σ(10^[L nguyên liệu] × 0.5) = [Giá trị] |\n  </action_info>\n\n# Giai đoạn 2: Đối kháng Chỉ số và Tính toán Chênh lệch\n  Logic và Quy tắc:\n    1. Ảnh hưởng Tích cực (Power):\n      Công thức: P = [Vu] + [Giá trị kỹ nghệ tương ứng] + [Giá trị cộng thêm của dụng cụ] + [Giá trị cộng thêm của ngọn lửa] + [Cộng thêm của trận pháp] + [Cộng thêm của công pháp] + ([P_mat một phần] × B)\n      (Chú ý: Các cộng thêm cùng loại lấy mục cao nhất)\n    2. Ảnh hưởng Tiêu cực (Difficulty):\n      Công thức: D = ([Vt] × 2.0 × B) + ([D_mat một phần] × B) + [Hình phạt không có công thức (Nếu không có thì cộng thêm Vt×0.5×B)]\n    3. Kết toán Chênh lệch (Δ):\n      Công thức: Δ = P - D\n\n  Template Bảng thông số:\n  <action_info>\n    {Đối kháng Chỉ số}\n    | Năng lực Người luyện chế (P_char): [Vu] + kỹ nghệ[X] + Dụng cụ[X] + Ngọn lửa[X] + Trận pháp[X] + Công pháp[X] = [Giá trị] |\n    | Tổng Năng hiệu Nguyên liệu: P_mat một phần[X] × Hàng loạt[B] = [P_mat_total] |\n    | Ảnh hưởng Tích cực (P): P_char + P_mat_total = [Tổng giá trị P] |\n    | Tổng Tạp chất và Độ khó Cơ bản: (Vt[X]×2.0×[B]) + (D_mat[X]×[B]) = [D_mat_total] |\n    | Ảnh hưởng Tiêu cực (D): [D_mat_total] + Hình phạt[X] = [Tổng giá trị D] |\n    | Phán định Chênh lệch: P[Tổng giá trị P] - D[Tổng giá trị D] = Δ[Giá trị] |\n  </action_info>\n\n# Giai đoạn 3: Kết toán Sản lượng và Tinh tiến Kỹ nghệ\n  Logic và Quy tắc:\n    1. Phán định Thành công và Suy diễn Phẩm chất (Mảng phẩm chất: Phàm/Hoàng/Huyền/Địa/Thiên):\n      - Ngưỡng Phán định Cơ bản (T) = Vt × B\n      - Δ < 0 : Luyện chế thất bại (Nguyên liệu bị hủy hoàn toàn)\n      - Δ ≥ 0 : Thành công, Phẩm chất cơ bản = [Min_Q]\n      - Δ ≥ 0.5 × T : Xuất sắc, Phẩm chất tăng 1 bậc (Ví dụ: Hoàng->Huyền)\n      - Δ ≥ 1.0 × T : Cực phẩm, Phẩm chất tăng 2 bậc (Ví dụ: Hoàng->Địa)\n      - Giới hạn Đỉnh: Phẩm chất cuối cùng không được vượt quá [Max_Q], nếu vượt quá thì cưỡng chế giảm xuống Max_Q\n    2. Quy tắc Sinh thành Số lượng (Chỉ tính khi thành công, đây là cơ số sản lượng của 【Một phần nguyên liệu】, làm tròn xuống):\n      - Pháp bảo/Trận bàn: Cố định 1 cái\n      - Khôi lỗi: 1 + floor(Δ / (0.5 × T)) cái\n      - Đan dược/Phù lục: min(1 + floor(Δ / (0.2 × T)),10) cái\n      - Tổng sản lượng cuối cùng = 【Sản lượng một phần】 × Hàng loạt【B】\n    3. Quy tắc Số lượng Hiệu quả của Thành phẩm (Gắn liền với phẩm chất được suy diễn cuối cùng):\n      - Phàm/Hoàng giai: 1 hiệu quả cơ bản\n      - Huyền/Địa giai: 2 hiệu quả\n      - Thiên giai: 3 hiệu quả\n    4. Tinh tiến Kỹ nghệ Lần đầu Luyện Công thức (Chỉ kích hoạt trong \"Lần đầu luyện chế\" không thất bại, không liên quan đến số lượng hàng loạt B):\n      - Công thức nâng cao kỹ nghệ: Giá trị nhận được = Max(1, floor( (10^L nguyên liệu chính / 10^L nhân vật) × 10 ))\n\n  Template Bảng thông số:\n  <action_info>\n    {Kết toán Sản lượng}\n    | Ngưỡng Phán định(T): Vt[X] × B[X] = [T] |\n    | Kết quả: Δ=[Giá trị] vs T=[T] -> [Thất bại / Thành công / Xuất sắc / Cực phẩm] |\n    (Nếu thất bại:)\n    | Trạng thái: Linh khí bạo tẩu, luyện chế thất bại, nguyên liệu bị hủy hoàn toàn |\n    (Nếu thành công trở lên:)\n    | Suy diễn Phẩm chất: Cơ bản[Min_Q] + Suy diễn thăng bậc -> Bị giới hạn đỉnh[Max_Q] -> Phẩm chất cuối cùng: [Cấp bậc cuối cùng] |\n    | Số lượng Hiệu quả: [1/2/3] (Theo phẩm chất cuối cùng) |\n    | Chi tiết Sản lượng: [Tên thành phẩm(Cảnh giới L, Phẩm chất cuối cùng)] |\n    | Số lượng: Sản lượng một phần[X] × Hàng loạt[B] = Tổng cộng [Tổng số lượng] [Đơn vị] |\n    {Tinh tiến Kỹ nghệ}\n    | Lần đầu Công thức: [có/không] |\n    | Nâng cao Kỹ nghệ: [kỹ nghệ tương ứng] tăng Max(1, floor([Vt]/[Vu] × 10)) = [Giá trị nhận được] điểm |\n  </action_info>\n</rule>"],["时间推进规则","<rule name=\"Quy tắc Thúc đẩy Thời gian\">\nCơ chế kích hoạt: Chỉ kích hoạt khi khoảng thời gian trong trần thuật ≥ 1 năm, dùng để suy diễn sự biến thiên trạng thái của thế giới\n\n# Giai đoạn 1: Bảng tham khảo Biến thiên\n\n  Thay đổi cảnh giới: Khi suy diễn các sự kiện thăng cấp/vượt bậc của từng nhân vật, khoảng thời gian tiêu hao tham khảo bảng 「Thời gian tiêu hao cảnh giới」 trong <realm_power_level/>\n\n  Tiến hóa Văn minh:\n  | Khoảng thời gian | Biểu hiện điển hình |\n  | --- | --- |\n  | 1~5 năm | Chính lệnh vương triều thay đổi, chiến loạn cục bộ, luân chuyển dân số thành thị |\n  | 5~30 năm | Tiểu quốc hưng suy, thành phố mới được xây dựng hoặc thành phố cũ bị bỏ hoang, tín ngưỡng dân gian thay đổi |\n  | 30~100 năm | Vương triều thay thế, di cư dân tộc, phong tục văn hóa biến đổi |\n  | 100~500 năm | Đại quốc diệt vong hoặc quật khởi, ngôn ngữ phân hóa, thành phố bị bỏ hoang hoặc xây mới |\n  | 500~3000 năm | Dung hợp hoặc diệt vong dân tộc, đứt gãy văn minh, lịch sử bị thần thoại hóa |\n  | Trên 3000 năm | Ngôn ngữ hoàn toàn biến đổi, văn minh thời đại cũ chỉ còn lại di tích và truyền thuyết |\n  Chú ý: Tu tiên vương triều (Kẻ thống trị là tu sĩ) xảy ra những thay đổi nhỏ hơn\n\n  Thế giới biến thiên:\n  | Khoảng thời gian | Biểu hiện điển hình |\n  | --- | --- |\n  | 1~5 năm | Thế lực tiêu trưởng, nhân sự thay đổi, chiến loạn cục bộ lắng xuống hoặc bùng nổ |\n  | 5~30 năm | Tông môn hưng suy, linh mạch cạn kiệt hoặc sinh mới, bí cảnh mở đóng |\n  | 30~100 năm | Tiểu tông môn vẫn lạc, bản đồ thế lực vẽ lại, một số khu vực hoàn toàn biến đổi |\n  | 100~500 năm | Đại tông môn diệt vong hoặc quật khởi, sơn hà đổi dòng, thượng cổ di tích tái hiện |\n  | 500~3000 năm | Cục diện đại lục định hình lại, chủng tộc hưng suy, thế lực cũ triệt để chìm vào quên lãng |\n  | Trên 3000 năm | Địa hình biến đổi, biển và đất liền hoán đổi vị trí, thời đại cũ triệt để trở thành thần thoại |\n\n# Giai đoạn 2: Bảng Sự kiện Thay đổi Nhân vật\n  Mỗi nhân vật trong quá trình thúc đẩy thời gian có thể kích hoạt một hoặc nhiều sự kiện (Thời gian càng dài, chuỗi sự kiện càng dài)\n  Định dạng chuỗi sự kiện: [Sự kiện A] -> [Sự kiện B] -> ...\n\n  | Loại Sự kiện | Khuynh hướng kích hoạt | Giải thích kết toán |\n  | --- | --- | --- |\n  | Không thay đổi | Bất kỳ | Tu vi hơi tinh tiến nhưng không có đột phá thực chất, trạng thái duy trì |\n  | Đột phá tiểu cảnh giới | Tu vi sung túc, không có thiên kiếp | Cảnh giới tiến một bước nhỏ |\n  | Đột phá đại cảnh giới | Tích lũy sung túc, có cơ duyên | Cảnh giới tiến một bước lớn, thực lực biến đổi về chất |\n  | Đạt được cơ duyên | Bất kỳ | Nhận được vật phẩm, cần ghi rõ cụ thể nhận được gì |\n  | Thám bí bị tổn thương | Tu sĩ cấp trung thấp | Chịu tổn thương trong bí cảnh hiểm địa, có thể mất vật phẩm/cảnh giới tụt lùi |\n  | Tẩu hỏa nhập ma | Tu luyện nóng vội/Thiên kiếp cao | Cảnh giới tụt lùi, có thể nhận trạng thái giảm ích vĩnh viễn |\n  | Bị người truy sát | Có kẻ thù/Mang theo bảo vật | Mất vật phẩm/linh thạch, có thể bị thương/lưu vong/vẫn lạc |\n  | Thế lực biến động | Thời kỳ tông môn rung chuyển | Thân phận/thế lực trực thuộc thay đổi, ví dụ: Phản bội tông môn, bị trục xuất, thăng chức trưởng lão |\n  | Kết thù kết oán | Cạnh tranh/Đoạt bảo | Thêm mới quan hệ thù địch, chuỗi sự kiện tiếp theo có thể kích hoạt bị truy sát |\n  | Vẫn lạc | Thọ nguyên cạn kiệt/Lịch kiếp thất bại/Bại trận | Xóa khỏi danh sách quan hệ, cần ghi rõ nguyên nhân vẫn lạc |\n  | Ẩn thế bế quan | Tu sĩ cấp cao/Sau khi bị thương | Biến mất khỏi tầm nhìn trần thuật, không rõ tung tích, sau này có thể xuất hiện lại |\n\n  Ràng buộc:\n    - Độ dài chuỗi sự kiện: 1~30 năm=1 sự kiện; 30~100 năm=2~4 sự kiện; Trên 100 năm=4~6 sự kiện\n    - Logic dây chuyền: Sự kiện phải phù hợp nhân quả, ví dụ [Đạt được cơ duyên]->[Bị người truy sát đoạt bảo] là hợp lý, sau khi [Vẫn lạc] không thể có thêm sự kiện\n    - Phán định thọ nguyên: Mỗi lần thúc đẩy phải đối chiếu với tuổi thọ tối đa để phán đoán nhân vật có tự nhiên tọa hóa hay không (tuổi ≥ tuổi thọ thì tất nhiên vẫn lạc)\n    - Tính không chắc chắn: Những sự kiện không đích thân trải qua được trình bày bằng giọng điệu \"nghe nói\", \"tin đồn\" v.v..., chứ không phải là sự thật đã định\n\n# Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận những nhân vật nào nên tham gia thúc đẩy thời gian}\n    - ${Trích xuất trạng thái nhân vật tương ứng từ <status_current_variables>}\n    - ${Khoảng thời gian lần này tương ứng với mức độ thay đổi nào}\n  -->\n  <time_info>\n    {Thúc đẩy Thời gian}\n    | Khoảng thời gian: [X năm X tháng] |\n    {Suy diễn Nhân vật}\n    | [Tên nhân vật] ([cảnh giới hiện tại] / Tuổi [X]/Tuổi thọ [X]) |\n    | Chuỗi sự kiện: [Sự kiện A] -> [Sự kiện B] -> ... |\n    | Thay đổi cảnh giới: [Cảnh giới cũ] -> [Cảnh giới mới / Duy trì] |\n    | Thay đổi thọ nguyên: Tuổi [Cũ]->[Mới] / Tuổi thọ [Cũ]->[Mới] | Phán định: [Khỏe mạnh/Tự nhiên tọa hóa/Vẫn lạc(Nguyên nhân)] |\n    | Thay đổi vật phẩm: Nhận được [XXX] / Mất đi [XXX] / Không |\n    | ... (Mỗi nhân vật trong danh sách quan hệ chiếm một nhóm) |\n    {Tiến hóa Văn minh}\n    | [Tên quốc gia/dân tộc]: [Miêu tả thay đổi] |\n    | ... |\n    {Thế giới Biến thiên}\n    | [Tên địa điểm/thế lực]: [Miêu tả thay đổi] |\n    | ... |\n  </time_info>\n  Chỉ đạo trần thuật: Cảm nhận sự thay đổi của thế giới dưới góc nhìn của <user>, thể hiện một cách tự nhiên thông qua lời kể của người khác, thần thức thăm dò, thăm lại chốn xưa v.v...; nhân vật vẫn lạc có thể để lại di vật, truyền thuyết hoặc những việc chưa hoàn thành v.v...\n</rule>"],["突破规则","<rule name=\"Quy tắc Đột phá\">\n<%_ { _%>\n<%_\n// ============ ① Đọc biến MVU (stat_data được xuất toàn bộ bởi <status_current_variable>) ============\nconst _tb_tu_luyen = getMessageVar('stat_data.tiến độ tu luyện', { defaults: {} }) || {};\nconst _tb_canh_gioi = _tb_tu_luyen['cảnh giới'] || 'phàm nhân';\nconst _tb_tien_do_hien_tai = Number(_tb_tu_luyen['tiến độ hiện tại']) || 0;\nconst _tb_gioi_han_tien_do = Number(_tb_tu_luyen['giới hạn tiến độ']) || 100;\nconst _tb_thien_kien = Number(_tb_tu_luyen['thiên kiếp']) || 0;\nconst _tb_dan_doc = Number(_tb_tu_luyen['đan độc']) || 0;\nconst _tb_linh_can_pham_giai = getMessageVar('stat_data.linh căn.phẩm giai') || 'chưa kiểm tra';\nconst _tb_khi_cam = Number(getMessageVar('stat_data.thể chất.khí cảm')) || 0;\nconst _tb_can_cot = Number(getMessageVar('stat_data.thể chất.căn cốt')) || 0;\nconst _tb_the_gioi = getMessageVar('stat_data.địa điểm.thế giới') || 'phàm giới';\nconst _tb_linh_khi = getMessageVar('stat_data.tài nguyên.linh khí', { defaults: {} }) || {};\nconst _tb_linh_khi_hien_tai = Number(_tb_linh_khi['hiện tại']) || 0;\nconst _tb_linh_khi_toi_da = Number(_tb_linh_khi['tối đa']) || 0;\nconst _tb_cong_phap = getMessageVar('stat_data.công pháp', { defaults: {} }) || {};\nconst _tb_tam_phap = Object.values(_tb_cong_phap).find(g => g && g['đang sử dụng'] && (g['thể loại'] === 'tâm pháp' || !g['thể loại'])) || {};\nconst _tb_toc_do_tu_hanh = Number((_tb_tam_phap['hiệu quả'] || {})['tốc độ tu hành']) || 0;\nconst _tb_vat_pham = getMessageVar('stat_data.vật phẩm', { defaults: {} }) || {};\nconst _tb_co_truc_co_dan = Object.entries(_tb_vat_pham).some(([ten, vat]) => ten.includes('trúc cơ đan') && Number(vat && vat['số lượng']) > 0);\nconst _tb_ky_nghe = getMessageVar('stat_data.kỹ nghệ', { defaults: {} }) || {};\nconst _tb_danh_sach_ky_nghe = [];\nfor (const _loai of Object.keys(_tb_ky_nghe)) {\n  for (const _ten of Object.keys(_tb_ky_nghe[_loai] || {})) {\n    _tb_danh_sach_ky_nghe.push({ ten: `${_loai}.${_ten}`, gia_tri: Number(_tb_ky_nghe[_loai][_ten]) || 0 });\n  }\n}\nconst _tb_ky_nghe_cao_nhat = _tb_danh_sach_ky_nghe.sort((a, b) => b.gia_tri - a.gia_tri)[0] || null;\n\n// ============ ② Suy luận Cảnh giới (Tham khảo <rule ref=\"Bảng Hệ số Cốt lõi\"/>) ============\nconst _tb_dinh_nghia_dai_canh_gioi = [\n  { ten: 'luyện khí', match: ['luyện khí', 'luyện khí'], L: 1 },\n  { ten: 'trúc cơ', match: ['trúc cơ'], L: 2 },\n  { ten: 'kim đan', match: ['kim đan'], L: 3 },\n  { ten: 'nguyên anh', match: ['nguyên anh'], L: 4 },\n  { ten: 'hóa thần', match: ['hóa thần'], L: 5 },\n  { ten: 'phản hư', match: ['phản hư', 'luyện hư', 'luyện hư'], L: 6 },\n  { ten: 'hợp thể', match: ['hợp thể'], L: 7 },\n  { ten: 'đại thừa', match: ['đại thừa'], L: 8 },\n  { ten: 'độ kiếp', match: ['độ kiếp'], L: 9 },\n];\nconst _tb_cong_them_tieu_canh_gioi = { 'sơ kỳ': 0, 'trung kỳ': 0.2, 'hậu kỳ': 0.4 };\nconst _tb_thu_tu_tieu_canh_gioi = ['sơ kỳ', 'trung kỳ', 'hậu kỳ'];\nconst _tb_bang_he_so_linh_can = { 'vô linh căn': -10, 'ngũ linh căn': 0, 'tứ linh căn': 0.25, 'tam linh căn': 0.5, 'song linh căn': 0.75, 'đơn linh căn': 1 };\n\nconst _tb_phan_tich = (ten_canh_gioi) => {\n  if (!ten_canh_gioi || ten_canh_gioi === 'phàm nhân') return { dai_canh_gioi: 'phàm nhân', tieu_canh_gioi: 'không', L: 0, dai_canh_gioi_L: 0, la_hau_ky: false, thu_tu: -1 };\n  const dinh_nghia = _tb_dinh_nghia_dai_canh_gioi.find(d => d.match.some(k => ten_canh_gioi.includes(k)));\n  if (!dinh_nghia) return { dai_canh_gioi: 'phàm nhân', tieu_canh_gioi: 'không', L: 0, dai_canh_gioi_L: 0, la_hau_ky: false, thu_tu: -1 };\n  const tieu_canh_gioi = _tb_thu_tu_tieu_canh_gioi.find(k => ten_canh_gioi.includes(k)) || 'sơ kỳ';\n  return { dai_canh_gioi: dinh_nghia.ten, tieu_canh_gioi, L: dinh_nghia.L + _tb_cong_them_tieu_canh_gioi[tieu_canh_gioi], dai_canh_gioi_L: dinh_nghia.L, la_hau_ky: tieu_canh_gioi === 'hậu kỳ', thu_tu: dinh_nghia.L - 1 };\n};\n\nconst _tb_hien_tai = _tb_phan_tich(_tb_canh_gioi);\nconst _tb_pham_nhan = _tb_hien_tai.thu_tu === -1;\nconst _tb_co_the_vuot_dai_canh = _tb_pham_nhan || _tb_hien_tai.la_hau_ky;\nconst _tb_dai_canh_tiep_theo = _tb_dinh_nghia_dai_canh_gioi[_tb_hien_tai.thu_tu + 1] || null;\nconst _tb_tieu_canh_tiep_theo = _tb_thu_tu_tieu_canh_gioi[_tb_thu_tu_tieu_canh_gioi.indexOf(_tb_hien_tai.tieu_canh_gioi) + 1] || '';\nconst _tb_dai_canh_muc_tieu = _tb_pham_nhan ? 'luyện khí' : (_tb_hien_tai.la_hau_ky ? (_tb_dai_canh_tiep_theo ? _tb_dai_canh_tiep_theo.ten : '') : _tb_hien_tai.dai_canh_gioi);\nconst _tb_canh_gioi_muc_tieu = _tb_pham_nhan ? 'luyện khí sơ kỳ' : (_tb_hien_tai.la_hau_ky ? (_tb_dai_canh_muc_tieu ? _tb_dai_canh_muc_tieu + ' sơ kỳ' : 'phi thăng tiên giới') : (_tb_hien_tai.dai_canh_gioi + ' ' + _tb_tieu_canh_tiep_theo));\nconst _tb_L_muc_tieu = _tb_pham_nhan ? 1 : (_tb_hien_tai.la_hau_ky ? (_tb_hien_tai.dai_canh_gioi_L + 1) : (_tb_hien_tai.L + 0.2));\nconst _tb_tien_do_dat_chuan = _tb_tien_do_hien_tai >= _tb_gioi_han_tien_do;\nconst _tb_R = _tb_bang_he_so_linh_can[_tb_linh_can_pham_giai] ?? 0;\nconst _tb_hien_thi_R = `${_tb_linh_can_pham_giai}(R=${_tb_R > 0 ? '+' : ''}${_tb_R * 100}%)`;\n\n// ============ ③ Quy tắc Lịch kiếp Đại cảnh giới (Cắt tỉa theo Đại cảnh giới mục tiêu, chỉ xuất ra một quy tắc liên quan hiện tại) ============\nconst _tb_bang_lich_kiep = {\n  'luyện khí': `luyện khí (phàm nhân->luyện khí sơ kỳ):\n    - Quy tắc: Tìm kiếm [linh căn], nếu là \"vô linh căn\" thì tự động thất bại; ngược lại tự động thành công`,\n  'trúc cơ': `trúc cơ (luyện khí hậu kỳ->trúc cơ sơ kỳ):\n    - Bắt buộc phải có [trúc cơ đan] trong vật phẩm, nếu không tự động thất bại (Hiện tại: ${_tb_co_truc_co_dan ? 'Có' : 'Không'})\n    - Phán định Ngưng khí hải: Độ khó [D] tăng thêm (thể chất[khí cảm] × 2) (khí cảm hiện tại=${_tb_khi_cam})`,\n  'kim đan': `kim đan (trúc cơ hậu kỳ->kim đan sơ kỳ) - \"Tam tụ cửu chuyển\":\n    - Đình chỉ quy trình thông thường, bắt buộc tiến vào 【Giai đoạn tụ khí】 kéo dài 3 hiệp\n    - Mỗi hiệp hệ thống tự động thử nén linh khí 3 lần (tổng cộng 9 lần tương ứng 9 chuyển)\n    - Tiêu hao linh khí: Tiêu hao cố định Chuyển thứ N = floor(10^L × N × 0.1) (Kim Đan kỳ L=3.0)\n    - Logic phán định: Nếu linh khí hiện tại ≥ tiêu hao, thì chuyển đó thành công và bị trừ đi, tiếp tục chuyển tiếp theo; nếu không đủ, lượng bơm vào còn lại trong hiệp này lập tức dừng lại\n    - Khoảng trống giữa các hiệp: Khi kết thúc mỗi hiệp sẽ tạm dừng, <user> có thể thực hiện 1 hành động chiến thuật (ví dụ uống 1 lần đan dược hồi phục), sau đó tiến vào hiệp tiếp theo\n    - Kết toán: Kết thúc 3 hiệp sẽ tính tổng số lần thành công cuối cùng thành 【N chuyển Kim Đan】 (N=1~9), N=0 thì đột phá thất bại\n    (linh khí hiện tại: ${_tb_linh_khi_hien_tai}/${_tb_linh_khi_toi_da})`,\n  'nguyên anh': `nguyên anh (kim đan hậu kỳ->nguyên anh sơ kỳ) - \"Toái đan và Tâm ma\":\n    - Bắt buộc chuyển sang <rule ref=\"Quy tắc Chiến đấu\"/>\n    - Toái đan phản phệ: Khi bắt đầu chiến đấu <user> nhận trạng thái không thể xua tan [Toái đan suy nhược] -> khí huyết và linh khí hiện tại giảm một nửa (duy trì đến khi kết thúc đột phá)\n    - Sinh thành túc địch: Triệu hồi 【Tâm ma】 (Ngoại trừ không có trạng thái suy nhược, mọi thứ khác hoàn toàn giống hệt <user>)\n    - Ảo thuật can nhiễu: Trước khi bắt đầu mỗi hiệp, Tâm ma tung ra thêm một đòn tấn công 【Ý đồ ảo thuật】 vào <user> (Coi như một hành động phụ của Tâm ma)\n    - Điều kiện thắng thua: Đánh bại Tâm ma -> Đột phá thành công; Bại trận -> Đột phá thất bại + Tẩu hỏa nhập ma`,\n  'hóa thần': `hóa thần (nguyên anh hậu kỳ->hóa thần sơ kỳ) - \"Dung hợp pháp tắc\":\n    - Cần chọn rõ một hạng mục [kỹ nghệ] của bản thân để tiến hành kiểm định pháp tắc khắt khe (Mặc định lấy hạng mục cao nhất) (Cao nhất hiện tại: ${_tb_ky_nghe_cao_nhat ? `${_tb_ky_nghe_cao_nhat.ten}=${_tb_ky_nghe_cao_nhat.gia_tri}` : 'Không rõ'})\n    - Độ khó pháp tắc: D_law = floor(10^L × 2) + thiên kiếp + đan độc\n    - Công thức kiểm định: Giá trị [kỹ nghệ] đó của bản thân × (1+[Z%]) + d20 vs D_law`,\n  'phản hư': `phản hư (hóa thần hậu kỳ->phản hư sơ kỳ) trở lên (Linh giới):\n    - Sau khi vượt qua phán định cơ sở sẽ tiến vào lịch kiếp đại cảnh giới (Quy tắc chưa được miêu tả chi tiết, kết hợp với đặc tính của cảnh giới đó để diễn giải, thất bại thì tẩu hỏa nhập ma/tu vi tụt lùi)`,\n};\n\nlet _tb_doan_lich_kiep = '';\nif (!_tb_dai_canh_muc_tieu) {\n  _tb_doan_lich_kiep = 'Đã đến độ kiếp hậu kỳ, đột phá thêm (phi thăng tiên giới) vượt quá phạm vi tài liệu này';\n} else if (_tb_the_gioi === 'phàm giới' && ['phản hư', 'hợp thể', 'đại thừa', 'độ kiếp'].includes(_tb_dai_canh_muc_tieu)) {\n  _tb_doan_lich_kiep = 'phản hư (hóa thần hậu kỳ->phản hư sơ kỳ) trở lên: Cần phi thăng Linh giới mới có thể tiến hành (Linh khí Phàm giới không đủ để gánh vác)';\n} else if (_tb_co_the_vuot_dai_canh) {\n  _tb_doan_lich_kiep = _tb_bang_lich_kiep[_tb_dai_canh_muc_tieu] || `Lịch kiếp 【${_tb_dai_canh_muc_tieu}】 (Quy tắc chưa được miêu tả chi tiết): Sau khi vượt qua phán định cơ sở sẽ tiến vào lịch kiếp, kết hợp với đặc tính của cảnh giới đó để diễn giải, thất bại thì tẩu hỏa nhập ma/tu vi tụt lùi`;\n}\n\n// ============ ④ Phần thưởng Đại cảnh giới (Cắt tỉa theo Đại cảnh giới mục tiêu) ============\nconst _tb_bang_phan_thuong = {\n  'luyện khí': '',\n  'trúc cơ': 'Phần thưởng Trúc Cơ: ngộ tính/căn cốt/khí cảm tăng floor([khí cảm] × 0.2)',\n  'kim đan': 'Phần thưởng Kim Đan: Nhận trạng thái vĩnh viễn [N chuyển Kim Đan] (Hiệu quả: tốc độ tu hành thường trú +N×5%)',\n  'nguyên anh': 'Phần thưởng Nguyên Anh: ngộ tính/căn cốt/khí cảm tăng 15 điểm',\n  'hóa thần': 'Phần thưởng Hóa Thần: Phẩm chất tâm pháp thăng cấp (Tối đa Thiên giai) dung hợp hiệu quả pháp tắc, [kỹ nghệ] dùng để phán định đột phá tăng 50000 điểm',\n};\nlet _tb_doan_phan_thuong_dai_canh = '';\nif (_tb_co_the_vuot_dai_canh) {\n  _tb_doan_phan_thuong_dai_canh = '\\n      * Tôi độc trọng sinh: đan độc -> floor(đan độc×0.5) (Đan độc bị ép ra khỏi cơ thể cùng với bụi bẩn)\\n      * Thọ nguyên bạo tăng: 15 × L sau khi đột phá^3';\n  if (_tb_bang_phan_thuong[_tb_dai_canh_muc_tieu]) _tb_doan_phan_thuong_dai_canh += `\\n      * ${_tb_bang_phan_thuong[_tb_dai_canh_muc_tieu]}`;\n}\n\n// ============ ⑤ Lắp ráp Output ============\nconst _tb_nhac_nho_nguong = _tb_tien_do_dat_chuan ? '' : `\\n  ⚠ Tu vi hiện tại ${_tb_tien_do_hien_tai}/${_tb_gioi_han_tien_do}, chưa đạt ngưỡng thăng cấp[Y], điều kiện kích hoạt chưa được thỏa mãn; Cần tích lũy tu vi theo <rule ref=\"Quy tắc Thu thập Tu vi\"> trước`;\nconst _tb_giai_doan_hai = _tb_co_the_vuot_dai_canh ? `  ${_tb_doan_lich_kiep}` : `  Hiện tại là [${_tb_canh_gioi}], chưa đến ngưỡng vượt đại cảnh giới (Cần hậu kỳ viên mãn), vòng này chỉ thực hiện phán định thăng cấp tiểu cảnh giới`;\n\nconst _tb_output = `# Quy tắc Đột phá (Thích ứng động: Chỉ xuất ra phần liên quan đến cảnh giới hiện tại)\n# Khai báo tham số:\n  L=Hệ số Cảnh giới R=Hệ số Linh căn E_local=Hệ số Môi trường Cục bộ\n  [P]=Tổng giá trị năng hiệu đột phá | [D]=Lực cản độ khó đột phá | [Giá trị thiên kiếp]/[Giá trị đan độc]=Lực cản tích lũy của nhân vật (Lấy từ <status_current_variable> tiến độ tu luyện), trực tiếp nâng cao [D]\n  [Z%] = Khớp với max(Tăng ích % liên quan) - max(Giảm ích % liên quan) của thuộc tính tính toán hiện tại\n  [W] = Khớp với max(Giá trị tăng liên quan) - max(Giá trị giảm liên quan) của thuộc tính tính toán hiện tại\n  [M] = Hệ số nhân tư chất và môi trường = (1 + R + E_local + [Z%])\n  [X/Y] = Tiến độ tu vi hiện tại / Ngưỡng thăng cấp  [Y] = 10^L × 100\n  (Chú ý: Z% và W là giá trị tìm kiếm động, chỉ tìm kiếm các cộng thêm trạng thái liên quan đến \"giảm độ khó đột phá\" hoặc \"tăng xác suất đột phá\"; E_local phán đoán nồng độ linh khí dựa trên bối cảnh hiện tại, tham khảo Bảng Hệ số Môi trường Cục bộ trong <rule ref=\"Bảng Hệ số Cốt lõi\"/>)\n\n# Suy luận hiện tại:\n  Cảnh giới: ${_tb_canh_gioi}(L=${_tb_hien_tai.L}) → Mục tiêu [${_tb_canh_gioi_muc_tieu}](L=${_tb_L_muc_tieu})\n  Linh căn: ${_tb_hien_thi_R} | Thiên kiếp: ${_tb_thien_kien} | Đan độc: ${_tb_dan_doc}${_tb_nhac_nho_nguong}\n\n# Điều kiện kích hoạt cốt lõi:\n  Kích hoạt: 1. <user> tuyên bố rõ ràng tiến hành đột phá 2. Tu vi hiện tại [X] ≥ Ngưỡng thăng cấp [Y]\n  Cấm: Hành vi đột phá không phải của <user> (Chỉ thể hiện bằng trần thuật)\n\n# Phán định Tiểu cảnh giới:\n  1. Phạm vi áp dụng: Tất cả thăng cấp tiểu cảnh giới (như sơ kỳ->trung kỳ) và kiểm định cơ sở tiền đề cho việc vượt đại cảnh giới\n  2. Công thức Năng hiệu: [P] = floor((10^L + Tâm pháp[tốc độ tu hành]×10) × [M]) + d20  (tốc độ tu hành hiện tại=${_tb_toc_do_tu_hanh})\n  3. Công thức Độ khó: [D] = Max(1, floor(10^L × 1.5) + [Giá trị thiên kiếp] + [Giá trị đan độc] - [W])\n  4. Tiêu chuẩn Phán định:\n    - [P] ≥ [D] -> Tiểu cảnh giới bước vào 【Kết toán đột phá thành công】; Đại cảnh giới bước vào 【Lịch kiếp Đại cảnh giới】\n    - [P] < [D] -> Nhảy đến 【Kết toán đột phá thất bại】\n\n  Bảng thông số Phán định cơ sở:\n  <action_info>\n    {Phán định Cơ sở Đột phá}\n    | Cảnh giới mục tiêu: [Tên](L=[L]) | R=[X] | E_local=[X] | Tăng ích đột phá[Z%]=[X%] |\n    | Năng hiệu[P]: floor((10^[L]+Tốc độ tâm pháp[X]×10)×[M]) + d20[Giá trị xúc xắc] = [Giá trị P] |\n    | Độ khó[D]: Max(1, floor(10^[L]×1.5)+thiên kiếp[X]+đan độc[X]-[W]) = [Giá trị D] |\n    | Kết quả: [P] vs [D] -> [Thành công(Tiểu cảnh giới thăng cấp trực tiếp/Đại cảnh giới bước vào lịch kiếp) / Thất bại] |\n  </action_info>\n\n# Lịch kiếp Đại cảnh giới:\n${_tb_giai_doan_hai}\n\n# Kết toán Đột phá:\n  1. Kết toán đột phá thành công\n    - Bể tu vi: [Tu vi X hiện tại] về 0, [Y] cập nhật thành ngưỡng cảnh giới mới [Y] = 10^L × 100, Cập nhật nhãn [cảnh giới] của nhân vật\n    - Trạng thái đầy đủ: khí huyết và linh khí hồi phục đến mức tối đa mới\n    - Phần thưởng khổng lồ Đại cảnh giới (Chỉ khi vượt đại cảnh giới thành công):${_tb_doan_phan_thuong_dai_canh || '\\n      (Không, vòng này không phải là vượt đại cảnh giới)'}\n  2. Kết toán đột phá thất bại\n    - Tu vi tụt lùi: Trừ đi tu vi tương đương với 20% giới hạn cảnh giới hiện tại [Y]\n  3. Tính toán lại tài nguyên\n    - Khí huyết tối đa = floor(10^L × (1+căn cốt×0.1)) | Linh khí tối đa = floor(10^L × (1+khí cảm×0.1)) | Độn tốc = floor(10^L × (1+căn cốt×0.02))\n  4. Chỉ đạo trần thuật: Khi đột phá đại cảnh giới thành công·tôi độc trọng sinh, miêu tả độc tố cùng bụi bẩn bị ép ra khỏi lỗ chân lông (ví dụ: trên da nổi lên một lớp bụi bẩn màu nâu đen dày cộm, bốc mùi hôi thối), sau khi gột rửa sạch sẽ thì rạng rỡ hẳn lên\n  5. Yêu cầu xuất ra: Quá trình lịch kiếp và kết toán được trình bày bằng bảng <action_info>, trước khi xuất ra phải suy nghĩ bằng <!-- ... -->`;\n_%>\n<%- _tb_output %>\n<%_ } _%>\n</rule>"],["物品功法生成规则","<%_ { let _ngu_canh_luyen_dan = false, _ngu_canh_dot_pha = false, _ngu_canh_san_xuat = false, _ngu_canh_tran_phap = false, _ngu_canh_thien_kien = false; try {\n  const _bat_dau = Math.max(0, lastMessageId - 3);\n  const _thuong_van = getChatMessages(`${_bat_dau}-${lastMessageId}`).map(m => m.message).join('\\n');\n  _ngu_canh_luyen_dan = ['luyện đan','luyện dược','đan dược','đan phương','đan lô','đan đỉnh','đan thất','đan độc','uống đan'].some(k => _thuong_van.includes(k));\n  _ngu_canh_dot_pha = ['đột phá','bình cảnh','trúc cơ đan'].some(k => _thuong_van.includes(k));\n  _ngu_canh_san_xuat = _ngu_canh_luyen_dan || ['luyện chế','luyện khí','chế phù','khắc phù','trận bàn','khắc lục','rèn đúc','khí đỉnh','đài rèn','dao khắc','phù bút','thuần thú','linh thực'].some(k => _thuong_van.includes(k));\n  _ngu_canh_tran_phap = ['trận pháp','trận bàn','kết trận','bố trận','pháp trận','trận nhãn','trận kỳ'].some(k => _thuong_van.includes(k));\n  _ngu_canh_thien_kien = _thuong_van.includes('thiên kiếp');\n} catch (e) {} _%>\n<rule name=\"Quy tắc Sinh thành Vật phẩm Công pháp\">\n# Khai báo tham số:\n  L=Hệ số Cảnh giới Q=Hệ số Phẩm chất R=Hệ số Linh căn k=Hệ số Sinh thành\n  G(k)=floor(10^L×k×(1+Q))   # Giá trị sinh thành: Giá trị nhãn và giá trị hiệu quả \"Loại giá trị cố định\" đều =G(k)\n\n# &RULE_Quy tắc Ánh xạ Nhãn:\n  Khi sinh thành nhãn, nghiêm ngặt áp dụng định dạng ghép nối trực tiếp `[Tên thuộc tính:Giá trị/Văn bản]`.\n  | Phân loại | Thể loại | Nhãn bắt buộc (Không được bỏ sót) |\n  | --- | --- | --- |\n  | Trang bị | Pháp bảo | [công kích:X] |\n  | Trang bị | Hộ giáp | [phòng ngự:X] |\n  | Trang bị | Trang sức | (Không có nhãn bắt buộc) |\n  | Vật phẩm | Phù lục | [tiêu hao linh khí:X]、[công kích:X] (Loại không tấn công có thể =0) |\n  | Vật phẩm | Tài liệu | [độ khó luyện chế:X] |\n  | Vật phẩm | Bí tịch | [độ hoàn chỉnh:tàn khuyết/bản sao/bản gốc]、[tiến độ đọc:X/Y] | //Mặc định X=0;Y = max(1, ceil(L / 2))\n  | Vật phẩm | Đan dược/Công cụ | (Không có nhãn bắt buộc) |\n  | Vật phẩm | Công thức | [kỹ nghệ tương ứng:luyện khí|thuần thú|linh thực|y thuật|luyện đan|chế phù|ngự vật|pháp thuật|huyễn thu   t|trận pháp|thần thức|luyện thể] |\n  | Công pháp | Tâm pháp | [tốc độ tu hành:X] |\n  | Công pháp | Công kích/Chú pháp | [chính xác:X][xuyên thấu%:X][công kích:X] |\n  | Công pháp | Thần thức | [công kích:X] |\n  | Công pháp | Thân pháp | [né tránh:X][độn tốc:X] |\n  | Công pháp | Hộ thể | [chịu đòn linh khí|chịu đòn khí huyết][giảm thương%:X][phòng ngự:X] |\n  | Công pháp | Trận pháp | [dung lượng linh khí:X][công kích:X] |\n  (Chú ý: Có thể tự do thêm các [nhãn:X] phù hợp với bối cảnh)\n\n# &RULE_Bảng Hệ số Sinh thành Vật phẩm: (Giá trị nhãn=G(k), bảng dưới đây cung cấp k cho từng thuộc tính)\n  | Phân loại | Thuộc tính | k | Giải thích |\n  | --- | --- | --- | --- |\n  | Hộ giáp | phòng ngự | 0~0.2 | Hộ giáp đặc thù có thể =0 |\n  | Công pháp(Tâm pháp) | tốc độ tu hành | 0.1~0.5 | |\n  | Công pháp(Công kích/Chú pháp)| công kích | 0.2~0.5 | |\n  | Công pháp(Thần thức)| công kích | 0.1~0.3 | |\n  | Công pháp(Thân pháp) | độn tốc | 0.5~2.5 | |\n  | Công pháp(Hộ thể) | phòng ngự | 0.1~0.4 | |\n  | Công pháp | tiêu hao linh khí | 0~0.5 | Loại kích hoạt bị động có thể =0 |\n  | Pháp bảo | công kích | 0.1~0.3 | |\n  | Khôi lỗi | khí huyết | 0.5~1 | |\n  | Linh thú | khí huyết | 5~15 | |\n  | Kỹ năng Khôi lỗi/Linh thú | công kích | 0~0.3 | Tham khảo khi sinh thành kỹ năng cho Khôi lỗi/Linh thú |\n  | Khôi lỗi/Linh thú | phòng ngự | 0~0.2 | |\n  | Khôi lỗi/Linh thú | độn tốc | 0.5~2 | |\n  | Công pháp(Trận pháp) | dung lượng linh khí | 2~6 | Cần kết trận bơm linh khí; tiêu hao cố định là không |\n  | Công pháp(Trận pháp) | công kích | 0~0.3 | Trận pháp không phải loại tấn công =0 |\n  | Phù lục | công kích | 0~0.8 | Phù lục không tấn công =0 |\n  | Phù lục | tiêu hao linh khí | 0.1~0.3 | |\n  Quy tắc đặc biệt (Không dùng G(k)):\n    - Chính xác/Né tránh chỉ cộng giá trị cố định: max(1,floor(L/2+2Q))\n      Chú ý: Giá trị này cộng vào d20, khi đối kháng cùng cảnh giới chênh lệch từ 1-3, giữ nguyên tác dụng quyết định của tính ngẫu nhiên d20\n    - Xuyên thấu%/Giảm thương% chỉ hiệu chỉnh phần trăm: L×5%+Q×20%\n      Chú ý: Khi đối kháng cùng cảnh giới Xuyên thấu% và Giảm thương% gần như triệt tiêu nhau, chênh lệch trang bị quyết định mức tăng giảm thực tế\n\n# &RULE_Chỉ đạo Cộng thêm Hiệu quả:\n  Yêu cầu cốt lõi: Phong cách từ khóa vật phẩm RPG, nội dung cụ thể rõ ràng, **Cấm miêu tả mơ hồ (ví dụ: hơi\\lượng lớn\\cực lớn\\lượng nhỏ...)**\n  Phân loại hiệu quả:\n    Loại phi số hóa:(ví dụ: miễn nhiễm với xx)\n      1. Phải đính kèm giới hạn cảnh giới (ví dụ: Miễn nhiễm với độc tố của cảnh giới Trúc Cơ sơ kỳ trở xuống)\n      2. Liên kết phẩm chất:\n        - Phạm vi hiệu lực (ví dụ: Hoàng giai -> Miễn nhiễm thiềm độc; Thiên giai -> Miễn nhiễm độc tố)\n        - Cường độ hiệu quả (ví dụ: Phàm giai -> Đau bụng; Hoàng giai -> Tiêu chảy)\n      3. Liên kết ngũ hành hợp lý (ví dụ: Dương -> Khắc chế tà ma, Hỏa -> Giữ ấm chống rét)\n    Loại số hóa:(ví dụ: công kích +10; công kích +10%)\n      1. Cấm sinh thành: Giới hạn khí huyết|linh khí (Không được xuất hiện trong hiệu quả)\n      2. Loại số hóa d20 (chính xác/né tránh/xuyên thấu/giảm thương): max(1,floor(L/2+2Q))\n      3. Loại phần trăm (+Z%): L×(1+Q)×(1% ~ 2%)\n      4. Loại giá trị cố định (+W): G(k), mặc định k=0.1~0.2\n      5. Liên kết ngũ hành hợp lý, ví dụ: Thủy -> Hồi phục khí huyết, Kim -> Công kích\n      6. Hiệu quả kích hoạt bằng cách đốt tinh huyết phải ghi rõ số giọt tinh huyết đốt (1~3 giọt)\n    Loại trần thuật:(Chỉ có chữ trần thuật)\n      1. Tài liệu: Trần thuật về ảnh hưởng đối với thành phẩm khi dùng trong sản xuất\n      2. Bí tịch: Thể loại bí tịch [tâm pháp|công kích|pháp thuật|thần thức|huyễn thuật|thân pháp|hộ thể|kỹ nghệ] và giới thiệu nội dung (không liên quan đến số hóa)\n      3. Công thức: Ghi chép nguyên liệu cần thiết (2-3 loại nguyên liệu)\n  Ví dụ hiệu quả:(Ưu tiên sử dụng các hiệu quả có trong ví dụ)\n    Hiệu quả chiến đấu:\n      - ${Dưới điều kiện nào đó}, khi tính toán ${kỹ nghệ}, coi như ${tăng|giảm}${G(k=0.1~0.3)}\n      - ${Dưới điều kiện nào đó}, ${công kích|phòng ngự|độn tốc} coi như ${tăng|giảm}${G(k=0.1~0.2)}\n      - ${Dưới điều kiện nào đó}, ${chính xác|né tránh} coi như ${tăng|giảm}${max(1,floor(L/2+2Q))}\n      - ${Dưới điều kiện nào đó}, ${xuyên thấu|giảm thương} coi như ${tăng|giảm}${L×5%+Q×20%}\n      - ${Dưới điều kiện nào đó}, ${phe ta|bản thân} kèm theo ${trạng thái}, ${hiệu quả trạng thái}, ${thời gian duy trì}\n      - ${Dưới điều kiện nào đó}, kẻ địch ${cảnh giới} trở xuống bị kèm theo ${trạng thái}, ${hiệu quả trạng thái}, ${thời gian duy trì}\n      - ${Dưới điều kiện nào đó}, giải trừ ${trạng thái loại nào đó}\n    Hiệu quả sản xuất:\n      - Khi ${luyện đan|luyện khí|chế phù|trận pháp} 【Cộng thêm công cụ】 là ${G(k=0.5~1.5)}\n      - Khi ${luyện đan|luyện khí} 【Cộng thêm ngọn lửa】 là ${G(k=0.5~1.5)}\n<%_ if (_ngu_canh_san_xuat) { _%>\n      - ${Công thức cụ thể} 【Sản lượng đơn vị】 tăng thêm ${1~3} cái\n      - Lần đầu sản xuất công thức thành công, giá trị thu được của ${kỹ nghệ} tăng ${2Q}%\n<%_ } _%>\n    Hiệu quả vật phẩm (Đan dược):\n      - Tu sĩ ${cảnh giới} trở xuống, giải trừ ${trạng thái}\n      - Tu sĩ ${cảnh giới} trở xuống, thêm ${trạng thái}, ${hiệu quả trạng thái}, ${thời gian duy trì}\n      - Hồi phục ${G(k=1~4)} ${linh khí/khí huyết}\n      - Nâng cao ${G(k=1~4)} tu vi\n<%_ if (_ngu_canh_luyen_dan) { _%>\n      - Nâng cao ${G(k=0.2~0.6)} năm thọ nguyên\n      - Đan độc thay đổi ${floor(10^L×(0.1~0.2)×(0.75-Q))} điểm (Chỉ Thiên phẩm giảm độc)\n<%_ } _%>\n<%_ if (_ngu_canh_luyen_dan || _ngu_canh_thien_kien) { _%>\n      - Thiên kiếp thay đổi ${floor(10^L×(0.1~0.2)×(0.75-Q))} điểm (Chỉ Thiên phẩm giảm kiếp)\n<%_ } _%>\n<%_ /* Loại đột phá: Khi luyện đan hoặc thượng văn xuất hiện \"đột phá/bình cảnh/trúc cơ đan\", đều có thể kích hoạt độc lập */ _%>\n<%_ if (_ngu_canh_luyen_dan || _ngu_canh_dot_pha) { _%>\n      - Khi đột phá ${cảnh giới} giảm độ khó ${L×5%+Q×20%}\n      - Khi đột phá ${cảnh giới} tăng tỷ lệ thành công ${L×(1+Q)×(1%~2%)}\n<%_ } _%>\n    Hiệu quả trạng thái:\n      - ${Tăng|giảm} tốc độ bài trừ đan độc ${L×(1+Q)×(1%~2%)}\n      - ${Tăng|giảm} tốc độ tu hành của ${phương thức tu luyện} ${L×(1+Q)×(0.5%~1%)}\n<%_ if (_ngu_canh_tran_phap) { _%>\n      - Linh khí ${trận pháp} ${tăng|giảm}${G(k=0.5~1.5)}\n<%_ } _%>\n      - ${Tăng|giảm} ${linh khí/khí huyết} ${G(k=0.05~0.1)}\n      - ${Hôn mê|Phong cấm|Giam cầm|Bỏ qua lượt chiến đấu tiếp theo}\n\n# Định dạng Sinh thành Vật phẩm\n  Kích hoạt: Khi cần hiển thị bất kỳ thông tin thực thể nào\n    - Ví dụ: Mua hoặc đấu giá, kiểm kê chiến lợi phẩm, sản xuất hoàn tất, phát hiện tài liệu...\n  Ràng buộc:\n    - Tất cả các giá trị số tuân theo *RULE_Bảng Hệ số Sinh thành Vật phẩm và *RULE_Chỉ đạo Cộng thêm Hiệu quả\n    - Nhãn tuân thủ nghiêm ngặt *RULE_Quy tắc Ánh xạ Nhãn\n  ## Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->\n  <!--\n    - ${Loại thực thể: Vật phẩm/Trang bị/Công pháp}\n    - ${Xác định cảnh giới L và phẩm chất Q dựa trên bối cảnh kích hoạt}\n    - ${Dựa vào *RULE_Bảng Hệ số Sinh thành Vật phẩm; xác nhận phạm vi hệ số tương ứng với từng thuộc tính của thực thể này}\n    - ${Xác nhận *RULE_Quy tắc Ánh xạ Nhãn; đảm bảo không bỏ sót nhãn bắt buộc}\n    - ${Xác nhận *RULE_Chỉ đạo Cộng thêm Hiệu quả; xác nhận số lượng hiệu quả (Phàm/Hoàng=1, Huyền/Địa=2, Thiên=3), xác nhận loại hiệu quả hợp lệ}\n  -->\n  ## Loại Vật phẩm (Bí tịch/Công thức/Phù lục/Đan dược/Tài liệu/Công cụ)\n  <item_info>\n    {Tên vật phẩm}\n    | phẩm chất: [phàm|hoàng|huyền|địa|thiên] |\n    | cảnh giới: [Cảnh giới] |\n    | thể loại: [bí tịch|công thức|phù lục|đan dược|tài liệu|công cụ] |\n    | ngũ hành: [kim|mộc|thủy|hỏa|thổ|âm|dương|hỗn độn] |\n    | nhãn: [Nhãn 1][Nhãn 2]... |\n    | số lượng: [num] |\n    | hiệu quả: [Tên hiệu quả: Hiệu quả]... |\n    | mô tả: [Miêu tả mang tính trần thuật] |\n  </item_info>\n\n  ## Loại Trang bị (Pháp bảo/Hộ giáp/Trang sức)\n  <item_info>\n    {Tên trang bị}\n    | phẩm chất: [phàm|hoàng|huyền|địa|thiên] |\n    | cảnh giới: [Cảnh giới] |\n    | thể loại: [pháp bảo|hộ giáp|trang sức] |\n    | ngũ hành: [kim|mộc|thủy|hỏa|thổ|âm|dương|hỗn độn] |\n    | tiêu hao: [linh khí:N|khí huyết:N|không] |\n    | nhãn: [Nhãn 1][Nhãn 2]... |\n    | hiệu quả: [Tên hiệu quả: Hiệu quả]... |\n    | mô tả: [Miêu tả mang tính trần thuật] |\n    | vị trí: [tay|áo trên|quần dưới|đầu|chân|áo ngực|quần lót|tất|khoác ngoài|eo|dây chuyền|nhẫn|túi trữ vật] |\n  </item_info>\n\n  ## Loại Công pháp (Tâm pháp/Công kích/Huyễn thuật/Thần thức/Pháp thuật/Thân pháp/Hộ thể/Trận pháp)\n  Chú ý: Công pháp chỉ được sinh ra bởi <rule ref=\"Quy tắc Lĩnh ngộ\"/>; Trận pháp tiêu hao cố định là không (Kết trận theo Quy tắc chiến đấu Hành động chiến thuật.Kết trận)\n  <item_info>\n    {Tên công pháp}\n    | phẩm chất: [phàm|hoàng|huyền|địa|thiên] |\n    | cảnh giới: [Cảnh giới] |\n    | ngũ hành: [kim|mộc|thủy|hỏa|thổ|âm|dương|hỗn độn] |\n    | thể loại: [tâm pháp|công kích|huyễn thuật|thần thức|pháp thuật|thân pháp|hộ thể|trận pháp] |\n    | tiêu hao: [linh khí:N|khí huyết:N|không] |   #Trận pháp=không\n    | nhãn: [Nhãn 1][Nhãn 2]... |\n    | hiệu quả: [Tên hiệu quả: Hiệu quả]... |\n    | mô tả: [Miêu tả mang tính trần thuật] |\n  </item_info>\n\n</rule>\n<%_ } _%>"],["修为获取规则","<rule name=\"Quy tắc Thu thập Tu vi\">\n# Khai báo tham số:\n  L=Hệ số Cảnh giới R=Hệ số Linh căn E_realm=Hệ số Môi trường Giới vực E_local=Hệ số Môi trường Cục bộ\n  [Z%] = Khớp với max(Tăng ích % liên quan) - max(Giảm ích % liên quan) của thuộc tính tính toán hiện tại\n  [W] = Khớp với max(Giá trị tăng liên quan) - max(Giá trị giảm liên quan) của thuộc tính tính toán hiện tại\n  (Chú ý: Z% và W là giá trị tìm kiếm động, chỉ tìm kiếm các cộng thêm trạng thái liên quan đến \"tốc độ tu hành\" hoặc \"thu thập tu vi\")\n  [X/Y] = Tiến độ tu vi hiện tại / Ngưỡng thăng cấp  [Y] = 10^L × 100\n  [T] = Thời gian tiêu hao của hành vi (Thống nhất chuyển đổi thành số ngày, 1 năm = 365 ngày)\n\n# Điều kiện kích hoạt cốt lõi: \n  Kích hoạt: <user> thực hiện rõ ràng hành vi thu thập tu vi. Ví dụ: Đả tọa, song tu, thái bổ, đoạt linh v.v...\n  Cấm:\n    1. Hành vi tình dục chưa tuyên bố rõ ràng là song tu/thái bổ\n    2. Giết chóc (Mặc định không đoạt linh)\n    3. Khi [X] ≥ [Y], coi như lần tu luyện này thực chất là ý đồ đột phá, chuyển sang kích hoạt <rule ref=\"Quy tắc Đột phá\"/>\n    4. Hành vi tu luyện không phải của <user> (Chỉ thể hiện bằng trần thuật)\n\n# Logic và Công thức Kênh thu thập\n  ## Kênh 1: Tu luyện\n    1. Điều kiện: Đang ở trạng thái phi chiến đấu/không bị can nhiễu, tuyên bố rõ ràng thời gian tiêu hao [T] ngày (Mặc định T=30)\n    2. Công thức Tu vi:\n      Thu thập hàng ngày = Tâm pháp[tốc độ tu hành]/10^(L+1) × (1 + R) × (E_realm + E_local)\n      Tu vi cuối cùng = floor(Thu thập hàng ngày × T × (1+[Z%])) + [W]\n    3. Đính kèm·Luyện hóa đan độc (Khi tu luyện nhục thân tự nhiên tôi luyện độc, nhân tiện bài trừ đan độc):\n      Luyện hóa hàng ngày = floor( 10^L × 0.2 × (1 + căn cốt×0.1) × (1 + [Z%]_độc) ) + [W]_độc\n      Thanh trừ đan độc = min( đan độc hiện tại, floor(Luyện hóa hàng ngày × T) )\n      đan độc -= Thanh trừ đan độc\n\n  ## Kênh 2: Uống đan\n    1. Điều kiện: Uống đan dược nâng cao tu vi (Tài liệu chưa luyện đan không thể ăn)\n    2. Giải thích: Có thể uống nhiều loại/nhiều phẩm chất đan dược một lần, thay từng loại (i) vào, kết toán làm hai bước\n    3. Step1·Tu vi:\n      Tiểu kế tu vi = Σ_i ( đan dược[giá trị nâng cao]_i × số lượng_n_i )\n      Tu vi cuối cùng = floor(Tiểu kế tu vi × (1+[Z%])) + [W]   # [Z%]/[W] tìm kiếm liên quan đến \"tốc độ tu hành/thu thập tu vi\"\n    4. Step2·Đan độc:\n      Tổng nguồn độc = Σ_i ( đan dược[giá trị nâng cao]_i × số lượng_n_i × (1 − Q_i/2) )\n      Lượng đan độc tăng = Max(0, floor( Tổng nguồn độc × 0.3 × (1 − [Z%]_độc) ) − [W]_độc )   # [Z%]_độc/[W]_độc tìm kiếm liên quan đến \"đan độc/bài độc\"\n      đan độc += Lượng đan độc tăng\n\n  ## Kênh 3: Song tu\n    1. Tham số cốt lõi:\n      - Cơ số 1 lần = Tâm pháp[tốc độ tu hành]/10^(L+1) × Max(0.1,1 + (L đối phương - L bản thân) × 0.5) × (1+R)\n      - Hệ số linh uẩn [V]: [linh uẩn] nam phương + [linh uẩn] nữ phương. Nếu không có nguyên âm/dương thì [linh uẩn]=0; Thể chất bình thường [linh uẩn]=5, Thể chất đặc thù [linh uẩn]=6~10\n      - Tặng phẩm bản nguyên = min(10^L đối phương × [V], 10^L bản thân × 100)\n    2. Chế độ tính toán lướt qua (Bế quan song tu trong khoảng thời gian dài):\n      - Tích lũy năm tháng = Cơ số 1 lần × T ngày × 5 (Bội số song tu dày đặc)\n      - Công thức: Tu vi cuối cùng = floor( (Tích lũy năm tháng + Tặng phẩm bản nguyên) × (1+[Z%]) ) + [W]\n    3. Chế độ tính toán chi tiết (Suy luận tương tác tức thời):\n      - Kích hoạt: Mỗi lần xuất hiện điểm cao trào rõ ràng (như xuất tinh/lên đỉnh) trong miêu tả hành động được tính là 1 lần tương tác\n      - Công thức: Tu vi cuối cùng = floor( (Cơ số 1 lần × Số lần tương tác + Tặng phẩm bản nguyên) × (1+[Z%]) ) + [W]\n\n  ## Kênh 4: Đoạt linh\n    1. Điều kiện: Mục tiêu không thể phản kháng;\n    2. Công thức lợi ích:\n      - Tu sĩ: Tu vi cuối cùng = floor(10^(min(L bản thân, L mục tiêu))×50 × (mục tiêu[tuổi thọ còn lại/tổng tuổi thọ%])× (1+[Z%]) ) + [W]\n      - Phàm nhân: Tu vi cuối cùng = 1/người (Cần giết chóc số lượng lớn)\n    3. Trả giá và Kết toán thiên kiếp (Cộng dồn tức thời):\n      - Trả giá của mục tiêu: Cảnh giới rớt xuống/Trở thành phế nhân/Chết thành xác khô\n      - Lượng thiên kiếp tăng: \n        * Mục tiêu là tu sĩ: Giá trị thiên kiếp += floor(10^L mục tiêu) (Đánh cắp thiên cơ, tu vi mục tiêu càng cao phản phệ càng lớn)\n        * Mục tiêu là phàm nhân: Giá trị thiên kiếp += 1/người\n\n# Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận kênh kích hoạt (Tu luyện/Uống đan/Song tu/Đoạt linh)}\n    - ${Nếu là song tu, xác nhận <user> có tuyên bố song tu không, có chèn vào âm đạo không, có xuất tinh không}\n    - ${Kiểm tra tu vi hiện tại [X/Y], nếu X≥Y thì chuyển sang <rule ref=\"Quy tắc Đột phá\"/>}\n    - ${Dựa vào kênh, xác nhận nguồn tham số từ <status_current_variables>:\n        Tu luyện→Tâm pháp[tốc độ tu hành]/L bản thân/Linh căn R/Giới vực D/E_local/căn cốt và [Z%]_độc[W]_độc (đính kèm luyện hóa đan độc);\n        Song tu→Công pháp song tu[tốc độ tu hành]/L hai bên/nguyên âm nguyên dương và linh uẩn;\n        Uống đan→Từng loại đan dược[giá trị nâng cao]/số lượng n/phẩm chất Q;\n        Đoạt linh→L bản thân/L mục tiêu/Tỷ lệ tuổi thọ còn lại của mục tiêu so với tổng tuổi thọ}\n    - ${Xác nhận Z%/W tìm kiếm các cộng thêm liên quan trực tiếp đến \"tốc độ tu hành\" hoặc \"thu thập tu vi\"}\n    - ${Xác nhận thời lượng bế quan lần này có kích hoạt <rule ref=\"Quy tắc Đột phá\"/> hay không}\n  -->\n  <action_info>\n    {Tổng quan Trạng thái Tu vi}\n    | Nhân vật: [tên] | Cảnh giới: [cảnh giới hiện tại] (L=[L]) | Bể tu vi: [Tu vi X hiện tại] / [Y] |\n    | Nguyên dương/Nguyên âm: [có/không] | Giá trị thiên kiếp hiện tại: [X] | Giá trị đan độc hiện tại: [X] |\n    {Phân tích Thu thập Tu vi}\n    | Kênh: [Tu luyện / Uống đan / Song tu(lướt qua/chi tiết) / Đoạt linh] | Thời gian T: [X ngày / X lần tương tác] |\n    {Kiểm định Tham số}\n    (Nếu là Tu luyện:)\n    | Công pháp: [Tên tâm pháp][tốc độ tu hành] -> κ=[tốc độ tu hành]/10^(L+1)=[X] | Linh căn R=[X] |\n    | Giới vực: D=[X] -> E_realm=(D/L)²=[X] | Cục bộ: [Miêu tả môi trường] E_local=[X] |\n    | Thu thập hàng ngày: κ[X] × (1+R)[X] × (E_realm+E_local)[X] = [X] Tu vi/ngày |\n    | Đính kèm Luyện hóa: căn cốt[X]->Hệ số tôi độc(1+căn cốt×0.1)[X] | Bài độc [Z%]_độc=[X%] [W]_độc=[X] |\n    | Luyện hóa hàng ngày: floor(10^[L]×0.2×Hệ số tôi độc[X]×(1+[Z%]_độc))+[W]_độc = [X]/ngày -> Tích lũy thanh trừ min(đan độc[X], ×T[X ngày]) = [X] |\n    | Tích lũy đan độc: [X cũ] -> [X mới] |\n    (Nếu là Uống đan:)\n    {Bước 1·Tu vi (Từng loại đan dược)}\n    | [Tên đan dược i] | Phẩm chất[Phàm~Thiên](Q=[X]) | Số lượng[n] | Giá trị nâng cao[X] -> Tiểu kế tu vi Giá trị nâng cao×n=[X] |\n    | ...(Các đan dược khác tương tự theo từng dòng) |\n    | Tổng cộng tu vi: Σ(Giá trị nâng cao×Số lượng) = [X] |\n    {Bước 2·Đan độc (Từng loại đan dược)}\n    | [Tên đan dược i] | Giá trị nâng cao[X]×Số lượng[n]×(1−Q/2)[X] -> Nguồn độc[X] |\n    | ...(Các đan dược khác tương tự theo từng dòng) |\n    | Tổng nguồn độc: Σ = [X] | Bài độc [Z%]_độc=[X%] [W]_độc=[X] |\n    | Lượng đan độc tăng: Max(0, floor(Tổng nguồn độc[X]×0.3×(1−[Z%]_độc)) − [W]_độc) = [X] |\n    | Tích lũy đan độc: [X cũ] -> [X mới] |\n    (Nếu là Song tu:)\n    | Công pháp: [Tên công pháp song tu][tốc độ tu hành] -> κ=[tốc độ tu hành]/10^(L+1)=[X] | L bản thân=[X] | L đối phương=[X] |\n    | Bù trừ cảnh giới C: Max(0.1, 1+([L đối phương]-[L bản thân])×0.5) = [X] |\n    | Cơ số 1 lần: κ[X] × C[X] × (1+R)[X] = [Cơ số] |\n    | Kiểm định Bản nguyên: Nam phương[nguyên dương:có/không,linh uẩn=X] | Nữ phương[nguyên âm:có/không,linh uẩn=X] | V=[X] |\n    | Tặng phẩm bản nguyên: min(10^L đối phương×V[X], 10^L bản thân×100[X]) = [Tặng phẩm] (Một lần duy nhất) |\n    | (Lướt qua) Tích lũy năm tháng = Cơ số[X] × T[X ngày] × 5 = [X] |\n    | (Chi tiết) Tích lũy tương tác = Cơ số[X] × N[X lần] = [X] |\n    | Thay đổi Bản nguyên: Nam phương:nguyên dương:[có/không]->[không] | Nữ phương:nguyên âm:[có/không]->[không] | (Kích hoạt Tặng phẩm bản nguyên bắt buộc cả hai bên mất nguyên âm, nguyên dương)\n    (Nếu là Đoạt linh/Thái bổ:)\n    | Phán định: Mục tiêu[Tu sĩ/Phàm nhân] | L_eff=min(L bản thân[X], L mục tiêu[X])=[X] |\n    | Tỷ lệ tuổi thọ: Còn lại[X]năm / Tổng tuổi thọ[X]năm = [X%] |\n    | Hạch toán lợi ích: 10^L_eff[X] × 50 × Tỷ lệ tuổi thọ[X%] = [X] |\n    {Kết toán Chỉ số}\n    | Tăng/Giảm ích: Z%=[X%] | W=[X] |\n    | Thay vào công thức: [Hiển thị toàn bộ quá trình thay vào] |\n    | Tu vi nhận được: +[Giá trị cuối cùng] |\n    | Phán định Kết toán: Tu vi [X cũ] -> [X mới] / [Y] | Tiến hành Đột phá: [có/không](Mặc định không) |\n    (Nếu là Đoạt linh bổ sung:)\n    | Trả giá của mục tiêu: [Tên mục tiêu] -> [Cảnh giới rớt xuống/Phế nhân/Chết thành xác khô] |\n    | Lượng thiên kiếp tăng: floor(10^L mục tiêu) | Phàm nhân 1/người -> thiên kiếp [X cũ] -> [X mới] |\n  </action_info>\n  Chỉ đạo trần thuật:\n  - Nếu E_realm cực thấp, miêu tả linh khí mỏng manh tu luyện khó khăn\n  - Đoạt linh/Thái bổ: Không trực tiếp miêu tả sự tích lũy thiên kiếp\n</rule>"],["战斗规则","<rule name=\"Quy tắc Chiến đấu\">\n# Khai báo tham số:\n  L=Hệ số Cảnh giới Q=Hệ số Phẩm chất R=Hệ số Linh căn\n  [Z%] = Khớp với max(Tăng ích % liên quan) - max(Giảm ích % liên quan) của thuộc tính tính toán hiện tại\n  [W] = Khớp với max(Giá trị tăng liên quan) - max(Giá trị giảm liên quan) của thuộc tính tính toán hiện tại\n  (Chú ý: Z% và W là giá trị tìm kiếm động, ví dụ khi tính toán \"độn tốc\", chỉ tìm kiếm các cộng thêm trạng thái liên quan đến độn tốc, tuyệt đối không được thay vào cộng thêm loại công kích hoặc phòng ngự)\n\n# Điều kiện kích hoạt cốt lõi: \n  Kích hoạt:\n    1. Tuyên bố rõ ràng bước vào chiến đấu \"hai bên\"\n    2. Cưỡng ép phá trận (Chiến đấu với trận pháp)\n  Cấm:\n    1. Đè bẹp đơn phương (Ví dụ: Chênh lệch cảnh giới L>2, xử lý tù binh, tàn sát, tiêu diệt kẻ địch đang bỏ chạy)\n    2. Phi chiến đấu (Ví dụ: Bị cuốn vào dư chấn chiến đấu của tu sĩ cấp cao, quan hệ tình dục, uy áp xã giao)\n\n# Logic Quy trình:\n  1. Hiệp chiến đấu: Tổng quan chiến cuộc → Thứ tự hành động → Đơn vị chiến đấu lần lượt thực hiện [Hành động tấn công + (Tùy chọn) Hành động chiến thuật] → (Tùy chọn) Phán định chiến ý → (Nếu kết thúc) Kết toán chiến đấu\n  2. Số lần hành động: Mỗi đơn vị chiến đấu trong mỗi hiệp chiến đấu chỉ thực hiện 1 [Hành động tấn công] 1 [Hành động chiến thuật]\n  3. Phán quyết mệnh lệnh: Phân tách mệnh lệnh của <user> theo đơn vị chiến đấu. Nếu một đơn vị duy nhất đưa ra nhiều hành động cùng loại (ví dụ: tấn công liên tục, dùng thuốc tuần tự), chỉ chấp nhận mệnh lệnh đầu tiên; các mệnh lệnh song song của các đơn vị khác nhau có hiệu lực độc lập\n  4. Tần suất: Chính văn chỉ xuất ra 1 hiệp chiến đấu, sau khi hoàn thành sẽ cắt ngang chính văn chờ <user> ra lệnh cho hiệp tiếp theo\n\n# Tổng quan Chiến cuộc:\n  Logic và Quy tắc:\n    1. Loại chiến đấu: Giao hữu/Trấn áp/Tử chiến\n    2. Xác nhận Đơn vị chiến đấu:\n      - Đơn vị chiến đấu chỉ gồm nhân vật, linh thú, khôi lỗi, trận pháp (thực thể tạm thời do công pháp loại trận pháp tạo ra)\n      - Chỉ khi một phe tồn tại ≥3 đơn vị cấp thấp cùng loại, mới có thể gộp thành [Quần thể] (Cá thể × N)\n    3. Hiển thị Trạng thái:\n      - Trong bảng thông số hiển thị toàn bộ đơn vị chiến đấu và trạng thái của chúng\n      - Trận pháp nếu đã tồn tại trước khi bắt đầu chiến đấu thì không cần kết trận\n\n  Template Bảng thông số (Trước khi xuất ra phải suy nghĩ bằng <!-- ... -->):\n  <!--\n    - ${Xác nhận các đơn vị chiến đấu chính xác đang ở trạng thái xuất chiến từ <status_current_variables>}\n    - ${Xác nhận các tham số then chốt như cảnh giới L, độn tốc, phòng ngự của đơn vị chiến đấu}\n    - ${Xác nhận công pháp/trang bị/đạo cụ/kỹ năng đang sử dụng hiện tại của đơn vị chiến đấu, xác nhận các hiệu quả và giá trị tương ứng (nếu không có thì là tay không)}\n    - ${Xác nhận ý đồ phân bổ [Hành động tấn công] và [Hành động chiến thuật] của đơn vị chiến đấu trong hiệp này}\n    - ${Tìm kiếm từ khóa miêu tả của <user>, xác nhận kết quả định tuyến ý đồ (Thông thường/Chiến thuật/Huyễn thuật/Thần thức/Phá trận)}\n    - ${Xác nhận Z% và W: Chỉ tìm kiếm các cộng thêm liên quan trực tiếp đến thuộc tính tính toán lần này, liệt kê nguồn gốc}\n  -->\n  <battle_info>\n    {Tổng quan Chiến cuộc}\n    | Hiệp: [Số hiệp hiện tại] | Loại: [Loại chiến đấu] | Môi trường: [Tóm tắt môi trường] |\n    | [cảnh giới] | [ngũ hành] | [Trận pháp A (Đang kết trận hoặc Đã kết trận)]: linh khí [X/X] (Tùy chọn: | Trạng thái: [Tên trạng thái (N hiệp)]) |\n    | [cảnh giới] | [ngũ hành] | [Nhân vật B/Quần thể nhân vật B (Số lượng sống sót hiện tại/Số lượng ban đầu)]: khí huyết [X/X] | linh khí [X/X] | độn tốc[X] | Kỹ nghệ chiến đấu: [Chỉ liệt kê các mục khác không, ví dụ trận pháp 10 thần thức 5; toàn bộ bằng không thì bỏ qua] (Tùy chọn: | Trạng thái: [Tên trạng thái (N hiệp)]) |\n    | [cảnh giới] | [ngũ hành] | [Linh thú C/Quần thể linh thú C (Số lượng sống sót hiện tại/Số lượng ban đầu)]: khí huyết [X/X] | linh khí [X/X] | độn tốc[X] phòng ngự[X] (Tùy chọn: | Trạng thái:[Tên trạng thái (N hiệp)]) |\n    | [cảnh giới] | [ngũ hành] | [Khôi lỗi D/Quần thể khôi lỗi D (Số lượng sống sót hiện tại/Số lượng ban đầu)]: khí huyết [X/X] | linh khí [X/X] | độn tốc[X] phòng ngự[X] (Tùy chọn: | Trạng thái: [Tên trạng thái (N hiệp)]) |\n    | [cảnh giới] | [ngũ hành] | [Nhân vật E/Quần thể nhân vật E (Số lượng sống sót hiện tại/Số lượng ban đầu)]: khí huyết [X/X] | linh khí [X/X] | độn tốc[X] | Kỹ nghệ chiến đấu: [Chỉ liệt kê các mục khác không, ví dụ trận pháp 10 thần thức 5; toàn bộ bằng không thì bỏ qua] (Tùy chọn: | Trạng thái:[Tên trạng thái (N hiệp)]) |\n    | ...Liệt kê toàn bộ đơn vị tham chiến\n  </battle_info>\n  Chỉ đạo trần thuật: (Phác họa thế đối đầu hiện tại, thú vị của môi trường, khí độ phong thái của nhân vật)\n\n# Thứ tự Hành động: \n  Logic và Quy tắc:\n    1. Công thức: [độn tốc] × (1+[Z%])+[W]\n    2. Sắp xếp: Các đơn vị chiến đấu tham gia sắp xếp, trận pháp sắp xếp cố định ở vị trí cuối cùng; thứ tự danh sách trong bảng thông số là <user>→Đồng đội A...→Kẻ địch A..., tổng giá trị chuỗi hành động từ cao xuống thấp, sinh ra trục hành động của hiệp này\n\n  Template Bảng thông số:\n  <battle_info>\n    {Thứ tự Hành động}\n    | [Nhân vật B]: [độn tốc] × (1+[Z%])+[W]=[Tổng giá trị] |\n    | [Linh thú C]: [độn tốc] × (1+[Z%])+[W]=[Tổng giá trị] |\n    | [Khôi lỗi D]: [độn tốc] × (1+[Z%])+[W]=[Tổng giá trị] |\n    | [Nhân vật E]: [độn tốc] × (1+[Z%])+[W]=[Tổng giá trị] |\n    | [Trận pháp A]: Cố định ở cuối |\n    | Chuỗi: [Nhân vật E] -> [Nhân vật B] -> [Linh thú C] -> [Khôi lỗi D] -> ... |\n  </battle_info>\n  Chỉ đạo trần thuật: (Khắc họa sự nhanh nhẹn hay chậm chạp của hai bên, sự khác biệt về tốc độ xuất thủ)\n\n# Hành động Tấn công:\n  Logic và Quy tắc:\n    1. Số lần tấn công: \n      - Các cuộc tấn công nhiều đoạn của nhân vật phi quần thể được coi là một ý đồ tấn công gộp chung (nhiều đoạn chỉ dùng để miêu tả)\n      - Số lần tấn công của quần thể do tỷ lệ phần trăm khí huyết hiện tại quyết định: khí huyết≥80%→3 lần, khí huyết≥50%→2 lần, khí huyết≥30%→1 lần, khí huyết<30%→1 lần\n    2. Định tuyến ý đồ:\n      - Bảng định tuyến:\n        | Khớp miêu tả | Định tuyến | Độ khó | Kỹ nghệ |\n        | --- | --- | --- | --- |\n        | Tấn công thông thường/Miêu tả mơ hồ/Tấn công điểm yếu/Chém giết | → Kiểm định tấn công | - | - |\n        | Tước vũ khí/Làm tàn phế/Bắt sống | → Đối kháng ý đồ chiến thuật + Kiểm định tấn công | 5 | Không |\n        | Công pháp huyễn thuật/Hiệu quả huyễn hoặc (Mê hoặc/Hỗn loạn/Hôn mê) | → Đối kháng ý đồ huyễn thuật (Bỏ qua kiểm định tấn công) | 2 | huyễn thuật |\n        | Công pháp thần thức/Hiệu quả thần niệm (Chấn nhiếp/Uy áp/Can nhiễu) | → Đối kháng ý đồ thần thức (Bỏ qua kiểm định tấn công) | 0 | thần thức |\n        | Miêu tả phá trận | → Đối kháng ý đồ phá trận (Bỏ qua kiểm định tấn công) | 0 | trận pháp |\n      - Công thức đối kháng ý đồ:\n        floor(10^L bên công+Bên công[kỹ nghệ]*(1+[Z%])+[W])*d20 vs floor(10^L bên thủ+Bên thủ[kỹ nghệ]*(1+[Z%])+[W])*(d20+[Độ khó])\n      - Kết quả ý đồ:\n        * Ý đồ chiến thuật: Thành công→Ý đồ thành công, tiếp tục kiểm định tấn công; Thất bại→Vô hiệu, tiếp tục kiểm định tấn công\n        * Ý đồ huyễn thuật: Thành công→Ý đồ thành công (Hành động lần này kết thúc); Thất bại→Can nhiễu yếu ớt (Hành động lần này kết thúc)\n        * Ý đồ thần thức: Thành công→Ý đồ thành công + Max(10^L, Công pháp[công kích]) (Không gây tử vong, Hành động lần này kết thúc); Thất bại→Can nhiễu yếu ớt (Hành động lần này kết thúc)\n        * Ý đồ phá trận: Thành công→Gây sát thương Max(10^L bên công, Bên công[kỹ nghệ]*(1+[Z%])+[W]) cho linh khí của trận pháp (Hành động lần này kết thúc); Thất bại→Vô hiệu (Hành động lần này kết thúc)\n    3. Kiểm định tấn công (Chỉ thực hiện khi định tuyến đến đây):\n      - Công thức:\n        * Đối với kẻ không thể hành động, độn tốc lấy bằng 0\n        * floor(10^L bên công+Bên công[độn tốc]*(1+[Z%])+[W])*(d20+[chính xác]) vs floor(10^L bên thủ+Bên thủ[độn tốc]*(1+[Z%])+[W])*(d20+[né tránh])\n      - Giá trị chính xác:\n        * Tấn công trực tiếp/Pháp thuật tấn công [chính xác] = Công pháp chính xác+[W]\n        * Phù lục/Trận pháp/Khôi lỗi/Linh thú [chính xác] = 1 + floor(L/2)+[W]\n      - Giá trị né tránh:\n        * Nhân vật [né tránh] = Thân pháp né tránh+[W]\n        * Khôi lỗi/Linh thú [né tránh] = 1 + floor(L/2)+[W]\n        * Trận pháp: 0\n    4. Tính toán sát thương (Chỉ thực hiện sau khi kiểm định tấn công trúng đích, sát thương thực của ý đồ thần thức áp dụng trực tiếp):\n      - Sát thương cơ bản:\n        * Tấn công cận chiến:floor(10^L + Công pháp[công kích] + [luyện thể]×(1+L×0.2) + Pháp bảo[công kích])*(1+[Z%])+[W]\n        * Tấn công tầm xa:floor(10^L + Công pháp[công kích] + [ngự vật]×(1+L×0.2) + Pháp bảo[công kích])*(1+[Z%])+[W]\n        * Pháp thuật tấn công:floor(10^L + Pháp thuật[công kích] + [pháp thuật]×(1+L×0.2))*(1+[Z%])+[W]\n        * Khôi lỗi/Linh thú tấn công:floor(10^L + Kỹ năng[công kích])*(1+[Z%])+[W]\n        * Trận pháp tấn công:floor(10^L + Trận pháp[công kích])*(1+[Z%])+[W]\n      - Hệ số sinh khắc ngũ hành: //Ngũ hành công pháp tấn công vs công pháp hộ thể, nếu không có thì là hỗn độn\n        * Tấn công phi pháp thuật: Khắc chế 1.25 | Bị khắc chế 0.75 | Không khắc chế 1.0\n        * Pháp thuật tấn công: Khắc chế 1.5 | Bị khắc chế 0.5 | Không khắc chế 1.0\n      - Xuyên thấu và Giảm thương:\n        * [xuyên thấu%]: L bên công*10% + [Z%]\n        * [giảm thương%]: L bên thủ*10% + [Z%]\n        * Tổng phòng ngự: Hộ giáp vị trí bị tấn công[phòng ngự]+Công pháp hộ thể[phòng ngự]+[W]\n        * Sát thương kết toán: Sát thương cuối cùng = Max(0, Sát thương cơ bản - Tổng phòng ngự) × (1 + [xuyên thấu%] - [giảm thương%]) × [Hệ số sinh khắc ngũ hành]\n      - Chỉnh sửa quần thể: Sát thương cuối cùng đối với đơn vị quần thể ×1.5\n      - Áp dụng sát thương:\n        * Nhân vật: if Công pháp hộ thể[chịu đòn linh khí]: linh khí-=sát thương; tràn=max(0,-linh khí); khí huyết-=tràn else:
