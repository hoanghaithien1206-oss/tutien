ương',description:'Vùng hồ đầm và rừng ôn đới phía tây bắc. Thượng nguồn Huyền Hà phân tán thành ngàn dòng trăm đầm, cây cổ thụ mọc giữa vùng nước; sương mù linh khí quanh năm không tan, các bộ tộc nhỏ của ngư nhân và người rừng sống rải rác.',tags:['Hồ Trạch','Vụ Lâm','Bộ Tộc'],kingdoms:[],sects:[]},{id:'eco-zy-linghua',name:'Linh Hoa Bình Trù',description:'Đồng bằng hoa hải phía bắc. Biển linh hoa bốn mùa không tàn xen lẫn với các thị trấn giao thương; Thông Tế Thành là cửa ngõ giao thương giữa Trung Nguyên và Bắc Cảnh, thương đạo trên Huyền Hà thuyền bè qua lại không dứt.',tags:['Hoa Hải','Thương Mậu','Thông Bắc Cảnh'],kingdoms:[{name:'Thông Tế Thành',brief:'Thành phố giao thương lớn giàu có bậc nhất thiên hạ, Trung Nguyên đối Bắc Cảnh (Nam Phong Quốc) cửa ngõ giao thương; ngành linh hoa phồn thịnh.',tags:['Thương Mậu đại thành']}],sects:[]},{id:'eco-zy-zhuohua',name:'Chước Hoa Sơn',description:'Dãy núi làm rào chắn cực nam. Dãy núi hùng vĩ nằm chắn ngang cực nam Trung Nguyên, tạo thành bình phong với Nam Cương; địa mạch thông thẳng tới địa hỏa, có nhiều suối nước nóng và dung nham; La Võ Môn dựa vào đó mà thành lập.',tags:['Sơn Mạch Bình Chướng','Huyền Minh','Địa Hỏa Ôn Tuyền'],kingdoms:[],sects:[{name:'La Vũ Môn',brief:'tông môn luyện thể toàn nữ giữ mãi dung nhan tuổi trẻ，lấy việc tắm thuốc ở Chước Hoa Trì để định hình cơ thể；Huyền Minh thành viên，nơi tụ tập những Thể tu xuất chúng。',tags:['Huyền Minh','Thể Tu','Toàn Nữ']}]},{id:'eco-zy-qiyao',name:'Thất Diệu Liên Phong',description:'Quần sơn biên thùy hung hiểm nhất phía tây. Bảy ngọn linh phong chìm trong mây mù được đặt tên theo Bắc Đẩu Thất Tinh; Tinh Thực Tông chiếm giữ Toàn Cơ Đài nay đã bị Thiên Ma thâm nhập, Tịnh Thế Quân chiếm Chú Đỉnh Thành gây tai họa, Định Biên Thành là tiền đồn chống lại Tây Vực.',tags:['Quần Sơn Biên Thùy','Thiên Ma Chi Trảo','Hung Hiểm'],kingdoms:[{name:'Chú Đỉnh Thành',brief:'Thất Diệu sơn lộc thành trì tu tiên chuyên luyện khí, nay bịb ị quân phản loạn phàm nhân Tịnh Thế Quân chiếm đóng, luyện khí đúc giáp gây phản loạn.',tags:['Tịnh Thế Quânchiếm cứ','luyện khí']},{name:'Định Biên Thành',brief:'Trung Nguyên quân trấn biên ải phía tây, gần Thiên Môn Quan, có thể chi viện; chống lại Hi Hoàng Cổ Triều ở Tây Vực, phòng thủ Tịnh Thế Quân.',tags:['Biên Tắc Quân Trấn','Càn Nguyên hạ hạt']},{name:'Tịnh Thế Quân',brief:'bị Thiên Ma quân phản loạn phàm nhân bị thao túng, chiếm giữ Thất Diệu Chú Đỉnh Thành, nhận lệnh từ Tinh Thực Tông, coi mọi sinh linh là kẻ thù.',tags:['phản quân','Thiên Ma Chi Trảo']}],sects:[{name:'Tinh Thực Tông',brief:'Vốn là Tuyền Cơ Các của Đạo Minh, vì nghiên cứu tinh không mà bị thực thể từ phía bên kia các vì sao nhìn thấu, dẫn đến đọa lạc; nay trở thành móng vuốt của Thiên Ma, là kẻ địch nguy hiểm nhất.',tags:['Thiên Ma Chi Trảo','Đọa Lạc']}]},{id:'eco-zy-wmgl',name:'Cổ Lâm Vạn Mộc Ngộ Đạo',description:'Rừng ôn đới cực đông. Vấn Đạo Sơn là ngọn núi thiêng nhô lên giữa biển rừng, do Vấn Đạo Tiên Tông tọa trấn; hạ lưu Thiên Giang chảy xuyên qua rừng, rìa phía đông là vực sâu khổng lồ thông tới Đông Thổ.',tags:['Cổ Lâm','Huyền Minhminh chủ','Thông Đông Thổ'],kingdoms:[],sects:[{name:'Vấn Đạo Tiên Tông',brief:'Huyền Minh minh chủ, bao dung mọi đạo, vạn pháp đều có thể tu luyện; tuân theo minh ước cổ xưa, đời đời bảo vệ Càn Nguyên Thánh Triều; chủ trấn thiên ma.',tags:['Huyền Minhminh chủ','Chính Đạo','Vạn Pháp']}]}]},{id:'reg-dongtu',name:'Đông Thổ',description:'vùng biển tự do nằm trơ trọi trên đại dương. biển nấm khổng lồ ở phía tây đã phong tỏa con đường trên bộ thông tới Trung Nguyên, chỉ còn đường biển; hàng vạn hòn đảo và rặng đá ngầm rải rác khắp Đông Minh, Lâm Uyên Thành là cổng kết nối các vực. các tông môn trong vùng đều giữ thái độ trung lập, người đời gọi là "vùng đất mặt trời mọc".',children:[{id:'eco-dt-jujun',name:'Biển Nấm Khổng Lồ',description:'Bình phong sương bào tử phía tây. Vực sâu ngút trời nối liền thành biển, bào tử nấm quanh năm tạo thành sương mù, ban đêm tỏa ra ánh sáng mờ ảo; phong tỏa con đường bộ nối liền Đông Thổ và Trung Nguyên, Lưu Ly Đan Tông lập doanh trại hái thuốc tại đây.',tags:['bào vụ bình chướng','Cự Tầm','Hiểm Địa'],kingdoms:[],sects:[]},{id:'eco-dt-linyuan',name:'Thủy Hương Lâm Uyên',description:'Vùng sông nước cửa biển miền trung. Huyền Hà và Thiên Giang giao nhau đổ ra biển tại đây, vùng đất ngập nước quanh co ngàn dặm; Lâm Uyên Thành được xây dựng trên mặt nước, là cửa ngõ để các vực vượt biển đổ bộ lên bờ, cũng là trung tâm tín ngưỡng Thanh Long.',tags:['hà khẩuth ủy hương','tự do cảng','cổng liên vực'],kingdoms:[{name:'Lâm Uyên Thành',brief:'thành phố tu tiên siêu lớn được xây dựng trên mặt nước·tự do cảng，cổng liên vực，trung tâm tín ngưỡng Thanh Long。',tags:['tự do cảng','cổng liên vực']}],sects:[{name:'Thiên Diễn Lâu',brief:'trung lập · trung tâm tình báo, nổi danh nhờ trận pháp, phù lục và bốc toán, tổ chức "Thiên Diễn Đại Bỉ"; đóng tại Lâm Uyên Thành.',tags:['trung lập','Thuật Tu','Tình Báo']},{name:'Hợp Hoan Tông',brief:'trung lập tông_môn, tin rằng âm dương giao hợp, thất tình lục dục mới là căn bản để thông đạt đại đạo; đóng tại Lâm Uyên Thành (Túy Nguyệt Lâu).',tags:['trung lập','Song Tu']}]},{id:'eco-dt-liufang',name:'Lưu Phương Đảo',description:'Tiên đảo linh dược phía đông. Sương mù linh khí lượn lờ, bốn mùa như xuân, kỳ hoa dị thảo và thực vật tiên giới mọc khắp nơi; do Lưu Ly Đan Tông tọa trấn, phàm nhân ca tụng là "Đảo Dược Vương".',tags:['Linh Dược Tiên Đảo','đan đạo','trung lập'],kingdoms:[],sects:[{name:'Lưu Ly Đan Tông',brief:'trung lập luyện_đan đại tông，nhà cung cấp đan dược lớn nhất Thần Lục；lấy thuốc cứu đời, lấy đan chứng đạo。',tags:['trung lập','đan đạo']}]},{id:'eco-dt-penglai',name:'Bồng Lai Tam Tiên Đảo',description:'Thánh địa ở ẩn tại hòn đảo xa phía đông. Ba đảo Bồng Lai, Phương Trượng, Doanh Châu nối với nhau bằng cầu vồng, thoắt ẩn thoắt hiện theo thủy triều linh khí, thuyền phàm khó lòng tiếp cận; là đỉnh cao tu chân của Đông Thổ.',tags:['Ẩn Thế Tiên Đảo','Kiếm Tu','Thượng Cổ Tiên Tông'],kingdoms:[],sects:[{name:'Bồng Lai Tiên Tông',brief:'Ẩn thế thượng cổ tiên tông, thanh tu hỏi đạo, ngự kiếm tìm hiểu huyền cơ; Đông Thổ tu chân chi đỉnh.',tags:['trung lập','Kiếm Tu','Ẩn Thế']}]},{id:'eco-dt-shuanghua',name:'Sương Hoa Đảo',description:'Băng sương nguyệt hoa phía đông. Mặt biển trải rộng lớp băng mỏng, bông tuyết kết lại thành cụm như ngọc, linh khí của ánh trăng là nồng đậm nhất; Toàn Nữ Tông Quảng Hàn Cung ẩn mình tại đây.',tags:['băng sươngnguyệt hoa','Toàn Nữ tông','trung lập'],kingdoms:[],sects:[{name:'Quảng Hàn Cung',brief:'Tông phái trung lập chỉ nhận nữ giới, chủ yếu tu luyện băng sương, thái âm, nguyệt hoa, bồi dưỡng sức mạnh Nguyên Âm; là tử địch của Hợp Hoan Tông.',tags:['trung lập','Toàn Nữ','băng sương']}]},{id:'eco-dt-biluo',name:'Bích Lạc San Hô Hải',description:'Biển san hô xanh thẳm phía đông nam. Rặng san hô rải rác, hàng trăm hòn đảo, dưới nước có các khu định cư của ngư nhân san hô; Châu Nhai Thành nhờ giao thương với ngư nhân mà trở nên giàu có.',tags:['San Hô Hải','Ngư Nhân Thông Thương','Hải Trân'],kingdoms:[{name:'Châu Nhai Thành',brief:'Bích lạc san hô hải thành phố cảng ven biển chuyên buôn bán trân bảo đại dương, nhờ giao thương với ngư nhân mà trở nên giàu có.',tags:['Hải Trân Cảng Thành']}],sects:[]},{id:'eco-dt-liexing',name:'Liệt Tinh Hải',description:'Vùng biển của Tán tu ở trung tâm Đông Minh. Hàng ngàn hòn đảo và vạn rặng đá ngầm rải rác, thương nhân trên biển và hải tặc qua lại tấp nập; Phường thị tán tu Tụ Tiên Thành và hải bang Đông Doanh Phù Tang Thành cùng tồn tại.',tags:['Tán Tuhải cương','Vạn Đảo Thiên Tiêu','pháp ngoạiph ường thị'],kingdoms:[{name:'Tụ Tiên Thành',brief:'Liệt Tinh Hải trung Tán Tu phường thị đại thành, vàng thau lẫn lộn, tự do ngoài vòng pháp luật, là sào huyệt của chợ đen và tình báo.',tags:['Tán Tuphường thị','pháp ngoại']},{name:'Phù Tang Thành',brief:'thành bang trên đảo mang phong cách Đông Doanh, tín ngưỡng "chư thiên bách thần", đền thờ và cổng Torii ở khắp nơi, dân phong chuộng kiếm sĩ.',tags:['Đông Doanh hải bang','Thần Đạo']}],sects:[]}]},{id:'reg-beijing',name:'Bắc Cảnh',description:'thảo nguyên, đài nguyên, vịnh hẹp sông băng và sa mạc cực bắc cùng tồn tại; càng về bắc càng lạnh, phàm quốc và phàm tu mỗi bên chiếm giữ một góc.',children:[{id:'eco-bj-xuesong',name:'Tuyết Tùng Hiệp Loan',description:'Vịnh hẹp sông băng ven biển phía đông bắc. Gia tộc Công Tôn mang huyết mạch Người Giao Tiếp Với Cá Voi đời đời lập quốc, tôn sùng Huyền Vũ phương Bắc; thuyền lầu đầu rồng dạo chơi trong vịnh hẹp.',tags:['băng xuyên hẻm loan','Hải Tộc','Huyền Vũ tín ngưỡng'],kingdoms:[{name:'Thương Lan vương triều',brief:'vương triều thế tập trên biển, Công Tôn thị lấy huyết mạch của Người Giao Tiếp Với Cá Voi để lập quốc; đóng đô tại Kình Tủy Thành.',tags:['vương triều','Giao Nhân Huyết Mạch']}],sects:[]},{id:'eco-bj-yongshuang',name:'Vĩnh Sương Tùng Đào',description:'Rừng thông đen lá kim sâu trong nội địa phía bắc. Thợ săn kết thành Hùng Bi Hội Minh để tự trị, Ngai vàng thông đen và sào huyệt ẩn trong sương mù giấu sâu giữa rừng.',tags:['Châm Diệp Lâm','Tát Mãn','Liệp Hộ'],kingdoms:[{name:'Hùng Bi Hội Minh',brief:'Tùng lâm hành liệp nhân chi tùng tán liên minh, không có vương triều thống nhất, các Trư ởng lãoáo trắng cùng bàn bạc chính sự.',tags:['Trư ởng Lão hội minh']}],sects:[{name:'Đống Cốt Quán',brief:'Vĩnh Sương Tùng Đào thâm xứ tiểu tông môn quỷ tu dựa vào thi khí của Cô Phần Lĩnh mà thành lập.',tags:['trung lập','Quỷ Tu']}]},{id:'eco-bj-yinsha',name:'Ngân Sa Lạc Tinh Mạc',description:'Sa mạc phía tây. Biển cát trắng bạc đan xen với những tảng thiên thạch khổng lồ; năm thành bang ốc đảo cùng kết thành liên minh thương mại, nắm giữ thương đạo phía tây Bắc Cảnh.',tags:['sa mạc','thương đạo','lục châu'],kingdoms:[{name:'Sa Duệ Thương Bang',brief:'năm đại lục châu thành bang liên minh，tinh nghị hội cộng trị，nghị hội trú tinh vẫn bảo。',tags:['thành bang liên minh']}],sects:[]},{id:'eco-bj-buzhou',name:'Bất Chu Tàn Tích',description:'Dãy núi chạy dọc từ nam chí bắc ở trung tâm. Sườn núi bằng huyền thiết đâm thủng tầng mây; sườn đông là Thiên Cơ Môn, sườn tây là Huyết Liên Mật Giáo, trên đỉnh chính là Tuyết Tông Cao Địa Bộ.',tags:['Sơn Mạch','Huyền Thiết','Ma Đạo'],kingdoms:[{name:'Tuyết Tông Cao Địa Bộ',brief:'Vương quốc thần quyền trên núi cao, là thế lực phụ thuộc của Huyết Liên Mật Giáo; đóng đô tại Thiên Thế Bảo, vương miện tuyết được thế tập.',tags:['Thần Quyền Phụ Thuộc Quốc']}],sects:[{name:'Thiên Cơ Môn',brief:'Chính Đạo cơ quan luyện_khí tông_môn，cư đông lộc thiên cơ phong，thần lục tối đa pháp bảo chế tạo thương。',tags:['Chính Đạo','luyện khí']},{name:'Huyết Liên Mật Giáo',brief:'Đại tông môn Ma Đạo lấy việc hiến tế người sống và cung phụng máu làm căn bản tu luyện, đóng tại Thiên Cốt Hình sườn tây.',tags:['Ma Đạo']}]},{id:'eco-bj-heiyao',name:'Hắc Diệu Hỏa Uyên',description:'Thung lũng đứt gãy địa nhiệt ở đoạn giữa tàn tích. Sông nham thạch uốn lượn dưới đáy cốc, là vực sâuấm áp duy nhất giữa lục địa lạnh giá; Tẫn Dương Thành được xây treo leo trên vách đá phía đông.',tags:['thung lũng đứt gãy địa nhiệt','luyện khí','Ôn Tuyền'],kingdoms:[],sects:[{name:'Tẫn Dương Thành',brief:'trung lậptu tiên thành，Bắc Cảnhluyện_khítrung Tâm；thiên Lô cùng mở"Lô Hỏa Tế"nổi danh。',tags:['trung lậptu tiên thành']}]},{id:'eco-bj-canglang',name:'Thương Lang Thảo Hải',description:'Thảo nguyên ôn đới phía đông nam. Mục dân mười hai bộ lạc cùng tôn thờ Đại Khả Hãn; Thương Lang Sơn được lập làm núi thiêng.',tags:['thảo nguyên','Du Mục','Kỵ Binh'],kingdoms:[{name:'Thương Lang Hãn Quốc',brief:'Liên minh mười hai bộ lạc thảo nguyên theo chế độ Khả Hãn, vương đình chóp vàng di chuyển theo Đại Khả Hãn.',tags:['Bộ Lạc Liên Minh']}],sects:[]},{id:'eco-bj-qianjing',name:'Thiên Kính Diêm Trạch',description:'Cánh đồng muối trên nền đáy biển cổ ở vùng trũng phía đông nam. Nước cạn phủ trên mặt đất như gương, ban đêm trên ruộng muối nổi lên lân hỏa màu xanh uám; do bảy gia tộc làm muối cùng cai trị.',tags:['Diêm Nguyên','Môn Phiệt','chiêm bốc'],kingdoms:[{name:'Thất Tính Diêm Gia',brief:'Chung · Kính · Đường · Tiêu · Lư · Dương · Tạ Liên minh nghị sự của bảy hào tộc buôn muối lớn, nghị đường đặt tại Đạc Chung Thành.',tags:['Môn Phiệt Liên Minh']}],sects:[{name:'Diêm Kính Xã',brief:'Bí xã huyễn thuật phản chiếu Kính Hàn Khâu, trực thuộc gia tộc họ Kính trong bảy họ.',tags:['trung lập','chiêm bốc']}]},{id:'eco-bj-nanfeng',name:'Nam Phong Cẩm Tú',description:'Vùng đất màu mỡ biên giới phía nam, là nơi đáng sống nhất Bắc Cảnh. Phiên quốc của Càn Nguyên Thánh Triều là Nam Phong Quốc đóng đô tại Cẩm Tú Thành, văn phong cực kỳ hưng thịnh.',tags:['ốc thổ','Văn Tu','Viên Lâm'],kingdoms:[{name:'Nam Phong Quốc',brief:'Vương quốc phàm nhân ở biên giới phía nam Bắc Cảnh, là chư hầu của Càn Nguyên Thánh Triều; gia tộc họ Tiêu thế tập, văn phong cực kỳ hưng thịnh.',tags:['phiên quốc']}],sects:[{name:'Linh Phong Trai',brief:'Tông môn Chính Đạo lấy âm nhạc nhập đạo, đóng tại Cẩm Tú Thành; là thánh địa của các tu sĩ phong nhã trong thiên hạ.',tags:['Chính Đạo','âm luật']}]}]},{id:'reg-nanjiang',name:'Nam Cương',description:'Rừng mưa ẩm nhiệt, Sở địa đại trạch, Thập Vạn Đại Sơn dữ cận hải hồng thụ lâm tịnh tồn, nam lâm ba tầng vô tận hải; Đạo Minh tứ tông (Tương Linh Các · U Minh Phủ · Ngũ Độc Giáo · Thiên Hình Tông) thống ngự chư quốc, dữ Tây Vực Tiên Minh địch đối.',children:[{id:'eco-nj-yuzhang',name:'Vũ Chướng Lâm',description:'Rừng mưa nhiệt đới đầy chướng khí độc ở phía nam. Thần Mộc Điện của Ngũ Độc Giáo luyện cổ ngự độc; Bốn bộ tộc phía nam của Bách Việt đời đời chịu sự bóc lột.',tags:['rừng mưa nhiệt đới','cổ độc','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang nam cảnh, Xà Phương · Quỷ Phương · Mẫu Phương tam bộ, bị Ngũ Độc Giáo thật tế khống chế, sung tác phàm nhân lai nguyên.',tags:['bộ lạc liên bang','nam cảnh']}],sects:[{name:'Ngũ Độc Giáo',brief:'Đạo Minh thành viên, thối độc luyện cổ, ngự thế gian vạn độc chi đại tông, cư Thần Mộc Điện.',tags:['Đạo Minh','cổ độc']}]},{id:'eco-nj-cuiyu',name:'Thúy Ngọc Khâu',description:'Vùng đồi núi á nhiệt đới dày đặc suối linh khí ở phía bắc. Địa mạch dị biến tạo thành Vạn Linh Tức Quật và Hóa Thú Uyên; Tạo Vật Điện của Thiên Hình Tông chiếm giữ nơi này để nhân giống kỳ thú, Bốn bộ tộc phía bắc của Bách Việt đời đời hái thuốc, ngự thú để mưu sinh.',tags:['đồi á nhiệt đới','Hoạt Thể Cải Tạo','Đạo Minh'],kingdoms:[{name:'Bách Việt Quốc',brief:'Bộ lạc liên bang Bắc Cảnh, Phượng Linh · Tước Vũ · Thú Minh · Thúy Linh tứ bộ, thế đại thải dược ngự thú, thụ Thiên Hình Tông bàn bác.',tags:['bộ lạc liên bang','Bắc Cảnh']}],sects:[{name:'Thiên Hình Tông',brief:'Đạo Minh thành viên, phồn dục kỳ biến ma thú, hoạt thể cải tạo chi đại tông, cư Tạo Vật Điện; cận bách niên cường thế quật khởi.',tags:['Đạo Minh','Cải Tạo','Kỳ Thú']}]},{id:'eco-nj-shiwan',name:'Thập Vạn Đại Sơn',description:'Dãy núi nguyên thủy phía tây nam, cấm địa của Yêu tộc. Bảy tộc của Vạn Yêu Minh chiếm giữ, quốc gia phàm nhân không được bước vào; ngang hàng với Đạo Minh, hai bên không xâm phạm lẫn nhau.',tags:['nguyên thủy Sơn Mạch','yêu tộc cấm địa','Vạn Yêu Minh'],kingdoms:[],sects:[{name:'Vạn Yêu Minh',brief:'Yêu tộc độc lập liên minh, vô minh chủ, thất tộc cộng trị; dữ Đạo Minh đồng cấp, hỗ bất xâm phạm.',tags:['Yêu Tộc','Liên Minh','Cấm Địa']}]},{id:'eco-nj-yongheng',name:'Vĩnh Hằng Cốc',description:'Thung lũng tử khí ở trung nam. Thông U Các của U Minh Phủ lập tại Cửu U Tuyền giữa thung lũng; Đại Tự Thành của Đại Tự Vương Triều xây ở cửa thung lũng, là thủ đô của quốc gia phụ thuộc Đạo Minh.',tags:['tử khí cốc địa','vong linh','Đạo Minh','thần quyền nô lệ'],kingdoms:[{name:'Đại Tự Vương Triều',brief:'Tàn khốc thần quyền nô lệ vương triều, U Minh Phủ công khai phụ thuộc; đô kì Đại Tự Thành kiến vu Vĩnh Hằng Cốc biên duyên.',tags:['thần quyền nô lệ','U Minh Phủ phụ thuộc']}],sects:[{name:'U Minh Phủ',brief:'Đạo Minh thành viên, nhiếp tử khí, luyện thi lỗi chi đại tông, cư Thông U Các; Đại Tự Vương Triều tông chủ.',tags:['Đạo Minh','vong linh']}]},{id:'eco-nj-yunmeng',name:'Vân Mộng Trạch',description:'Đầm lầy khổng lồ của đất Sở ở phía đông, trung tâm vương triều. Dĩnh Đô của Sở Thiên Vương Triều xây dựng cung điện trên mặt nước giữa đầm lầy; Cửu Ca Điện của Tương Linh Các chính là trung tâm nghị sự của Đạo Minh.',tags:['thấp địa đại trạch','Sở vu','Đạo Minh trung khu'],kingdoms:[{name:'Sở Thiên Vương Triều',brief:'Sở địa vu chúc vương triều, Tương Linh Các phụ dung; quân vương trị chính, đại chúc ti thần, đô Dĩnh Thành kiến vu Vân Mộng Trạch phúc tâm.',tags:['vương triều','Sở vu','Đạo Minhphụ dung']}],sects:[{name:'Tương Linh Các',brief:'Đạo Minh minh chủ, thượng cổ Vu tộc thất lạc huyết duệ chi đại tông, cư Cửu Ca Điện; Sở Thiên Vương Triều tông chủ, Đại Chúc Do Các trung chỉ phái.',tags:['Đạo Minh','minh chủ','Vu Tộc']}]},{id:'eco-nj-jinxiu',name:'Cẩm Tú Đạo Hương',description:'Kho lương thực của Sở Thiên ở vùng trung bắc. Hàng ngàn dặm ruộng bậc thang và đồng bằng, lúa linh khí mọc ba vụ; Đạo Quan Phủ của Sở Thiên nắm giữ chính sách lương thực, phàm tu rất hiếm.',tags:['lương thương','Đạo Điền','Sở Thiên'],kingdoms:[{name:'Sở Thiên Vương Triều',brief:'Vương triều tây cảnh lương thương, Đạo Quan Phủ chủ lý lương chính; Đại Chúc Hành Cung tọa trấn đạo tế.',tags:['vương triều','lương thương']}],sects:[]},{id:'eco-nj-shenmu',name:'Thần Mộc Mãng Nguyên',description:'Rừng thần mộc Thượng cổ ở vùng tây trung, cấm địa của mộc linh. Thần mộc khổng lồ đã khai mở một nửa linh trí cắm rễ giữa tâm rừng; phàm tu không được vào, quốc gia phàm nhân không dám bén mảng.',tags:['Thượng Cổ Thần Mộc','thụ linh cấm địa','Vô Chủ'],kingdoms:[],sects:[]},{id:'eco-nj-zhusui',name:'Chu Tủy Cô Tự',description:'Hòn đảo cô lập ngoài khơi xa với nhiều thực vật dị chủng, thánh địa của Đại Tự. Long Hài Cốc ở trung tâm đảo là nơi hiến tế người sống của Đại Tự; Chu Tủy Mộc, Bình Phúc Mộc, Linh Chi Hương là những loài độc nhất vô nhị chỉ có trên hòn đảo này.',tags:['Viễn Hải Cô Đảo','Dị Chủng Thực Vật','Đại Tự Phi Địa','tế địa'],kingdoms:[{name:'Đại Tự Vương Triều',brief:'Viễn Hải Thánh Đảo, Tung Mục Tế Sư Đoàn trú thủ; hoạt tế thuyền đoàn mỗi niên áp tống nô lệ lên bờ chí Long Hài Cốc.',tags:['vương triều phi địa','tế địa']}],sects:[]}]},{id:'reg-xiyu',name:'Tây Vực',description:'Tây lâm hải, trung đa hoang mạc, đông hữu vô ngân tuyết sơn túng quán nam bắc; tây hữu cổ Ba Tư thức vương triều, đông hữu thượng cổ Hi Hoàng Cổ Triều.',children:[{id:'eco-xy-rouwfeng',name:'Nhu Phong Hải Loan',description:'Bờ biển và vịnh cảng ôn đới phía tây. Nhu Phong Cảng vạn thương vân tập; tháp thánh hỏa cháy mãi không tắt, thuyền buôn trên hồ và biển cùng tồn tại với các bia đá cổ trên thương đạo.',tags:['Hải Cảng','thương đạo','Hiên Giáo'],kingdoms:[{name:'Xích Diễm Bái Nhật Quốc',brief:'Cổ Ba Tư thức vương triều, Nhu Phong Cảng vi tây hải ngạn tổng đốc trị sở.',tags:['thần vương chuyên chế']}],sects:[{name:'Bái Hỏa Đàn',brief:'Trung lập Hiên Giáo đại tông, thánh hỏa bất diệt thiên niên; phù trì Xích Diễm Bái Nhật Quốc vi phụ thuộc phàm quốc.',tags:['trung lập','Hiên Giáo']}]},{id:'eco-xy-liusha',name:'Lưu Sa Tinh Hải',description:'Sa mạc nhiệt đới vùng trung tây. Biển cát vàng mênh mông vô tận nơi các vì sao rơi xuống; Bái Nhật Kim Đô lập tại ốc đảo giữa biển cát, tháp thánh hỏa cháy mãi không tắt.',tags:['sa mạc','thần vương chuyên chế','Tinh Vẫn'],kingdoms:[{name:'Xích Diễm Bái Nhật Quốc',brief:'Bái Hỏa Đàn thiên niên phụ thuộc phàm quốc, Bái Nhật Kim Đô vi kỳ đô.',tags:['vương triều']}],sects:[]},{id:'eco-xy-loulan',name:'Lâu Lan Cựu Địa',description:'Quần thể phế tích ốc đảo ở trung tâm. Ba mươi sáuốc đảo rải rác trong biển cát, phế tích ngàn năm và các thành bang đang hoạt động cùng tồn tại; cố đô Lâu Lan vẫn còn đó.',tags:['lục châu','Phế Khư','Thương Lữ'],kingdoms:[{name:'Xích Diễm Bái Nhật Quốc',brief:'Lâu Lan Đông Sa Đô vi kỳ hạt cảnh, nguyên tam thập lục lục châu cố đồng minh nghị sự sở cải kiến.',tags:['vương triều hạt cảnh']}],sects:[]},{id:'eco-xy-kunlun',name:'Côn Luân Thần Khư',description:'Linh sơn Thượng cổ vùng trung bắc. Ngọ , dùng để phân biệt phương hướng trong chướng lâm, tránh bị lạc; ngoài ra không có công dụng kỳ diệu nào khác.'},"mô tả":'Khối đá chỉ nam tầm thường Ngũ Độc Giáo phát cho mỗi đệ tử dự thi trước thềm sát hạch nhập môn bước ra khỏi Vũ Chướng Lâm. Không linh khí không hoa văn, chỉ là hòn đá ngoan cố nhận biết được Nam Bắc.'}},{id:'plot-wudu-shixin',storyId:'story-wudu-init',name:'Phệ Tâm Cổ Kinh',category:'công pháp',thể_loại:'Thần thức',phẩm_chất:'Thiên',"cảnh giới":'Luyện Khí kỳ',"ngũ hành":'Âm',desc:'Công pháp thần thức quỷ dị tự dưng in vào thức hải sau khi tỉnh lại, phẩm cấp vượt xa phạm vi tu sĩ Luyện khí vốn có thể điều khiển, lai lịch là bí ẩn.',glyph:'Cổ',tags:['Ngũ Độc tổ truyền','lai lịch bất minh'],data:{đang_sử_dụng:!1,phẩm_chất:'Thiên',"cảnh giới":'Luyện Khí kỳ',"ngũ hành":'Âm',thể_loại:'Thần thức',"tiêu hao":'Linh khí:5',nhãn:['công_kích:5','Ngũ Độc tổ truyền','lai lịch bất minh'],"hiệu quả":{'Vô Tướng Chủng Cổ':'Ngưng tụ thần_thức thành kim vô hình, vô điều kiện cấy một con cổ trùng vào cơ thể mục tiêu từ Hóa Thần kỳ trở xuống, bỏ qua mọi sự kháng cự.','Tuần Cổ Cổ Cảm':'Bất kỳ ai bị cấy cổ trùng của kinh này vào cơ thể, bất luận xa gần, đều có thể dựa vào cổ trùng để cảm nhận phương hướng và sống chết của kẻ đó.'},"mô tả":'Sau khi nuốt quả lạ ngũ sắc và tỉnh lại từ cơn hôn mê, một môn thần_thức công_pháp bỗng dưng khắc sâu vào tận cùng thức hải. Hoàn toàn không liên quan đến những gì ghi trong 《Bách Độc Kinh》, tựa như xuất phát từ tiếng thì thầm gọi đến "Vạn Độc Tổ Quật" kia.'}},{id:'plot-luowu-duangu',storyId:'story-luowu-mirror',name:'Đoạn Cốt Thổ Nạp Quyết',category:'công pháp',thể_loại:'Tâm pháp',phẩm_chất:'Hoàng',"cảnh giới":'Luyện Khí kỳ',"ngũ hành":'Thổ',desc:'Tâm pháp nhập môn của La Võ Môn được mẫu thân phong ấn vào Tố Quang Giám, và đã được điều chỉnh dựa theo kinh mạch của ngươi.',glyph:'Cốt',tags:['La Vũ Môn','mẫu thân di lưu','đoạn thể'],data:{đang_sử_dụng:!1,phẩm_chất:'Hoàng',"cảnh giới":'Luyện Khí kỳ',"ngũ hành":'Thổ',thể_loại:'Tâm pháp', , được tặng một cuộn tàn trang.',cost:0,glyph:'Cơ',recommend:'Tầm Thường Tu Hành',thể_loại:'Tán Tu',constraints:{linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7156,Nguyệt:11,Nhật:12,"thời thần":'dậu'},"tông môn":'Tán Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'ngươi đang ngồi ở góc quán trà，nhìn những hạt tuyết đập vào song cửa ngẩn người。\nlão giả áo xám bàn bên chợt cười với ngươi：\n"Tiểu hữu có duyên với kiếm."\nlão tiện tay đẩy qua mặt bàn một cuộn giấy dầu Hoàngtàn khuyết，lạit ự rót tự uống cạn ly rượu，chớp mắt đã tan biến vào bão tuyết——'},{id:'story-fuchou',name:'Di cô huyết môn',subtitle:'Mang thù tiến bước',desc:'Môn phái bị ma tu đánh đêm tàn sát sạch, chỉ mình bạn mang tín vật sư môn trốn thoát.',cost:0,glyph:'Cừu',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'Tán Tu',constraints:{linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7188,Nguyệt:7,Nhật:22,"thời thần":'dần'},"tông môn":'Tán Tu (tiền · Vụ Ẩn Sơn Môn)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'hậu kỳ'}},body:'Sơn môn bị hủy diệt chỉ trong một đêm.\n Ngươi nằm rạp trong vũng bùn máu giả chết, lắng nghe tiếng gầm thét phẫn nộ cuối cùng của sư tỷ, nghe tiếng quải trượng nặng nề lướt qua bên cạnh.\nCho đến khi mọi thứ chìm vào tĩnh lặng.\n Ngươi nắm chặt lấy miếng ngọc bài đã bị máu tươi nhuộm đẫm, trước lúc bình minh bò ra khỏi đống đổ nát hoang tàn——',tags:['Cừu Oán']},{id:'story-dadao',name:'Đã ngộ đại đạo',subtitle:'Kiếp trước kiếp này',desc:'Bạn dường như còn nhớ đủ chuyện kiếp trước. Mọi thứ còn chưa bắt đầu mà đã như nhìn thấy kết cục.',cost:0,glyph:'Đạo',recommend:'Tiểu Đạo Du Du',thể_loại:'đặc biệt',settings:{"thời gian":{Niên:7301,Nguyệt:3,Nhật:3,"thời thần":'mão'},"tông môn":'Tán Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ngươi mở bừng mắt giữa ánh bình minh.\n Ngoài cửa sổ là dòng linh khê quen thuộc không thể quen thuộc hơn, phía xa tiếng chuông sớm vang vọng——\n Tất cả những thứ này, ngươi dường như đã thấy qua ngàn vạn lần trong một giấc mộng nào đó.\n Ngươi đưa tay khẽ chạm vào ngọc bài trước ngực, nơi đó phảng phất vẫn còn lưu lại hơi ấm sau ngọn lửa thiêu đốt của kiếp trước——',tags:['Truyền thuyết']},{id:'story-tianxuan-zayou',name:'Vạn kiếm bình · kiếm sư tặng đá',subtitle:'Duyên bèo nước giữa gió tuyết',desc:'Là đệ tử tạp dịch của Thiên Huyền Kiếm Tông, khi quét tuyết ở Vạn Kiếm Bình, bạn tình cờ gặp truyền nhân kiếm mạch Mặc Thi Hành phụng mệnh xuống núi lịch luyện; trước khi rời đi, nàng để lại một viên linh thạch hạ phẩm.',cost:0,glyph:'Kiếm',recommend:'Lệ Tâm Vấn Đạo',thể_loại:'tông môn',constraints:{locationIds:['eco-xy-wuyan'],linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7204,Nguyệt:12,Nhật:18,"thời thần":'thìn'},"tông môn":'Thiên Huyền Kiếm Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Thiên Huyền Kiếm Tôngt ông mônquảng trường，vạn Kiếm trên bình đài đọng một lớp sương mới，vài tênt ạp dịch Đệ Tử đang cúi đầu quét tước，ngươi cũng ở trong đó。\ntông chủ Mạc Quyết Vân đứng phía trước đại điện Thạchtr ên thềm，chắp tay sau lưng đứng，trường sam xám trắng tung bay trong gió；Kiếmm ạch truyền nhân Mặc Thi Hànhm ột thân Huyềnthanh Kiếm Bào，đứng lẻ loi giữa vạn Kiếmbìnhtrung ương，trường Kiếmnghi êng đón tàn tuyết，đứng yên Bất Động，dường như đã đứng trong bão tuyết này suốt cả đêm。\n"Một đêm chưa thu kiếm, nhát kiếm đó, đã có \'thể\' chưa?"Mạc Quyết Vân đích thanh âm bất đại, khước thanh tích truyền biến chỉnh cá Vạn Kiếm Bình, ẩn ẩn áp quá hô khiếu đích phong thanh.\n Mặc Thi Hành chậm rãi thu kiếm vào vỏ, mặc mâu thanh lãnh, vọng trước mạn thiên phong tuyết, thanh âm hẩn đạm.\n"Hồi sư tôn, còn kém một phân. Một tiễn này Đệ Tử luyện ba năm, chiêu đã tới cực, trong kiếm lại luôn thiếu một hơi—— không phải không đủ sắc, là không có thi."\n Mạc Quyết Vân mi đầu vi bất khả sát địa nhất động, tụ bào khinh phất, tương nàng thân bàng tam xích tích tuyết đãng khai, nàng khước liên nhãn dã vị trát.\n"Bế tử quan trên núi, kiếm ý ngược lại bị mài cùn. Từ hôm nay trở đi, ngươi xuống núi lịch luyện đi—— đi nhân gian tìm một ngụm「thi」đó của ngươi, tìm không thấy, thì không cần về tông."\n Mặc Thi Hành chinh liễu nhất thuấn, tùy tức đoan chính hành liễu nhất lễ, thanh âm y cựu thanh lãnh, khước bỉ phương tài đa liễu nhất phân trịnh trọng,"Đệ Tử……lĩnh mệnh。"\n Nàng chuyển thân hướng sơn môn tẩu khứ, trường phát thúc đắc cực cao, bối thượng trường kiếm ánh trước tuyết quang, huyền thanh kiếm bào lược quá nhất địa tố bạch. Hành chí ngươi thân biên, cước bộ vô đoan đốn liễu nhất đốn.\n Nàng thuỵ mâu khán liễu khán ngươi đống đắc phát hồng đích thủ, hựu khán liễu khán ngươi cước hạ na nhất tiểu phiến bị tảo đắc can can tịnh tịnh đích tuyết địa, mặc mâu lý lược quá nhất ti cực đạm đích đồ vật.\n"Nhất xứ nhất xứ, tảo đắc bất yếm, giá dã thị kiếm ý."Mặc Thi Hành thuyết trước, tòng tụ trung thủ xuất một viên Hạ Phẩm Linh Thạch, khinh khinh các tiến ngươi chư ởng tâm,"Tâm trầm đắc hạ xuống, chổi cũng có thể thông đạo. Đồng này, coi như cảm tạ ngươi cho ta xem một mảnh tuyết địa sạch sẽ này."\nlời cạn，nàng không nói thêm gì，mũi chân nhẹ nhàng Điểm，niệm quyết Ngự Kiếmm à bay lên，một Đạothanh quang ẩn vào tuyết rơi，chớp mắt biến mất。'},{id:'story-lingfeng-yueye',name:'Hồi âm cốc · hòa tấu dưới trăng',subtitle:'Nhã hội khi mới vào linh phong trai',desc:'Vừa vào Linh Phong Trai chưa lâu, bạn một mình gảy đàn dưới trăng ở Hồi Âm Cốc, đúng lúc gặp Hạ Vị Ương cầm ngọc địch; hai người cùng hòa tấu một khúc.',cost:0,glyph:'Cầm',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'tông môn',constraints:{locationIds:['eco-bj-nanfeng'],linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7212,Nguyệt:8,Nhật:16,"thời thần":'hợi'},"tông môn":'Linh Phong Trai',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'dạ sắc hơi trầm xuống，một vầng trăng non treo trên đêm Hồi Âm Cốc Không；Thủyh ơi sương mờ mịt，làm ướt rêu xanh ven bờ。\nngươi ngồi ven sông Thạch trên，trên gối đặt ngang cổ Cầm，ngón tay khảy，tịnh Vôđịnh phổ，chỉ nương theo cơn gió phập phồng。Linh linh Thất Huyền，thỉnh thoảng kinh động đến loài nghỉ trong bụi lautrongvài con Thủychim，Thủychim vỗ cánh sượt qua Thủym ặt，lay động ánh trăng ĐiểmĐiểm。\nchợt có tiếng sáo Tựtừ ngọn cây rơi xuống，tiếng sáo thanh việt ấy，không tranh không đoạt，chỉ khẽ lấp vào Cầmâm thanh sắp dứt Khôngkhe，giữ lại cái sắp tán đi kia Dưv ận。\nngươi giữ chặt Cầmdây，ngước mắt nhìn về phía xa，ngã rẽ lối mòn trong rừng，một bộ sa y màu ngó sen nhạt nhè nhẹ lay theo gió。người đến tay cầm một chi ngọc địch，sáo Thântoàn thân trắng ngần，duy chỉ có phần đuôi Trụyminh Hoàngtua cờ。\n"Quấy rầy nhã hứng của đạo hữu, vừa rồi nghe tiếng đàn này, dường như có ý giang lưu uyển chuyển nhiễu phương điện, nhưng lại nhiều thêm vài phần tùy tính. Đạo hữu là người mới nhập trai?"\n nễ khởi thân, hướng nữ tử củng thủ nhất lễ,"tại hạ ngươi, sơ nhập Linh Phong Trai, kiến thử địa nguyệt sắc chánh hảo, tình nan tự cấm, bất tư ởng kinh động liễu sư tỷ."\n Nữ tử kia bước đến bên bờ nước, không đứng trên cao nhận lễ, mà ngồi xuống phiến đá xanh bên cạnh, đặt ngang ngọc địch lên gối.\n"Vạn vật có tiếng, sóng nước vỗ bờ này là tiếng, trùng kêu chim hót là tiếng, tiếng đàn của đạo hữu tự nhiên cũng là tiếng, đã đều ở trong thiên địa này, vậy thì không tính là quấy rầy."\n"Ta vừa rồi ở trong rừng, nghe trong tiếng đàn của đạo hữu dường như có ý chưa dứt, trùng hợp ta có một khúc nhạc cũng thiếu đi chút ý cảnh, không biết đạo hữu có nguyện hợp tấu một khúc?"\n Ngươi ngồi xuống lại, hai tay đặt lên dây đàn, không cần dùng lời nói để xác nhận điệu thức, ngón tay vừa hạ xuống, chính là lời đáp lại.\n Tiếng đàn nổi lên như suối chảy khe núi, trong trẻo trong ngần; tiếng sáo theo đó mà hòa vào, miên man xa xăm, tựa gió thoảng qua rừng thông.\n Khúc nhạc kết thúc, dư âm tan vào trong gió, mặt nước trở lại vẻ bình lặng.\n"Gió đêm nay, xem ra lại dịu dàng hơn ngày thường đôi chút." Hạ Vị Ương khẽ vuốt thân sáo, đứng dậy, chỉnh lại lọn tóc bị gió thổi rối.\n"Nếu như đạo hữu thích nơi này, về sau cũng có thể thường đến. Linh Phong Trai Hạ Vị Ương, ghi nhớ tiếng đàn đêm nay của đạo hữu."'},{id:'story-liuli-baicao',name:'Bách thảo phong · láng giềng mới trong vườn thuốc',subtitle:'Cùng triệu phương oánh cuốc thuốc chung một khoảnh ruộng',desc:'Là đệ tử ngoại môn Lưu Ly Đan Tông, bạn cuốc thuốc trong vườn thuốc nơi góc khuất Bách Thảo Phong; mảnh vườn bên cạnh vừa có một tiểu sư muội nhút nhát tên Triệu Phương Oánh chuyển tới.',cost:0,glyph:'Đan',recommend:'Tầm Thường Tu Hành',thể_loại:'tông môn',constraints:{locationIds:['eco-dt-liufang'],linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7197,Nguyệt:4,Nhật:9,"thời thần":'thìn'},"tông môn":'Lưu Ly Đan Tông（Ngoại Môn Tạp Dịch）',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Lưu Phương Sơn Mạchk éo dài mấy trăm dặm，thần huy xé mây，Kimánh sáng chiếu xuống Bách Thảo Phong，đỉnh núi mây mù bồng bềnh，loáng thoáng thấy bóng dáng Nội Môn Đệ Tửng ự vậtt ại Thiên，có kẻ ngồi trên hồ lô、có người đứng trênphi kiếm，nhưng những thứ đó đều vớit ạp dịch Vô Duyênphong cảnh。\n Lưu Ly Đan Tông，Bách Thảo Phong，khu vực tập trung gieo trồng linh thảo linh dược cấp thấp，trong số đó có một tiểu dược viên。\nngươi nhấc cuốc lên nghỉ một lát，thẳng lưng lên，luyện khí kỳs ơ kỳc ủalinh khílu ân chuyển trong kinh mạch được một vòng nhỏ Thiên，xóa đi ít nhiều mệt nhọc。dược điền này chính là nơi hắn Lưu Ly Đan Tôngm ột mẫu ba phân Địa，thứ được trồng đều làluyện khí kỳk ỳđan dượccủa Cơ Sởph ụ Tài。\ntiểu dược viên bỏ hoang gần nửa tháng ở nhà kế bên，hôm nay rục rịch。\nphía bên bờ rào trúc，một thiếu nữ tuổi độ thanh xuân Niênhoa Nữ，Thântr êncủatạp dịchv ải Bàoc ó chút rộng rãi，tay áo xắn vài vòng Đạo，để lộ cổ tay gầy。cô gái nửa ngồi ở ThổĐịa trên，huơ tay múa chân trước cỏ thuốc ủ rũ vừa được cắm xuống。\n"Lục cao cao, đất ở đây rất mềm mại, ngươi phải tranh khí, cắm rễ sâu một chút."\nThanh âm thuận trước thần phong phiêu quá trúc ly, lạc nhập ngươi nhĩ trung. Na thiếu nữ tịnh vị sát giác bàng nhân mục quang, chỉ thị tòng câu cừ yểu khởi thiểu hứa tuyền thủy, lâm cấp thảo dược.\n"Uống nước rồi thì không được phép héo nữa, đợi ngươi mọc ra lá mới, ta sẽ gọi ngươi là lục tráng tráng."\n Ngươi thủ trung sừ đầu khinh đốn, bính thượng nhất khối ngạnh thổ, phát xuất liễu hư ởng thanh, thiếu nữ chuyển đầu, mâu tử lý ánh xuất ngươi đề trước sừ đầu đích thân ảnh.\n Nàng liên mang trạm khởi thân lai, song thủ tại thân tiền giao điệp, triều trước ngươi thâm thâm hành liễu nhất lễ, vì động tác thái cấp, đầu đính na điều dụng lai thúc phát đích thô bố điều oai liễu một số, kỷ lũ toái phát tán tại ngạch tiền.\n"Tiền, tiền bối hảo." Nàng cúi đầu rất thấp, để lộ gáy trắng ngần thon thả, giọng nói có chút rụt rè, "Ta là Triệu Phương Huỳnh mới đến khối dược điền này, nếu làm ồn đến tiền bối tu hành, mong tiền bối thứ tội."'},{id:'story-nanjiang-fox',name:'Thập vạn đại sơn · gặp gỡ hồ yêu',subtitle:'Trên đường hái thuốc lạc vào u cốc tiên chi',desc:'Vì tìm "Linh Sơn Tiên Chi", bạn quanh quẩn ở rìa Thập Vạn Đại Sơn suốt mấy ngày rồi lạc vào u cốc, gặp thiếu nữ hồ tộc Thanh Khâu Tô Ngưng Hương đang một mình luyện lời đáp trước cọc gỗ.',cost:0,glyph:'Hồ',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'Tán Tu',constraints:{regionIds:['reg-nanjiang'],linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7220,Nguyệt:6,Nhật:1,"thời thần":'thìn'},"tông môn":'Tán Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'Tia nắng ban mai mờ tỏ, hơi nước oi bức ẩm ướt đặc trưng của Nam Cương vẫn chưa tiêu tán hết, trong rừng ngưng đọng lại lớp sương mù tựa màn lụa mỏng.\n Ngươi lưng cõng gùi tre, chân xỏ giày da, bước vào lối nhỏ thâm u. Nơi này vắng bóng người, thợ hái thuốc tầm thường không dám bén mảng, nhưng vì truy tìm "Linh Sơn Tiên Chi" trong truyền thuyết, ngươi đã quanh quẩn ở rìa Thập Vạn Đại Sơn nhiều ngày.\n Ngươi vạch đám lá rộng che khuất tầm nhìn trước mắt, tầm nhìn chợt mở rộng. Phía trước là một u cốc tĩnh mịch, trong cốc suối chảy róc rách, hai bên bờ nở đầy dã hoa không tên, đung đưa theo gió, cánh hoa rơi rụng lả tả. Giữa khóm hoa, một thiếu nữ mặc nhu quần màu phấn nhạt đang ngồi, nàng quay lưng về phía ngươi, đối diện với một cọc gỗ lẩm bẩm điều gì đó.\n"Công tử đại ân, tiểu nữ tử không biết lấy gì đền đáp, chỉ có..." Giọng thiếu nữ hơi khựng lại, nghiêng đầu, tựa như đang nhớ lại điều gì, sau đó đổi sang một ngữ điệu khác, mang theo chút e lệ, "Chỉ có lấy thân báo đáp, nguyện theo chàng đi khắp chân trời góc bể."\n Ngươi vô tình giẫm gãy một cành cây khô, tiếng "rắc" khẽ vang lên, trong u cốc tĩnh mịch này lại lộ ra vẻ vô cùng đột ngột.\n Thân hình thiếu nữ khẽ run, đột ngột quay đầu lại, khuôn mặt kiều diễm, hai má ửng hồng, trong đôi mắt trong vắt như nước suối mang theo chút hoảng hốt.\n"Ngươi là ai? Ngươi là... tới đây ngắm cảnh sao?"\n Ngươi chắp tay hành lễ, "Tại hạ là người hái thuốc trong núi, đi nhầm vào nơi thanh tu của cô nương... nhiều điều đắc tội, xin hãy lượng thứ."\n Thiếu nữ nghe vậy, sự cảnh giác trong mắt hơi lui đi, thay vào đó là sự tò mò, tựa như đang xác nhận thiện ý của đối phương.\n"Người hái thuốc..." Nàng lặp lại với giọng trầm thấp, lập tức đứng dậy, vụng về đáp lễ, "Tiểu nữ tử Tô Ngưng Hương, xin ra mắt."'},{id:'story-wudu-init',name:'Ra khỏi chướng lâm · vạn độc tổ quật',subtitle:'Một canh bạc trong khảo nghiệm nhập môn',desc:'Trong Vũ Chướng Lâm, bạn tham gia khảo nghiệm nhập môn của Ngũ Độc Giáo, vừa đói vừa rét, bốn bề đều độc; khi cùng đường, bạn nuốt một quả lạ ngũ sắc không được ghi trong Bách Độc Kinh, tỉnh lại thấy thức hải tự dưng có thêm một môn cổ pháp thần thức và một tiếng thì thầm gọi bạn đến "Vạn Độc Tổ Quật".',cost:0,glyph:'Cổ',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-nj-yuzhang'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tán Tu','Ngũ Độc Giáo']},settings:{"thời gian":{Niên:7231,Nguyệt:4,Nhật:9,"thời thần":'tỵ'},"tông môn":'Ngũ Độc Giáo (nhập môn thí luyện)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Vũ Chướng Lâms âu thẳm，chướng khí ẩm thấp dính vào da，mãi không tan。\nđây là Ngũ Độc Giáonh ập môns át hạchc ửa ải cuối cùng——độc Tựb ước ra khỏi khu rừng ăn thịt người này。đã sang ngày thứ ba，ngươiluyện khí kỳs ơ kỳ đóĐiểmít ỏilinh khí đã sớm bị chướng khí Độcbào mòn chỉ còn lại Vôvài，đói Hỏac ùng hàn ý đồng thanh gặm nhấm ngũ tạng lục phủ。\nlại khổ thay khu rừng này"thực phẩm"Tịnh bất toán thiểu: tử hồng đích tương quả, phì hậu đích khuẩn tán, ba mãn đằng mạn đích điềm ngẫu……ngươi phiên khai tùy thân na quyển 《Bách Độc Kinh》 nhất nhất bỉ đối, phiên đáo tối hậu, chỉ tiêm phát lương——vô nhất lệ ngoại, toàn thị kịch độc. Nguyên lai giá nhất quan khảo đích tòng bất thị"Có thể tìm được đồ ăn không"，mà là"Minh tri hữu độc, nhĩ cảm bất cảm bính".\n Tựu tại ngươi cơ hồ yếu đảo hạ khứ đích lúc, nhất tùng hủ diệp gian lộ xuất một viên quyền đầu đại đích quả tử, ngũ thải ban lan, lưu chuyển trước cận hồ yêu dị đích quang trạch. Ngươi phiên biến 《Bách Độc Kinh》, tòng đầu đáo vĩ——cánh không có bán cá tự đề đáo tha.\n Vị tái vu kinh, tiện thị vị tri; vị tri, tiện thị bất tri tử hoạt. Khả ngươi dã xác thật, tái không có biệt đích lộ liễu.\n Ngươi đinh trước na mai quái quả khán liễu hẩn cửu, chung vu bế thượng nhãn, nhất khẩu giảo liễu hạ khứ——đổ giá nhất bả.\nÝ thức trụy nhập vô biên đích hắc.\n……\n Tái tranh nhãn thời, thiên quang dĩ lượng. Cơ hàn tận thoái, na điểm bị ma tận đích linh khí cánh dã tiễu nhiên phục nguyên, tứ chi bách hài thuyết bất xuất đích thông thái, phảng phất cái gì đồ vật tại thể nội bị triệt để tẩy quá nhất biến.\n Chỉ thị——ngươi đích thức hải lý, bằng không đa liễu nhất môn công pháp. Tha đích tên bản thân phù thượng tâm đầu: 《Phệ Tâm Cổ Kinh》. thần thức vi châm, chủng cổ phệ tâm, quỷ dị đắc dữ 《Bách Độc Kinh》 lý nhậm hà nhất hiệt đô bất tương can.\nNhi tại thức hải thâm xứ, nhất đoạn sa á nhi diêu viễn đích đê ngữ, chính thiếp trước thần hồn phản phục hồi hư ởng, huy chi bất khứ——\n"Lai……Vạn Độc Tổ Quật……trảo ngã……"\n Ngươi mạc liễu mạc hoài lý na khối nhập môn thời tông môn phát hạ đích ti nam chi thạch——tha nhất như vãng thường, chỉ nhận đắc nam bắc, khước bán điểm chỉ bất xuất na"Vạn Độc Tổ Quật"ở nơi nao。',tags:['Ngũ Độc Giáo','kỳ ngộ']},{id:'story-luowu-mirror',name:'Di kính quy tông · tố quang tầm thân',subtitle:'Truyền thừa la võ môn ngủ say trong di vật của mẫu thân',desc:'Bạch Nhụy Huyền trong lúc vân du tình cờ phát hiện, trong cơ thể ngươi thế mà lại đang vận chuyển tâm pháp của La Võ Môn; Tố Quang Giám do mẫu thân để lại có lưu giữ công pháp, kỹ nghệ và bốn đoạn ký ức, chỉ khi đột phá đại cảnh giới mới có thể lần lượt giải tỏa. Để truy tìm nguyên nhân cái chết của mẫu thân ngươi, nàng quyết định đưa ngươi quay lại La Võ Môn.',cost:0,glyph:'Kính',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],giới_tính_cấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tán Tu','La Vũ Môn']},settings:{"thời gian":{Niên:7232,Nguyệt:8,Nhật:17,"thời thần":'thân'},"tông môn":'La Vũ Môn (quy tông đồ trung)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Bạch Nhụy Huyền ly khai La Vũ Môn hậu, nhất lộ tầm phỏng các địa Thể Tu thiết tha luận kỹ. Đồ kinh ngươi cư trú đích thành trấn thời, nàng nguyên bản chỉ đả toán đình lưu nhất dạ, khước tại nhân quần trung sát giác đáo nhất lũ cực thục tất đích thổ nạp tiết luật——na cỗ khí tức chính tòng ngươi đích kinh mạch gian tuần hoàn, phân minh thị La Vũ Môn Đoán Cốt nhất mạch đích nội công lộ số.\n Nàng đương tức lan hạ ngươi, tế vấn giá môn tâm pháp tòng hà nhi lai, hựu phản phục truy vấn ngươi đích mẫu thân tính thậm danh thùy, thị phủ tằng vi La Vũ Môn Đệ Tử. Ngươi khước đáp bất thượng lai: mẫu thân khứ thế thời, ngươi thượng bất biết nàng đích quá vãng, chỉ ký đắc nàng lâm chung tiền tương nhất diện cựu kính giao cấp ngươi; phụ thân dã chỉ khẳng thuyết, nàng thị bị cừu nhân sở sát.\n Ngươi thủ xuất mẫu thân lưu lại kính tử. Kính diện bất ánh tầm thường nhân ảnh, linh lực xúc cập thời phản nhi phù xuất nhất tằng tằng Lưu đích kinh mạch đồ dữ kỹ nghệ thủ trát. Bạch Nhụy Huyền kiểm tra hứa cửu, Xác nhận kỳ trung tàng trước hoàn chỉnh đích La Vũ Môn Truyền Thừa, khước bị tứ trọng cấm chế phân cách; chỉ hữu ngươi thân tự đột phá một cái đại cảnh giới, kính trung phong ấn tài hội giải khai nhất tằng, hiển lộ nhất đoạn mẫu thân lưu lại ký ức tuyến sách. Vị đáo đột phá chi thời, túng sử nàng cường hành quán chú linh lực dã chỉ hội chiếu kiến nhất phiến vụ quang.\n Cánh lệnh nàng ý ngoại đích thị, giá phần Truyền Thừa tảo dĩ y chiếu ngươi đích kinh mạch trùng tân điều chỉnh. Tức sử ngươi tịnh phi nữ tính, dã năng an toàn tu hành bổn ưng chỉ truyền môn trung nữ Đệ Tử đích công pháp, tuyệt phi ngẫu nhiên đắc lai đích sao bản sở năng tố đáo.\n Bạch Nhụy Huyền trầm mặc phiến khắc, tương kính tử trịnh trọng giao hoàn ngươi, tùy tức dĩ La Vũ Môn chiến kỹ mạch mạch chủ chi danh lập thệ: vô luận ngươi đích mẫu thân thị thùy, hựu tử vu hà nhân chi thủ, nàng đô hội bồi ngươi tra minh chân tướng, vi cố nhân thảo hồi công đạo.\n Thành môn ngoại, nàng dĩ bị hảo hồi phản La Vũ Môn đích hành trang. Ngươi đái trước 《Đoạn Cốt Thổ Nạp Quyết》 dữ Tố Quang Giám tùy nàng thượng lộ; hạ nhất đoạn kính trung ký ức, yếu đẳng ngươi thân thủ khóa quá đệ một cái đại cảnh giới hậu tài hội tỉnh lai.',tags:['La Vũ Môn','kỳ ngộ','Thân Thế']},{id:'story-luowu-nuwa',name:'Vẫn tinh hoán tâm · nữ oa di thạch',subtitle:'Kẻ vốn dĩ đã chết, trong ngực lại vang lên nhịp đập của trái tim đá',desc:'Trung Nguyên bỗng nhiên có thiên thạch rơi xuống, ngươi bị đập trúng chính diện nhưng lại không chết; tu sĩ La Võ Môn chạy đến kiểm tra thì phát hiện, trái tim nguyên bản của ngươi đã bị thiên thạch thay thế, bên trong hòn đá vẫn còn lưu lại sức mạnh nghi là nguồn gốc từ Cửu Thiên Huyền Nữ.',cost:0,glyph:'Vẫn',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-zy-zhuohua'],"giới tính":'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tán Tu','La Vũ Môn']},settings:{"thời gian":{Niên:7233,Nguyệt:3,Nhật:21,"thời thần":'tuất'},"tông môn":'La Vũ Môn (vẫn tinh cứu trị)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Na nhất dạ, Trung Nguyên thiên mạc hốt nhiên liệt khai nhất đạo xí bạch trường ngân. Vẫn tinh tha trước diễm vĩ việt quá quần sơn, tối chung trực trụy ngươi sở tại chi địa; ngươi thậm chí lai bất cập đóa thiểm, thiên địa tiện tại chấn hư ởng dữ cường quang trung nhất đồng trầm một.\n Phụ cận đích La Vũ Môn tu sĩ tuần trước cự hư ởng cản lai, chỉ kiến địa diện hãm thành nhưng mạo trước nhiệt khí đích thâm khan. Chiếu lý thuyết, khan tâm bất cai lưu hạ nhậm hà hoạt vật, ngươi khước hoàn chỉnh địa tràng tại toái thạch giữa, hung khẩu không có trí mệnh sang thương, tứ chi dã nhưng hữuôn độ.\n Nàng môn tương ngươi đái ly khan để, kiểm tra thương thế thời tài phát hiện cánh gia bất khả tư nghị chi sự: ngươi đích hung khoang lý dĩ thính bất kiến huyết nhục tâm tạng đích khiêu động, thủ nhi đại chi đích thị một viên dữ vẫn tinh đồng chất đích ngũ sắc kỳ thạch. mỗi lần thạch tâm chấn động, đô hữuôn nhuận nhi cổ lão đích lực lượng duyên huyết mạch lưu biến toàn thân, duy trì trước bổn ưng đoạn tuyệt đích sinh cơ.\n Môn trung tu sĩ thường thí dĩ linh lực thám tra, ngũ sắc huy quang khước tự hành phính hợp thương xứ, bài khai ngoại lực, ẩn ước hiển xuất bổ thiên tạo hóa đích đạo uẩn. Nàng môn vô pháp đoạn định thạch đầu chân chính đích lai lịch, chỉ năng Xác nhận kỳ trung tự hồ tàn lưu trước dữ Cửu Thiên Huyền Nữ hữu quan đích lực lượng.\n Ngươi tòng hôn mê trung tỉnh lai thời, đệ nhất thanh thính kiến đích tịnh phi tầm thường tâm khiêu, mà là hung khoang thâm xứ trầm ổn đích thạch minh. La Vũ Môn tu sĩ thủ tại nhất bàng, cáo tố ngươi vẫn thạch đã dữ ngươi đích tính mệnh dung vi nhất thể, tịnh chuẩn bị đái ngươi Quay lại tông môn tường tra giá khỏa “Nữ Oa Thạch” cứu cánh vi hà lựa chọn liễu ngươi.',tags:['La Vũ Môn','kỳ ngộ','Nữ Oa Thạch']},{id:'story-guanghan-twin-fish',name:'Song ngư bội dẫn · nguyệt hạ trùng phùng',subtitle:'Nàng cuối cùng cũng đợi được chuyển thế của cố nhân',desc:'Đêm trăng tròn, ngọc bội bạn sinh bỗng nhiên phát nhiệt, dẫn dắt Cung chủ Quảng Hàn Cung Mộ Toàn Cơ tìm đến. Nàng nhận ra ngươi chính là chuyển thế của cố nhân năm xưa, và quyết định không bỏ lỡ lần nữa, phá lệ đưa ngươi đến Quảng Hàn Cung.',cost:0,glyph:'Bội',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'đặc biệt','kịch bản':!0,flags:['Mộ Toàn Cơ · cựu duyên chuyển thế'],constraints:{locationIds:['eco-dt-shuanghua'],giới_tính_cấm:['Nữ'],linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tán Tu','Quảng Hàn Cung']},settings:{"thời gian":{Niên:7234,Nguyệt:8,Nhật:15,"thời thần":'tý'},"tông môn":'Quảng Hàn Cung (phá lệ nhập cung)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'đêm trăng tròn, ngươi tòng thụy mộng trung tỉnh lai, phi y đáo ốc ngoại tiểu giải. Hồi ốc thời nhu yếu xuyên quá gia hương đích Hoa Hải, vạn khoảnh hoa chi chính phục tại dạ phong lý, thanh lượng nguyệt quang nhất lộ phô đáo ngươi đích cước biên.\n Tẩu đáo Hoa Hải thâm xứ, ngươi hốt nhiên sát giác hung tiền nhất trận ôn nhiệt. Na mai ngọc bội bổn cai tại thụy tiền trích hạ, kim dạ khước hãn kiến địa bị ngươi vong tại thân thượng. Phụ mẫu tằng cáo tố ngươi, ngươi xuất sinh thời khẩu trung tiện hàm trước tha; trừ thử chi ngoại, vô nhân thuyết đắc thanh tha tòng hà nhi lai.\n Ngọc bội việt lai việt đãng, khước bất chước thương cơ phu. Lưỡng vĩ tương hàm đích ngư văn phù khởi nhu hòa nguyệt huy, tượng tại hồi ứng một cái khóa việt mạn trường tuế nguyệt đích hô hoán. Ngươi mạch nhiên hồi thủ, chỉ kiến Hoa Hải ngoại lập trước nhất đạo tuyệt mỹ đích tiên tử thân ảnh, nguyệt bạch cung trang duệ quá hoa tiêu, thanh lãnh mi nhãn gian khước hữu cơ hồ áp bất trụ đích kinh hỉ dữ hoàng nhiên.\nLai nhân chính thị Quảng Hàn Cung chủ Mộ Toàn Cơ. Nàng cảm ứng đáo lánh một viên song ngư bội tô tỉnh hậu lập tức tuần tích nhi lai, chỉ nhất nhãn tiện nhận xuất ngươi thần hồn trung na đạo lệnh nàng đẳng đãi chí kim đích khí tức. Tiền thế, ngươi dữ nàng tương thức tương tri, khước tại nàng lai đắc cập biểu lộ chân tình trước đó vẫn lạc; nàng chỉ năng bả na mai thủy chung vị năng tống xuất đích đồng tâm bội dữ ngươi nhất đồng mai táng.\n Như kim, na mai bổn ưng trường miên mộ trong ngọc bội tùy ngươi chuyển thế nhi sinh. Mộ Toàn Cơ thủ xuất bản thân trân tàng đa niên đích lánh nhất bán, lưỡng mai ngọc bội cách trước nguyệt sắc đồng thời khinh minh, tái không có bỉ giá cánh xác thiết đích chứng minh.\n Nàng hướng lai khắc chế đích thần tình chung vu thất thủ, việt quá hoa tùng khẩn khẩn bão trụ ngươi, tượng thị sảo nhất tùng thủ tiện hội tái mất đi nhất thứ. Đãi tối sơ đích kích động bình phục, nàng tài cáo tố ngươi tiền thế chi sự, dã thản ngôn giá nhất thế tuyệt bất hội tái bả tâm ý lưu đáo lai bất cập thuyết xuất khẩu đích lúc.\n Quảng Hàn Cung tòng vị thu quá phi nữ tính Đệ Tử, đãn Mộ Toàn Cơ quyết định thân tự thừa đảm thứ phá lệ. Thiên lượng trước đó, nàng hội cấp ngươi thời gian cáo biệt gia hương; đãi nguyệt luân tây trầm, ngươi tương đái trước Song Ngư Đồng Tâm Bội tùy nàng khải trình, tiền vãng Sương Hoa Đảo thượng đích Quảng Hàn Cung.',tags:['Quảng Hàn Cung','Chuyển Thế','Mộ Toàn Cơ','Song Ngư Đồng Tâm Bội']},{id:'story-guanghan-frozen-qilin',name:'Hồ tâm băng quan · kiếp tiền di dân',subtitle:'Cùng kỳ lân ấu tể thức tỉnh',desc:'Mặt hồ Nguyệt Hoa nứt toác, một khối băng tinh cổ xưa nổi lên mặt nước; ngươi và Kỳ Lân ấu tể trong ngực bị phong ấn bên trong, y phục và giọng điệu đều giống hệt cổ tu sĩ trước thời đại kiếp, nhưng lại chỉ nhớ được mỗi sứ mệnh bảo vệ ấu tể.',cost:0,glyph:'Lân',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt','kịch bản':!0,constraints:{locationIds:['eco-dt-shuanghua'],"giới tính":'Nữ',linh_căn_cấm:['Vô'],môn_phái_quy_thuộc:['','Tán Tu','Quảng Hàn Cung']},settings:{"thời gian":{Niên:7235,Nguyệt:11,Nhật:6,"thời thần":'mão'},"tông môn":'Quảng Hàn Cung (hồ để hoạch cứu)',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Sương Hoa Đảo địa mạch hốt nhiên chấn động, nguyệt hoa hồ tùy chi phát sinh địa long phiên thân. Hồ ngạn băng tằng thốn thốn khai liệt, hồ để truyền lai trầm muộn oanh hư ởng, tượng hữu nhất tọa bị tuế nguyệt yểm mai đích cựu điện chính tại thủy hạ băng tháp.\n Quảng Hàn Cung tu sĩ cản đáo hồ biên phong tỏa liệt khích thời, nhất khối trượng hứa cao đích trừng triệt băng tinh tòng hồ để chậm rãi nổi lên mặt nước. Băng trung tịnh phi khoáng thạch hoặc cổ khí, mà là nhất danh song tí khẩn bão ấu thú đích nữ tử——chính thị trầm thụy kỳ trong ngươi.\n Chúng nhân tương băng tinh khiên dẫn thượng ngạn, dĩ nguyệt hoa chi lực trục tằng hóa khai phong ấn. Ngươi hoài trung na chích bất minh ấu thú thủy chung bị hộ tại hung tiền, đầu sinh nhu nhuyễn lân giác, tế tiểu lân phiến gian lưu chuyển trước ngũ sắc hỗn độn quang; tức sử băng phong giải trừ, ngươi đích thủ tí nhưng bổn năng địa bất khẳng tùng khai.\n Tô tỉnh hậu đích ngươi không có minh hiển thương thế, y bào tài chế, phát sức hình chế nãi chí thuyết thoại khẩu âm khước đô dữ đương thế bất đồng, cánh tiếp cận điển tịch trung ký tái đích đại kiếp tiền cổ tu sĩ. tông môn cao tằng tiếp liên tuần vấn ngươi đích tên, sư thừa dữ bị phong nhập hồ để đích duyên do, ngươi khước chỉ tòng phá toái ký ức lý lao xuất linh tinh họa diện, vô pháp cấp xuất hoàn chỉnh đáp án.\n Nàng môn nhân thử thôi trắc, ngươi hoặc hứa thị đại kiếp trước đó bị Lưu chí kim đích hạnh tồn giả; nguyệt hoa hồ để đích địa động chỉ thị ngẫu nhiên đả khai liễu na tọa trầm thụy đa niên đích băng quan. Chân tướng thượng vô định luận, cung trung dã bất hội tại ngươi thần trí vị phục thời cường bách bức vấn.\n Ngươi duy nhất ký đắc thanh sở đích thị bản thân sứ mệnh: bảo hộ hoài trong Kỳ Lân ấu sồ, nhượng giá điểm tòng cựu thời đại bảo tồn hạ xuống đích hy vọng hoạt đáo vị lai. ấu sồ thể nội phong trước tứ đạo trầm thụy đích tứ tượng ấn ký, Thanh Long, Bạch Hổ, Chu Tước, Huyền Vũ chi lực giai vị thủ đắc, tứ hạng thiên phú nhưng toàn bộ khóa.\n Tại trảo hồi ký ức dữ tra thanh băng phong lai lịch trước đó, Quảng Hàn Cung tạm thời tiếp nạp ngươi dữ Kỳ Lân ấu sồ lưu tại Sương Hoa Đảo. Ngươi tỉnh lai đích giá nhất nhật, dã trở thành giá đoạn khóa việt đại kiếp đích thủ hộ sứ mệnh trùng tân khai thủy đích đệ nhất thiên.',tags:['Quảng Hàn Cung','Đại Kiếp Tiền','Kỳ Lân ấu sồ','Thất Ức']},{id:'story-hehuan-yuanyang',name:'Uyên ương trì · nhập môn hợp hoan tông',subtitle:'Lần đầu thấy trường song tu sau hoan mị điện',desc:'Vừa được người ta khuyên vào Hợp Hoan Tông, lệnh bài còn chưa ấm tay, bạn đã bị dẫn đến bên Uyên Ương Trì. Suối nóng mờ hơi, quỳnh tương tràn đầy, lần đầu biết đến danh nghĩa "song tu Hợp Hoan".',cost:0,glyph:'Hợp',recommend:'Tiểu Đạo Du Du / Tầm Thường Tu Hành',thể_loại:'tông môn',constraints:{locationIds:['eco-dt-linyuan'],linh_căn_cấm:['Vô']},settings:{"thời gian":{Niên:7245,Nguyệt:3,Nhật:28,"thời thần":'tuất'},"tông môn":'Hợp Hoan Tông',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'trung kỳ'}},body:'Trời đã chập tối, lồng đèn hoa vừa được treo lên. Hàng trăm chiếc lồng đèn cung đình màu đỏ rực tỏa sáng, nhuộm luồng khí nóng bốc lên thành một sắc hồng ái muội. Trong không khí thoang thoảng dị hương ngòn ngọt, tựa hoa lan lại tựa hương xạ, chỉ vừa hít một chút vào phổi đã thấy ruột gan nóng hầm hập.\nTay ngươi vò xát miếng yêu bài vừa nhận, vẫn chưa hoàn toàn tỉnh táo sau khi bị kẻ khác dụ dỗ vào nơi này. Đằng sau là hành lang dẫn tới Hoan Mị Điện, trước mắt lại là một bức xuân cung sống động.\n Nơi đây là đại mộc dục của Hợp Hoan Tông, gọi là Uyên Ương Trì —— cái tên thật đúng với thực tế. Đưa mắt nhìn quanh, đây nào phải là chốn đất lành tu tiên gì, rõ ràng là một chốn vui chơi giấu giếm. Trong làn nước suối ấm áp, vô số thân xác trắng ngần đang quấn quýt lấy nhau —— nơi này không chỉ là chốn tắm rửa, mà chính là trường tu luyện của đệ tử Hợp Hoan Tông.\n Tầm mắt hơi dời đi, lại thấy một bệ ngọc giữa hồ, vài tên nữ tu đang ngồi quây lại thành vòng tròn, nằm ở giữa là một thiếu niên tuấn tú mặt đang đỏ bừng.\n\"Đây chính là tiểu sư đệ mới nhập môn sao? Nguyên Dương ngược lại mười phần dồi dào... để các sư tỷ nếm thử chút nào.\"\n\"Đây chính là... tu tiên sao?\" Ngươi lầm bầm tự ngữ, âm thanh nhanh chóng bị dìm nghỉm bởi những tiếng rên rỉ nối tiếp nhau.\n Suối nước nóng màu trắng đục, sương mờ mang theo hơi ẩm ướt át. Cách đó không xa trên chiếc giường nước, vô số nam nữ thiếu niên cởi trần đang nô đùa mây mưa.',tags:['Hợp Hoan']},{id:'story-fan-zhigen',name:'Đèn cuối ngõ · hậu thiên nối rễ',subtitle:'Thân phàm phu tình cờ gặp tiên duyên',desc:'Thân phàm nhân tình cờ gặp một lão ông lưu lạc nơi ngõ phố. Có duyên với nhau, lão ông dùng một bí pháp gần như thất truyền để nối linh căn cho bạn, từ đó bước lên đường tu chân.',cost:0,glyph:'Tục',recommend:'Tầm Thường Tu Hành / Lệ Tâm Vấn Đạo',thể_loại:'đặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{"thời gian":{Niên:7268,Nguyệt:10,Nhật:7,"thời thần":'hợi'},"tông môn":'Tán Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'Luyện Khí kỳ',tiểu_cảnh_giới:'sơ kỳ'}},body:'Mưa đêm gõ nhịp vào hiên nhà, ngọn đèn trong ngôi nhà cũ ở ngõ sau mờ nhạt.\n Ngươi vừa sắc xong thuốc cho nương, toan dập đèn thì ngoài cửa chợt truyền đến tiếng ho nhỏ khản đặc —— một ông lão y phục rách nát đang bám lấy khung cửa, tựa hồ thân thể không thể đứng vững được nữa.\n\"Tiểu hữu... một bát nước trong... một chỗ tránh gió, có được không?\"\n Ngươi nhường lối cho ông lão bước vào nhà, ngồi xuống mép giường, mượn ánh đèn dầu lờ mờ, ông lão ngước đôi mắt vẩn đục lên cẩn thận đánh giá ngươi một hồi lâu.\n\"Mệnh ngươi không có căn cốt, vốn không thể tu tiên. Nhưng —— lão hủ mang trên mình một môn bí pháp cấy ghép Linh Căn, e rằng đã không còn ngày tháng để thi triển nữa. Đêm nay ngươi dẫn ta vào nhà, chính là nhân duyên.\"\n Lão lấy từ trong ngực ra một ngón tay khô gầy như củi, đầu ngón tay ngưng kết một luồng Linh Khí xám xịt, chỉ thẳng vào mi tâm của ngươi.\n\"Cắn răng chịu đựng ý hỏa thiêu, mở ra khí hải bảy tấc, từ nay phàm trần không còn là nơi để ngươi quay về.\"\n Một đạo noãn lưu từ mi tâm chạy thẳng xuống Đan Điền. Tiếng mưa bên song cửa dần xa, ngọn nến trong phòng bỗng chốc bùng cháy rực rỡ ——\n Thân phàm phu, từ nay dứt trần tục, kết duyên tiên đạo.',tags:['đặc biệt']},{id:'story-fan-renjian',name:'Nhân gian kê mễ · con đường thuần phàm',subtitle:'Không bước vào đường tu chân',desc:'Không vào hàng tu chân, an phận phàm nhân; sống qua ngày giữa phố chợ, trải kiếp trên sa trường. Thân phàm cũng có thể chứng kiến thế đạo tu chân.',cost:0,glyph:'Tục',recommend:'Lệ Tâm Vấn Đạo / Nghịch Thiên Cải Mệnh',thể_loại:'đặc biệt',constraints:{physiqueTier:['phàm thể']},settings:{"thời gian":{Niên:7222,Nguyệt:5,Nhật:18,"thời thần":'tỵ'},"tông môn":'Tán Tu',cảnh_giới_ban_đầu:{đại_cảnh_giới:'phàm nhân',tiểu_cảnh_giới:'sơ kỳ'}},body:'Ánh sáng mờ ảo xuyên qua lớp giấy dán cửa sổ rọi xuống bàn của ngươi, chiếu sáng một bản khế ước chưa chép xong.\n Quán cháo sát vách đã bày ra nồi cháo nóng hổi đầu tiên, hơi nước lẫn với mùi củi lửa từ từ bốc lên.\n Ngươi là phàm phu, không thông hiểu tu chân, chẳng biết linh khí; tu sĩ thế gian ngự kiếm xuyên mây, đối với ngươi mà nói chẳng qua chỉ là truyền thuyết trên trời.\n Nhưng khói lửa chốn phàm trần, tự có nơi dành cho ngươi —— sổ sách phải tính, củi gạo phải mua, thiếu nữ bán hoa bên cạnh sáng nay còn nhờ ngươi mua giúp một vò rượu.\n Ngươi chỉnh lại áo vải, nhét kỹ mấy đồng tiền nặng trĩu vào ngực, bước qua bậu cửa, đón lấy ánh ban mai đạp bước vào khu chợ nhộn nhịp này.\n Phàm nhân có cách sống của phàm nhân. Sóng gió của thế giới tu chân đối với ngươi lúc xa lúc gần, nhưng chỉ cần trong lòng có cán cân, con đường phàm nhân cũng có thể không thẹn với lòng.',tags:['đặc biệt','Thuần Phàm']}];function s(e,t){const n=e.constrain
